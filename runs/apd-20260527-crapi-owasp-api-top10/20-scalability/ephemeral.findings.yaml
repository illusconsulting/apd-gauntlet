finding:
  - schema_version: 1
    id: ephem-30d38360
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "JWT signing key has no rotation procedure (services/identity/jwks.json is effectively static)"
    summary: "Runbook §5 explicitly notes the rotation procedure is GAP; ADR-0002 confirms no rotation tooling ships; jwks.json is static post-deploy."
    detail: |
      Per runbook §5 and ADR-0002 "No rotation tooling", crAPI ships no
      mechanism to rotate the JWT signing key. The `jwks.json` mounted
      into the identity container is whatever was there at deploy time;
      replacing it requires manual file mutation plus container
      restart, plus an unanswered cutover decision about
      already-issued tokens.

      Two Ephemeral concerns: (a) the key itself is long-lived — for a
      multi-week or multi-month deploy the signing key has effectively
      indefinite lifetime; (b) the absence of rotation tooling means
      that even when rotation is desired (e.g., post-incident, on
      personnel change, on suspected leak) the operator has no
      published path. Runbook §5 enumerates the multi-step manual
      ceremony.

      Severity is high per the rubric's "Service account tokens or API
      keys are static long-lived secrets in application configuration
      with no rotation" — substitute "JWT signing key" for "API key"
      and the structural pattern is identical. The key is the
      authentication trust anchor for the cluster.
    evidence:
      - artifact: runbook.md
        locator: "§5 Rotate the JWT signing key"
        excerpt: "GAP. No documented procedure ships in the input set"
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Consequences"
        excerpt: "No rotation tooling. There is no key-rotation script, no rotation runbook, no kid rollover ceremony documented. Once deployed, the key in jwks.json is effectively static"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "SC-12", "SC-12(1)", "AC-2"]
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Static long-lived signing key with no rotation makes credential-in-files exposure (conf-c66f08cf) a permanent compromise rather than a time-bounded one."
      cwe: ["CWE-321", "CWE-798"]
      owasp_api_top10: ["API2:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Ship a rotate-jwks.sh that generates a fresh keypair, supports multi-kid grace period, and documents the cutover policy."
      detail: |
        Add `deploy/scripts/rotate-jwks.sh`:
        (1) Generate fresh RSA-2048 key.
        (2) Append the new public key to the served JWKS with a new
        `kid`. Keep the old key in the JWKS for a documented grace
        window (24h reasonable) so already-issued tokens still verify.
        (3) Switch the identity service's *signing* `kid` to the new
        key.
        (4) After grace window, remove the old key from JWKS.
        (5) Document the cutover decision: grace-window or revoke-
        immediately (requires JTI deny-list per resil-776fc650).
        (6) Update runbook §5 to reference the script.
    related_concerns: [authenticity, integrity, immutability]
    cross_references: [conf-c66f08cf]

  - schema_version: 1
    id: ephem-22c2358c
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "Datastore admin credentials are static — no rotation tooling, multi-service simultaneous restart required"
    summary: "Per runbook §6, rotating Postgres/Mongo admin credentials requires manual ALTER USER + env-var edit + every consuming service restart simultaneously."
    detail: |
      The rotation procedure for `admin / crapisecretpassword` is
      explicitly GAP per runbook §6. The procedure requires (a)
      ALTER USER / db.changeUserPassword in each datastore, (b)
      updating env vars in every consuming service, (c) restarting
      every consuming service simultaneously to avoid a window of
      broken connectivity.

      The "simultaneously restart everything" requirement is the
      Ephemeral concern: the credential cannot be rotated without
      cluster downtime. This makes rotation effectively never-
      performed in practice. Combined with conf-3e324699 (the
      credential is plaintext in compose), this is a long-lived
      shared credential with documented hostile-rotation cost.

      Severity is high per the rubric's "Service account tokens or
      API keys are static long-lived secrets" — the datastore admin
      credential here functions identically.
    evidence:
      - artifact: runbook.md
        locator: "§6 Rotate datastore credentials"
        excerpt: "GAP. The Postgres and Mongo passwords (crapisecretpassword) are hardcoded in deploy/docker/docker-compose.yml. Helm values may override, but no rotation script is provided"
      - artifact: runbook.md
        locator: "§6"
        excerpt: "The single shared admin credential means every service has to restart simultaneously to avoid a window of broken connectivity"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "AC-2", "SC-12"]
      cwe: ["CWE-798", "CWE-321"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Provision per-service credentials via init container or external secret; document zero-downtime rotation."
      detail: |
        Couple with dist-c047a7c0 (per-service users): each service
        gets its own datastore credential, rotated independently via
        an init-container that fetches from a secret store. Rotation
        becomes per-service rolling restart rather than cluster-wide
        simultaneous restart. Document in runbook §6 as the new
        rotation procedure.
    related_concerns: [authenticity, distributed, confidentiality]
    cross_references: [conf-3e324699, dist-c047a7c0]

  - schema_version: 1
    id: ephem-b95a7d11
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "Chatbot embedded admin credential and provider API keys have no rotation procedure"
    summary: "Per runbook §7, rotating API_USER/API_PASSWORD and the LLM-provider API keys (OpenAI/Anthropic/AWS/Azure/GCP) is GAP."
    detail: |
      The chatbot container holds:
      - `API_USER=admin@example.com / API_PASSWORD=Admin!123` — a
        crAPI identity credential with admin authority.
      - Provider keys: `CHATBOT_OPENAI_API_KEY`, `ANTHROPIC_API_KEY`,
        `AZURE_OPENAI_API_KEY`, `GROQ_API_KEY`, etc.
      - Cloud credentials: `AWS_ACCESS_KEY_ID`, Azure SP credentials,
        GCP service-account JSON depending on provider.

      Per runbook §7, none have a documented rotation procedure.
      "Compromise of any of these is silent — there is no audit trail
      that distinguishes legitimate chatbot calls from prompt-
      injection-driven calls". The combination of long-lived
      credentials + admin authority + no rotation + no detection is
      the worst quadrant: theft-undetected, blast-radius-maximal.

      Severity is high per the rubric's static-long-lived-secret
      pattern. The chatbot's admin credential is high-trending-
      critical because it grants administrative authority across
      crAPI — see intg-078ee9f6 for the Integrity framing.
    evidence:
      - artifact: runbook.md
        locator: "§7 Rotate the chatbot's embedded credentials"
        excerpt: "GAP. The chatbot container holds: API_USER=admin@example.com / API_PASSWORD=Admin!123 — the crAPI identity-service credential the chatbot impersonates"
      - artifact: runbook.md
        locator: "§7"
        excerpt: "No rotation procedure ships. Compromise of any of these is silent — there is no audit trail that distinguishes legitimate chatbot calls from prompt-injection-driven calls"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "AC-2", "AC-2(2)", "AC-6"]
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Long-lived admin credential embedded in a container's environment is credentials-in-files; absence of rotation means a single exposure (image pull, env dump, prompt-injection extraction) yields permanent admin authority."
      cwe: ["CWE-798", "CWE-256"]
      owasp_api_top10: ["API2:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Remove the embedded admin credential (couple with intg-078ee9f6); rotate LLM-provider keys quarterly via secret store."
      detail: |
        (1) Remove API_USER/API_PASSWORD — the chatbot should act
        under the user's bearer token (intg-078ee9f6). (2) For
        LLM-provider keys, fetch from a secret store at container
        start; rotate quarterly via the store's lifecycle policy. (3)
        For cloud credentials, prefer workload identity (IRSA on EKS,
        Workload Identity on GKE, Pod Identity on AKS) over static
        keys; the chatbot's IAM role is then per-pod and revocable.
    related_concerns: [authenticity, confidentiality, non_repudiation]
    cross_references: [intg-078ee9f6]

  - schema_version: 1
    id: ephem-96d3befb
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "7-day JWT TTL with no refresh-token rotation, no idle timeout, no logout"
    summary: "Per tech_plan §4, JWTs are 7-day bearer tokens; no refresh-token rotation, no session-revocation endpoint, no idle-timeout policy."
    detail: |
      Per tech_plan §4 and the OpenAPI absence of a /logout endpoint,
      a crAPI session lives for 7 days with no idle-timeout boundary,
      no logout revocation, no behavior-on-credential-change semantics.
      The 7-day TTL is the entire session.

      Per the rubric clause "JWT access-token lifetime exceeds 1 hour
      with no refresh-token rotation and no revocation channel" —
      severity is high. Combined with the JWT forgery vectors
      (intg-15c04a1c) and the inability to revoke (resil-776fc650),
      this is the structural session-lifetime gap.

      This finding is the Ephemeral framing (the credential is too
      long-lived). The session-revocation framing is in Resilient
      (resil-776fc650) and the authentication-strength framing is in
      Authenticity (auth-jwt-validation).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication and sessions"
        excerpt: "Expiration defaults to JWT_EXPIRATION=604800000 milliseconds (7 days)"
      - artifact: tech_plan.md
        locator: "§4"
        excerpt: "There is no MFA. There is no documented session-revocation surface (no /logout endpoint in the OpenAPI spec)"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(13)", "AC-12", "AC-12(1)", "SC-10"]
      cwe: ["CWE-613", "CWE-384"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Drop JWT TTL to 1 hour; add refresh-token rotation; expose /logout that revokes via JTI deny-list."
      detail: |
        (1) `JWT_EXPIRATION=3600000` (1 hour). (2) Introduce refresh
        tokens, rotation per access-token refresh, family-revocation
        on reuse (cross-ref resil-776fc650). (3) Expose
        `POST /identity/api/auth/logout` that revokes the refresh
        token and adds the access-token JTI to a deny-list. (4) Idle
        timeout: if no API call in 30 minutes, refresh-token rotation
        fails and the user re-authenticates.
    related_concerns: [authenticity, resilient, non_repudiation]
    cross_references: [resil-776fc650, intg-15c04a1c]

  - schema_version: 1
    id: ephem-6020f861
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: blocked
    severity: medium
    confidence: high
    title: "OTP TTL implied ~10 minutes but not asserted; re-issuance unbounded"
    summary: "Challenge 3 discussion implies OTP TTL ~10 minutes; the input set does not assert the value or specify re-issuance semantics."
    detail: |
      The intake-brief evidence-gap entry on OTP TTL is operative
      here. Challenge 3's discussion implies a ~10 minute TTL but the
      input set does not assert it. ADR-0003 explicitly states "No
      replay or throttling discipline on OTP issuance" — re-issuance
      is unbounded (avail-c1ffcf8e covers the rate-limit gap).

      The Ephemeral concern: the OTP credential lifetime is uncertain
      and re-issuance creates a sliding window where multiple
      legitimate OTPs may be valid simultaneously. Severity is medium
      because the 4-digit OTP space (avail-e96ad7ff) makes brute
      force the dominant concern over TTL precision.

      Disposition is `blocked` pending the actual OTP TTL config from
      identity-service source review.
    evidence:
      - artifact: tech_plan.md
        locator: "§7 OTP delivery"
        excerpt: "OTP format: 4-digit numeric (per brute-force in challenge 3). TTL: per challenge 3 discussion, OTP expiry ~10 min; v3 variant attempt count unbounded"
      - artifact: invariants.md
        locator: "INV-AUTH-005"
        excerpt: "Holds for OTP format. Brute-force protection does not hold on v3/check-otp per challenge 3"
    prerequisite_evidence:
      - "Identity service OTP-handler source showing the TTL configuration value"
      - "OTP re-issuance behavior: does a new issuance invalidate the prior OTP?"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(13)", "AC-12"]
      cwe: ["CWE-613"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: recommended
      summary: "Pin OTP TTL to 5 minutes and invalidate prior OTP on re-issuance; document in tech_plan §7."
      detail: |
        Confirm the OTP TTL by reading the identity service's
        OTP-generator code. Document the value in tech_plan §7. If the
        TTL is >5 minutes, reduce. Add re-issuance semantics:
        forget-password re-issuance invalidates any prior outstanding
        OTP for the account.
    related_concerns: [authenticity, availability]
    cross_references: [avail-c1ffcf8e, avail-e96ad7ff]

  - schema_version: 1
    id: ephem-a39a1f7b
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "Gateway-service basic-auth credential undocumented and unrotated"
    summary: "Per S-5, identity authenticates to gateway-service with a basic-auth credential; the credential is not in compose env and presumably lives hard-coded in the identity binary."
    detail: |
      Per S-5 in the threat model, the gateway-service authentication
      is HTTP basic-auth. The credential location is not documented;
      the threat-model entry speculates "presumably hard-coded in the
      identity service binary".

      A credential hard-coded in a binary is the worst Ephemeral
      pattern: rotation requires a new build and redeploy, the
      credential is observable to anyone with the binary, and there is
      no audit signal on use. The credential is also reachable via the
      chatbot (which holds Admin!123, and per S-5 "if guessable
      against admin / Admin!123 — visible in the chatbot env" — the
      same trivial pattern may be reused).

      Severity is medium per the rubric's basic-auth-rotation pattern;
      escalates to high if the credential is genuinely `admin / Admin!123`
      as S-5 hypothesizes.
    evidence:
      - artifact: threat-model.md
        locator: "§1 S-5"
        excerpt: "Identity authenticates to the gateway with HTTP basic-auth. Credential not documented; if static and obtainable (env dump, log leak, or guess against admin/Admin!123)"
      - artifact: runbook.md
        locator: "§5"
        excerpt: "How is the gateway-service basic-auth credential rotated? The credential is not documented in compose; presumably hard-coded in the binary"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "SC-12"]
      cwe: ["CWE-798"]
      owasp_api_top10: ["API2:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Externalize the gateway basic-auth credential to env or vault; document the rotation procedure."
      detail: |
        Move the gateway basic-auth credential out of the identity
        binary into either an env var (`API_GATEWAY_BASIC_AUTH`) or a
        secret-store fetch. Document the credential location and
        rotation procedure in runbook.md. Confirm the credential is
        NOT `admin / Admin!123` and is not reused from any other
        crAPI credential.
    related_concerns: [authenticity, confidentiality]
    cross_references: []

  - schema_version: 1
    id: ephem-edcc17b4
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "Container images mutable in production — :latest tag on ChromaDB"
    summary: "ChromaDB is pinned to chromadb/chroma:latest; image content can change without an image-pull event."
    detail: |
      Per tech_plan §2 and architecture-index `§chromadb`, the
      ChromaDB image is `chromadb/chroma:latest`. The `:latest` tag is
      the canonical mutable-in-production anti-pattern: the published
      image at `:latest` can change at any time, and Docker's
      `imagePullPolicy: IfNotPresent` (the default) means a node may
      run an older `:latest` than another node, producing version skew.

      The Ephemeral concern is twofold: (a) the running image content
      is non-deterministic — a deploy on Monday differs from a deploy
      on Friday with no Git commit between them; (b) there is no
      attribution chain from the artifact-signing perspective (covered
      in authn-image-signing).

      Severity is medium per the rubric's "Container images mutable in
      production — `:latest` tags" pattern. Postgres and Mongo are
      pinned (`postgres:14`, `mongo:4.4`) which is the floor; the
      ChromaDB exception is the operative finding.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Services table"
        excerpt: "chromadb — chromadb (chromadb/chroma:latest)"
      - artifact: architecture-index.md
        locator: "§chromadb Image"
        excerpt: "chromadb/chroma:latest"
    control_mappings:
      nist_800_53r5: ["CM-2", "CM-3", "SA-15(7)", "SI-7", "SR-4"]
      cwe: ["CWE-1357"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Pin ChromaDB to a specific image digest; document the upgrade procedure."
      detail: |
        Replace `image: chromadb/chroma:latest` with
        `image: chromadb/chroma:0.4.22@sha256:...` (pin to a specific
        version AND digest). Document the ChromaDB upgrade procedure
        in `runbook.md` — version bump requires a deliberate digest
        change reviewed in source control. Apply the same digest-pinning
        discipline to mailhog, postgres, mongo even though they have
        version tags.
    related_concerns: [authenticity, immutability, integrity]
    cross_references: []

  - schema_version: 1
    id: ephem-2c1c7ecf
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "Just-in-time human access not modeled; operator uses shared admin credential against datastores"
    summary: "Runbook §9 instructs operators to docker compose exec into postgresdb as admin; no time-boxed, audited, or approval-gated access pattern."
    detail: |
      Per runbook §9 ("Respond to a balance went wrong report"), the
      documented operator action is `docker compose exec postgresdb
      psql -U admin -d crapi`. Every operator with shell access to the
      host has the admin credential and unbounded access to the
      datastore.

      The Ephemeral pattern here is "JIT human access for production
      via approval workflow with time-boxed grants and full session
      recording" — crAPI's posture is the opposite: persistent shell
      access, no approval, no time-bound, no session recording. For
      the demo intent (single operator on a laptop) this is
      acceptable; for any shared deploy it is a Ephemeral gap.

      Severity is medium because the demo-intent makes this tolerable;
      for any non-demo deploy it is the canonical privilege-elevation
      pattern.
    evidence:
      - artifact: runbook.md
        locator: "§9 Respond to balance went wrong"
        excerpt: "docker compose exec postgresdb psql -U admin -d crapi"
      - artifact: agents.md
        locator: "§Operator capabilities"
        excerpt: "Inspect Postgres / Mongo directly with the shared admin credential"
    control_mappings:
      nist_800_53r5: ["AC-2", "AC-2(2)", "AC-2(3)", "AC-6", "AC-6(9)", "AU-12"]
      cwe: ["CWE-269"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: consider
      summary: "For shared deploys, replace shared admin with per-operator credentials issued JIT via a vault/SSH bastion."
      detail: |
        For demo: continue as documented. For any shared deploy:
        provision per-operator Postgres/Mongo users via Vault dynamic
        secrets with 1-hour TTL, accessed via an SSH bastion that
        audit-logs every session. Replace `docker compose exec` with
        `vault exec` or equivalent. Document in runbook.md as the new
        operator pattern.
    related_concerns: [authenticity, non_repudiation, confidentiality]
    cross_references: []

  - schema_version: 1
    id: ephem-3ad94819
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "Per-session chatbot LLM provider key bootstrap has no session-end revocation"
    summary: "POST /chatbot/genai/init accepts a per-session OpenAI/Anthropic API key; no documented session-end behavior or key revocation."
    detail: |
      Per tech_plan §3 boundary #6, the chatbot accepts per-session
      LLM-provider keys via `POST /genai/init` for OpenAI and Anthropic.
      The input set does not document: (a) where the per-session key
      is stored (in-memory? written to disk? logged?); (b) when the
      session ends and the key is revoked; (c) whether the same key
      can be reused across sessions.

      The Ephemeral concern is the session-key lifetime. If the key
      lives in memory only for the chatbot's session, the pattern is
      reasonable. If the key is persisted, even briefly, the
      attack surface grows substantially — a separate credential
      compromise (e.g., chatbot container env dump) discloses
      caller-supplied LLM keys for every active session.

      Severity is medium pending session-key handling confirmation;
      the in-memory-only pattern is acceptable, the persisted pattern
      is high.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #6"
        excerpt: "credentials are passed via environment, except OpenAI/Anthropic which also accept a per-session key via POST /genai/init"
      - artifact: tech_plan.md
        locator: "§8 Chatbot endpoints"
        excerpt: "POST /genai/init <-- per-session LLM provider key bootstrap (OpenAI/Anthropic only)"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "AC-12", "SC-28"]
      cwe: ["CWE-256", "CWE-613"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: recommended
      summary: "Document per-session LLM-key handling: in-memory only, scrubbed on session end, never logged."
      detail: |
        Audit chatbot source for the /genai/init handler. Document in
        `architecture-index.md` (1) the storage location of the
        per-session key (must be in-memory, not Mongo, not Postgres),
        (2) the session-end trigger that clears the key, (3) the log
        scrubbing that prevents the key appearing in chatbot stdout.
        If the key is persisted, refactor to in-memory and add a
        session-end timer (idle 30 min).
    related_concerns: [authenticity, confidentiality, non_repudiation]
    cross_references: []
