capability:
  - schema_version: 1
    id: ephem-cap-fd22b084
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    title: "Image versioning on Postgres (postgres:14) and Mongo (mongo:4.4)"
    description: |
      The two relational/document datastores are pinned to specific
      version tags (`postgres:14`, `mongo:4.4`) rather than `:latest`.
      This is the floor for image-ephemerality discipline — version
      drift is at least deliberate at deploy time.
    maturity: implemented
    scope: |
      Confirmed for Postgres and Mongo specifically. NOT confirmed for
      ChromaDB which uses `:latest` (ephem-edcc17b4) and the crAPI
      service images which use `${VERSION}` interpolation (which is
      pinned at build time but the digest is not).
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Services table"
        excerpt: "postgresdb (postgres:14); mongodb (mongo:4.4)"
    control_mappings:
      nist_800_53r5: ["CM-2", "SI-7"]
    caveats:
      - "ChromaDB uses :latest (ephem-edcc17b4)"
      - "Mongo 4.4 is past EOL (ADR-0004 notes); upgrade path not documented"
      - "Image digests not pinned"
    related_concerns: [authenticity, immutability]
