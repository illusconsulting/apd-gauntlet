finding:
  - schema_version: 1
    id: avail-6af5aff7
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: high
    confidence: high
    title: "No rate limit on POST /workshop/api/merchant/contact_mechanic"
    summary: "Contact-mechanic endpoint accepts arbitrary outbound webhook URLs; no per-IP, per-user, or per-token rate limit; trivial L7 DoS + reflective fan-out."
    detail: |
      Per challenge 6 / D-1, the `contact_mechanic` endpoint performs an
      outbound HTTP fetch per request with no rate limit. A caller bursts
      requests and exhausts the workshop service's outbound socket pool,
      worker pool, and (per the compose `cpus: 0.8` limit) CPU budget.
      The cascade reaches identity (JWT-verifier latency on every
      authenticated workshop call climbs) and the broader cluster.

      The same surface is a reflective-DoS launchpad against arbitrary
      external hosts: the attacker submits target=victim.example.com and
      the workshop service emits the request, attributed to the workshop
      IP. The crAPI host becomes an unwitting amplifier.

      Severity is high per "Rate-limiting absent on authentication,
      password-reset, MFA enrollment, or account-recovery endpoints" —
      while contact_mechanic is not strictly an auth endpoint, the rubric
      escalates rate-limit gaps that combine with another amplification
      (the outbound fan-out is the amplifier here). This finding pairs
      with intg-5c659bdb (input validation) and conf-cf457739 (SSRF
      data exfiltration) — synthesizer merge candidate.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 No Rate Limit #6"
        excerpt: "No throttle on the contact-mechanic submission endpoint; arbitrary outbound webhook fan-out"
      - artifact: threat-model.md
        locator: "§5 D-1"
        excerpt: "Service exhausts its outbound socket pool / worker pool; identity + community degrade as workshop's JWT verifier latency climbs"
    control_mappings:
      nist_800_53r5: ["SC-5", "SC-5(1)", "SC-5(2)", "SC-6", "SI-13"]
      mitre_attack:
        - technique: "T1499"
          sub_technique: "T1499.003"
          tactic: "TA0040"
          rationale: "Unbounded outbound-fetch endpoint enables application-exhaustion DoS through resource starvation of the workshop service's network and worker pools."
      cwe: ["CWE-770", "CWE-400"]
      owasp_api_top10: ["API4:2023", "API7:2023"]
    recommendation:
      posture: required
      summary: "Add per-token rate limit (10/min) plus global concurrency cap on contact_mechanic; couple with the conf-cf457739 allowlist."
      detail: |
        Wrap the `contact_mechanic` view in a Django REST Framework
        throttle class scoped per-user (`UserRateThrottle` with
        `DEFAULT_THROTTLE_RATES['contact_mechanic'] = '10/min'`). Add a
        global semaphore (e.g., `asyncio.Semaphore(20)` or a thread-pool
        cap) on the outbound fetcher to bound concurrent outbound
        requests cluster-wide. Set the outbound HTTP timeout to a
        bounded value (5s connect, 10s total) so a slow upstream cannot
        tie up a worker indefinitely. Couple with the URL allowlist from
        conf-cf457739.
    related_concerns: [resilient, confidentiality, integrity]
    cross_references: []

  - schema_version: 1
    id: avail-e96ad7ff
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: high
    confidence: high
    title: "No rate limit on /identity/api/auth/v3/check-otp (4-digit OTP space, 10k entries)"
    summary: "v3/check-otp accepts unbounded guess attempts against a 10,000-entry numeric OTP; brute force completes in seconds at trivial request rate."
    detail: |
      The v3 OTP-check variant lacks the rate limit applied to v2 (per
      challenge 3 solution discussion). At a 10,000-entry OTP space and
      no per-account / per-IP throttle, an attacker exhausts the keyspace
      in seconds, achieving account takeover for any user whose email is
      enumerable (which is every user, per community-post author display).

      Beyond the authentication-bypass severity (owned by Authenticity),
      this is also an Availability concern: the brute-force request
      volume is itself a probe-storm DoS against identity, and the OTP
      issuance side (forget-password) has no rate limit either — a
      coordinated attacker can drive OTP issuance and brute force in
      parallel, saturating identity's CPU budget under the compose
      `cpus: 0.8` cap.

      Severity is high per the "Rate-limiting absent on authentication
      [...] account-recovery endpoints" clause, escalated by the
      compose-cap amplifier per the rubric's compose-and-amplify guidance.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication, /v3/check-otp row"
        excerpt: "rate-limiting on v2 was added but v3 and other variants remain bypassable"
      - artifact: threat-model.md
        locator: "§5 D-2"
        excerpt: "4-digit OTP space is 10,000 entries; the un-throttled v3 endpoint accepts repeated guesses until success"
    control_mappings:
      nist_800_53r5: ["SC-5", "SC-5(1)", "AC-7", "IA-5", "AC-7(2)"]
      mitre_attack:
        - technique: "T1110"
          sub_technique: "T1110.001"
          tactic: "TA0006"
          rationale: "Unrate-limited OTP verification endpoint permits brute-force of the 4-digit OTP keyspace in seconds, enabling account takeover."
      cwe: ["CWE-307", "CWE-770"]
      owasp_api_top10: ["API4:2023", "API2:2023"]
    recommendation:
      posture: required
      summary: "Apply identical rate-limit + lockout policy to every check-otp variant; deprecate parallel-versioned variants of auth endpoints."
      detail: |
        (1) Apply a rate limit to `v3/check-otp`: max 5 attempts per OTP
        per account, then lock the OTP for a 30-minute window. (2)
        Centralize the OTP-verification logic so v2/v3/future variants
        all flow through one rate-limited handler — eliminate version
        drift on security-critical paths. (3) Add a CI lint that flags
        any new `/check-otp` path variant. (4) Increase OTP entropy: 6
        digits minimum (1M space) or 8 digits (100M space) — keeps UX
        manageable while making brute-force infeasible at any rate
        limit. (5) Add a per-IP throttle in addition to the per-account
        throttle to prevent distributed brute force across many
        accounts.
    related_concerns: [authenticity, ephemeral]
    cross_references: []

  - schema_version: 1
    id: avail-c1ffcf8e
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "No rate limit on /identity/api/auth/forget-password"
    summary: "Forget-password endpoint accepts unbounded OTP-issuance requests; combined with avail-e96ad7ff amplifies brute force."
    detail: |
      The `forget-password` endpoint emits a fresh OTP to mailhog on every
      call. There is no per-account or per-IP rate limit (the catalog
      notes rate-limit on `v2/check-otp` only). An attacker dials the
      endpoint at high rate against a victim account, generating one
      mailhog email per request, and each issuance resets the active OTP.
      Per ADR-0003 "No replay or throttling discipline on OTP issuance"
      is explicit.

      Two Availability concerns: (a) high-rate OTP issuance is a
      probe-storm DoS against identity and a write-burst on the OTP
      storage subsystem; (b) the per-request mailhog dispatch saturates
      the SMTP catcher's in-memory ring buffer, evicting earlier
      messages and potentially losing legitimate emails for other users.

      The authentication-impact (account-recovery weakening) is owned by
      Authenticity (authn-otp-rate-limit). This finding holds the
      availability-impact lens.
    evidence:
      - artifact: adrs/0003-mailhog-for-otp-delivery.md
        locator: "Consequences"
        excerpt: "No replay or throttling discipline on OTP issuance. A single account can request password-reset OTPs as fast as it can dial the forget-password endpoint"
      - artifact: tech_plan.md
        locator: "§4 Authentication, /forget-password row"
        excerpt: "OTP email dispatch (per docs/challenges.md #3, this path is rate-limited but neighboring /v3/check-otp variants are not)"
    control_mappings:
      nist_800_53r5: ["SC-5", "AC-7", "IA-5"]
      cwe: ["CWE-307", "CWE-770"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: required
      summary: "Cap OTP issuance to 3 per account per hour; reject further with HTTP 429 + Retry-After."
      detail: |
        Apply a per-account rate limit on `forget-password`: maximum 3
        OTP issuances per account per hour, with a 1-hour Retry-After
        on the 4th attempt. Apply a per-IP cap in addition (say 20/hour)
        to prevent enumeration. Couple with the avail-e96ad7ff
        improvements so issuance and verification are both bounded.
    related_concerns: [authenticity, ephemeral, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: avail-fb795bfb
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "No timeout on outbound calls from identity to gateway-service or workshop to mechanic webhook"
    summary: "Outbound HTTP timeout discipline is not documented; vendor slowdown cascades to thread-pool exhaustion."
    detail: |
      Two outbound paths are documented in artifacts:

      - identity → `api.mypremiumdealership.com` (VIN owner lookup,
        payment dispatch). Outbound HTTPS basic-auth. Timeout posture
        not specified.
      - workshop → user-supplied `mechanic_api` URL (the SSRF surface).
        Timeout posture not specified.

      Without an outbound timeout, a slow upstream pins the calling
      service's worker thread indefinitely. Per the compose `cpus: 0.8,
      memory: 384M` constraints, modest thread-pool exhaustion (a few
      dozen pinned threads) is enough to saturate identity or workshop.

      Severity is medium per the rubric's "No timeout on outbound calls
      to third-party APIs" clause; the impact is bounded by upstream
      stability today but is the structural amplifier for any vendor
      incident. Combined with avail-6af5aff7 (no rate limit on the
      caller), severity escalates because the attacker can manufacture
      the slow-upstream condition.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #5"
        excerpt: "identity → gateway-service. Outbound HTTPS to https://api.mypremiumdealership.com (basic-auth) for VIN owner lookup and payment dispatch"
      - artifact: tech_plan.md
        locator: "§3 boundary #2"
        excerpt: "web → backend services. Plain HTTP inside the Compose network unless TLS_ENABLED=true. No mutual TLS"
    control_mappings:
      nist_800_53r5: ["SC-5", "SI-13", "CP-13"]
      cwe: ["CWE-400", "CWE-1088"]
      owasp_api_top10: ["API4:2023", "API10:2023"]
    recommendation:
      posture: required
      summary: "Establish an outbound timeout policy: 5s connect, 10s total per outbound call; document in tech_plan.md."
      detail: |
        Add a §11 outbound-timeout policy to tech_plan.md declaring
        connect=5s, total=10s as the default for every outbound HTTP
        call. Implement per-language: Spring `RestTemplate` /
        `WebClient` with `ResponseTimeout`; Python `requests` with
        `timeout=(5, 10)`; Go `http.Client{Timeout: 10*time.Second}`
        plus a `Transport` with `DialContext` timeout=5s. Add CI lints
        that flag any `requests.get(url)` / `RestTemplate#getForObject`
        without an explicit timeout.
    related_concerns: [resilient, distributed]
    cross_references: []

  - schema_version: 1
    id: avail-470902f0
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: blocked
    severity: medium
    confidence: high
    title: "No SLO/SLI declared for any service or surface"
    summary: "agents.md explicitly states there is no SLO commitment; no error budget, no latency target, no burn-rate alerting."
    detail: |
      Per `agents.md`, crAPI is operated by a single security-engineering
      practitioner or a workshop instructor; there is no enterprise
      operator and explicitly no SLO commitment to anyone using the
      deployed instance. The intent is "deploy-and-explore", not
      "administer-and-defend".

      The Availability finding here is not that an SLO is missing in
      isolation — it is that the absence of any SLO statement makes the
      gauntlet unable to evaluate other Availability findings against a
      target. The rubric's "SLO and error budget undeclared for
      consequential paths" clause applies, but the architectural choice
      (no SLO is correct for the demo's intent) is explicit in inputs.

      Disposition is `blocked` because evaluating Availability findings
      against a missing baseline is not meaningful; the prerequisite is
      a declared availability target, which by the agents.md framing
      does not apply for the demo's intent.
    evidence:
      - artifact: agents.md
        locator: "§Who operates crAPI"
        excerpt: "There is no enterprise operator. There is no on-call rotation. There is no SLO commitment to anyone using the deployed instance"
      - artifact: tech_plan.md
        locator: "§10 Out-of-scope for this plan"
        excerpt: "crAPI does not target production deployment. No on-call posture, no SLO commitments"
    prerequisite_evidence:
      - "A declared availability target if any production-intent deploy is contemplated"
      - "Error budget definition and burn-rate alert thresholds for any consequential path"
    control_mappings:
      nist_800_53r5: ["CP-2", "CP-2(3)", "SI-13"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: consider
      summary: "If any deploy is unattended for non-trivial periods, declare a 99% SLO on the auth path; otherwise the demo posture stands."
      detail: |
        For demo deploys (the intent per agents.md), no SLO is
        appropriate. For any deploy where users rely on the system for
        more than 1-hour sessions, a 99% availability target on the
        auth surface and a 95% target on the workshop surface would be
        the minimum reasonable baseline. Document the target choice in
        a §11 SLO section of tech_plan.md if added.
    related_concerns: [resilient, distributed]
    cross_references: []

  - schema_version: 1
    id: avail-898bfad0
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: high
    confidence: high
    title: "Health checks are shallow — port-availability checks, not dependency-aware"
    summary: "Per-service health.sh scripts probe local readiness; no documented health endpoint reflects downstream-dependency state."
    detail: |
      The runbook §2 lists per-service health endpoints as basic GET
      checks (`/identity/health_check`, `/workshop/health_check/`,
      `/community/home`). The check shape per docker-compose `healthcheck:`
      blocks invokes `health.sh` which (by convention for Spring Boot /
      Django / Go) typically checks process liveness — not whether the
      service can actually serve requests end-to-end (e.g., reach
      Postgres, fetch the JWKS, route to mailhog).

      The chatbot service has no documented external health endpoint per
      runbook §2. Shallow health checks mask dependency degradation: the
      load balancer continues to send traffic to instances that can
      accept connections but cannot complete authenticated requests
      because, e.g., identity is unreachable.

      Severity is high per the rubric's "Health checks specified as TCP
      port checks or basic HTTP-200 checks only" — the operative concern
      is that the health-check shape does not inform any failover or
      degradation decision because no such decision exists in the
      deploy.
    evidence:
      - artifact: runbook.md
        locator: "§2 Health checks"
        excerpt: "Each service ships a health.sh invoked by the compose healthcheck: block. To probe manually: ..."
      - artifact: runbook.md
        locator: "§2 chatbot row"
        excerpt: "chatbot — container internal; no documented external health endpoint"
    control_mappings:
      nist_800_53r5: ["SI-13", "CP-10", "SC-5"]
      cwe: ["CWE-754", "CWE-1088"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: recommended
      summary: "Add dependency-aware /readyz endpoints to identity/workshop/community/chatbot; document expected shape."
      detail: |
        Add a `/readyz` endpoint to each backend service that returns 200
        only when (a) the service can complete a JWT-verifier call (for
        services that verify), (b) the primary datastore connection
        succeeds, (c) the JWKS fetch succeeds (for verifiers), (d) for
        chatbot, the LLM provider client initialization succeeds. Keep
        `/health_check` as a process-liveness probe. Document the
        distinction in `runbook.md` §2.
    related_concerns: [resilient]
    cross_references: []

  - schema_version: 1
    id: avail-8ad04f0e
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: blocked
    severity: medium
    confidence: high
    title: "No backup or restore procedure documented"
    summary: "Runbook §10 and tech_plan §6 explicitly state no backup/restore tooling ships; PITR posture, retention, restore-time bound are all unspecified."
    detail: |
      crAPI does not ship a backup procedure for Postgres, Mongo, or
      ChromaDB. Per tech_plan §6 and runbook §10, the operator can wipe
      named volumes with `docker compose down -v` but there is no
      forward-recovery path from a corrupted state.

      The Availability concern is not the absence of backups in
      isolation — for the demo intent that is appropriate — but the
      absence of any documented restore-time bound, RPO/RTO target, or
      ransomware-resilience posture. Per the rubric this is a defense-
      in-depth gap; severity is medium because the deploy intent
      (single-host demo) bounds the impact.

      Disposition is `blocked` because remediation depends on deploy
      target: a single-host demo has different backup needs from a
      classroom-shared host from a contemplated production deploy. The
      prerequisite is a stated deploy intent and recovery target.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 Persistence and storage"
        excerpt: "Backups: unspecified. No backup, restore, or PITR procedure ships in docs/setup.md or docs/troubleshooting.md"
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Consequences"
        excerpt: "Two backup / restore disciplines. Neither is shipped. A consistent point-in-time recovery across both stores would require coordinated snapshots"
    prerequisite_evidence:
      - "Deploy intent (demo / shared-classroom / production-contemplated) and corresponding RPO/RTO target"
      - "Cross-store consistency requirement for any backup approach (Postgres + Mongo coordinated snapshot vs independent)"
    control_mappings:
      nist_800_53r5: ["CP-9", "CP-9(1)", "CP-9(8)", "CP-10", "CP-10(2)"]
      cwe: ["CWE-1188"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: consider
      summary: "For any non-demo deploy, add a coordinated Postgres+Mongo backup procedure with a stated RPO/RTO."
      detail: |
        For demo deploys, the existing posture (no backups, accept
        teardown) is correct. For any other deploy intent, add a
        `deploy/backup/` directory with: (a) a script that calls
        `pg_dump` against the Postgres container and `mongodump`
        against Mongo with a stop-the-world pause between them
        (single-snapshot consistency), (b) an encrypted upload step
        to object storage with object-lock for ransomware resilience,
        (c) a documented restore drill in `runbook.md` §11.
    related_concerns: [immutability, distributed, confidentiality]
    cross_references: []

  - schema_version: 1
    id: avail-b01847b0
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "Compose resource limits (cpus:0.8, memory:384M) easily exhausted by DoS"
    summary: "Per ADR-0001 and threat-model D-4, every service is capped at 0.8 vCPU / 384 MiB; any of avail-6af5aff7 / avail-e96ad7ff / avail-c1ffcf8e tips a service below threshold."
    detail: |
      The default compose declares uniform tight resource limits to fit
      the t2.micro single-host target. While appropriate for the demo
      intent, the limits are operative for any DoS / cost-of-attack
      analysis: ~$0 of attacker resource produces a measurable identity-
      service or workshop-service slowdown.

      The threat model D-4 entry notes this is the amplifier behind D-1
      / D-2 / D-3 — the underlying rate-limit gap converts to OOMs and
      CPU-throttles before backpressure can apply. Per the rubric this
      is medium-high; the architecture-cap concern is medium in
      isolation, escalating to high when paired with the rate-limit
      gaps.

      The Helm `values.yaml` may declare different limits — not in the
      input set.
    evidence:
      - artifact: adrs/0001-microservice-split-by-language.md
        locator: "Consequences"
        excerpt: "Resource limits are uniformly tight. cpus: 0.8, memory: 384M per service to meet the t2.micro target; little room to absorb bursts"
      - artifact: threat-model.md
        locator: "§5 D-4"
        excerpt: "Every service has cpus: 0.8, memory: 384M. Any of D-1, D-2, D-3 lands on a thin pod; the pod OOMs or CPU-throttles cluster-wide"
    control_mappings:
      nist_800_53r5: ["SC-5", "SC-6", "SI-13"]
      cwe: ["CWE-770", "CWE-400"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: consider
      summary: "For any non-demo deploy, increase limits to ≥1 vCPU / 1 GiB per service and add per-service request/limit profiles in Helm."
      detail: |
        For the demo intent, document explicitly that the tight limits
        are part of the teaching surface — D-4 is intentional. For any
        non-demo deploy, increase the compose / Helm limits to 1.0 vCPU
        / 1024 MiB minimum, with a separate `values-production.yaml`
        that sets requests/limits per service. Add HPA / VPA
        configuration in the Helm chart for any deploy that expects
        non-trivial load.
    related_concerns: [distributed, resilient]
    cross_references: []

  - schema_version: 1
    id: avail-004444b5
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "Chatbot LLM cost amplification (denial of wallet)"
    summary: "POST /chatbot/genai/chat forwards user prompts to the configured LLM provider with no length cap, no per-user budget, no token-budget guardrail."
    detail: |
      The chatbot's chat endpoint accepts a user-supplied prompt and
      forwards it to whichever LLM provider is configured (OpenAI,
      Anthropic, Bedrock, Vertex, Groq, Mistral, Cohere, Azure). Per
      D-3 in the threat model, there is no prompt-length cap, no
      per-user rate limit, and no token-budget guardrail.

      Each call bills the operator's API key. Long prompts plus repeated
      calls drain the operator's LLM budget in minutes; this is the
      "denial of wallet" availability variant specific to LLM-integrated
      systems.

      Severity is medium per the rubric's "Defense-in-depth gap where a
      single compensating control is the only barrier" — the only
      barrier is operator-side LLM provider rate limiting, which is not
      a crAPI control. For operators using paid-per-token providers, the
      financial impact can be substantial.
    evidence:
      - artifact: threat-model.md
        locator: "§5 D-3"
        excerpt: "Caller submits very long prompts that the chatbot forwards to the configured LLM provider. Each call bills the operator's API key. No prompt-length cap"
      - artifact: architecture-index.md
        locator: "§crapi-chatbot Notable surface"
        excerpt: "Provider-specific env vars carry long-lived cloud credentials"
    control_mappings:
      nist_800_53r5: ["SC-5", "SC-6", "AC-7"]
      cwe: ["CWE-770", "CWE-400"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: recommended
      summary: "Add prompt-length cap (4K tokens), per-user rate limit (10 calls/hr), per-user daily token budget."
      detail: |
        In the chatbot service: (a) reject prompts >4K tokens client-side
        with a clear error; (b) apply a per-user throttle of 10 chat
        calls per hour; (c) track per-user daily token-spend against a
        configurable budget (default 100K input + output tokens per user
        per day) and reject with 402-equivalent once exceeded; (d)
        expose the per-user remaining budget in response headers so
        clients can self-throttle. Audit-log every chat call with the
        token counts (cross-ref nonrep-chatbot-attribution).
    related_concerns: [ephemeral, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: avail-4f60016d
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: blocked
    severity: medium
    confidence: high
    title: "No unbounded-request-size guard documented on web ingress or backend services"
    summary: "Inputs do not specify max_request_body_size on OpenResty or any backend; unbounded request body is a known DoS vector against thin pods."
    detail: |
      Per the rubric's "Unbounded request body size" pattern, the absence
      of a documented `max_request_body_size` is an Availability gap on
      any pod with limited memory. crAPI's compose limits (`memory: 384M`)
      make this concrete: a single 200 MiB POST to any endpoint can pin
      a worker's heap.

      The OpenResty ingress has a `client_max_body_size` default
      (typically 1M), but this is not documented in the input set. The
      backend services (Spring, Django, Go) each have their own
      defaults, none documented.

      Disposition is `blocked` because the effective limits depend on
      the actual nginx.conf.template content and per-service config not
      surfaced in inputs. The prerequisite is the rendered template
      content and each service's request-size config.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #2"
        excerpt: "web → backend services. Plain HTTP inside the Compose network unless TLS_ENABLED=true"
      - artifact: architecture-index.md
        locator: "§crapi-web Notable surface"
        excerpt: "Nginx config templates under services/web/ (nginx.conf.template, nginx.ssl.conf.template)"
    prerequisite_evidence:
      - "nginx.conf.template content showing client_max_body_size directive"
      - "Per-backend-service request-size configuration (Spring multipart.max-file-size, Django DATA_UPLOAD_MAX_MEMORY_SIZE, Go http.MaxBytesReader usage)"
    control_mappings:
      nist_800_53r5: ["SC-5", "SC-5(1)", "SI-10"]
      cwe: ["CWE-400", "CWE-770"]
