    recommendation:
      posture: recommended
      summary: "Set client_max_body_size=2M on OpenResty; mirror in each backend service; document in tech_plan.md."
      detail: |
        Add a §11 request-size policy: `client_max_body_size 2m;` on
        OpenResty for all paths except `/identity/api/v2/user/videos` and
        `/identity/api/v2/user/pictures` (which carry file uploads —
        50m would be reasonable for those). Mirror in Spring
        (`spring.servlet.multipart.max-file-size`), Django
        (`DATA_UPLOAD_MAX_MEMORY_SIZE`), Go (`http.MaxBytesReader` on
        every handler that reads the body).
