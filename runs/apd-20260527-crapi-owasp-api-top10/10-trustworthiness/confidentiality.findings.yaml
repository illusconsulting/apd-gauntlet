    title: "TLS configuration policy unspecified when TLS_ENABLED=true"
    summary: "Inputs declare a TLS_ENABLED=true mode but do not specify version floor, cipher suite, certificate validation, or mTLS topology."
    detail: |
      The tech plan notes `TLS_ENABLED=true` switches services to "HTTPS-
      backed mode using PKCS12 keystores shipped under each service's
      certs/ directory" but does not specify (a) the TLS version floor,
      (b) the cipher suite allowlist, (c) certificate-validation behavior
      on outbound connections (identity → gateway-service, chatbot → LLM
      provider), (d) whether mTLS is in scope at any boundary.

      The shipped certs are self-signed and development-only; production
      deploys would need real CA-issued certs but the procedure is not
      documented (cross-references the rotation gap in runbook §5).

      This is `blocked` rather than `gap` because the project's intent is
      that operators configure TLS at deploy time; the architectural
      decision (TLS available, configurable) is reasonable. The
      remediation prerequisite is a declared TLS policy.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Deployment topologies"
        excerpt: "TLS_ENABLED=true to switch services into HTTPS-backed mode using PKCS12 keystores shipped under each service's certs/ directory"
      - artifact: prior-audit.md
        locator: "§Operational hygiene"
        excerpt: "Self-signed certificates shipped under each service's certs/ directory. Development-only; TLS is off by default"
      - artifact: invariants.md
        locator: "INV-OPS-005"
        excerpt: "TLS_ENABLED=false by default; shipped certs are self-signed development material"
    prerequisite_evidence:
      - "TLS configuration policy: version floor, cipher suite allowlist, certificate-validation behavior on outbound calls"
      - "mTLS posture at the in-cluster service-to-service hop"
      - "Production certificate issuance and rotation procedure"
    control_mappings:
      nist_800_53r5: ["SC-8", "SC-8(1)", "SC-12", "SC-23", "IA-3"]
      cwe: ["CWE-326", "CWE-319"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "Add a TLS policy section to tech_plan.md naming version floor (TLS 1.2 min, 1.3 preferred), cipher allowlist, and outbound-call certificate-validation posture."
      detail: |
        Extend tech_plan.md with a §11 TLS Policy that declares: (a) TLS
        1.3 preferred, TLS 1.2 floor at the ingress and at every
        in-cluster service; (b) modern cipher allowlist (TLS_AES_128_GCM_SHA256,
        TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256 for 1.3; the
        Mozilla "intermediate" set for 1.2); (c) full certificate-chain
        validation including SAN match on all outbound calls; (d) mTLS at
        the in-cluster service-to-service hop using cert-manager or a
        service mesh; (e) deploy-time replacement of the self-signed
        certs with real CA-issued certs in any non-loopback deploy.
    related_concerns: [authenticity, integrity, ephemeral]
    cross_references: []
