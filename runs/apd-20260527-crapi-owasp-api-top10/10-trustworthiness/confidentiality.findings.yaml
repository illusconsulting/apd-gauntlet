finding:
  - schema_version: 1
    id: conf-fb05be4e
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Vehicle-location endpoint discloses owner identity + GPS across users (BOLA #1)"
    summary: "GET /identity/api/v2/vehicle/{vehicleId}/location returns latitude/longitude and owner full name to any authenticated caller; vehicleId leaks via community recent-posts."
    detail: |
      The vehicle-location endpoint accepts any UUID and returns the owner's
      identity plus precise GPS coordinates. Because the community
      recent-posts feed serializes `vehicleid` alongside the author display
      name, enumeration is unnecessary — a low-privilege account can iterate
      every leaked UUID and recover geolocation telemetry for arbitrary
      crAPI users.

      This is a Confidentiality finding because the architectural choice is
      "endpoint returns the object regardless of caller identity." The
      identity-verification half is in scope for Authenticity; the BOLA
      ownership-check half is captured here via the data-disclosure lens.

      Severity is high per "BOLA / IDOR exposing PII or payment data bounded
      to a subset" in the API security rubric, specifically because the
      blast radius is bounded only by the recent-posts feed size (and is
      effectively unbounded over time as new posts accrue). The disclosed
      data is geolocation, which is itself sensitive personal data under
      GDPR Article 4(1).
    evidence:
      - artifact: tech_plan.md
        locator: "§9 BOLA #1"
        excerpt: "endpoint accepts any UUID and returns latitude, longitude, and the owner's full name"
      - artifact: threat-model.md
        locator: "§4 I-1"
        excerpt: "community recent-posts response carries the author's vehicleid as a sibling field"
      - artifact: invariants.md
        locator: "INV-AUTHZ-002"
        excerpt: "UUIDs are non-sequential but leak via the community recent-posts feed"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-3(7)", "AC-4", "AC-6", "SC-8", "SI-15"]
      mitre_attack:
        - technique: "T1213"
          sub_technique: null
          tactic: "TA0009"
          rationale: "Missing object-level authorization permits authenticated callers to harvest vehicle records from an information repository (the identity service) at enumeration scale."
      cwe: ["CWE-639", "CWE-285"]
      owasp_api_top10: ["API1:2023", "API3:2023"]
    recommendation:
      posture: required
      summary: "Add ownership check on /vehicle/{vehicleId}/location and strip vehicleid from community recent-posts response."
      detail: |
        Two-part remediation: (1) in identity's `VehicleLocationController`,
        check that the bearer token's `sub` resolves to a user who owns the
        requested `vehicleId` (FK lookup against `vehicles.owner_id`), and
        reject with 403 otherwise. (2) In community's recent-posts
        serializer, remove the `vehicleid` field from the response shape
        entirely; the field has no UI consumer and exists only as a BOLA
        pivot per the documented challenge.
      references:
        - "external: OWASP API Security Top 10 — API1:2023"
    related_concerns: [authenticity, integrity]
    cross_references: []

  - schema_version: 1
    id: conf-5369e807
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Mechanic-report endpoint discloses report bodies across users (BOLA #2)"
    summary: "GET /workshop/api/mechanic/mechanic_report?report_id=N uses sequential integer IDs with no ownership check."
    detail: |
      Mechanic-report IDs are sequential integers exposed via the
      `report_link` field returned by `/workshop/api/merchant/contact_mechanic`.
      The report endpoint accepts the integer ID and returns the report body
      with no check against the bearer token's user.

      The disclosure surface is the report's body — vehicle problem
      description, mechanic comments, owner identifying data if the report
      includes it. The data-taxonomy file in the active domain pack treats
      `mechanic_report.body` as PII when it includes owner-identifying
      fields.

      Severity is high per the same BOLA clause as conf-fb05be4e; integer
      enumeration is materially worse than UUID enumeration because the
      attacker does not depend on a leak channel — they iterate from 1
      upward.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 BOLA #2"
        excerpt: "Mechanic report IDs are sequential integers; the endpoint does not authorise the requester against the report owner"
      - artifact: threat-model.md
        locator: "§4 I-2"
        excerpt: "Reports are keyed by sequential integer; no ownership check against the bearer token"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "AC-6", "SI-15"]
      mitre_attack:
        - technique: "T1213"
          sub_technique: null
          tactic: "TA0009"
          rationale: "Sequential integer IDs with missing ownership check enable trivial enumeration of mechanic-report records from the workshop information repository."
      cwe: ["CWE-639", "CWE-285", "CWE-340"]
      owasp_api_top10: ["API1:2023"]
    recommendation:
      posture: required
      summary: "Add ownership check on mechanic_report retrieval and migrate report_id to UUID."
      detail: |
        (1) In workshop's `MechanicReportView`, verify that the bearer
        token's user matches `service_request.owner_id` for the requested
        `report_id`; reject with 403 otherwise. (2) Migrate
        `mechanic_reports.report_id` from sequential integer to UUIDv4 to
        defeat enumeration. (1) is the primary fix; (2) is defense-in-depth.
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: conf-c237e01d
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "User dashboard and video responses leak internal fields (BOPLA read-side)"
    summary: "Dashboard and /videos/{video_id} serialize underlying ORM objects, exposing fields the UI never consumes (e.g., conversion_params)."
    detail: |
      Per tech_plan §9 EDE #4 and #5, the dashboard endpoint and the video
      retrieval endpoint return serialized ORM objects without an
      allowlist. The video object's internal `conversion_params` field
      leaks to clients (challenge 5), and the dashboard exposes user fields
      that the SPA does not display (challenge 4). The leaked field name
      directly enables challenge 10's mass-assignment write (T-2 in the
      threat model).

      This is OWASP API3:2023 (Broken Object Property Level Authorization,
      read-side / BOPLA). Severity is high per the rubric clause "BOPLA —
      excessive property exposure or mass-assignment write-side exposure";
      the field names are the actionable disclosure (not raw PII), but the
      pivot to challenge 10 means the read-side gap is structurally tied to
      a privilege-relevant write surface.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 EDE #4 and #5"
        excerpt: "user dashboard / profile endpoints serialize fields the UI does not display; video object response includes an internal property"
      - artifact: invariants.md
        locator: "INV-DATA-001"
        excerpt: "Challenges 4 and 5 contradict — internal video property and excessive user fields exposed"
    control_mappings:
      nist_800_53r5: ["AC-4", "SI-15", "SC-8"]
      mitre_attack:
        - technique: "T1213"
          sub_technique: null
          tactic: "TA0009"
          rationale: "ORM-default serialization exposes internal property names that aid downstream exploitation of write-side mass assignment on the same fields."
      cwe: ["CWE-200", "CWE-213"]
      owasp_api_top10: ["API3:2023"]
    recommendation:
      posture: required
      summary: "Add explicit response-field allowlists to dashboard and video serializers."
      detail: |
        Replace the default ORM-to-JSON serialization with explicit Pydantic
        / DRF Serializer / Jackson-MixIn allowlists per endpoint. Each
        endpoint must enumerate the response fields the SPA consumes; any
        field not on the allowlist is stripped. Include a smoke test that
        diffs the response shape against a checked-in golden file so
        accidental field re-introduction fails CI.
    related_concerns: [integrity, authenticity]
    cross_references: []

  - schema_version: 1
    id: conf-c66f08cf
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: critical
    confidence: high
    title: "Default signing key (jwks.json with private components) ships in the repo"
    summary: "services/identity/jwks.json contains RSA private-key components (d, p, q, dp, dq, qi) by default; anyone with the published image can mint tokens for any user."
    detail: |
      The default install ships a known-compromised RSA private key
      embedded in `services/identity/jwks.json`. Operators are advised to
      override but the default installation has the private key available
      to anyone who pulls the repo or the published Docker images. With
      this key any attacker mints arbitrary RS256-signed JWTs and bypasses
      the entire authentication system across every service that trusts
      identity's JWKS.

      This is a Confidentiality finding because the issue is *disclosure of
      cryptographic key material*. The forgeability consequence is captured
      by Authenticity in a separate finding (auth-jwks-key-default).

      Severity is critical per "Forgeable session tokens at platform scope
      — signing-key compromise" in the API security rubric. The rubric
      explicitly calls out signing-key compromise as equivalent to
      authentication bypass.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication"
        excerpt: "crAPI ships a default jwks.json containing the private key components (d, p, q, dp, dq, qi) checked into the repo"
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Consequences, Default JWKS ships private-key components"
        excerpt: "the default install ships a known-compromised private key. Anyone pulling the published images can mint tokens for any user"
      - artifact: prior-audit.md
        locator: "§Operational hygiene"
        excerpt: "Default JWKS contains private-key components"
    control_mappings:
      nist_800_53r5: ["SC-12", "SC-12(1)", "SC-12(2)", "SC-13", "IA-5(2)", "SC-28(1)"]
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Private signing key checked into the repository is a credential-in-file disclosure that enables forge-any-JWT against the entire cluster."
      cwe: ["CWE-321", "CWE-798"]
      owasp_api_top10: ["API2:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Generate a fresh per-install JWKS; remove private components from any repo-tracked file."
      detail: |
        Provide a deploy-time `gen-jwks.sh` that creates a fresh RSA-2048
        keypair, writes the public-only JWKS to the served location, and
        stores the private key in a KMS-backed mount that is never
        committed. Replace the `services/identity/jwks.json` default with
        an empty placeholder plus a startup check that refuses to start if
        the placeholder is unmodified. The keypair MUST NOT exist in any
        git history.
    related_concerns: [authenticity, ephemeral, immutability]
    cross_references: []

  - schema_version: 1
    id: conf-8f7c8c8d
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Mailhog web UI on :8025 has no authentication; exposes every OTP and password-reset email"
    summary: "When LISTEN_IP is anything other than 127.0.0.1, port :8025 is reachable; the Mailhog UI has no auth and surfaces every captured email."
    detail: |
      Mailhog's web UI is the canonical inspection interface for captured
      OTP and password-reset emails. It has no built-in authentication. The
      default `LISTEN_IP=127.0.0.1` makes the port loopback-only, but the
      documented override `LISTEN_IP=0.0.0.0` exposes it to any network the
      host is reachable on — with no warning in the setup documentation per
      ADR-0003 invariants.

      Any party that reaches `:8025` reads every signup OTP, every password-
      reset OTP, and every email-change notification for the `example.com`
      domain. Combined with email-only identity claim (S-6), this is an
      account-takeover path that bypasses every authentication control
      crAPI does have.

      Severity is high per "Defense-in-depth gap where a single
      compensating control is the only barrier" plus the consequential
      account-takeover impact. The single barrier is `LISTEN_IP` posture; a
      documented override removes it.
    evidence:
      - artifact: adrs/0003-mailhog-for-otp-delivery.md
        locator: "Consequences, OTP confidentiality"
        excerpt: "Mailhog has no built-in authentication on :8025. Anyone reachable on that port can read every captured OTP"
      - artifact: invariants.md
        locator: "INV-OPS-004"
        excerpt: "LISTEN_IP=0.0.0.0 override is documented in setup.md without a warning"
      - artifact: threat-model.md
        locator: "§4 I-6"
        excerpt: "Anyone on the same network as the deployed stack can read every signup OTP, password-reset OTP, and notification email"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "SC-7", "IA-2", "SC-8"]
      mitre_attack:
        - technique: "T1110"
          sub_technique: "T1110.001"
          tactic: "TA0006"
          rationale: "Direct read access to delivered OTPs collapses the OTP entropy bound to zero and substitutes the email-read step for the brute-force step in account takeover."
      cwe: ["CWE-306", "CWE-200"]
      owasp_api_top10: ["API8:2023", "API2:2023"]
    recommendation:
      posture: required
      summary: "Require an explicit warning before LISTEN_IP override; gate Mailhog UI behind basic-auth or remove it from non-loopback exposure."
      detail: |
        Modify the compose file so that `LISTEN_IP` other than `127.0.0.1`
        emits a startup warning to stderr that names Mailhog specifically.
        Add a `MAILHOG_BASIC_AUTH=user:pass` env that, when set, wraps the
        web UI in HTTP basic-auth (Mailhog supports this natively via
        `-auth-file`). For unattended lab deploys, the recommended config
        is `LISTEN_IP=127.0.0.1` plus a separate `kubectl port-forward`
        or `ssh -L` to the Mailhog UI.
    related_concerns: [authenticity, ephemeral]
    cross_references: []

  - schema_version: 1
    id: conf-3e324699
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Postgres and Mongo plaintext credentials in docker-compose.yml"
    summary: "Single shared credential admin/crapisecretpassword is world-readable in any repo clone, in any container's /proc/1/environ, and via docker inspect."
    detail: |
      `deploy/docker/docker-compose.yml` ships the datastore credentials as
      plaintext env values. The credentials are identical across Postgres,
      Mongo, every consuming service, and every operator clone of the repo.
      Anyone with read access to the repo, the deployed compose project, or
      the running containers reads these credentials.

      Direct datastore access bypasses every service-layer control —
      including the BOLA / BFLA / mass-assignment controls that *would*
      apply if a service-layer rewrite landed. Plaintext PII (`users`,
      `vehicles`, `mechanic_reports`) and quasi-PII (`vehicle_locations`)
      are readable and writeable with no application-tier audit signal.

      Severity is high per "Defense-in-depth gap where a single
      compensating control is the only barrier" — the barrier is "attacker
      cannot reach :5432" — combined with the broad bypass surface.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 Persistence and storage"
        excerpt: "user/password admin / crapisecretpassword (hardcoded in deploy/docker/docker-compose.yml)"
      - artifact: threat-model.md
        locator: "§4 I-7"
        excerpt: "Credentials (admin / crapisecretpassword) are world-readable in any clone of the repo, in any container's /proc/1/environ"
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Decision"
        excerpt: "Both datastores accept the same admin credential (admin / crapisecretpassword, hardcoded in deploy/docker/docker-compose.yml)"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "SC-12", "SC-28(1)", "AC-2"]
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Credentials in the compose file are credentials-in-files disclosure that grants full datastore read/write to any party with repo or container access."
      cwe: ["CWE-798", "CWE-256"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Remove static credentials from compose; generate per-deploy credentials via init container."
      detail: |
        Replace the static `POSTGRES_PASSWORD` and `MONGO_INITDB_ROOT_PASSWORD`
        env values with a deploy-time generated secret stored in a
        `.env.local` (gitignored) or a Vault-backed secret store. For
        Compose, an init container can `openssl rand -hex 32` once and
        propagate to consuming services through a shared volume. The Helm
        values file should require credentials passed via `--set` rather
        than defaulted in `values.yaml`.
    related_concerns: [authenticity, ephemeral, integrity]
    cross_references: []

  - schema_version: 1
    id: conf-cf457739
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "SSRF on contact_mechanic enables reads against internal services and cloud metadata"
    summary: "POST /workshop/api/merchant/contact_mechanic fetches a user-supplied webhook URL server-side and echoes the response body; no allowlist."
    detail: |
      The webhook URL parameter on `contact_mechanic` is fetched by the
      workshop service with no URL allowlist, no DNS-rebinding defense, and
      no response-body filter — the response body is returned to the
      caller. This is the classic SSRF data-exfiltration pattern: an
      attacker requests `http://169.254.169.254/latest/meta-data/iam/security-credentials/`
      (cloud metadata) or `http://postgresdb:5432`
      (internal-service probing) or `http://localhost:8025/api/v2/messages`
      (Mailhog UI scraping) and reads the response.

      In a cloud deploy this surface yields the EC2/ECS task role
      credentials. In any deploy this surface yields every reachable
      internal HTTP service's response, which on crAPI includes the Mailhog
      UI (every OTP), the JWKS endpoint, and the ChromaDB instance.

      Severity is high per "SSRF reaching internal services or cloud
      metadata" in the API security rubric. The rubric notes this trends
      to critical when IMDSv1 is reachable.

      This finding is the Confidentiality framing (what data the SSRF
      exfiltrates). The input-validation framing is owned by Integrity
      (intg-ssrf-contact-mechanic) and the cross-trust-boundary outbound
      framing by Authenticity (`related_concerns`).
    evidence:
      - artifact: tech_plan.md
        locator: "§9 SSRF #11"
        excerpt: "mechanic_api URL submitted to /workshop/api/merchant/contact_mechanic is fetched server-side, returning the HTTP response body to the caller. No allowlist"
      - artifact: threat-model.md
        locator: "§4 I-4"
        excerpt: "Caller submits a webhook URL pointing at http://169.254.169.254/latest/meta-data/, http://localhost:8025, http://postgresdb:5432, etc."
    control_mappings:
      nist_800_53r5: ["SC-7", "SC-7(5)", "AC-4", "SC-8(1)", "SI-10"]
      mitre_attack:
        - technique: "T1190"
          sub_technique: null
          tactic: "TA0001"
          rationale: "SSRF on a public-facing endpoint with response body returned to caller enables cloud-metadata and internal-service data extraction without further compromise."
      cwe: ["CWE-918", "CWE-441"]
      owasp_api_top10: ["API7:2023"]
    recommendation:
      posture: required
      summary: "Add an allowlist + DNS-rebinding defense to the contact_mechanic outbound fetch."
      detail: |
        Replace the unbounded `requests.get(mechanic_api)` call with a
        helper that (1) validates the URL against an explicit hostname
        allowlist (or rejects all but a configured mechanic-callback host
        per-mechanic-record), (2) resolves the hostname once and rebinds
        the resolved IP into the fetch to prevent DNS-time rebinding, (3)
        rejects RFC-1918 and link-local destinations including
        169.254.169.254, fc00::/7, and ::1, and (4) does not return the
        response body to the caller — return only a delivery-status
        boolean. Combine with rate limiting per ephem-contact-mechanic.
    related_concerns: [integrity, authenticity, availability]
    cross_references: []

  - schema_version: 1
    id: conf-bd613330
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Encryption at rest unconfigured on Postgres, Mongo, and ChromaDB"
    summary: "Tech plan and ADR-0004 explicitly state no encryption-at-rest is configured on any datastore; specifics of remediation depend on deploy substrate."
    detail: |
      crAPI runs PostgreSQL 14 and MongoDB 4.4 in upstream images with no
      encryption-at-rest configuration. ChromaDB is similarly default. In
      the Helm `values-pv.yaml` variant, volumes are host-mounted with no
      mention of underlying disk encryption.

      The PII stored at rest includes user emails, names, phones, vehicle
      identifiers, vehicle locations, mechanic-report bodies, and the
      gateway-service's faker-seeded SSN/card-number records. None of this
      is encrypted at the storage layer.

      This is `blocked` because the remediation is materially different per
      deploy substrate (LUKS on a Vagrant guest, EBS encryption on EC2,
      pgcrypto for column-level on Postgres). The required prerequisite is
      a declared deploy target. The architectural finding stands regardless
      — encryption-at-rest is absent.

      Severity is medium per "Defense-in-depth gap where a single
      compensating control is the only barrier" — the single barrier is
      datastore-port reachability, which conf-3e324699 and the SSRF in
      conf-cf457739 both penetrate.
    evidence:
      - artifact: tech_plan.md
        locator: "§10 Out-of-scope"
        excerpt: "Encryption at rest. Not configured anywhere in the inputs."
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Consequences"
        excerpt: "Two encryption-at-rest postures to evaluate. Neither is configured in the inputs."
    prerequisite_evidence:
      - "Target deploy substrate (cloud, on-prem, single host); disk-encryption posture of underlying storage"
      - "Field-level vs full-disk encryption decision; key-management hierarchy if field-level chosen"
      - "Backup encryption posture (cross-references avail-backup-procedure)"
    control_mappings:
      nist_800_53r5: ["SC-28", "SC-28(1)", "SC-12", "MP-4"]
      cwe: ["CWE-311", "CWE-312"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "Add an encryption-at-rest posture declaration to ADR-0004 and a deploy-substrate-specific implementation."
      detail: |
        Extend ADR-0004 with a third "encryption-at-rest" section that
        declares (a) the deploy target, (b) whether disk-level (LUKS, EBS)
        or column-level (pgcrypto, MongoDB CSFLE) encryption is in scope,
        (c) the key-management story (KMS hierarchy, key rotation cadence),
        and (d) which fields are covered. For lab deploys, document that
        the default is unencrypted and that production deploys MUST
        configure at-rest encryption appropriate to the substrate.
    related_concerns: [ephemeral, immutability]
    cross_references: []

  - schema_version: 1
    id: conf-b7aaa1e7
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Password storage scheme unspecified in inputs"
    summary: "users.password storage is not described; modern API security demands argon2/scrypt/bcrypt with appropriate parameters."
    detail: |
      The tech plan, architecture-index, and ADRs do not specify how
      `users.password` is stored. The intake brief flags this as an
      evidence gap. Modern API security demands a memory-hard hash
      (argon2id preferred; scrypt or bcrypt acceptable) with parameters
      tuned for the deploy substrate.

      Without this evidence, the gauntlet cannot evaluate the password-
      handling posture. The likelihood that the project ships
      `BCryptPasswordEncoder` defaults from Spring Security is high, but
      "likely-OK" is not the bar — block until the verifier can read the
      identity service's password-config bean and confirm the hash, the
      cost factor, and the migration story.

      Severity is medium because the failure mode is bounded: a database
      compromise (already enabled by conf-3e324699) discloses password
      hashes; weak hashing turns offline disclosure into cleartext
      recovery.
    evidence:
      - artifact: tech_plan.md
        locator: "§5 Data model"
        excerpt: "password (storage scheme unspecified in inputs)"
      - artifact: context-brief.md
        locator: "§5 Evidence gaps"
        excerpt: "Password hashing scheme — users.password storage is unspecified"
    prerequisite_evidence:
      - "Spring Security password-encoder bean configuration in identity"
      - "argon2/scrypt/bcrypt cost factor in effect"
      - "Migration / rehash-on-login policy for legacy hashes"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "SC-13"]
      cwe: ["CWE-916", "CWE-256", "CWE-326"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: recommended
      summary: "Document password-storage posture in ADRs or tech plan and confirm via code review."
      detail: |
        Add a §4.1 to tech_plan.md naming the password-hashing scheme,
        the cost factor, and the migration policy for any legacy hashes.
        For Spring Security, this is the `PasswordEncoder` bean wiring;
        for argon2id with sensible defaults the recommended parameters
        are time=3, memory=64 MiB, parallelism=1 per OWASP guidance.
    related_concerns: [authenticity, ephemeral]
    cross_references: []

  - schema_version: 1
    id: conf-d760cafe
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Gateway-service VIN-to-PII oracle exposes bulk PII and payment data"
    summary: "api.mypremiumdealership.com returns SSN/address/card_number/card_owner_name deterministically seeded by VIN; basic-auth alone gates access."
    detail: |
      The simulated dealership gateway returns a faker-seeded record per
      VIN — name, phone, SSN, address, card_number, card_owner_name,
      card_expiry — with FNV-32a determinism. The gating control is HTTP
      basic-auth with an undocumented credential (`S-5` in the threat
      model).

      In the threat model's framing, the gateway is a cross-organization
      boundary. The deterministic seeding means *every deploy* yields the
      same PII for the same VIN — useful pedagogically but materially
      worse than a randomized fake: any VIN leak (BOLA #1 leaks
      `vehicleId`; from there a VIN lookup in identity, then a gateway
      query) becomes a bulk PII oracle with stable identity across deploys
      (re-identification surface).

      Severity is high per "BOLA / IDOR exposing PII or payment data
      bounded to a subset". When combined with conf-fb05be4e (BOLA on
      vehicle UUIDs) and S-5 (basic-auth disclosure), the chain becomes
      mass-PII extraction; that chained exposure escalates toward
      critical, captured separately in attack-path analysis (Phase 5.6).
    evidence:
      - artifact: architecture-index.md
        locator: "§api.mypremiumdealership.com"
        excerpt: "Returns deterministically faked PII (name, phone, ssn, address, card_number, card_owner_name, card_expiry) seeded from fnv32a(VIN)"
      - artifact: threat-model.md
        locator: "§4 I-8"
        excerpt: "Outputs are deterministic (FNV-32a seed), so the same VIN always returns the same identity record — useful as a fingerprint / re-identification oracle"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "AC-6", "SC-7", "IA-5"]
      mitre_attack:
        - technique: "T1213"
          sub_technique: null
          tactic: "TA0009"
          rationale: "Deterministic VIN-seeded PII repository with weak basic-auth gating enables collection of bulk personal and payment data when paired with VIN enumeration."
      cwe: ["CWE-639", "CWE-340", "CWE-200"]
      owasp_api_top10: ["API1:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Replace deterministic VIN-seeding with per-deploy random seeds and add rate-limiting + audit to the gateway-service."
      detail: |
        (1) In gateway-service, seed the faker once per service boot from
        a process-random value rather than from `fnv32a(VIN)`; preserves
        deterministic responses within a deploy lifecycle but defeats
        cross-deploy re-identification. (2) Rotate the basic-auth
        credential per-deploy via the same mechanism proposed in
        conf-3e324699. (3) Add a per-source-IP rate limit on /owners
        and audit every lookup with the requester identity. (4) Document
        these controls in `architecture-index.md` for the gateway service.
    related_concerns: [authenticity, ephemeral, non_repudiation]
