capability:
  - schema_version: 1
    id: conf-cap-c354ef8e
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    title: "JWKS endpoint published over standard /.well-known/jwks.json path"
    description: |
      The identity service publishes its signing-key public material at
      `/.well-known/jwks.json` through the web ingress on :8888. This is
      the standard OIDC posture and enables every downstream service to
      verify JWTs without sharing key material directly. ADR-0002
      documents the intent.
    maturity: designed
    scope: |
      Confirmed for the asymmetric-key-distribution pattern itself (the
      mechanism is in place). NOT confirmed for production-grade
      operations: the default install ships private-key components in the
      same file (covered in conf-c66f08cf), and the public JWKS is the
      attack enabler for the algorithm-confusion vector (covered in
      integrity findings on JWT verification).
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #3"
        excerpt: "consume IDENTITY_SERVICE=crapi-identity:8080 to validate bearer JWTs against the JWKS endpoint"
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Decision"
        excerpt: "The corresponding public key is published at GET /.well-known/jwks.json through the web ingress on :8888"
    control_mappings:
      nist_800_53r5: ["SC-12", "IA-5(2)", "SC-17"]
    caveats:
      - "Default jwks.json file contains private-key components — see conf-c66f08cf"
      - "No key rotation procedure ships — see ephem-jwks-rotation"
      - "Verifier algorithm-pinning is not enforced consistently — see intg-jwt-algo-pinning"
    related_concerns: [authenticity, ephemeral]

  - schema_version: 1
    id: conf-cap-0eea8c9d
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    title: "Default Mailhog loopback binding (LISTEN_IP=127.0.0.1) on unattended deploys"
    description: |
      The default compose configuration binds Mailhog UI to 127.0.0.1,
      keeping the captured-email surface unreachable from anything other
      than the local host. This is the single compensating control that
      keeps every OTP confidential in the default deploy posture.
    maturity: designed
    scope: |
      Confirmed for the documented default. NOT enforced — the
      LISTEN_IP=0.0.0.0 override documented in setup.md removes the
      binding without any startup warning (see conf-8f7c8c8d for the
      finding-side framing).
    evidence:
      - artifact: invariants.md
        locator: "INV-OPS-004"
        excerpt: "Asserted in ADR-0003. Enforced by LISTEN_IP=127.0.0.1 default"
      - artifact: adrs/0003-mailhog-for-otp-delivery.md
        locator: "Decision"
        excerpt: "With LISTEN_IP=127.0.0.1 (the default), it is loopback-only"
    control_mappings:
      nist_800_53r5: ["SC-7", "AC-3"]
    caveats:
      - "Documented LISTEN_IP override removes the binding"
      - "Operator-enforced, not architecturally pinned"
    related_concerns: [authenticity]

  - schema_version: 1
    id: conf-cap-545144bc
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    title: "Datastores not exposed externally by default compose"
    description: |
      The default `deploy/docker/docker-compose.yml` does not publish the
      Postgres or Mongo ports to LISTEN_IP. Datastore reachability is
      restricted to the compose network by virtue of the absent port
      mapping. ADR-0004 documents this intent.
    maturity: implemented
    scope: |
      Confirmed for the default Compose deploy. NOT confirmed for the
      Helm deploy — the shipped values.yaml does not declare a
      NetworkPolicy restricting in-cluster reachability of postgres or
      mongo (see context-brief.md §5 evidence gaps).
    evidence:
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Invariants pinned by this ADR"
        excerpt: "Held in compose by not exposing :5432 / :27017 to LISTEN_IP"
      - artifact: architecture-index.md
        locator: "§postgresdb"
        excerpt: "Inbound: identity, workshop, community, chatbot. Outbound: None"
    control_mappings:
      nist_800_53r5: ["SC-7", "SC-7(5)", "AC-4"]
    caveats:
      - "Helm NetworkPolicy not in shipped values"
      - "SSRF on contact_mechanic (conf-cf457739) penetrates this compensating control from any in-cluster service"
      - "Hardcoded credentials (conf-3e324699) defeat this if reachability is established"
    related_concerns: [authenticity, distributed]

  - schema_version: 1
    id: conf-cap-95d55d61
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    title: "TLS-capable mode (TLS_ENABLED=true) available across all services"
    description: |
      Every service ships a `certs/` directory with a self-signed PKCS12
      keystore and a nginx.ssl.conf.template variant. Setting
      TLS_ENABLED=true switches services to HTTPS on :8443. The
      mechanism is in place even though the default is HTTP.
    maturity: designed
    scope: |
      Confirmed: the mechanism exists. NOT confirmed: production
      configuration (real certs, TLS version floor, cipher allowlist,
      mTLS — see conf-5f25ca4e for the policy gap).
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Deployment topologies"
        excerpt: "TLS_ENABLED=true to switch services into HTTPS-backed mode using PKCS12 keystores"
      - artifact: architecture-index.md
        locator: "§crapi-web"
        excerpt: "certs/ for development TLS material"
    control_mappings:
      nist_800_53r5: ["SC-8", "SC-8(1)", "SC-23"]
    caveats:
      - "Default is TLS_ENABLED=false"
      - "Shipped certs are self-signed dev material"
      - "Outbound TLS posture (identity → gateway) not separately documented"
    related_concerns: [authenticity, ephemeral]

  - schema_version: 1
    id: conf-cap-e149eaec
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    title: "UUID identifier choice on vehicles (vs sequential integer)"
    description: |
      Per ADR-implicit and INV-AUTHZ-002, vehicle identifiers are UUIDv4
      rather than sequential integers. This defeats simple enumeration
      across the vehicles table — an attacker cannot iterate 1..N to
      pull arbitrary vehicle records.
    maturity: implemented
    scope: |
      Confirmed by the OpenAPI spec shape and the invariant assertion.
      Significantly weakened in practice by the BOLA leak channel: the
      community recent-posts feed serializes vehicleid, defeating the
      enumeration defense (see conf-fb05be4e for the BOLA finding).
    evidence:
      - artifact: invariants.md
        locator: "INV-AUTHZ-002"
        excerpt: "Asserted in: the vehicleId: GUID shape in the OpenAPI spec. Enforced by: UUIDv4 randomness at vehicle creation"
      - artifact: tech_plan.md
        locator: "§5 Data model identity / postgres vehicles"
        excerpt: "UUID vehicleId (per challenge 1, IDs are GUIDs but they leak via the community recent-posts endpoint)"
    control_mappings:
      nist_800_53r5: ["AC-4", "SC-7"]
    caveats:
      - "Leaked via community recent-posts; UUID randomness defense defeated"
      - "Other identifier surfaces (mechanic_report.id) use sequential integers"
    related_concerns: [authenticity]
