capability:
  - schema_version: 1
    id: intg-cap-4212a616
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "OpenAPI specification published for the API surface"
    description: |
      The workshop service exposes the canonical OpenAPI spec at
      `/workshop/openapi-spec/` and the chatbot indexes it for RAG
      retrieval at boot. The spec is the artifact that defines request /
      response shapes for every documented endpoint.
    maturity: implemented
    scope: |
      Confirmed: spec exists, is served, is indexed. NOT confirmed:
      whether request validation actually conforms to the spec at the
      handler boundary (per intg-e7ebcc95, intg-b7417f91 the handlers
      accept inputs the spec does not document). The spec is a documentation
      artifact, not an enforced contract — schema enforcement gap is a
      finding-side concern.
    evidence:
      - artifact: runbook.md
        locator: "§4 Extract the OpenAPI spec"
        excerpt: "curl -sk http://localhost:8888/workshop/openapi-spec/ -o crapi-openapi.json"
      - artifact: tech_plan.md
        locator: "§8 API surfaces"
        excerpt: "Drawn from openapi-spec/crapi-openapi-spec.json (paths summarised; verbs and exact request shapes available in the spec). 41 endpoints"
    control_mappings:
      nist_800_53r5: ["SI-10", "CM-2"]
    caveats:
      - "Spec ≠ enforced schema; handlers accept inputs the spec doesn't document (intg-e7ebcc95)"
      - "No CI gate verifying handler behavior matches the spec"
    related_concerns: [authenticity]

  - schema_version: 1
    id: intg-cap-d764e156
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "RS256 asymmetric JWT mint (signing private key not distributed to verifiers)"
    description: |
      Per ADR-0002, JWTs are signed with RS256 by the identity service.
      Verifiers use the published JWKS — the asymmetric posture means
      verifiers do NOT need the private key, so a verifier compromise
      does not yield token-minting capability.
    maturity: designed
    scope: |
      Confirmed: the asymmetric design choice and the JWKS distribution
      pattern. NOT confirmed: production posture — the default install
      ships the private key in jwks.json (conf-c66f08cf), and verifier
      libraries accept HS256 in addition to RS256 (intg-15c04a1c) which
      collapses the asymmetric benefit.
    evidence:
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Decision"
        excerpt: "crapi-identity mints RS256-signed JWTs. The signing private key lives in a single JWKS file at services/identity/jwks.json"
    control_mappings:
      nist_800_53r5: ["SC-12", "IA-5(2)", "SI-7", "SC-13"]
    caveats:
      - "Default JWKS file contains private-key components (conf-c66f08cf)"
      - "HS256 also accepted; benefit defeated by intg-15c04a1c"
      - "No rotation procedure (ephem-jwks-rotation)"
    related_concerns: [confidentiality, authenticity, ephemeral]

  - schema_version: 1
    id: intg-cap-a070072a
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "Coupon claim-state column (intent: per-user idempotent redemption)"
    description: |
      The `coupons.claimed_by` column is the intended idempotency
      mechanism for coupon redemption per INV-INPUT-003. A second
      redemption attempt for the same code by the same user should
      observe the `claimed_by` value and reject the duplicate.
    maturity: designed
    scope: |
      Confirmed: the mechanism is in place as a column. NOT confirmed:
      enforcement under attack — the SQL-injection vector
      (intg-2aeb03f1) defeats the claim-state check by re-arming the
      column directly (intg-ab3edc7a).
    evidence:
      - artifact: tech_plan.md
        locator: "§5 Data model community coupons"
        excerpt: "coupons (postgres) — code, claimed_by FK; redemption tracked via a separate flag"
      - artifact: invariants.md
        locator: "INV-INPUT-003"
        excerpt: "Coupon redemption is idempotent per user"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-7"]
    caveats:
      - "SQL injection vector defeats the idempotency check (intg-2aeb03f1, intg-ab3edc7a)"
      - "No DB-level unique constraint backing the application check"
    related_concerns: [confidentiality]

  - schema_version: 1
    id: intg-cap-c6f2bf49
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "Rate limit on /identity/api/auth/v2/check-otp (single partial control)"
    description: |
      Per challenge 3 solution discussion, the `v2/check-otp` endpoint
      has a rate limit implemented after the original challenge was
      published. The challenge framing notes that the rate-limit was the
      response to the brute-force concern — i.e., the project ships *a*
      mitigation on the auth surface, just incomplete coverage.
    maturity: implemented
    scope: |
      Confirmed for `v2/check-otp` specifically. NOT confirmed and
      explicitly absent for `v3/check-otp` and any predicted future
      variants per the challenge solution's "predictable versioning"
      observation. See avail-otp-rate-limit / authn-otp-bypass for the
      gap-side findings.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication, /v2/check-otp row"
        excerpt: "this path is rate-limited but neighboring /v3/check-otp variants are not"
      - artifact: threat-model.md
        locator: "§5 D-2"
        excerpt: "v2/check-otp has a documented rate limit; v3 does not"
    control_mappings:
      nist_800_53r5: ["SC-5", "AC-7", "IA-5"]
    caveats:
      - "Only v2 covered; v3 and future variants not covered"
      - "Threshold and identity dimension not documented"
    related_concerns: [availability, authenticity]
