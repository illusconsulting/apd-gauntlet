  - schema_version: 1
    id: immut-49cb874c
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: medium
    confidence: high
    title: "Cryptographic key lifecycle events not auditable"
    summary: "No record of jwks.json mutation or credential rotation; key-lifecycle events go unaudited."
    detail: |
      The rubric's required-immutable data classes include
      "cryptographic key lifecycle events — key creation, rotation,
      revocation, destruction". crAPI ships no such audit. When an
      operator drops a replacement `jwks.json` per runbook §5,
      there's no record of the change beyond the filesystem mtime.
      When datastore credentials are rotated per runbook §6, there's
      no record of the change beyond the env-var swap.
    
      Combined with ephem-30d38360 (no rotation procedure at all),
      this is a chicken-and-egg: rotation is GAP so audit-of-rotation
      is moot; when rotation is added, audit emission must be part
      of the rotation script.
    
      Severity is medium because the demo-intent bounds the
      operational impact; for any production-adjacent posture this
      is the audit-side of the rotation gap.
    evidence:
      - artifact: runbook.md
        locator: "§5 Rotate the JWT signing key"
        excerpt: "GAP. No documented procedure ships"
    control_mappings:
      nist_800_53r5: ["AU-3", "AU-12", "SC-12", "IA-5"]
      cwe: ["CWE-778"]
      owasp_api_top10: ["API9:2023", "API8:2023"]
    recommendation:
      posture: recommended
      summary: "When rotation tooling added, rotation scripts emit key-lifecycle audit events."
    related_concerns: [ephemeral, non_repudiation]
    cross_references: [ephem-30d38360, nonrep-7fad26d8]

