    title: "No rate limit on /identity/api/auth/v3/check-otp (4-digit space, 10k entries)"
    summary: "Unbounded guess attempts against trivial OTP space; brute force completes in seconds."
    detail: |
      The v3 OTP-check variant lacks the rate limit applied to v2 (per
      challenge 3 solution discussion). At a 10,000-entry OTP space and
      no per-account / per-IP throttle, an attacker exhausts the keyspace
      in seconds, achieving account takeover for any user whose email is
      enumerable (which is every user, per community-post author display).
    
      Beyond the authentication-bypass severity (owned by Authenticity),
      this is also an Availability concern: the brute-force request
      volume is itself a probe-storm DoS against identity, and the OTP
      issuance side (forget-password) has no rate limit either — a
      coordinated attacker can drive OTP issuance and brute force in
      parallel, saturating identity's CPU budget under the compose
      `cpus: 0.8` cap.
    
      Severity is high per the "Rate-limiting absent on authentication
      [...] account-recovery endpoints" clause, escalated by the
      compose-cap amplifier per the rubric's compose-and-amplify guidance.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication, /v3/check-otp"
        excerpt: "rate-limiting on v2 was added but v3 and other variants remain bypassable"
