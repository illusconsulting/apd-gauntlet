  - schema_version: 1
    id: ephem-edcc17b4
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "ChromaDB pinned to :latest — image content can change without pull event"
    summary: "Mutable image tag introduces deploy-time version drift."
    detail: |
      Per tech_plan §2 and architecture-index `§chromadb`, the
      ChromaDB image is `chromadb/chroma:latest`. The `:latest` tag is
      the canonical mutable-in-production anti-pattern: the published
      image at `:latest` can change at any time, and Docker's
      `imagePullPolicy: IfNotPresent` (the default) means a node may
      run an older `:latest` than another node, producing version skew.
    
      The Ephemeral concern is twofold: (a) the running image content
      is non-deterministic — a deploy on Monday differs from a deploy
      on Friday with no Git commit between them; (b) there is no
      attribution chain from the artifact-signing perspective (covered
      in authn-image-signing).
    
      Severity is medium per the rubric's "Container images mutable in
      production — `:latest` tags" pattern. Postgres and Mongo are
      pinned (`postgres:14`, `mongo:4.4`) which is the floor; the
      ChromaDB exception is the operative finding.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Services table"
        excerpt: "chromadb — chromadb (chromadb/chroma:latest)"
    control_mappings:
      nist_800_53r5: ["CM-2", "CM-3", "SA-15(7)", "SI-7", "SR-4"]
      cwe: ["CWE-1357"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Pin ChromaDB to specific version + digest; apply digest-pinning to all images."
    related_concerns: [authenticity, immutability, integrity]

