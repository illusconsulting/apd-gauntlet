    disposition: gap
    severity: high
    confidence: high
    title: "BFLA — admin video-delete reachable by non-admin tokens"
    summary: "DELETE /identity/api/v2/admin/videos/{id} accepts any user token; role claim not checked."
    detail: |
      Per challenge 7 / E-1, the admin-prefixed endpoint accepts non-admin
      tokens — the role claim is never checked. The Authenticity framing:
      the identity assertion is verified (the token signature checks out
      per the alg-confusion gaps aside) but the *role* claim within the
      verified identity is not enforced. The authorization side of
      authentication fails.
    
      The threat-model E-1 entry notes the pattern generalizes:
      `/workshop/api/shop/orders/all` and `/workshop/api/management/users/all`
      are also admin-shaped per naming, and their auth posture is not
      stated in inputs.
    
      Severity is high per "BFLA exposing admin functions to authenticated
      low-privilege users" in the API security rubric. The clause
      enumerates "missing role check on a privilege-altering operation"
      as the canonical case.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 BFLA #7"
        excerpt: "The admin path DELETE /identity/api/v2/admin/videos/{video_id} does not check the caller's role"
    control_mappings:
      nist_800_53r5: ["IA-2", "AC-3", "AC-6", "AC-6(1)", "AC-6(7)"]
      mitre_attack:
        - {technique: "T1078", sub_technique: null, tactic: "TA0004", rationale: "Missing role check on admin-prefixed endpoint lets valid low-priv account perform admin operations."}
      cwe: ["CWE-285", "CWE-269", "CWE-862"]
      owasp_api_top10: ["API5:2023"]
    recommendation:
      posture: required
      summary: "Add role check on /admin/* prefix; audit /shop/orders/all, /management/users/all for same pattern."
    related_concerns: [integrity, non_repudiation]

  - schema_version: 1
    id: auth-0925a719
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: critical
    confidence: high
    title: "No MFA on any authentication surface — including admin"
    summary: "Per tech_plan §4: 'There is no MFA' on any surface, including admin actions."
    detail: |
      Per tech_plan §4 explicitly: "There is no MFA." Every
      authentication surface — signup, login, password reset, admin
      actions — relies on a single factor (password or password-reset
      OTP). Admin video-delete (BFLA notwithstanding), admin order
      enumeration, and admin user enumeration all execute against the
      same single-factor token.
    
      The rubric clause "MFA optional on administrative surfaces (OWASP
      API2)" rates this critical when on PII or payment admin. crAPI's
      admin surfaces touch user-record enumeration and video deletion;
      the broader gateway-service path reaches faker-seeded PII / payment
      data. Severity is critical per the rubric for the PII-admin
      framing.
    
      For the demo intent the absence of MFA is expected and acceptable;
      this finding is the structural finding against the architecture,
      not a procedural complaint against the operator.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication and sessions"
        excerpt: "There is no MFA"
    control_mappings:
      nist_800_53r5: ["IA-2", "IA-2(1)", "IA-2(2)", "IA-2(6)", "IA-2(8)", "AC-6"]
      mitre_attack:
        - {technique: "T1078", sub_technique: null, tactic: "TA0004", rationale: "Absence of MFA on admin surfaces means stolen or forged credential yields admin authority with no second-factor barrier."}
      cwe: ["CWE-308"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Add TOTP MFA on login (optional user, required admin); WebAuthn for admin step-up."
    related_concerns: [ephemeral, non_repudiation]

  - schema_version: 1
    id: auth-b57f022f
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "OTP-based password reset is single-factor account-recovery"
    summary: "Forget-password initiates reset via email-only claim; OTP success completes recovery with no additional verification."
    detail: |
      Per tech_plan §4 and the threat-model S-6 entry, the password-
      reset flow accepts the email as the sole identity claim. The OTP
      verification (which is itself weak per avail-e96ad7ff) is the
      only barrier between request and password change.
    
      Authentication-quality on account-recovery is a sharper concern
      than authentication-quality on login: the recovery flow exists
      specifically to grant access to accounts whose primary
      credential is unknown to the user. Without a second factor or
      knowledge-of-prior-password requirement, any party who can read
      the OTP (mailhog at :8025, attacker who can brute force, S-6
      enumeration combined with OTP weakness) gets the account.
    
      Severity is high per "MFA bypass or weak MFA on PII or payment
      surfaces" — the forget-password path is the MFA-bypass
      equivalent when MFA is absent (auth-0925a719). The rubric
      specifically calls out recovery-code endpoints without rate
      limiting; this is the OTP-flow equivalent.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication endpoints"
        excerpt: "POST /identity/api/auth/forget-password — OTP email dispatch"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-2", "IA-2(8)", "AC-7"]
      cwe: ["CWE-640", "CWE-308"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Require knowledge of prior password OR MFA factor for password reset; rate-limit forget-password."
    related_concerns: [ephemeral, availability]
    cross_references: [avail-c1ffcf8e, avail-e96ad7ff]

  - schema_version: 1
    id: auth-5b90d6c3
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "Service-to-service authentication via bearer JWT only, not mTLS or workload identity"
    summary: "Plaintext HTTP in-cluster with header-trust; no mTLS, no SPIFFE."
    detail: |
      In-cluster service-to-service traffic uses bearer JWTs for
      authentication and plaintext HTTP for transport. There is no
      mTLS, no SPIFFE/SPIRE workload identity, no service-mesh
      identity binding. The web tier presents `Host` and
      `X-Forwarded-*` headers that backend services trust (per
      tech_plan §3 boundary #2).
    
      Per the rubric clause "Service-to-service inside the cluster
      uses shared bearer tokens, not mTLS or workload identity" —
      severity is high. The lateral-movement amplification is concrete:
      an attacker who reaches one service-internal pod (e.g., via
      SSRF in workshop reaching identity directly) can forge whatever
      headers the next service trusts.
    
      For the demo intent on a single host this is acceptable. For
      any deploy with multiple network zones or untrusted in-cluster
      traffic, the absence of mTLS is the structural identity gap.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #2"
        excerpt: "Plain HTTP inside the Compose network unless TLS_ENABLED=true. No mutual TLS"
    control_mappings:
      nist_800_53r5: ["SC-8", "SC-8(1)", "SC-23", "IA-3", "IA-9"]
      mitre_attack:
        - {technique: "T1557", sub_technique: null, tactic: "TA0006", rationale: "Plaintext in-cluster traffic with header-trust posture allows in-cluster observers to intercept and forge inter-service requests."}
      cwe: ["CWE-319", "CWE-345"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "For non-demo deploys, enable mTLS via service mesh (Linkerd/Istio) with SPIFFE workload identity."
    related_concerns: [distributed, confidentiality, ephemeral]
    cross_references: [dist-bc4789b6]

