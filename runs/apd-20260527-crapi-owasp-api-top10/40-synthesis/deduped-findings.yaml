    title: "Backup immutability not addressed — no backups exist; ransomware resilience absent"
    summary: "Per rubric backups must be immutable; crAPI has no backups (avail-8ad04f0e)."
    detail: |
      crAPI ships no backup or restore procedure for either Postgres or MongoDB
      (tech_plan §6: "Backups: unspecified"). The Immutability rubric requires
      that any backup set be written to a medium that resists post-write
      modification (e.g., S3 object-lock compliance mode, WORM tape). Because
      no backups exist at all, the immutability requirement is vacuously
      unmet and remains blocked on avail-8ad04f0e (introduce a backup
      procedure). Once a backup mechanism is chosen, immutability must be
      co-designed: a mutable backup is no defence against ransomware that
      can reach the backup destination.

      This finding is synthesizer-minted (no backing per-specialist record);
      it was raised by the Immutability specialist to flag the gap for
      cross-reference with avail-8ad04f0e.
