  - schema_version: 1
    id: auth-04fcfb9a
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: medium
    confidence: medium
    title: "Container images not signed; no admission control verifies image authenticity"
    summary: "No cosign/notation signature posture, no admission control; image-pull trust relies on registry."
    detail: |
      Per the rubric's "Container images deployed without signature
      verification or admission control" pattern, the absence of any
      image-signing posture is a supply-chain authenticity gap. crAPI
      pulls upstream images (postgres, mongo, chromadb, mailhog) and
      crAPI's own (crapi/crapi-identity, etc.) with no signature
      verification step documented.
    
      The Authenticity concern: when a deploy pulls `crapi/crapi-identity:
      ${VERSION}`, there is no cryptographic proof that the image content
      matches what the crAPI maintainers published. Registry compromise
      or DNS poisoning yields silent image substitution.
    
      Severity is medium per the rubric's image-signing pattern. For the
      demo intent (single operator pulling from public registries) the
      impact is bounded by registry trust. For any deploy that trusts
      crAPI as a teaching target rather than as a malware-delivery
      surface, this would be material.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Services"
        excerpt: "crapi/crapi-identity:${VERSION}"
    control_mappings:
      nist_800_53r5: ["SI-7", "SR-4", "SR-4(3)", "SR-4(4)", "SR-11", "CM-5"]
      cwe: ["CWE-345"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "Upstream: sign crAPI images via cosign; publish verification key; document operator verification."
    related_concerns: [ephemeral, immutability, integrity]
    cross_references: [ephem-edcc17b4]

  - schema_version: 1
    id: auth-c990b0ff
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: blocked
    severity: medium
    confidence: medium
    title: "AAL target undeclared (NIST SP 800-63B AAL1/AAL2/AAL3 not stated)"
    summary: "No Authenticator Assurance Level target; cannot evaluate MFA-strength against defined standard."
    detail: |
      Per the rubric's "AAL undeclared" pattern, the absence of an
      Authenticator Assurance Level target means the gauntlet cannot
      evaluate authentication strength against a defined standard.
    
      crAPI's authentication posture (single-factor password, OTP
      account recovery, no MFA) implicitly targets AAL1 — but AAL1 is
      NIST's lowest tier and is generally inappropriate for any system
      handling PII at scale.
    
      Disposition is `blocked` rather than `gap` because the
      remediation is to declare a target, and the target choice
      depends on the deploy intent (per agents.md the demo intent
      makes AAL1 acceptable; for any other intent AAL2 minimum).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication and sessions"
        excerpt: "There is no MFA. There is no documented session-revocation surface"
    prerequisite_evidence:
      - "AAL target declaration per deploy intent"
      - "Per-surface AAL declaration"
    control_mappings:
      nist_800_53r5: ["IA-2", "IA-2(1)", "IA-2(2)", "IA-2(8)"]
      cwe: ["CWE-308"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: recommended
      summary: "Add AAL target to tech_plan §4; couple with MFA introduction."
    related_concerns: [ephemeral, non_repudiation]
    cross_references: [auth-0925a719]

  # ---- Non-Repudiation ----
  - schema_version: 1
    id: nonrep-7fad26d8
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "No application-level audit log for consequential actions across any service"
    summary: "Per runbook §8: GAP. No audit log; only LOG_LEVEL=INFO stdout. No actor attribution, no schema, no retention."
    detail: |
      Per runbook §8 ("Inspect audit data") explicitly: "GAP. No
      application-level audit log is shipped. Containers emit to
      stdout at LOG_LEVEL=INFO; aggregation is operator-provided."
      Per the threat-model R-1 entry, there is no immutable record of
      who initiated financial actions, password resets, vehicle
      additions, mechanic-report submissions, or any other consequential
      action enumerated in the active domain pack's consequential-
      actions list.
    
      The Non-Repudiation lens evaluates audit coverage against the
      domain pack's consequential-actions list. The list includes
      authentication events, authorization decisions, PII access,
      payment events, session lifecycle, OAuth/OIDC events,
      administrative configuration, third-party integration,
      break-glass, and data-subject rights events — every single
      category is uncovered in crAPI.
    
      Severity is high per "Partial audit gap on consequential-action
      flows" — except this is total absence, not partial gap. The
      rubric escalates "Audit trail loss covering credential or
      payment events" to critical; given crAPI's payment surface
      (gateway-service, credit/orders) and credential surface
      (login, OTP, password-reset), the critical-tier rubric clause
      also applies. Holding at high because the demo-intent context
      bounds the production impact, but for any production-adjacent
      deploy this would be critical.
    evidence:
      - artifact: runbook.md
        locator: "§8 Inspect audit data"
        excerpt: "GAP. No application-level audit log is shipped"
    control_mappings:
      nist_800_53r5: ["AU-2", "AU-3", "AU-3(1)", "AU-3(3)", "AU-6", "AU-12", "AU-12(1)"]
      mitre_attack:
        - {technique: "T1562", sub_technique: "T1562.008", tactic: "TA0005", rationale: "Absence of any audit log means an attacker does not need to disable audit; the defender has no audit to disable."}
      cwe: ["CWE-778", "CWE-223"]
      owasp_api_top10: ["API9:2023"]
    recommendation:
      posture: required
      summary: "Define audit schema; emit per consequential action with actor attribution; ship to separate sink."
    related_concerns: [immutability, availability, authenticity]

  # nonrep-fc423071 merged into merged-d2e871f5
  - schema_version: 1
    id: nonrep-fa2c351c
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "OTP issuance and verification not audit-logged at application layer"
    summary: "ADR-0003 explicit: identity does not audit-log dispatch; mailhog records SMTP envelope only."
    detail: |
      Per ADR-0003 Consequences: "OTP delivery is unattributed at the
      application layer. Mailhog records the SMTP envelope but the
      identity service does not audit-log the dispatch event."
    
      The Non-Repudiation gap is acute on the OTP path because OTP
      issuance + verification is the account-recovery surface and is
      the recovery-attempt evidence horizon. Without audit, the
      operator cannot reconstruct: who initiated a reset, when, from
      what IP, with what user-agent, whether the OTP was successfully
      verified or merely brute-forced (avail-e96ad7ff), whether the
      reset completed.
    
      Runbook §10 ("Respond to user account takeover") tries to
      reconstruct via the Mailhog inbox, but Mailhog stores the
      envelope only (not the requester IP) and the in-memory ring
      buffer evicts on restart (dist-c5b2799b).
    
      Severity is high per "Audit retention shorter than the longest
      plausible breach-detection window" combined with the OTP-specific
      consequential-action coverage gap.
    evidence:
      - artifact: adrs/0003-mailhog-for-otp-delivery.md
        locator: "Consequences"
        excerpt: "OTP delivery is unattributed at the application layer"
    control_mappings:
      nist_800_53r5: ["AU-2", "AU-3", "AU-12", "AU-10"]
      cwe: ["CWE-778"]
      owasp_api_top10: ["API9:2023", "API2:2023"]
    recommendation:
      posture: required
      summary: "Audit-log OTP issuance and verification per nonrep-7fad26d8 schema with source IP / user-agent."
    related_concerns: [immutability, availability, authenticity]
    cross_references: [nonrep-7fad26d8, avail-e96ad7ff]

  - schema_version: 1
    id: nonrep-304b32af
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "No source IP / user-agent attribution on any consequential action"
    summary: "Runbook §10: no source IP/UA in audit trail; per-request actor context missing."
    detail: |
      Beyond the absence of any audit log (nonrep-7fad26d8), the
      runbook §10 entry highlights that even an introduced audit
      pipeline would need to capture per-request context that crAPI
      does not currently propagate to the application layer: source
      IP, user-agent, request-id, correlation-id.
    
      In particular, the web ingress passes traffic to backend
      services with `X-Forwarded-*` headers (per tech_plan §3 boundary
      #2) but the backend services' trust-or-extract posture for these
      headers is not specified. If the backend services do extract
      X-Forwarded-For for the would-be audit, they need to either
      trust OpenResty's setting (vulnerable to upstream header
      injection if a client supplies X-Forwarded-For pre-ingress) or
      extract from OpenResty's last hop only.
    
      Severity is high per the same Non-Repudiation rubric pattern:
      "actor field is system or a shared service account" — here the
      actor record is missing entirely, which is structurally worse.
    evidence:
      - artifact: runbook.md
        locator: "§10 Respond to user account takeover"
        excerpt: "There is no source IP / user-agent in the audit trail"
    control_mappings:
      nist_800_53r5: ["AU-3", "AU-3(1)", "AU-3(3)"]
      cwe: ["CWE-778"]
      owasp_api_top10: ["API9:2023"]
    recommendation:
      posture: required
      summary: "Propagate source IP, user-agent, request-id from OpenResty into backend services; include in every audit event."
    related_concerns: [authenticity, integrity]
    cross_references: [nonrep-7fad26d8]

  - schema_version: 1
    id: nonrep-9faa010e
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: blocked
    severity: medium
    confidence: high
    title: "Audit shipping reliability — no documented shipper, retention, or buffering posture"
    summary: "Runbook §8 punts log-shipper/retention/schema/tamper-evidence to operator."
    detail: |
      Per runbook §8, the gaps in the audit pipeline are: log shipper
      (Fluent Bit, Filebeat) collecting per-container stdout;
      retention policy; schema for audit events; tamper-evidence on
      stored logs. All four are operator-provided, none documented.
    
      The Non-Repudiation concern at the shipping layer is that even
      with an introduced audit-emit per nonrep-7fad26d8, if shipping
      is fire-and-forget (no buffering, no acknowledgment) the
      consumer-side failure produces silent loss. Per the rubric's
      "Audit shipping is fire-and-forget; consumer-side failure
      produces silent loss" pattern this is high severity.
    
      Disposition is `blocked` because the operator's chosen shipping
      stack determines the appropriate buffering, retry, and dead-
      letter posture. Severity is medium because the deeper
      audit-absence concern (nonrep-7fad26d8) renders this concern
      moot until the underlying gap is closed.
    evidence:
      - artifact: runbook.md
        locator: "§8 Inspect audit data"
        excerpt: "A log shipper (Fluent Bit, Filebeat) collecting per-container stdout. A retention policy. A schema. Tamper-evidence"
    prerequisite_evidence:
      - "Operator-chosen log shipper and aggregator"
      - "Retention policy"
      - "Shipping reliability posture"
    control_mappings:
      nist_800_53r5: ["AU-4", "AU-5", "AU-5(1)", "AU-5(2)"]
      cwe: ["CWE-778"]
      owasp_api_top10: ["API9:2023"]
    recommendation:
