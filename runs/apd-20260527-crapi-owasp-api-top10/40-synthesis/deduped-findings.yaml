      audit log entries must not change once written. crAPI has no
      audit log (nonrep-7fad26d8); the operational stdout streams that
      stand in for audit are written to per-container log files that
      docker/k8s log drivers manage with rotation and no immutability
      guarantee.
    
      The Immutability finding is the design-time concern: when audit
      is introduced per nonrep-7fad26d8, the storage substrate must
      enforce immutability. The rubric's "Audit log written to a
      mutable RDS table or document collection; no append-only
      enforcement, no WORM substrate" pattern applies directly to any
      naïve audit implementation that lands in Postgres or Mongo
      alongside business data.
    
      Severity is high per the rubric pattern. Combined with
      nonrep-7fad26d8 the merged finding carries both concerns;
      synthesizer should merge.
    evidence:
