  - schema_version: 1
    id: conf-bd613330
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Encryption at rest unconfigured on Postgres, Mongo, ChromaDB"
    summary: "tech_plan and ADR-0004 explicitly state no encryption-at-rest is configured; specifics of remediation depend on deploy substrate."
    detail: |
      crAPI runs PostgreSQL 14 and MongoDB 4.4 in upstream images with no
      encryption-at-rest configuration. ChromaDB is similarly default. In
      the Helm `values-pv.yaml` variant, volumes are host-mounted with no
      mention of underlying disk encryption.
    
      The PII stored at rest includes user emails, names, phones, vehicle
      identifiers, vehicle locations, mechanic-report bodies, and the
      gateway-service's faker-seeded SSN/card-number records. None of this
      is encrypted at the storage layer.
    
      This is `blocked` because the remediation is materially different per
      deploy substrate (LUKS on a Vagrant guest, EBS encryption on EC2,
      pgcrypto for column-level on Postgres). The required prerequisite is
      a declared deploy target. The architectural finding stands regardless
      — encryption-at-rest is absent.
    
      Severity is medium per "Defense-in-depth gap where a single
      compensating control is the only barrier" — the single barrier is
      datastore-port reachability, which conf-3e324699 and the SSRF in
      conf-cf457739 both penetrate.
    evidence:
      - artifact: tech_plan.md
        locator: "§10 Out-of-scope"
        excerpt: "Encryption at rest. Not configured anywhere in the inputs"
    prerequisite_evidence:
      - "Target deploy substrate and disk-encryption posture"
      - "Field-level vs full-disk encryption decision; key-management hierarchy"
    control_mappings:
      nist_800_53r5: ["SC-28", "SC-28(1)", "SC-12", "MP-4"]
      cwe: ["CWE-311", "CWE-312"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "Add encryption-at-rest posture to ADR-0004 with deploy-substrate-specific implementation."
    related_concerns: [ephemeral, immutability]

  - schema_version: 1
    id: conf-b7aaa1e7
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Password storage scheme unspecified in inputs"
    summary: "users.password storage is not described; modern API security demands argon2/scrypt/bcrypt with tuned parameters."
    detail: |
      The tech plan, architecture-index, and ADRs do not specify how
      `users.password` is stored. The intake brief flags this as an
      evidence gap. Modern API security demands a memory-hard hash
      (argon2id preferred; scrypt or bcrypt acceptable) with parameters
      tuned for the deploy substrate.
    
      Without this evidence, the gauntlet cannot evaluate the password-
      handling posture. The likelihood that the project ships
      `BCryptPasswordEncoder` defaults from Spring Security is high, but
      "likely-OK" is not the bar — block until the verifier can read the
      identity service's password-config bean and confirm the hash, the
      cost factor, and the migration story.
    
      Severity is medium because the failure mode is bounded: a database
      compromise (already enabled by conf-3e324699) discloses password
      hashes; weak hashing turns offline disclosure into cleartext
      recovery.
    evidence:
      - artifact: tech_plan.md
        locator: "§5 Data model"
        excerpt: "password (storage scheme unspecified in inputs)"
    prerequisite_evidence:
      - "Spring Security password-encoder bean configuration in identity"
      - "argon2/scrypt/bcrypt cost factor in effect"
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "SC-13"]
      cwe: ["CWE-916", "CWE-256", "CWE-326"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: recommended
      summary: "Document password-storage posture in ADRs or tech_plan and confirm via code review."
    related_concerns: [authenticity, ephemeral]

  - schema_version: 1
    id: conf-d760cafe
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Gateway-service VIN-to-PII oracle exposes bulk PII and payment data"
    summary: "api.mypremiumdealership.com returns SSN/address/card_number deterministically seeded by VIN; basic-auth alone gates."
    detail: |
      The simulated dealership gateway returns a faker-seeded record per
      VIN — name, phone, SSN, address, card_number, card_owner_name,
      card_expiry — with FNV-32a determinism. The gating control is HTTP
      basic-auth with an undocumented credential (`S-5` in the threat
      model).
    
      In the threat model's framing, the gateway is a cross-organization
      boundary. The deterministic seeding means *every deploy* yields the
      same PII for the same VIN — useful pedagogically but materially
      worse than a randomized fake: any VIN leak (BOLA #1 leaks
      `vehicleId`; from there a VIN lookup in identity, then a gateway
      query) becomes a bulk PII oracle with stable identity across deploys
      (re-identification surface).
    
      Severity is high per "BOLA / IDOR exposing PII or payment data
      bounded to a subset". When combined with conf-fb05be4e (BOLA on
      vehicle UUIDs) and S-5 (basic-auth disclosure), the chain becomes
      mass-PII extraction; that chained exposure escalates toward
      critical, captured separately in attack-path analysis (Phase 5.6).
    evidence:
      - artifact: architecture-index.md
        locator: "§api.mypremiumdealership.com"
        excerpt: "Returns deterministically faked PII (name, phone, ssn, address, card_number) seeded from fnv32a(VIN)"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "AC-6", "SC-7", "IA-5"]
      mitre_attack:
        - {technique: "T1213", sub_technique: null, tactic: "TA0009", rationale: "Deterministic VIN-seeded PII repository with weak basic-auth gating enables collection of bulk personal and payment data when paired with VIN enumeration."}
      cwe: ["CWE-639", "CWE-340", "CWE-200"]
      owasp_api_top10: ["API1:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Replace deterministic VIN-seeding with per-deploy random; add rate-limit + audit on /owners."
    related_concerns: [authenticity, ephemeral, non_repudiation]

  - schema_version: 1
    id: conf-fffef009
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: medium
    confidence: high
    title: "JWT carries excessive claims — full PII profile likely embedded in 7-day bearer tokens"
    summary: "7-day TTL with no documented claim-minimization; standard Spring practice serializes full user record."
    detail: |
      The identity service mints RS256-signed JWTs with a 7-day TTL and no
      documented claim-minimization policy. Spring Security's default
      `JwtUserDetails` serialization typically embeds the user's email,
      name, role, and authorities. Without claim allowlisting, the token
      carries PII for its full lifetime to every service in the path —
      every downstream verifier, every log aggregator, every proxy.
    
      The default lifetime amplification matters: at 7 days a single
      logged JWT is a 7-day disclosure window for whatever PII the claims
      hold. The API security rubric explicitly calls out JWT-claim
      amplification: "a 1-hour bearer token carrying email, full name, and
      DOB exposes that PII to every downstream service".
    
      This finding is medium because the disclosure surface is bounded
      to log/proxy/downstream-service consumers — not direct public
      disclosure. It escalates to high if the token is observed leaking
      to a SaaS log aggregator or external proxy (not currently in
      evidence).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication and sessions"
        excerpt: "Expiration defaults to JWT_EXPIRATION=604800000 milliseconds (7 days)"
    control_mappings:
      nist_800_53r5: ["SC-8", "AC-4", "SC-28", "AU-3"]
      cwe: ["CWE-200", "CWE-532"]
      owasp_api_top10: ["API3:2023", "API8:2023"]
    recommendation:
      posture: recommended
      summary: "Reduce JWT TTL to 1 hour and limit claims to {sub, iss, aud, exp, jti, scope}."
    related_concerns: [ephemeral, authenticity]
    cross_references: [ephem-96d3befb]

  - schema_version: 1
    id: conf-5f25ca4e
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: blocked
    severity: medium
    confidence: medium
    title: "TLS configuration policy unspecified when TLS_ENABLED=true"
    summary: "Version floor, cipher suite, certificate validation, mTLS topology unspecified."
    detail: |
      The tech plan notes `TLS_ENABLED=true` switches services to "HTTPS-
      backed mode using PKCS12 keystores shipped under each service's
      certs/ directory" but does not specify (a) the TLS version floor,
      (b) the cipher suite allowlist, (c) certificate-validation behavior
      on outbound connections (identity → gateway-service, chatbot → LLM
      provider), (d) whether mTLS is in scope at any boundary.
    
      The shipped certs are self-signed and development-only; production
      deploys would need real CA-issued certs but the procedure is not
      documented (cross-references the rotation gap in runbook §5).
    
      This is `blocked` rather than `gap` because the project's intent is
      that operators configure TLS at deploy time; the architectural
      decision (TLS available, configurable) is reasonable. The
      remediation prerequisite is a declared TLS policy.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 Deployment topologies"
