      summary: "When nonrep-7fad26d8 is addressed, ship via buffered, retry-aware shipper with documented dead-letter."
    related_concerns: [availability, immutability]
    cross_references: [nonrep-7fad26d8]

  - schema_version: 1
    id: nonrep-c32e3967
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: blocked
    severity: medium
    confidence: high
    title: "Time-source policy unspecified — audit timestamps will be local clocks without drift bounds"
    summary: "No NTP policy, no drift bounds; per-container clock drift defeats forensic ordering."
    detail: |
      Per the rubric's "No time-source policy" pattern, the input set
      is silent on NTP discipline. In multi-container deployments
      (compose, k8s), per-container clocks may drift independently;
      the host clock may not be NTP-synced; audit timestamps from
      different services may not be totally-ordered.
    
      For the demo intent (single-host, short-lived runs) this is
      acceptable. For any deploy where audit is intended for forensic
      reconstruction, drift between identity, workshop, and community
      timestamps produces a reconstruction gap.
    
      Disposition is `blocked` because the time-source posture is
      host/deploy-level concern (Docker uses the host clock by
      default) and the appropriate remediation depends on substrate.
      Severity is medium pending the deeper audit-absence resolution
      (nonrep-7fad26d8).
    evidence:
      - artifact: runbook.md
        locator: "§8"
        excerpt: "Tamper-evidence on stored logs (currently none)"
    prerequisite_evidence:
      - "Host time-source posture"
      - "Per-container clock-source declaration"
    control_mappings:
      nist_800_53r5: ["AU-8", "AU-8(1)"]
      cwe: ["CWE-829"]
      owasp_api_top10: ["API9:2023"]
    recommendation:
      posture: consider
      summary: "Document NTP posture: chrony on host; drift bound <1s for audit consistency."
    related_concerns: [immutability]
    cross_references: [nonrep-7fad26d8]

