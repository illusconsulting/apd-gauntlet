  # ============================================================
  # TIER 2 — Scalability
  # ============================================================
  - schema_version: 1
    id: dist-1f123cef
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: gap
    severity: high
    confidence: high
    title: "Single-host topology by design — identity is a cluster-wide SPOF"
    summary: "All services on one host per agents.md; identity service compromise/outage = total cluster auth failure."
    detail: |
      Per `agents.md` and tech_plan §10, crAPI is intentionally a
      single-host deploy. Every service shares the host's failure
      domain — a host reboot, kernel panic, or compose-daemon crash
      takes everything down simultaneously. The identity service in
      particular is the JWT-issuer that every other service depends on
      for verification — its compromise yields cluster-wide auth
      bypass (the threat-model framing) and its outage yields cluster-
      wide auth failure (the availability framing).
    
      The Distributed concern is purely structural: the system is by
      design a single failure domain. For the demo intent (single
      practitioner, one laptop) this is appropriate. For any production-
      adjacent posture it is the first finding.
    
      Severity is high per "Single-AZ deployment of the authentication
      service, session store, or payment service" — the rubric clause
      explicitly anchors on the auth-tier SPOF. The fact that crAPI is a
      single host (not just single AZ) is structurally identical for
      blast radius.
    evidence:
      - artifact: agents.md
        locator: "§Intended runtime"
        excerpt: "Default target: a single host"
    control_mappings:
      nist_800_53r5: ["SC-7", "CP-7", "SC-36", "CP-2"]
      cwe: ["CWE-1188"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: consider
      summary: "For non-demo deploys, split into ≥2 AZs with identity replicated."
    related_concerns: [availability, resilient, authenticity]

  - schema_version: 1
    id: dist-04709717
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: gap
    severity: high
    confidence: high
    title: "Postgres and Mongo are single-instance with no replication topology"
    summary: "Single-container datastores; no Mongo replSet, no Postgres streaming replication; single corrupted volume = total data loss."
    detail: |
      Per tech_plan §6, Postgres 14 and Mongo 4.4 are deployed as single
      containers from upstream images. There is no replication topology
      declared — no Postgres streaming replication, no Mongo replica
      set (Mongo 4.4 explicitly requires `--replSet` for replication;
      the upstream image does not enable it). The Helm `values-pv.yaml`
      variant adds persistent volumes but does not change the topology
      from single-instance.
    
      Combined with avail-8ad04f0e (no backups), this is a structural
      data-loss SPOF: a single corrupted volume is unrecoverable. The
      cross-store consistency concern (intg-b097f9a8) is also tightly
      coupled — both datastores would need coordinated replication
      strategies and crAPI ships none.
    
      Severity is high per the rubric's Distributed SPOF clause and per
      the data-loss potential. For the demo intent the impact is
      bounded (operator accepts wipe-on-restart per runbook §11).
    evidence:
      - artifact: tech_plan.md
        locator: "§6 Persistence and storage"
        excerpt: "PostgreSQL 14 (postgresdb). Single database crapi"
    control_mappings:
      nist_800_53r5: ["SC-36", "CP-7", "CP-9", "SC-7"]
      cwe: ["CWE-1188"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: consider
      summary: "For non-demo deploys, configure Postgres streaming replication and Mongo replSet."
    related_concerns: [availability, integrity, ephemeral]
    cross_references: [avail-8ad04f0e]

  - schema_version: 1
    id: dist-5e588812
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: gap
    severity: medium
    confidence: high
    title: "Service-to-service auth via shared single JWKS — coupled failure with identity"
    summary: "Every service fetches JWKS from identity; identity unavailability eventually fails every verifier."
    detail: |
      Per ADR-0002, downstream services fetch JWKS from
      `IDENTITY_SERVICE=crapi-identity:8080`. Cache-time-to-live for
      the fetched JWKS is not documented; a naive implementation
      re-fetches per-request (Spring's default is to cache, but Go and
      Python libraries vary). When identity is down, every verifier's
      JWKS cache eventually expires and authentication fails cluster-
      wide.
    
      This is a Distributed finding because the topology choice ("verify
      against live identity") creates a coupling that makes the
      single-host SPOF concretely worse: not just "identity dies and
      can't issue new tokens" but "identity dies and existing tokens
      fail verification too".
    
      Severity is medium per the rubric's "In-process state in the
      application tier" clause (the JWKS cache is the in-process state
      whose staleness becomes a coupled failure). It escalates to high
      if the cache TTL is very short or if no cache exists.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary #3"
        excerpt: "Other services consume IDENTITY_SERVICE=crapi-identity:8080 to validate bearer JWTs against the JWKS endpoint"
    control_mappings:
      nist_800_53r5: ["SC-7", "SC-22", "CP-13"]
      cwe: ["CWE-754"]
      owasp_api_top10: ["API4:2023", "API10:2023"]
    recommendation:
      posture: recommended
      summary: "Document and harden per-service JWKS cache: TTL 1h, last-known-good 24h on fetch failure."
    related_concerns: [resilient, availability, authenticity, ephemeral]
    cross_references: [dist-1f123cef]

