  - schema_version: 1
    id: conf-fb05be4e
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Vehicle-location endpoint discloses owner identity + GPS across users (BOLA #1)"
    summary: "GET /identity/api/v2/vehicle/{vehicleId}/location returns latitude/longitude and owner full name to any authenticated caller; vehicleId leaks via community recent-posts."
    detail: |
      The vehicle-location endpoint accepts any UUID and returns the owner's
      identity plus precise GPS coordinates. Because the community
      recent-posts feed serializes `vehicleid` alongside the author display
      name, enumeration is unnecessary — a low-privilege account can iterate
      every leaked UUID and recover geolocation telemetry for arbitrary
      crAPI users.

      This is a Confidentiality finding because the architectural choice is
      "endpoint returns the object regardless of caller identity." The
      identity-verification half is in scope for Authenticity; the BOLA
      ownership-check half is captured here via the data-disclosure lens.

      Severity is high per "BOLA / IDOR exposing PII or payment data bounded
      to a subset" in the API security rubric, specifically because the
      blast radius is bounded only by the recent-posts feed size (and is
      effectively unbounded over time as new posts accrue). The disclosed
      data is geolocation, which is itself sensitive personal data under
      GDPR Article 4(1).
    evidence:
      - artifact: tech_plan.md
        locator: "§9 BOLA #1"
        excerpt: "endpoint accepts any UUID and returns latitude, longitude, and the owner's full name"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-3(7)", "AC-4", "AC-6", "SC-8", "SI-15"]
      mitre_attack:
        - {technique: "T1213", sub_technique: null, tactic: "TA0009", rationale: "Missing object-level authorization permits authenticated callers to harvest vehicle records at enumeration scale."}
      cwe: ["CWE-639", "CWE-285"]
      owasp_api_top10: ["API1:2023", "API3:2023"]
    recommendation:
      posture: required
      summary: "Add ownership check on /vehicle/{vehicleId}/location and strip vehicleid from community recent-posts response."
    related_concerns: [authenticity, integrity]

  - schema_version: 1
    id: conf-5369e807
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Mechanic-report endpoint discloses report bodies across users (BOLA #2)"
    summary: "GET /workshop/api/mechanic/mechanic_report?report_id=N uses sequential integer IDs with no ownership check."
    detail: |
      Mechanic-report IDs are sequential integers exposed via the
      `report_link` field returned by `/workshop/api/merchant/contact_mechanic`.
      The report endpoint accepts the integer ID and returns the report body
      with no check against the bearer token's user.
    
      The disclosure surface is the report's body — vehicle problem
      description, mechanic comments, owner identifying data if the report
      includes it. The data-taxonomy file in the active domain pack treats
      `mechanic_report.body` as PII when it includes owner-identifying
      fields.
    
      Severity is high per the same BOLA clause as conf-fb05be4e; integer
      enumeration is materially worse than UUID enumeration because the
      attacker does not depend on a leak channel — they iterate from 1
      upward.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 BOLA #2"
        excerpt: "Mechanic report IDs are sequential integers; the endpoint does not authorise the requester against the report owner"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "AC-6", "SI-15"]
      mitre_attack:
        - {technique: "T1213", sub_technique: null, tactic: "TA0009", rationale: "Sequential integer IDs with missing ownership check enable trivial enumeration of mechanic-report records."}
      cwe: ["CWE-639", "CWE-285", "CWE-340"]
      owasp_api_top10: ["API1:2023"]
    recommendation:
      posture: required
      summary: "Add ownership check on mechanic_report and migrate report_id to UUID."
    related_concerns: [authenticity, non_repudiation]

