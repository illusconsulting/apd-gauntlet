      the user mid-flow with no way to recover the in-flight OTP.
    
      The Distributed concern is the topology choice: mailhog is the
      OTP delivery system and it has no persistence. For the demo
      intent this is appropriate (restart-during-class is rare). For
      any deploy where users rely on async OTP delivery, the
      stateless mailhog is a structural SPOF.
    
      Severity is medium because the demo-intent posture makes this
      tolerable; it escalates if any deploy treats mailhog as a
