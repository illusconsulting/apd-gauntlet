  # ---- Integrity ----
  - schema_version: 1
    id: intg-e7ebcc95
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: gap
    severity: critical
    confidence: high
    title: "Mass assignment on /workshop/api/shop/orders accepts negative quantity → arbitrary credit inflation"
    summary: "Server multiplies unit_price × quantity unconditionally; quantity:-100 inflates balance by 100×price."
    detail: |
      The order-create handler in workshop deserializes the entire request
      body to the order domain object and computes `total = unit_price *
      quantity` with no positive-integer constraint on `quantity`. A caller
      submits `{"product_id": X, "quantity": -100}` and the signed delta is
      applied to `credit.balance`, minting balance equal to 100 × the
      product's unit price.
    
      The architectural concern is twofold: (a) input validation does not
      enforce the documented invariant INV-INPUT-001 (`quantity >= 1`), and
      (b) the deserialization is allowlist-free — the handler binds every
      field present in the JSON body onto the model, which is the broader
      OWASP API3:2023 (BOPLA write-side) pattern.
    
      Severity is critical per the API security rubric's mass-assignment
      clause "BOPLA — excessive property exposure or mass-assignment
      write-side exposure" — the rubric specifically calls out writeable
      `account_balance`, `order_status`, and `coupon_amount` as critical;
      writeable balance via negative-quantity is the same outcome at
      identical impact.
    
      The Confidentiality team's BOPLA-read finding (conf-c237e01d) and
      this finding are the two sides of the same architectural choice
      (no serializer/deserializer allowlist); the synthesizer will likely
      link them.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 Mass Assignment #8/#9"
        excerpt: "POST /workshop/api/shop/orders allows negative quantity. The server applies the credit delta unconditionally, letting the caller mint balance"
    control_mappings:
      nist_800_53r5: ["SI-10", "SI-10(5)", "AC-3", "SI-15", "CM-5"]
      mitre_attack:
        - {technique: "T1190", sub_technique: null, tactic: "TA0001", rationale: "Allowlist-free deserialization with missing input constraint enables direct manipulation of financial state via a single crafted request."}
      cwe: ["CWE-915", "CWE-20", "CWE-840"]
      owasp_api_top10: ["API3:2023", "API6:2023"]
    recommendation:
      posture: required
      summary: "Enforce quantity ≥ 1 server-side; replace ORM-bind with explicit allowlist serializer; compute unit_price server-side."
    related_concerns: [confidentiality, availability]

