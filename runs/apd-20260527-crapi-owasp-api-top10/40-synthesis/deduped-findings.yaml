    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: medium
    confidence: high
    title: "Break-glass and emergency-action audit not designed"
    summary: "Runbook lacks emergency-action procedure; no distinguishable audit stream for break-glass events."
    detail: |
      The rubric's break-glass pattern: emergency actions (break-glass
      auth, emergency policy override, emergency credential rotation,
      DR failover initiation) should produce a distinguishable audit
      stream routed to security-review independent of normal audit
      consumption.
    
      crAPI's runbook §10 enumerates only account-takeover response
      (which is essentially a procedure for accepting the failure
      because session-revocation is impossible per resil-776fc650).
      There is no documented break-glass action, no emergency
      credential rotation procedure, no DR failover initiation.
    
      Severity is medium because the demo-intent makes break-glass
      formally unnecessary; for any production-adjacent deploy this
      coupled with nonrep-7fad26d8 is the operational-posture gap
      preventing emergency response.
    evidence:
      - artifact: runbook.md
        locator: "§10 Respond to user account takeover"
        excerpt: "Cannot invalidate the attacker's session"
    control_mappings:
      nist_800_53r5: ["AU-3", "AU-12(1)", "AC-6(9)", "AC-6(10)", "IR-4"]
      owasp_api_top10: ["API9:2023"]
    recommendation:
      posture: consider
      summary: "For non-demo deploys, add break-glass procedures and dedicated audit streams."
    related_concerns: [resilient, availability, ephemeral]
    cross_references: [resil-776fc650, ephem-22c2358c]

  # ---- Immutability ----
  - schema_version: 1
    id: immut-e50364e4
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: high
    confidence: high
    title: "Audit substrate is mutable — no append-only, WORM, or hash-chain"
    summary: "When audit is introduced (nonrep-7fad26d8), substrate must enforce immutability; default would land in Postgres/Mongo."
    detail: |
