  - schema_version: 1
    id: merged-44bdb663
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Shared plaintext admin/crapisecretpassword on Postgres+Mongo, all services, repo-tracked"
    summary: "Merged: single shared credential in compose env (Confidentiality disclosure) collapses datastore tier into one failure domain (Distributed) and enables direct DB write bypass of service-layer controls."
    detail: |
      Merged from conf-3e324699 and dist-c047a7c0. The plaintext
      credential is both a credential-disclosure concern
      (Confidentiality) and a topology-of-trust concern (Distributed).
      The same fix — per-service users + rotation — addresses both.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 Persistence and storage"
        excerpt: "user/password admin / crapisecretpassword (hardcoded in deploy/docker/docker-compose.yml)"
      - artifact: adrs/0004-dual-datastore-postgres-and-mongo.md
        locator: "Decision"
        excerpt: "Both datastores accept the same admin credential. Every service that needs either datastore authenticates as admin"
    lens_perspectives:
      confidentiality:
        summary: "Credential is plaintext in repo; anyone with repo or container access has datastore admin."
        detail: "conf-3e324699 framing — the credential-itself disclosure."
      distributed:
        summary: "Single shared credential collapses N service trust domains into one datastore trust domain; service compromise yields full datastore."
        detail: "dist-c047a7c0 framing — the topology-of-trust concern."
    control_mappings:
      nist_800_53r5: ["IA-5", "IA-5(1)", "IA-5(7)", "SC-12", "SC-28(1)", "AC-2", "AC-6", "AC-6(1)", "AC-6(5)", "SC-7"]
      mitre_attack:
        - {technique: "T1552", sub_technique: "T1552.001", tactic: "TA0006", rationale: "Credentials in compose file are credentials-in-files disclosure granting full datastore read/write."}
      cwe: ["CWE-798", "CWE-256", "CWE-250"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: required
      summary: "Provision per-service Postgres+Mongo users with collection-scoped grants; remove static creds from compose; rotate per-deploy."
    related_concerns: [authenticity, ephemeral, integrity]
    cross_references: [ephem-22c2358c]

  - schema_version: 1
    id: merged-514507e6
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "SSRF on contact_mechanic with unbounded rate — cloud metadata + internal services exfiltration"
    summary: "Merged: (a) no URL allowlist on outbound fetch, (b) no input validation on URL field, (c) no rate limit, (d) response body returned to caller."
    detail: |
      Merged from conf-cf457739 (Confidentiality / data exfiltration),
      intg-5c659bdb (Integrity / input validation), and avail-6af5aff7
      (Availability / rate limit). The single architectural fix —
      input-validating typed URL with allowlist + per-token rate limit
      + no response-body return — closes all three concerns.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 SSRF #11"
        excerpt: "mechanic_api URL fetched server-side, returning the HTTP response body to the caller. No allowlist"
      - artifact: tech_plan.md
        locator: "§9 No Rate Limit #6"
        excerpt: "No throttle on the contact-mechanic submission endpoint; arbitrary outbound webhook fan-out"
    lens_perspectives:
      confidentiality:
        summary: "Response body returned to caller enables cloud-metadata + internal-service data extraction."
        detail: "conf-cf457739 framing."
      integrity:
        summary: "URL field accepts arbitrary string; no validation, no IP-resolution check, no DNS-rebinding defense."
        detail: "intg-5c659bdb framing."
      availability:
        summary: "Unbounded request rate exhausts outbound socket/worker pool; reflective-DoS launchpad."
        detail: "avail-6af5aff7 framing."
    control_mappings:
      nist_800_53r5: ["SC-7", "SC-7(5)", "AC-4", "SC-8(1)", "SI-10", "SC-5", "SC-5(1)", "SC-6", "SI-13"]
      mitre_attack:
        - {technique: "T1190", sub_technique: null, tactic: "TA0001", rationale: "SSRF on a public-facing endpoint with response body returned to caller enables cloud-metadata and internal-service data extraction."}
        - {technique: "T1499", sub_technique: "T1499.003", tactic: "TA0040", rationale: "Unbounded outbound-fetch endpoint enables application-exhaustion DoS through resource starvation."}
      cwe: ["CWE-918", "CWE-441", "CWE-770", "CWE-400", "CWE-20"]
      owasp_api_top10: ["API7:2023", "API4:2023"]
    recommendation:
      posture: required
      summary: "Add typed URL field with hostname allowlist + IP-resolution check; per-token rate limit (10/min); do not return fetched body to caller."
    related_concerns: [authenticity, resilient]

