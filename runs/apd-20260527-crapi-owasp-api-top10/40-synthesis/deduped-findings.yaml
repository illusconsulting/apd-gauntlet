      cwe: ["CWE-307", "CWE-770"]
      owasp_api_top10: ["API4:2023"]
    recommendation:
      posture: required
      summary: "Cap OTP issuance to 3 per account per hour; per-IP cap 20/hour."
    related_concerns: [authenticity, ephemeral, non_repudiation]

