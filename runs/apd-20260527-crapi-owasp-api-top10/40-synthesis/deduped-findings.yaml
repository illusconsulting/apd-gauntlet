  - schema_version: 1
    id: merged-c829ffc8
    agent: confidentiality  # primary; merged across 3 lenses
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: critical
    confidence: high
    title: "Default JWT signing key + multi-algorithm verifier accepts forgeries — cluster-wide identity trust broken"
    summary: "Merged: (a) services/identity/jwks.json ships private-key components by default, (b) verifier accepts alg:none, HS256-confusion, jku-fetch, kid-traversal; cluster auth is forgeable."
    detail: |
      Merged from three specialist findings (conf-c66f08cf Confidentiality,
      intg-15c04a1c Integrity, auth-09ae00ed Authenticity).

      The architectural concern combines two failures: (a) the default
      install ships an RSA private key in `services/identity/jwks.json`
      committed to the repo, and (b) the verifier accepts at least four
      documented JWT forgery patterns. Either failure independently
      yields forge-any-identity capability; together they are critical
      authentication-bypass.

      Severity is critical per "Forgeable session tokens at platform
      scope" and "Authentication bypass to high-privilege functions
      with no factor required" — both rubric clauses independently
      apply.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 Authentication"
        excerpt: "crAPI ships a default jwks.json containing the private key components (d, p, q, dp, dq, qi)"
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Consequences"
        excerpt: "Algorithm-confusion (RS256 ↔ HS256) is the headline forgery vector"
      - artifact: tech_plan.md
        locator: "§9 JWT vulnerabilities #15"
        excerpt: "Four documented variants: RS256↔HS256 algorithm confusion, alg:none on dashboard, jku misuse, kid path traversal"
    lens_perspectives:
      confidentiality:
        summary: "Private signing key disclosed via repo commit; defaults compromise the trust anchor."
        detail: "conf-c66f08cf framing — focuses on the key material disclosure."
      integrity:
        summary: "Verifier accepts forged tokens via multiple algorithm-confusion patterns; tamper detection on the JWT fails."
        detail: "intg-15c04a1c framing — focuses on the verifier's tamper-detection failure."
      authenticity:
        summary: "Identity provenance broken: verifier cannot cryptographically prove the asserted identity is genuine."
        detail: "auth-09ae00ed framing — focuses on the identity-verifiability collapse."
    control_mappings:
      nist_800_53r5: ["SC-12", "SC-12(1)", "SC-12(2)", "SC-13", "IA-2", "IA-2(1)", "IA-2(8)", "IA-5(2)", "SI-7", "SI-7(1)", "SC-23", "SC-23(3)", "SC-17", "SC-28(1)"]
      mitre_attack:
        - {technique: "T1552", sub_technique: "T1552.001", tactic: "TA0006", rationale: "Signing key checked into repository is a credential-in-files disclosure that enables forge-any-JWT against the entire cluster."}
        - {technique: "T1606", sub_technique: null, tactic: "TA0006", rationale: "Verifier accepts forged web credentials due to absent algorithm pin, jku fetch, and kid-as-path."}
        - {technique: "T1550", sub_technique: "T1550.001", tactic: "TA0008", rationale: "Forged JWT is presented as a valid application access token to every downstream service."}
      cwe: ["CWE-321", "CWE-347", "CWE-345", "CWE-22", "CWE-798", "CWE-287"]
      owasp_api_top10: ["API2:2023", "API8:2023"]
    recommendation:
      posture: required
      summary: "Generate fresh per-install keypair; pin alg:RS256; remove JWT_SECRET; allowlist jku; restrict kid to known set."
    related_concerns: [ephemeral, distributed, immutability, non_repudiation]
    cross_references: [ephem-30d38360, dist-0a56c5f0]

  - schema_version: 1
    id: conf-8f7c8c8d
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Mailhog web UI on :8025 exposes every OTP and password-reset email when LISTEN_IP!=127.0.0.1"
    summary: "No authentication on Mailhog UI; documented LISTEN_IP=0.0.0.0 override removes the only barrier with no startup warning."
    detail: |
      Mailhog's web UI is the canonical inspection interface for captured
      OTP and password-reset emails. It has no built-in authentication. The
      default `LISTEN_IP=127.0.0.1` makes the port loopback-only, but the
      documented override `LISTEN_IP=0.0.0.0` exposes it to any network the
      host is reachable on — with no warning in the setup documentation per
      ADR-0003 invariants.
    
      Any party that reaches `:8025` reads every signup OTP, every password-
      reset OTP, and every email-change notification for the `example.com`
      domain. Combined with email-only identity claim (S-6), this is an
      account-takeover path that bypasses every authentication control
      crAPI does have.
    
      Severity is high per "Defense-in-depth gap where a single
      compensating control is the only barrier" plus the consequential
      account-takeover impact. The single barrier is `LISTEN_IP` posture; a
      documented override removes it.
    evidence:
      - artifact: adrs/0003-mailhog-for-otp-delivery.md
        locator: "Consequences"
        excerpt: "Mailhog has no built-in authentication on :8025"
    control_mappings:
      nist_800_53r5: ["AC-3", "AC-4", "SC-7", "IA-2", "SC-8"]
      mitre_attack:
        - {technique: "T1110", sub_technique: "T1110.001", tactic: "TA0006", rationale: "Direct read access to delivered OTPs collapses the OTP entropy bound to zero."}
      cwe: ["CWE-306", "CWE-200"]
      owasp_api_top10: ["API8:2023", "API2:2023"]
    recommendation:
      posture: required
      summary: "Gate Mailhog UI behind basic-auth; emit startup warning on LISTEN_IP override."
    related_concerns: [authenticity, ephemeral]

