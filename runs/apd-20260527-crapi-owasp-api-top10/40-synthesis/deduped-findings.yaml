  - schema_version: 1
    id: immut-79a844dd
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: medium
    confidence: high
    title: "Configuration spread across compose env, env-vars, mounted files, and hard-coded binary — no drift detection"
    summary: "ENABLE_LOG4J/SHELL flags, JWKS file, gateway basic-auth in binary; no declared baseline."
    detail: |
      The system's configuration surface is spread across:
      - compose env stanzas (postgres/mongo credentials, JWT_SECRET,
        ENABLE_LOG4J, ENABLE_SHELL_INJECTION, LOG_LEVEL)
      - mounted files (services/identity/jwks.json, per-service certs)
      - hardcoded in service binaries (gateway-service basic-auth per
        S-5)
      - container images themselves (the crAPI service images)
    
      There is no declared baseline configuration ("the
      production-intended state is X"), no drift detection ("the
      actual state diverged from declared by Y"), no signed-commit
      requirement on configuration changes.
    
      Per the rubric's "Configuration is partly IaC, partly manual;
      no drift detection between declared and actual state" pattern,
      severity is medium when deploy parameters are manual; the
      ENABLE_LOG4J/SHELL flags are in the medium-to-high band because
      flipping one silently activates a critical vulnerability per
      intg-8d97cd9f.
    
      For the demo intent — operator-controlled, single-host —
      drift detection is overkill. For any shared deploy this is the
      operational-posture gap.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 Implicit posture facts"
        excerpt: "Postgres + Mongo creds are static literals in the compose file. JWT_SECRET=crapi shipped alongside the RS256 keys"
    control_mappings:
      nist_800_53r5: ["CM-2", "CM-2(2)", "CM-3", "CM-3(1)", "CM-6", "CM-6(1)", "CM-6(2)"]
      cwe: ["CWE-1357"]
      owasp_api_top10: ["API8:2023"]
    recommendation:
      posture: recommended
      summary: "Declare baseline in IaC (Helm values + compose with required overrides); add config-drift check."
    related_concerns: [integrity, authenticity]
    cross_references: [intg-8d97cd9f]

