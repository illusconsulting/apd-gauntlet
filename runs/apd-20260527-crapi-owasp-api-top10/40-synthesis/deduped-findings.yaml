      mitre_attack:
        - {technique: "T1110", sub_technique: "T1110.001", tactic: "TA0006", rationale: "Unrate-limited OTP verification permits brute-force of 4-digit keyspace in seconds, enabling account takeover."}
      cwe: ["CWE-307", "CWE-770"]
      owasp_api_top10: ["API4:2023", "API2:2023"]
    recommendation:
