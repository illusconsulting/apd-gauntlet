  # ---- Authenticity (2) ----
  - schema_version: 1
    id: auth-cap-125067f9
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    title: "RS256 asymmetric JWT mint + JWKS publication (OIDC-style identity provenance)"
    description: "Per ADR-0002, identity mints RS256 JWTs; verification material at standard /.well-known path."
    maturity: implemented
    scope: "Mint and JWKS-publication confirmed. Significantly weakened by default private key, multi-algo verifier, no rotation."
    evidence:
      - artifact: adrs/0002-jwt-with-rsa-and-jwks.md
        locator: "Decision"
        excerpt: "crapi-identity mints RS256-signed JWTs"
    control_mappings:
      nist_800_53r5: ["IA-5(2)", "SC-12", "SC-17", "IA-2"]
      mitre_attack:
        - technique: "T1606"
          tactic: "TA0006"
          rationale: "Asymmetric JWT minting counters web-credential forgery; RS256+JWKS publication is the reference countermeasure against forged credential issuance."
      mitre_attack_mitigations:
        - id: "M1041"
          rationale: "Asymmetric signing means verifiers do not hold signing capability; defeats verifier-side credential theft."
      d3fend:
        - technique: "D3-IAA"
          counters_attack: ["T1606"]
          rationale: "Identity-Assertion-Attestation via cryptographically-signed JWT issued by a designated authority counters web-credential forgery when verifier is correctly configured."
    caveats:
      - "Default private key in repo (merged-c829ffc8)"
      - "Verifier accepts multiple algorithms"
      - "No rotation procedure"
      - "Per-service verifier consistency not enforced"
    related_concerns: [confidentiality, integrity, ephemeral, distributed]

