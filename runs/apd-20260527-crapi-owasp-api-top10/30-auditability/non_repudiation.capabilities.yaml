    title: "Stdout logging at LOG_LEVEL=INFO across all services (operational, not auditable)"
    description: |
      Per runbook §8, every service emits to stdout at
      `LOG_LEVEL=INFO`. The Docker logging driver captures these
      streams. While not an audit log (no schema, no actor
      attribution, no retention), the streams provide some
      operational signal that an operator could grep through for
      forensic reconstruction.
    maturity: implemented
    scope: |
      Confirmed: stdout streams exist. NOT confirmed: log format,
      content, or whether any of the consequential actions in the
      api-security domain pack are actually logged at INFO level.
      The streams are operational, not audit. Reconstruction is
      best-effort and prone to gaps.
    evidence:
      - artifact: runbook.md
        locator: "§8 Inspect audit data"
        excerpt: "Containers emit to stdout at LOG_LEVEL=INFO; aggregation is operator-provided"
    control_mappings:
      nist_800_53r5: ["AU-2", "AU-12"]
    caveats:
      - "No audit schema (nonrep-7fad26d8)"
      - "No actor attribution (nonrep-304b32af)"
      - "No retention (nonrep-7fad26d8)"
      - "Per-container stdout; aggregation operator-provided"
      - "Not immutable (immut-audit-mutability)"
    related_concerns: [availability, immutability]
