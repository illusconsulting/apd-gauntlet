schema_version: 1
agent: ephemeral
capability:
  - schema_version: 1
    id: ephem-cap-c2af080d
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    title: "Per-deploy credential bootstrap via ensure_local_config()"
    description: |
      When --insecure is not used, the server's ensure_local_config()
      generates a per-deploy conf/local.yml with auto-generated
      usernames, passwords, API keys, encryption_key, and crypt_salt.
      Mitigates the default-credential surface for deployments that
      avoid --insecure.
    maturity: implemented
    scope: |
      Confirmed as the documented first-start behavior. Not
      addressed: re-run preserves whatever was on disk (the
      auto-generation runs once); no documented entropy floor for
      generated values; no detection that defaults are still in
      place on a manually-edited config.
    evidence:
      - artifact: tech_plan.md
        locator: "§4 'Authentication & sessions'"
        excerpt: "absent that flag, ensure_local_config() auto-generates a conf/local.yml"
      - artifact: runbook.md
        locator: "§1 'Bring the stack up'"
        excerpt: "the server will create conf/local.yml with auto-generated values on first start"
    control_mappings:
      nist_800_53r5: [IA-5, "IA-5(1)"]
    caveats:
      - "Runs once at first start; later edits not validated."
      - "Generated-value entropy not documented."
      - "Does not enforce rotation cadence after first start."

  - schema_version: 1
    id: ephem-cap-053c3f98
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    title: "untrusted_timer demotes silent agents in the registry"
    description: |
      AppService runs an untrusted-agent sniffer that marks Agent
      records as 'untrusted' when last_seen exceeds the
      untrusted_timer threshold (default 90 seconds). Provides a
      coarse ephemeral signal on implant liveness.
    maturity: implemented
    scope: |
      Confirmed for live Agent records. Not addressed: registry
      eviction (silent agents demote, not evict; see avail-e4b13596);
      no cryptographic continuity check on resurrected paws.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 'Trust boundaries' #4"
        excerpt: "the platform decides whether the agent is trusted or untrusted based on the configured untrusted_timer"
    control_mappings:
      nist_800_53r5: [AC-12, SC-10]
    caveats:
      - "Demotion only; no eviction."
      - "Silent agents retain registry slot indefinitely."
    related_concerns: [authenticity, availability]
