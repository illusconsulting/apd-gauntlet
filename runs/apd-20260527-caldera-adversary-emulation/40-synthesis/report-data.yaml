strengths:
  - id: ephem-cap-c2af080d
    caveats:
      - "Runs only on first start — subsequent edits not validated."
      - "No documented entropy floor for generated values."
      - "Does not enforce rotation cadence after first start."
  - id: intg-cap-27c5021a
    caveats:
      - "Coverage is /api/v2 only; /api/v1 and plugin routes bypass."
      - "Validation is shape-only; no semantic constraints (target-in-ROE)."
  - id: conf-cap-ce39d07c
    caveats:
      - "Single platform-wide key — no per-engagement isolation."
      - "Key derived from operator-supplied conf values; default values are well-known."
      - "No documented rotation cadence."
  - id: conf-cap-9f572979
    caveats:
      - "Default session_expiration_days = 7; no session deny-list."
      - "Same Fernet key as the at-rest result encryption — key separation absent."
      - "Default key in --insecure deploys is publicly known."
  - id: auth-cap-17c17dd2
    caveats:
      - "No shipped MFA implementation in core."
      - "Plugin trust model (no signature, no sandbox) applies to login plugins too."
  - id: nonrep-cap-f135a692
    caveats:
      - "In-memory only; no durable audit emission."
      - "Ad-hoc manual flows may bypass the attribution path."
      - "API-key path only attributes to group, not user."
  - id: dist-cap-5006e4c2
    caveats:
      - "Operator-discretion only; no platform enforcement."
      - "Long-lived team-server pattern (which violates the principle) is also common."

next_steps:
  - rank: 1
    text: "Introduce first-class Engagement object with target-inventory enforcement at command-issue time; emit engagement_start / scope_change / close events to a structured audit sink. Closes the CFAA-defensibility gap and unblocks per-engagement ACL, per-engagement keys, and per-engagement sessions."
    refs: [intg-899da63b, nonrep-58511e00, conf-88726ba8, ephem-06509c27]
  - rank: 2
    text: "Stand up a structured audit emitter covering the security-tooling consequential-action surface (24 event classes); ship to WORM storage (S3 object-lock or transparency-log-anchored hash chain). Closes the audit-vacuum cluster."
    refs: [nonrep-d8bf1096, nonrep-79ed516c, nonrep-1f49427b, nonrep-5f137373, immut-b0fd1144]
  - rank: 3
    text: "Add plugin signature verification at load time with a community-maintained signing root; deprecate the implicit-operator-trust model. Closes the plugin-supply-chain cluster; combines with plugin sandbox (subprocess per plugin) for defense-in-depth."
    refs: [intg-81c06dfa, auth-ec69906a, dist-dbaf5c57, nonrep-5f137373, immut-df8094e4]
  - rank: 4
    text: "Fail-closed when default credentials or default Fernet key are in use; add an admin rotate-keys flow that re-derives encryption_key + crypt_salt and re-encrypts data/cookie_storage and data/results/."
    refs: [conf-e223c03d, conf-01d02036, ephem-608839d8]
  - rank: 5
    text: "Ship implants with pinned listener certificate and per-command signature verification; refuse to beacon on pinning failure. Closes the implant-trust cluster."
    refs: [auth-c1c1d0cb, auth-0e31c9b1, intg-f6c14927]
  - rank: 6
    text: "Add MFA to the core login pipeline (TOTP minimum, WebAuthn preferred); migrate API-key path from per-group to per-operator tokens with TTL and deny-list."
    refs: [auth-1c9a7b78, auth-31296050, ephem-cc497fed]
  - rank: 7
    text: "Adopt per-engagement DEK derivation for result-data encryption with KEK in operator-supplied KMS; destroy DEK on engagement closure for forward-secrecy of harvested credentials."
    refs: [conf-aabbd48f, ephem-d6c8d458, immut-6352dd54]
  - rank: 8
    text: "Split agent listener path into a separate process from operator UI; bulkhead the asyncio event loop; document at least one multi-host topology with explicit data-residency handling."
    refs: [avail-623b8e59, dist-85515eec, dist-dbaf5c57, resil-ca256373]
  - rank: 9
    text: "Refuse to bind a non-loopback address without TLS configured; move TLS termination into core (drop ssl-plugin-optional framing); fail-closed on missing certificate."
    refs: [conf-056edb0c]
  - rank: 10
    text: "Move data/results/ to WORM storage with per-record signature held by an orchestrator-only key; document retention policy per data class with legal-hold support."
    refs: [immut-de3cc948, intg-5152e7ba, immut-6352dd54]

posture_summary:
  trustworthiness: |
    Trustworthiness tier carries 18 findings (4 critical, 6 high, 7 medium, 1 risk). The compound concerns are default credentials (encryption_key, crypt_salt, API keys, login creds all ship as public-known strings), absent plugin signature verification (any plugins/<name>/hook.py runs with full server privilege at startup), and absent platform-enforced ROE (no Engagement object means CFAA defensibility is operator-attested only). Channel security defaults to HTTP for both operator console and beacon endpoint; the ssl plugin is optional. Result data uses a single platform-wide Fernet key with no per-engagement isolation. CVE-2025-27364 (pre-auth RCE) was an example of the documented trust model's load-bearing nature.
  scalability: |
    Scalability tier carries 14 findings (0 critical, 4 high, 10 medium). The single-asyncio-process architecture is the dominant constraint — operator UI, every contact listener, plugin code, planner, and result store share one event loop with no bulkhead. No process-level isolation between plugins and core. No multi-host topology documented; no DR/BCP with RTO/RPO targets; no per-tenant or per-engagement residency binding for harvested data. API keys and encryption keys are long-lived and require restart to rotate. Session cookies remain valid for 7 days regardless of credential change. Long-lived team-server deployment pattern accumulates harvested credentials indefinitely without retention enforcement.
  auditability: |
    Auditability tier carries 18 findings (4 critical, 9 high, 5 medium) — the highest-density tier. There is no structured audit log at all; Python logging to stdout is the only event stream. Zero of 24 consequential-action classes (command issuance, engagement lifecycle, plugin lifecycle, result-data access, operator authentication, configuration changes, etc.) have structured coverage. There is no append-only / WORM substrate; nothing to protect against alteration because nothing is captured. Plugins, implants, and operator API tokens all carry weak or no cryptographic identity. The aggregate consequence is that the platform cannot produce defensible evidence to distinguish authorized testing from unauthorized intrusion under CFAA, cannot attribute commands to specific operators (the API-key path attributes only to a group), and cannot reconstruct historical state after an incident.
