schema_version: 1

exec_summary:
  paragraphs:
    - "Apache Caldera (MITRE, Apache-2.0, v5.x) is an adversary-emulation framework explicitly positioned by its upstream maintainers as a research-grade, trusted-environment platform. The README is candid: 'The Caldera server does not have a hardened and thoroughly pentested web application interface, but only basic authentication and security features.' This APD advisory review treats that documented posture as accepted starting state and produces findings against its second-order consequences for trustworthiness, scalability, and auditability — specifically through the security-tooling pack's lens of weapons-platform misuse, ROE enforcement, and CFAA defensibility."
    - "The review identifies 41 deduped findings clustered into 9 cross-lens compounds: default-credential exposure, plugin-supply-chain compromise, implant-trust failure, engagement / ROE / CFAA absence, audit-vacuum, single-process SPOF, result-data lifecycle, channel security, and listener resilience. Eight findings score critical on the security-tooling severity rubric — four of which engage the weapons-platform-misuse axis (the rubric's load-bearing legal-exposure dimension). The platform's documented research posture is internally consistent — no specialist contradictions, no severity disagreements — which strengthens confidence that the gaps are intentional in the upstream model but consequential for any operator deploying outside MITRE's segregated-lab assumption."
    - "The single load-bearing recommendation across critical clusters is the introduction of a first-class Engagement object with platform-enforced ROE, paired with a structured audit emitter shipped to WORM storage. Without these, every command issuance is challengeable as out-of-scope (a CFAA defensibility failure), every implant compromise has unbounded blast radius (a weapons-platform-misuse failure), and incident reconstruction is impossible (a forensic failure). The recommendations are individually tractable in the codebase but compose a substantial uplift; the advisory groups them into a prioritized roadmap below."
    - "On the trustworthiness tier, the highest-priority gaps are the default-credential surface (encryption_key, crypt_salt, API keys, login credentials all ship as public-known strings when --insecure is set) and the absence of plugin signature verification (any plugin in plugins/ runs with full server privilege on next start). On scalability, the single-asyncio-process architecture is the dominant constraint — operator UI, every listener, plugin code, and the result store share one event loop with no bulkhead, no per-process isolation, and no documented DR posture. On auditability, the platform has no structured audit log at all; the security-tooling consequential-action surface (24 event classes) is zero-percent covered. CVE-2025-27364 (Feb 2025) was a pre-auth RCE in this footprint and a reminder that the trusted-environment assumption is load-bearing."
    - "The capability picture is sparse: 12 unique capabilities confirmed at designed (7) or implemented (5) maturity, none tested or operationalized. This is consistent with the input set's lack of test artifacts, CI gates, and production runbooks. Notable confirmed capabilities include optional Fernet at-rest encryption for harvested data, optional TLS via the ssl plugin, encrypted session cookies, request-validation middleware on /api/v2, ldflags sanitization for sandcat builds, and the pluggable LoginHandlerInterface (which would let an operator add MFA without forking core). Each capability comes with caveats that the advisory enumerates honestly."
    - "This advisory is not a vulnerability disclosure. It is an architecture-review artifact that scopes the second-order consequences of Caldera's documented trust model for operators who wish to harden a deployment beyond the upstream baseline, or for the upstream project itself if it elects to evolve toward production-grade defensibility. Specific remediation guidance is in each finding's recommendation block; the prioritized roadmap below sequences them by dependency and impact."

