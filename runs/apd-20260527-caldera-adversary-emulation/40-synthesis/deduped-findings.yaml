  title: Default HTTP transport on operator console and agent listener leaks credentials and beacons
  summary: Default deploy is HTTP on :8888 for both operator console and HTTP /beacon contact; TLS only via optional ssl plugin.
  detail: 'The aiohttp web.Application binds HTTP on :8888 by default. The

    ssl plugin is optional and operator-enabled. The operator

    console (including login form) and the HTTP /beacon contact

    share the same port and the same transport. A passive

    on-network attacker captures: session cookies, KEY header API

    keys, every beacon payload (base64-decoded JSON — easy to

    recover plaintext), every command queued to implants in

    response, and every result returned (cleartext if not separately

    encrypted at the obfuscator layer).


    Severity is high per the security-tooling rubric clause "MITM

    on implant callback channel without certificate pinning" — and

    the rubric clause escalates to critical when the payload

    contains harvested credentials, which the result responses

    routinely do.

    '
  evidence:
  - artifact: tech_plan.md
    locator: '§3 ''Trust boundaries'' #1'
    excerpt: Default deploy is HTTP on :8888 unless the ssl plugin is enabled
  - artifact: tech_plan.md
    locator: §7 'Agent communication'
    excerpt: POST /beacon over the same :8888 aiohttp server. Beacon body is base64-encoded JSON by default
  - artifact: adrs/0003-agent-callback-encryption-by-protocol.md
    locator: ADR-0003 body
    excerpt: agent callback encryption is per-protocol
  control_mappings:
    nist_800_53r5:
    - SC-8
    - SC-8(1)
    - SC-13
    - SC-23(3)
    mitre_attack:
    - technique: T1557
      sub_technique: null
      tactic: TA0006
      rationale: Default HTTP transport on operator login and beacon path allows on-path interception of session cookies,
        API keys, and beacon payloads.
    cwe:
    - CWE-319
    - CWE-311
    owasp_top10:
    - A02:2021
    owasp_api_top10:
    - API8:2023
  recommendation:
    posture: required
    summary: 'Fail-closed: refuse to bind a non-loopback address without TLS configured; make the ssl plugin equivalent in
      core.'
    detail: 'Move TLS-termination into core (drop the plugin-optional

      framing). Add a start-time check that refuses to bind any

      non-127.0.0.1 address when TLS is not configured. The

      operator must explicitly --bind-insecure to override. For

      agent listeners, document the per-contact TLS expectation

      and refuse to register an HTTP-only contact when a non-

      loopback bind address is in use.

      '
    references:
    - NIST SP 800-52 Rev. 2
    - RFC 7568
