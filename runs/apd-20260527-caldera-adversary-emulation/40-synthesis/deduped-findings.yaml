  title: Timeout posture on contact decoders unspecified — slow-decode attacks may stall the event loop
  summary: Each contact decoder runs in the shared event loop; tech plan does not document per-decoder timeout or async-yield
    guarantees.
  detail: 'ContactService.handle_heartbeat invokes the per-contact decoder

    synchronously within the asyncio task that handles the beacon.

    The tech plan does not document whether contact decoders are

    time-bounded, whether they yield to the event loop during

    multi-step decode, or whether the platform enforces a max

    decode time. A slow-decode attack (large base64 input,

    adversarial DNS record encoding for the DNS contact) could

    stall the event loop and degrade every other surface (the

    avail single-process SPOF amplifies this).


    Medium (blocked) per the security-tooling rubric clause "Health

    checks ... do not verify the listener can accept and

    authenticate" — the rubric''s emphasis on synthetic end-to-end

    health applies here as the symptom-detection mechanism.

    Pending evidence of per-decoder time-bound contracts.

    '
