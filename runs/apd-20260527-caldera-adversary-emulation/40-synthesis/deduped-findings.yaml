  title: Default cookie-encryption key and salt enable session takeover when --insecure is used
  summary: conf/default.yml ships encryption_key=ADMIN123 and crypt_salt=REPLACE_WITH_RANDOM_VALUE; --insecure deploys derive
    a Fernet key any attacker can reproduce.
  detail: 'The aiohttp_session.EncryptedCookieStorage uses a Fernet key

    derived via PBKDF2-HMAC-SHA256 over (encryption_key + crypt_salt).

    conf/default.yml ships both as public-known strings. Any

    attacker who knows --insecure was used (a common pattern per the

    runbook §1) can decrypt or forge session cookies offline,

    bypassing the login form entirely. The same Fernet key is also

    the at-rest key for data/cookie_storage and for encrypt_files

    result-data encryption per FileSvc.


    This is critical severity because it falls under the

    security-tooling rubric clause "Operator authentication bypass to

    admin or operator console" — a known-key cookie is functionally

    equivalent to default credentials. It also engages the

    weapons-platform-misuse axis: a forged operator session yields

    full command-issuance capability against every fielded implant.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §4 'Authentication & sessions'
    excerpt: 'ships encryption_key: ADMIN123 and crypt_salt: REPLACE_WITH_RANDOM_VALUE'
  - artifact: prior-audit.md
    locator: '''Carried — Default-credential posture'''
    excerpt: encryption_key = ADMIN123 ; crypt_salt = REPLACE_WITH_RANDOM_VALUE
