  title: Ability-file watcher reloads YAML without integrity attribution
  summary: AppService starts an ability-file watcher that reloads data/abilities/*.yml on change; reloads are silent (no audit,
    no signature) and the planner picks them up on next operation.
  detail: 'AppService.start_sniffer_untrusted_agents and the related

    ability-file watcher per architecture-index.md reload ability

    definitions when files under data/abilities/ change. The reload

    is silent: there is no integrity check against a signed

    manifest, no operator attribution for the change, and no event

    emit. An operator (or post-compromise attacker) who modifies a

    stored ability changes what the planner will issue on the next

    operation. Threat-model T-3 confirms the gap.


    Medium per the security-tooling rubric clause "No audit on

    plugin module load" applied to the ability-file analog — the

    ability YAML controls what command the planner queues; a

    mutation here is functionally equivalent to a plugin mutation

    in its effect on what the platform issues. Escalates to high

    if combined with plugin-load mutability findings.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §2.1 'Top-level entrypoint' step 5
    excerpt: ability-file watcher
  - artifact: threat-model.md
    locator: T-3
    excerpt: ability-file watcher reloads modified YAML without integrity check
  control_mappings:
    nist_800_53r5:
    - SI-7
    - SI-7(2)
    - CM-3
    - CM-3(1)
    - AU-2
    mitre_attack:
    - technique: T1565
      sub_technique: T1565.003
      tactic: TA0040
      rationale: Live mutation of ability YAML alters runtime behavior of the planner without any platform-side detection.
    cwe:
    - CWE-345
  recommendation:
    posture: recommended
    summary: Hash ability files at load time and surface (sha256, file_path, mtime, operator) to the structured audit emitter
      on every reload.
    detail: 'Capture per-ability sha256 at load. On watcher-triggered

      reload, compare new sha256 to the prior; emit a structured

      audit event (ability_modified) including file_path, prior

      sha256, new sha256, operator identity (from process owner

      context if not directly attributable). Reject reload when

      the file''s signature does not match a manifest, if a plugin

      signature scheme is later adopted (cross-ref intg-81c06dfa).

      '
  related_concerns:
  - non_repudiation
  - immutability
  - authenticity
