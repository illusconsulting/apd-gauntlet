  title: Backup snapshot encryption posture undocumented for data/backup/
  summary: data/backup/ holds periodic state dumps; tech plan does not document whether backup is encrypted, whether keys
    differ from runtime, or whether backups are off-host.
  detail: 'DataService.save_state writes periodic dumps under data/backup/.

    The tech plan §9 confirms the path but does not state encryption

    posture, key separation, or off-host replication. Backup

    snapshots inherit the full sensitivity of the runtime store —

    harvested credentials, operator session material — and are

    typically the most attractive target for a long-window attacker.


    Medium severity (blocked) per the security-tooling rubric clause

    "Result data retained beyond engagement-completion + customer-

    policy window" — pending evidence that backups are subject to

    a defined retention enforcement and a separate-key encryption

    story. Escalates to high if backups carry the runtime Fernet

    key (single-key-compromise broadens the blast radius).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §9 'Persistence'
    excerpt: 'data/backup/ # periodic state dumps'
  - artifact: runbook.md
    locator: §6 (GAP marker)
    excerpt: 'GAP: backup key rotation not documented'
  prerequisite_evidence:
  - Backup encryption policy — key scope, key custody, rotation cadence
  - Backup retention policy and enforcement mechanism
  - Off-host replication or air-gap posture for backup tree
  control_mappings:
    nist_800_53r5:
    - CP-9
    - CP-9(1)
    - CP-9(8)
    - SC-28
    - MP-4
    mitre_attack: []
  recommendation:
    posture: recommended
    summary: Document backup encryption posture and adopt object-lock for off-host backup.
    detail: 'Specify in the runbook (a) which key encrypts data/backup,

      (b) the off-host destination (S3 with object lock, write-once

      media, separate cloud account), and (c) the retention floor

      and ceiling. If the backup carries the runtime Fernet key,

      adopt envelope encryption with a KMS-held KEK so a stolen

      backup tree does not yield a decryption key.

      '
