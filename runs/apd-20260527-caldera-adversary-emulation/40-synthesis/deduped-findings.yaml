  title: No certificate pinning at implant — listener TLS termination yields command-substitution
  summary: Implants validate listener TLS via OS trust store; an attacker who compromises the listener (or any CA in the trust
    store) substitutes commands.
  detail: 'ADR-0003 documents per-protocol callback encryption; the SSL

    plugin terminates TLS for HTTP-class contacts using a standard

    certificate chain. There is no documented certificate pinning

    at the implant against the listener''s specific certificate. A

    DNS hijack, BGP hijack, or any CA-compromise in the implant''s

    trust store yields a successful TLS termination by an

    attacker-controlled listener — and absent per-command

    signature verification (cross-ref intg-f6c14927), every implant

    whose callback resolves to the attacker''s endpoint becomes

    attacker-controlled.


    Critical per the security-tooling rubric clause "Implant

    callback channel substitution" — the rubric explicitly names

    this as "turnkey conversion of the platform''s fielded agents

    into attacker tools" and assigns critical because of the

    weapons-platform-misuse blast radius.

    '
