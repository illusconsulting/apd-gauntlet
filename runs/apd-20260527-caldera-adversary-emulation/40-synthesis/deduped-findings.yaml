  title: Cross-operator data access within a group — no per-engagement ACL
  summary: Operator B in red group can read every operation, agent, fact, and harvested-credential record operator A created;
    only coarse red/blue check exists.
  detail: 'The @check_authorization decorator in AuthService validates only

    that the caller belongs to the required group (''red'' or ''blue'').

    DataService has no per-resource ACL. INV-AUTHZ-002 confirms the

    gap: "Operator B in group red can read every operation, agent,

    fact, and harvested-credential record that operator A in the

    same group created."


    This is high per the security-tooling rubric clause "Result

    data accessible across engagements" — within a single tenant

    this is a horizontal-privilege violation; the rubric notes

    that within multi-tenant SaaS it escalates to critical. For

    Caldera''s typical team-server pattern it produces an

    insider-threat exposure where one compromised operator account

    yields every other operator''s harvested-credential corpus.

    '
  evidence:
  - artifact: invariants.md
    locator: INV-AUTHZ-002
    excerpt: Operator B in group red can read every operation, agent, fact, and harvested-credential record
  - artifact: tech_plan.md
    locator: §4 'Authentication & sessions'
    excerpt: 'Two coarse roles exist in core: red and blue ... there is no per-resource ACL'
