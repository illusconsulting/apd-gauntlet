  title: Implant has no cryptographic identity — paw alone is the registration token
  summary: The paw (operator-generated implant identifier) is the only identity an implant presents; ContactService accepts
    any beacon with a syntactically-valid paw.
  detail: 'Tech plan §7 documents the beacon flow: implant presents its

    paw and platform fingerprint, server upserts the agent in the

    registry. There is no cryptographic identity per implant; no

    per-implant key the listener verifies. The sandcat implant is

    built with operator-supplied ldflags that may include an

    identifier, but the server does not verify the binding. INV-

    AUTHZ-001 reviewer-notes the ambiguity. Threat-model S-2 and

    WP-3 confirm the impersonation vector.


    Critical per the security-tooling rubric clause "Implant

    authentication bypass" escalated by the rubric note "registered

    implants can issue commands or receive operator-attributed

    data" — a registered fake implant in detection-validation mode

    returns fabricated results that the operator treats as

    authoritative (a wrong "sensor X is detecting Y" determination

    drives downstream defense decisions). Also engages the

    weapons-platform-misuse axis: in red-team mode, the fake

    implant receives commands the operator intended for a

    legitimate implant.

    '
