  id: resil-ca256373
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  disposition: gap
  severity: high
  confidence: high
  title: No circuit breaker, no bulkhead between operator-console traffic and beacon-handling traffic
  summary: All traffic shares one event loop; no in-process bulkhead; a beacon flood degrades operator UI and a UI-heavy operation
    slows beacon handling.
  detail: 'With every request going through the single aiohttp app on one

    event loop, there is no bulkhead between the operator-UI render

    path and the beacon-handling path. ADR-0001 documents the

    single-process choice. The resilient consequence is that any

    load on one path degrades every other path: a chatty beacon

    flood (legitimate or D-1 attack scenario) stretches operator UI

    response time; a heavy listAgents query from the operator UI

    slows beacon handling.


    High per the security-tooling rubric: resilience asymmetry —

    the platform should fail SAFE for offensive surfaces (refuse

    commands without authorization gates) and OPEN for audit

    surfaces. Caldera''s single-loop model fails-fragile in both

    directions: a degraded auth path produces ambiguous behavior

    (some requests time out, some succeed) and there is no audit

    to record which requests received which treatment.

    '
  cross_references:
  - avail-623b8e59
  - dist-dbaf5c57
  evidence:
  - artifact: adrs/0001-asyncio-single-process-server.md
    locator: ADR-0001
    excerpt: asyncio single-process server
  - artifact: tech_plan.md
    locator: §2.3 'Process model'
    excerpt: Every incoming request ... is dispatched into the same loop
  control_mappings:
    nist_800_53r5:
    - SI-13
    - SI-13(1)
    - SI-13(4)
    - SC-5
    - CP-13
    mitre_attack:
    - technique: T1499
      sub_technique: T1499.003
      tactic: TA0040
      rationale: Application-exhaustion DoS amplified because there is no bulkhead between operator-facing and agent-facing
        request paths.
    cwe:
    - CWE-410
  recommendation:
    posture: recommended
    summary: Bulkhead beacon handling from operator UI via process split (per dist-dbaf5c57) and add per-path circuit breakers.
    detail: 'Adopt the 2-process model proposed by avail-623b8e59 and

      dist-dbaf5c57. Within each process, add per-downstream

      circuit breakers (data store, planning service, contact

      decoder) with explicit half-open / fail-fast behavior. Refuse

      new beacon registrations during degraded data-store states

      (fail-SAFE) rather than queuing in memory.

      '
