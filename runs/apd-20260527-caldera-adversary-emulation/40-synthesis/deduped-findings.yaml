    CFAA exposure (18 U.S.C. § 1030) as the legally-load-bearing

    consequence. The finding''s severity is on the

    weapons-platform-misuse axis: the platform is supposed to be

    the enforcement layer between operator intent and target

    reachability, and it abdicates that role.

    '
