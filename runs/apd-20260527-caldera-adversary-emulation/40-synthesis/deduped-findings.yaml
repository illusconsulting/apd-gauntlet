  detail: 'Runbook §2 describes "Plugin load errors: server stdout at INFO

    level shows any plugin whose enable() raised; aggregated under

    AppService.errors". The runbook does not describe what happens

    next: does the plugin''s partial state get cleaned up, do

    operator console pages handle the missing plugin gracefully,

    does the platform retry the load? The platform fails-fragile

    in this path: a half-loaded plugin can be worse than no plugin.


    Medium per the security-tooling rubric clause "No circuit

    breaker on result-data store" applied to the plugin-load

    analog — degradation of a single plugin has unbounded

    consequences on dependent surfaces.

    '
  evidence:
