  title: Plugin modules load with no signature verification, no manifest pinning, no hash check
  summary: AppService.load_plugins imports each plugins/<name>/hook.py without any integrity check; an attacker who can write
    to plugins/ has full server privilege on next start.
  detail: 'AppService.load_plugins iterates the plugins: list in

    conf/<env>.yml and import_module()s each. There is no

    signature verification, no manifest pinning, no hash check,

    no transparency log, and no allowlist beyond the operator''s

    conf list. ADR-0002 documents this as a load-bearing trust

    assumption — but the second-order consequence is what the

    gauntlet must score: a single write to plugins/<name>/hook.py

    (via supply-chain compromise of a community plugin, a

    typosquat, a compromised author account, or a backdoored

    dependency) yields full server privilege on next start.


    Critical per the security-tooling rubric clause "Plugin code

    execution by untrusted source" — a malicious plugin executes

    in the platform''s privileged context with access to the

    Fernet key, the agent registry, the result store, and the

    builder plugin (which can compile attacker-chosen implants).

    Also engages the weapons-platform-misuse axis: a backdoored

    plugin can issue commands to every fielded implant.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §5 'Plugin model'
    excerpt: There is no plugin signature verification. There is no runtime sandbox.
  - artifact: adrs/0002-plugin-runtime-without-signature-verification.md
    locator: ADR body
    excerpt: plugin runtime without signature verification
  - artifact: invariants.md
    locator: INV-PLUGIN-001
    excerpt: This is the trust assumption the platform's plugin model rests on
  control_mappings:
    nist_800_53r5:
    - SI-7
    - SI-7(1)
    - SI-7(15)
    - SR-4
    - SR-4(3)
    - SR-11
    - CM-5
    mitre_attack:
    - technique: T1195
      sub_technique: T1195.002
      tactic: TA0001
      rationale: Plugin loader imports any code in plugins/ without verification, enabling supply-chain compromise of the
        platform.
    - technique: T1505
      sub_technique: null
      tactic: TA0003
      rationale: Loaded plugin code is a long-lived server component running with platform privilege.
    cwe:
    - CWE-494
    - CWE-829
    - CWE-915
  recommendation:
    posture: required
    summary: Verify plugin signatures against a community-maintained signing root at load time; fail-closed on verification
      failure.
    detail: 'Add a plugin manifest format that declares

      (author, version, digest, signature, dependency lockfile).

      Add a verify-on-load pass in AppService.load_plugins that

      rejects any plugin whose signature does not validate against

      an operator-configured signing root. Surface the verification

      outcome to the non_repudiation finding''s structured audit

      sink. For community plugins, adopt a transparency log

      (sigstore-style) so the operator can audit which signing root

      signed which version. Fail-closed: a verification failure

      refuses to start the server (with --plugin-allow-unsigned

      opt-in for research deployments).

      '
    references:
    - in-toto attestation framework
    - Sigstore (sigstore.dev)
    - SLSA Level 2+ build attestation
