  title: Beacon listener has no rate limit — agent registry grows unboundedly under flood
  summary: POST /beacon accepts unbounded new paws; ContactService.handle_heartbeat upserts; no cap on registry size, no rate-limit
    per source IP.
  detail: 'ContactService.handle_heartbeat creates a fresh Agent for each

    previously-unseen paw. There is no rate limit on /beacon, no

    cap on agent_registry size, no per-source-IP throttle. An

    attacker who can reach the listener (HTTP /beacon on :8888 is

    reachable on the same port as the operator console) can script

    thousands of beacons with unique paws and bloat the registry

    until memory exhausts or the operator UI is unusably slow

    enumerating agents. Threat-model D-1 confirms the gap.


    Medium per the security-tooling rubric clause "No detection on

    listener probe activity" applied to the volumetric variant —

    the platform fails to detect AND fails to bound the

    consequence. Escalates to high if combined with no audit

    coverage (the operator may not notice the registry bloat until

    OOM).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §7 'Agent communication' step 2
    excerpt: Server's contact_svc.handle_heartbeat upserts the agent in the in-memory registry
  - artifact: threat-model.md
    locator: D-1
    excerpt: registry grows unboundedly until OOM
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-5(1)
    - SC-6
    - AU-12
    mitre_attack:
    - technique: T1498
      sub_technique: null
      tactic: TA0040
      rationale: Unbounded beacon registration is a network-DoS vector at the listener with secondary memory-pressure DoS
        at the server.
    cwe:
    - CWE-770
    - CWE-400
  recommendation:
    posture: required
    summary: Apply per-source-IP rate-limit on /beacon, cap agent_registry size, and emit a structured alert when the cap
      is approached.
    detail: 'Add a token-bucket rate limiter at the /beacon handler

      keyed by source IP (default 60 beacons per minute per IP,

      operator-tunable). Cap agent_registry size (default 10k

      agents, operator-tunable). Emit an alert (to the

      structured audit emitter once it exists) when registry

      approaches 80% of cap. Reject new beacon registrations at

      cap and surface to the operator with a clear "registry

      full" error.

      '
  related_concerns:
  - resilient
  - distributed
  - non_repudiation
  cluster_id: cluster-listener-resilience
  links:
