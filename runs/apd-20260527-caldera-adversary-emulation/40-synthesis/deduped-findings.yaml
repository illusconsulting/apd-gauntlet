  title: Plugin runtime shares process with every other in-process service — no isolation boundary at all
  summary: Plugin code, operator REST handlers, agent listeners, fact store, planner, and FileSvc all share one Python process;
    no namespace, no subprocess, no container per plugin.
  detail: 'Tech plan §3 (Trust boundaries #2) explicitly states: "Caldera

    server ↔ in-process plugins. NO BOUNDARY. Plugins are Python

    modules in plugins/<name>/ loaded by import_module; the

    plugin''s enable() method runs with full server privilege".

    INV-AUTHZ-003 reviewer-notes the gap.


    High per the security-tooling rubric clause "Multi-tenant SaaS

    platform with shared orchestrator process per tenant" applied

    to the single-process single-tenant case — every plugin shares

    every other plugin''s blast radius, and a sandbox-escape from

    any plugin yields the platform.

    '
