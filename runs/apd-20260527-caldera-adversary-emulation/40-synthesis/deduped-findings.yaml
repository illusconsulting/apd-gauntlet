  title: Single asyncio process is a blast-radius SPOF — one blocking call takes everything down
  summary: Operator UI, every listener, planner, plugin code share one asyncio event loop in one process; any in-process pathology
    takes down the whole platform.
  detail: 'ADR-0001 documents the single-process choice. Tech plan §2.3

    confirms: "One asyncio event loop hosts the aiohttp

    web.Application. Every incoming request — operator REST call,

    operator UI page render, agent beacon, GraphQL query,

    plugin-contributed route — is dispatched into the same loop."

    A blocking call in any plugin, a memory leak in the

    KnowledgeService fact store, a long-running go build via the

    builder plugin, a buggy parser running on a result — all of

    these stall the event loop and degrade every other surface

    simultaneously.


    High per the security-tooling rubric clause "Audit pipeline

    single-broker, single-sink" applied to the orchestrator analog

    — the rubric notes that a single point of failure in a

    security-tool component impairs every active engagement at

    once. For Caldera the blast radius includes the operator''s

    ability to observe what is happening AND the listener''s

    ability to accept beacons AND the planner''s ability to

    schedule new abilities.

    '
  evidence:
  - artifact: adrs/0001-asyncio-single-process-server.md
    locator: ADR-0001
    excerpt: asyncio single-process server
  - artifact: tech_plan.md
    locator: §2.3 'Process model'
    excerpt: One asyncio event loop hosts the aiohttp web.Application
  - artifact: threat-model.md
    locator: D-3
    excerpt: single-process single-eventloop is a SPOF
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-5(1)
    - CP-2
    - CP-2(3)
    - SC-39
    mitre_attack:
    - technique: T1499
      sub_technique: T1499.004
      tactic: TA0040
      rationale: Any blocking call in any plugin or any handler in the shared event loop is a DoS amplifier against every
        surface.
    cwe:
    - CWE-400
    - CWE-410
  recommendation:
    posture: recommended
    summary: Split the agent listener path into a separate process; bulkhead operator-console traffic from beacon handling.
    detail: 'Adopt at minimum a 2-process model: one process for the

      agent listeners (the high-volume, attacker-adjacent path);

      one process for the operator console + planner. Communicate

      via a local IPC (UNIX socket + shared store). The listener

      process can be replicated horizontally; the operator-console

      process remains singleton if simplicity is preferred. The

      process boundary also enables the plugin-sandbox finding''s

      recommendation (run plugins in the listener process at lower

      privilege).

      '
  related_concerns:
  - distributed
  - resilient
