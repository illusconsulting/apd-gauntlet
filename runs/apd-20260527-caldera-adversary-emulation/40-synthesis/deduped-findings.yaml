  detail: 'The builder plugin invokes go build against operator-supplied

    configuration; FileSvc applies URL_SANITIZATION_REGEX and

    ALLOWED_LDFLAG_REGEXES to filter what can be substituted into

    the implant binary. The risk is dual: (1) sensitive material an

    operator embeds (signing keys, internal URLs, credentials) ends

    up in a payload served from /file/download to anyone with

    operator privilege; (2) regex completeness against evasions is

    not audited in the artifacts.


    Medium per the security-tooling rubric clause "Listener

    fingerprinting trivial via banner/default/etc." — escalates to

    high if the regexes are bypassable (would require code review

    to confirm). The operator can plausibly leak material they

    did not intend to embed.

    '
