  title: Result data stored without per-record integrity hashing — chain-of-custody is not preserved
  summary: data/results/ Result records are Fernet-encrypted but not content-hashed; an operator with filesystem access can
    edit a captured Result without detection.
  detail: 'The Fernet wrapper provides confidentiality plus HMAC-based

    tamper-evidence of the ciphertext, but the integrity check is

    keyed by the same key that performs encryption — the operator

    holding the encryption_key can re-encrypt a modified plaintext

    and the wrapper does not detect change. There is no per-record

    external signature, no content-addressed identifier, no

    timestamp-authority anchor. INV-AUTHZ-002 and the threat-model

    T-2 confirm the chain-of-custody gap.


    High per the security-tooling rubric clause "Implant binary

    modifiable post-build" applied to the result-side analog — the

    rubric notes that destruction of chain-of-custody impairs

    dispute resolution. The result records are the

    customer-deliverable provenance under typical engagement

    contracts; the inability to detect post-capture mutation

    undermines the platform''s role as evidence custodian.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §9 'Persistence'
    excerpt: FileSvc can also encrypt arbitrary files (payload at-rest) with Fernet
  - artifact: threat-model.md
    locator: T-2
    excerpt: operator with filesystem access edits a captured Result under data/results/ to falsify a customer-deliverable
      finding
  control_mappings:
    nist_800_53r5:
    - SI-7
    - SI-7(6)
    - AU-9
    - AU-9(3)
    - MP-4
    mitre_attack:
    - technique: T1565
      sub_technique: T1565.001
      tactic: TA0040
      rationale: Operator-writable Fernet-encrypted store allows post-capture mutation of stored result data without tamper
        detection by a key-separate verifier.
    cwe:
    - CWE-345
    - CWE-353
  recommendation:
    posture: required
    summary: Layer a per-record signature signed with an orchestrator-only key independent of FileSvc's encryption_key; verify
      on every read.
    detail: 'At Result-capture time, hash the captured payload (SHA-256)

      and sign the hash with a separately-managed

      result_integrity_key held only at PlanningService /

      RestService (not exposed to FileSvc). Store the (hash,

      signature) pair as an immutable sidecar record per Result.

      Verify on every read; refuse to return result content when

      signature verification fails. Cross-references the

      immutability finding on result-record retention.

      '
    references:
    - NIST SP 800-92 §3.3
  related_concerns:
  - immutability
  - non_repudiation
  - confidentiality
  cluster_id: cluster-result-data-lifecycle
  links:
  - immut-de3cc948
  - nonrep-1f49427b
