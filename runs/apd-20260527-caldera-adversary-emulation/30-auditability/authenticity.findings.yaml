finding:
  - schema_version: 1
    id: auth-1c9a7b78
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "No MFA in core — operator authentication relies on single-factor password or API key"
    summary: "INV-AUTH-004 reviewer-notes that MFA is not present in core; the AuthService login pipeline has no second-factor step."
    detail: |
      Tech plan §4 explicitly states "MFA. Not present in core."
      INV-AUTH-004 reviewer-notes the gap; the saml plugin or a
      custom LoginHandlerInterface implementation could add MFA but
      no shipped plugin does. For a weapons platform whose
      authenticated user can issue commands against fielded
      implants, single-factor authentication is below the floor for
      the security-tooling severity rubric.

      High per the security-tooling rubric clause "Weak operator MFA
      or MFA-bypass paths" — escalates to critical (per "Operator
      authentication bypass to admin or operator console") when
      paired with the default-credential surface and the long-lived
      session.
    cross_references:
      - conf-e223c03d
      - conf-01d02036
      - ephem-cc497fed
    evidence:
      - artifact: tech_plan.md
        locator: "§4 'Authentication & sessions'"
        excerpt: "MFA. Not present in core"
      - artifact: invariants.md
        locator: "INV-AUTH-004"
        excerpt: "Not present in core"
    control_mappings:
      nist_800_53r5: [IA-2, "IA-2(1)", "IA-2(2)", "IA-2(6)", "IA-2(8)", IA-5]
      mitre_attack:
        - technique: T1110
          sub_technique: "T1110.003"
          tactic: TA0006
          rationale: "Single-factor authentication on a weapons platform is the canonical target for password spraying."
      cwe: [CWE-308, CWE-1390]
      owasp_top10: ["A07:2021"]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Add MFA to core login pipeline (TOTP minimum, WebAuthn preferred); require MFA for admin operators."
      detail: |
        Add a core MFA step to the default LoginHandlerInterface.
        Default to TOTP enrollment on first login. Strongly recommend
        WebAuthn (phishing-resistant). Require MFA enrollment before
        any command-issuance privilege is granted. For the API-key
        path: require step-up MFA when issuing a new token; bind
        the token to an operator_id with optional per-action MFA
        challenge for engagement-initiation operations.
      references:
        - "NIST SP 800-63B AAL2 / AAL3"
        - "FIDO Alliance WebAuthn"
    related_concerns: [confidentiality, ephemeral, non_repudiation]

  - schema_version: 1
    id: auth-0e31c9b1
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: critical
    confidence: high
    title: "Implant has no cryptographic identity — paw alone is the registration token"
    summary: "The paw (operator-generated implant identifier) is the only identity an implant presents; ContactService accepts any beacon with a syntactically-valid paw."
    detail: |
      Tech plan §7 documents the beacon flow: implant presents its
      paw and platform fingerprint, server upserts the agent in the
      registry. There is no cryptographic identity per implant; no
      per-implant key the listener verifies. The sandcat implant is
      built with operator-supplied ldflags that may include an
      identifier, but the server does not verify the binding. INV-
      AUTHZ-001 reviewer-notes the ambiguity. Threat-model S-2 and
      WP-3 confirm the impersonation vector.

      Critical per the security-tooling rubric clause "Implant
      authentication bypass" escalated by the rubric note "registered
      implants can issue commands or receive operator-attributed
      data" — a registered fake implant in detection-validation mode
      returns fabricated results that the operator treats as
      authoritative (a wrong "sensor X is detecting Y" determination
      drives downstream defense decisions). Also engages the
      weapons-platform-misuse axis: in red-team mode, the fake
      implant receives commands the operator intended for a
      legitimate implant.
    evidence:
      - artifact: tech_plan.md
        locator: "§3 'Trust boundaries' #3"
        excerpt: "no payload authentication beyond the implant's declared paw"
      - artifact: threat-model.md
        locator: "S-2"
        excerpt: "attacker crafts a beacon with a fabricated paw"
      - artifact: invariants.md
        locator: "INV-AUTHZ-001"
        excerpt: "Operation carries a creator field at create time; Link inherits"
    control_mappings:
      nist_800_53r5: [IA-3, "IA-3(1)", IA-9, "IA-5(2)", SC-17]
      mitre_attack:
        - technique: T1036
          sub_technique: null
          tactic: TA0005
          rationale: "Fabricated implant identity allows an attacker to masquerade as a deployed agent at the platform's registration layer."
      cwe: [CWE-287, CWE-290]
    recommendation:
      posture: required
      summary: "Issue a per-implant cryptographic identity at build time; verify at registration and every beacon."
      detail: |
        Modify sandcat / manx build pipeline to embed a per-build
        signing key (server-issued at build time). Server retains
        the public half indexed by paw. ContactService verifies a
        signature on every beacon body using the stored public half.
        Reject registration where the paw does not have a matching
        public key on file (i.e., the platform did not issue the
        binary). Use mTLS where the contact protocol supports it
        (HTTP, websocket, TCP).
      references:
        - "SPIFFE / SPIRE workload identity"
    related_concerns: [integrity, confidentiality, non_repudiation]

  - schema_version: 1
    id: auth-c1c1d0cb
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: critical
    confidence: high
    title: "No certificate pinning at implant — listener TLS termination yields command-substitution"
    summary: "Implants validate listener TLS via OS trust store; an attacker who compromises the listener (or any CA in the trust store) substitutes commands."
    detail: |
      ADR-0003 documents per-protocol callback encryption; the SSL
      plugin terminates TLS for HTTP-class contacts using a standard
      certificate chain. There is no documented certificate pinning
      at the implant against the listener's specific certificate. A
      DNS hijack, BGP hijack, or any CA-compromise in the implant's
      trust store yields a successful TLS termination by an
      attacker-controlled listener — and absent per-command
      signature verification (cross-ref intg-f6c14927), every implant
      whose callback resolves to the attacker's endpoint becomes
      attacker-controlled.

      Critical per the security-tooling rubric clause "Implant
      callback channel substitution" — the rubric explicitly names
      this as "turnkey conversion of the platform's fielded agents
      into attacker tools" and assigns critical because of the
      weapons-platform-misuse blast radius.
    cross_references:
      - intg-f6c14927
      - conf-056edb0c
    evidence:
      - artifact: adrs/0003-agent-callback-encryption-by-protocol.md
        locator: "ADR-0003 body"
        excerpt: "agent callback encryption by protocol"
      - artifact: threat-model.md
        locator: "WP-3"
        excerpt: "attacker who controls the listener endpoint ... issues commands to every implant"
    control_mappings:
      nist_800_53r5: [SC-17, "SC-23(3)", IA-3, "IA-3(1)", SC-12]
      mitre_attack:
        - technique: T1090
          sub_technique: "T1090.003"
          tactic: TA0011
          rationale: "Listener-endpoint substitution converts the C2 channel into an attacker-controlled proxy serving commands to live implants."
        - technique: T1557
          sub_technique: null
          tactic: TA0006
          rationale: "Channel substitution without pinning is the canonical AitM scenario."
      cwe: [CWE-295, CWE-296]
    recommendation:
      posture: required
      summary: "Ship implants with a pinned listener certificate (or pinned listener-CA); refuse to beacon on pinning failure."
      detail: |
        At sandcat / manx build time, embed a fingerprint of the
        listener's TLS certificate (or a pinned listener-CA). The
        implant verifies on every connection and refuses to send
        beacon body on mismatch. The platform exposes a
        rotate-listener-cert flow that includes a coordinated
        push-new-pin to live implants before swapping the listener
        cert. For long-running engagements, use short-lived listener
        certs with a transparency-log-anchored rotation cycle.
      references:
        - "MITRE D3FEND D3-CP (Certificate Pinning)"
    related_concerns: [confidentiality, integrity, immutability]

  - schema_version: 1
    id: auth-ec69906a
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "Plugin authorship is unverified — no signing root, no provenance attestation"
    summary: "Plugins ship as source under plugins/<name>/; no signature, no SBOM, no provenance attestation tying code to author."
    detail: |
      Tech plan §5 confirms no plugin signature verification. ADR-
      0002 documents the trust assumption. There is no SBOM, no
      provenance attestation (SLSA, in-toto), no signing root. The
      authenticity lens concern (distinct from integrity's
      tamper-detection lens) is that the platform cannot answer
      "who wrote this code" or "is this the artifact the author
      published" — both prerequisites for an operator to make a
      trust decision before enabling a plugin.

      High per the security-tooling rubric clause "Plugin update
      mechanism unsigned" — escalates to critical (per "Plugin code
      execution by untrusted source") when paired with the absent
      sandbox (dist-dbaf5c57).
    cross_references:
      - intg-81c06dfa
    evidence:
      - artifact: tech_plan.md
        locator: "§5 'Plugin model'"
        excerpt: "no signature verification, no allowlist beyond the plugins: list"
      - artifact: adrs/0002-plugin-runtime-without-signature-verification.md
        locator: "ADR-0002"
        excerpt: "plugin runtime without signature verification"
    control_mappings:
      nist_800_53r5: [SR-4, "SR-4(3)", "SR-4(4)", SR-10, SR-11, "IA-5(2)"]
      mitre_attack:
        - technique: T1195
          sub_technique: "T1195.001"
          tactic: TA0001
          rationale: "Absent provenance attestation, an attacker substitutes a backdoored plugin and the operator has no signal that authorship has changed."
      cwe: [CWE-345]
    recommendation:
      posture: required
      summary: "Adopt sigstore-style signing for plugins with a public transparency log; require operator-pinned signing roots."
      detail: |
        Adopt sigstore / cosign signing for plugin distributions. Each
        plugin publishes a signature against an OIDC-bound identity
        in a public transparency log. Operators pin one or more
        signing-root identities in conf/<env>.yml. Plugin load
        rejects any plugin not signed by a pinned identity. Surface
        signature-verification outcome to the audit emitter.
    related_concerns: [integrity, non_repudiation, immutability]

  - schema_version: 1
    id: auth-31296050
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "API-key path attributes only to a group, not a specific operator"
    summary: "INV-AUTH-002 reviewer-notes the KEY header attributes only to red or blue group; multiple humans share a single key."
    detail: |
      AuthService API-key check matches the inbound KEY header against
      api_key_red or api_key_blue. The group is the only attribution.
      INV-AUTH-002 reviewer-notes the gap; threat-model R-2 confirms
      the consequence. For a weapons platform, the inability to bind
      an API-key request to a specific human breaks the chain of
      accountability for every API-driven action — including command
      issuance against fielded implants.

      High per the security-tooling rubric clause "Credential leak in
      operator API tokens" applied to the attribution analog — and
      directly on the authenticity lens because the platform's
      identity claim ("red group") is insufficient for any defensible
      attribution.
    cross_references:
      - ephem-608839d8
    evidence:
      - artifact: invariants.md
        locator: "INV-AUTH-002"
        excerpt: "KEY header path attributes only to a group (red or blue) — multiple humans share a single key"
      - artifact: threat-model.md
        locator: "R-2"
        excerpt: "API-key path attributes only to a group, not a user"
    control_mappings:
      nist_800_53r5: [IA-2, "IA-2(1)", IA-5, AC-2, AU-3, "AU-3(1)"]
      mitre_attack:
        - technique: T1078
          sub_technique: null
          tactic: TA0001
          rationale: "Shared group-level API keys are valid-accounts with no per-human attribution; any user of the key is indistinguishable."
      cwe: [CWE-284, CWE-732]
      owasp_api_top10: ["API2:2023"]
    recommendation:
      posture: required
      summary: "Replace per-group API keys with per-operator tokens carrying operator_id; deprecate group-level keys."
      detail: |
        Migrate to per-operator API tokens. Each token binds
        (operator_id, scope, TTL, issued_at, revoked). Tokens
        contain a JTI for deny-list support. The KEY header
        validation extracts operator_id and surfaces it to the
        audit emitter on every request. Deprecate the group-key
        path; offer a grace period with a deprecation warning
        emitted on every group-key use.
    related_concerns: [non_repudiation, ephemeral, confidentiality]

  - schema_version: 1
    id: auth-5911ace7
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Some /api/v2 handlers may be exempt from @check_authorization via __caldera_unauthenticated__"
    summary: "Tech plan notes /api/v2/health uses __caldera_unauthenticated__; other handlers may use the same exemption mechanism without a documented allowlist."
    detail: |
      Tech plan §10 documents that __caldera_unauthenticated__ is the
      exemption mechanism: "auth is enforced per-handler by
      @check_authorization or by exempting a handler with
      __caldera_unauthenticated__". The runbook §2 confirms health
      uses this. There is no documented allowlist of which handlers
      use the exemption; there is no CI check that flags new
      exemptions. Threat-model E-2 raises the analogous concern for
      plugin-contributed routes.

      Medium (blocked) per the security-tooling rubric clause
      "Operator role bypass" — pending evidence of the exhaustive
      list of unauthenticated handlers and the threat model for each.
    evidence:
      - artifact: tech_plan.md
        locator: "§10 'API surfaces'"
        excerpt: "auth is enforced per-handler by @check_authorization or by exempting a handler with __caldera_unauthenticated__"
      - artifact: threat-model.md
        locator: "E-2"
        excerpt: "Plugin author forgets @check_authorization or marks a route __caldera_unauthenticated__ incorrectly"
    prerequisite_evidence:
      - "Complete list of handlers using __caldera_unauthenticated__"
      - "Threat-model entry per unauthenticated handler"
      - "CI lint that flags new unauthenticated handlers"
    control_mappings:
      nist_800_53r5: [IA-2, AC-3, "AC-3(7)", AU-12]
      mitre_attack: []
      cwe: [CWE-862]
      owasp_api_top10: ["API5:2023"]
    recommendation:
      posture: recommended
      summary: "Maintain an explicit allowlist of unauthenticated handlers; CI lint to flag additions."
      detail: |
        Add an unauthenticated_handlers.yml manifest enumerating
        every handler that uses __caldera_unauthenticated__, each
        annotated with the rationale. CI test: fail if any handler
        is exempted but absent from the manifest. Periodic review:
        every entry in the manifest must be re-justified annually.
    related_concerns: [non_repudiation, integrity]
