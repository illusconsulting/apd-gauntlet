schema_version: 1
agent: immutability
finding:
  - schema_version: 1
    id: immut-b0fd1144
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: critical
    confidence: high
    title: "No append-only / WORM substrate for operator-action audit log — the audit log itself does not exist"
    summary: "The security-tooling immutability data-class list requires immutable operator-action audit; Caldera has no audit log at all, so the immutability requirement is vacuously violated."
    detail: |
      The security-tooling immutability classes from the active
      domain pack require WORM / append-only storage for the
      operator-action audit log: "The chain-of-custody record
      distinguishing authorized testing from unauthorized intrusion
      under CFAA. Mutability or deletion-by-single-credential is a
      critical finding." Caldera has no structured audit log
      (cross-ref nonrep-d8bf1096); therefore there is nothing to
      protect against alteration.

      The immutability lens scores this distinctly from
      non_repudiation: non_repudiation owns the question "is the
      record being captured", immutability owns "can the captured
      record be altered later." For Caldera the answer is "nothing
      is being captured, so the protect-against-alteration question
      is moot, but the resulting evidence absence is itself the
      load-bearing legal-defensibility problem."

      Critical per the security-tooling rubric clause "Audit trail
      loss or alterability covering operator actions" — and per the
      immutability classes file: "Mutability or deletion-by-single-
      credential is a critical finding."
    cross_references:
      - nonrep-d8bf1096
    evidence:
      - artifact: tech_plan.md
        locator: "§11 'Known security posture'"
        excerpt: "no immutable event store"
      - artifact: invariants.md
        locator: "INV-AUTH-001"
        excerpt: "no structured audit emitter, no signed event record"
    control_mappings:
      nist_800_53r5: ["AU-9(2)", "AU-9(3)", "AU-9(4)", AU-11, "AU-11(1)", "SI-7(8)"]
      mitre_attack:
        - technique: T1070
          sub_technique: null
          tactic: TA0005
          rationale: "Absent immutable audit substrate, an attacker (or an operator covering tracks) has nothing to delete because nothing was captured — the same end state."
      cwe: [CWE-778, CWE-117]
    recommendation:
      posture: required
      summary: "Adopt an external WORM substrate for the audit log (S3 object-lock, vault-lock, or hash-chained log shipped to a transparency log)."
      detail: |
        After the audit emitter exists (nonrep-d8bf1096), ship every
        event to a sink with object-lock (S3 with compliance-mode
        retention) or vault-lock (Azure Blob immutable storage). For
        defense-in-depth, hash-chain entries per day; anchor the
        daily chain-head to a public transparency log (rekor) or
        an external TSA. Retention floor: 7 years (longest typical
        customer-MSA audit window per the immutability classes file).
        Deletion of any audit record requires multi-party authorization
        (NIST AU-9(4) intent).
    related_concerns: [non_repudiation, authenticity, confidentiality]

  - schema_version: 1
    id: immut-df8094e4
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: high
    confidence: high
    title: "Plugin install records are not retained — plugin removal erases prior-install history"
    summary: "No persistent plugin install record; toggling a plugin in conf/<env>.yml and restarting silently changes which plugin ran when."
    detail: |
      The security-tooling immutability classes require: "Module /
      plugin install records — supply-chain provenance for which
      plugin ran in the platform's privileged context when. Required
      for incident reconstruction when a plugin is later discovered
      malicious or backdoored... Plugin removal MUST NOT erase
      prior-install records." Caldera persists no install records;
      removing a plugin from conf/<env>.yml and restarting yields a
      state where no evidence remains that the plugin was ever
      loaded. Threat-model R-3 confirms.

      High per the security-tooling rubric clause "No audit on
      plugin module load" — escalates to critical when paired with
      the mutable-without-signature plugin store (intg-81c06dfa)
      because the historical state is not just unauditable but
      cryptographically irrecoverable.
    cross_references:
      - nonrep-5f137373
      - intg-81c06dfa
    evidence:
      - artifact: tech_plan.md
        locator: "§5 'Plugin model'"
        excerpt: "imported by AppService.load_plugins at server start"
      - artifact: threat-model.md
        locator: "R-3"
        excerpt: "no structured audit captures which plugin loaded when, with what version digest"
    control_mappings:
      nist_800_53r5: [AU-11, CM-2, "CM-2(2)", "CM-2(3)", CM-3, SR-4]
      mitre_attack:
        - technique: T1505
          sub_technique: null
          tactic: TA0003
          rationale: "Without retained plugin install history, a backdoored plugin's prior load cannot be reconstructed; the attacker effectively removes the historical record by removing the plugin."
      cwe: [CWE-117]
    recommendation:
      posture: required
      summary: "Append every plugin install / enable / disable / remove event to the immutable audit substrate; retention matches the audit floor."
      detail: |
        Plugin lifecycle events from nonrep-5f137373 must be appended
        to the WORM audit substrate from immut-b0fd1144. Retention
        for plugin install records: the longer of (audit-floor,
        engagement-completion + customer-policy-window). On plugin
        remove, the in-memory list is updated but the immutable
        record persists.
    related_concerns: [non_repudiation, authenticity, integrity]

  - schema_version: 1
    id: immut-de3cc948
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: high
    confidence: high
    title: "Result-data store is mutable by anyone with filesystem write — no WORM, no per-record signature"
    summary: "data/results/ records are encrypted but mutable; the security-tooling immutability classes require result-harvest log immutability for chain-of-custody."
    detail: |
      The security-tooling immutability classes require: "Result-
      harvest log — the provenance record linking captured data to
      the implant and engagement that produced it... Required for
      chain-of-custody if engagement results are ever used in a
      customer's own legal proceedings or regulatory disclosure."
      Caldera stores Result records under data/results/ with
      optional Fernet encryption; the operator (or any process
      running as the server user) can edit, delete, or replace any
      Result file. There is no WORM substrate, no per-record
      external signature, no content-addressable storage.

      High per the security-tooling rubric: severity follows the
      rubric clause "Result data ingested from implants is stored
      without integrity hashing" (which the integrity finding
      intg-5152e7ba owns); immutability owns the retention /
      alteration-detection dimension. Escalates to critical when
      paired with the operator-edits-her-own-results scenario
      (T-2 threat model) because the chain-of-custody is destroyed.
    cross_references:
      - intg-5152e7ba
      - conf-aabbd48f
    evidence:
      - artifact: tech_plan.md
        locator: "§9 'Persistence'"
        excerpt: "data/results/ # per-link captured output"
      - artifact: threat-model.md
        locator: "T-2"
        excerpt: "operator with filesystem access edits a captured Result"
    control_mappings:
      nist_800_53r5: ["AU-9(2)", "AU-9(3)", AU-11, MP-4, "SI-7(8)"]
      mitre_attack:
        - technique: T1565
          sub_technique: "T1565.001"
          tactic: TA0040
          rationale: "Mutable result-data store on operator-writable filesystem allows post-capture stored-data manipulation."
      cwe: [CWE-1188, CWE-353]
    recommendation:
      posture: required
      summary: "Move data/results/ to WORM-class storage (S3 object-lock or vault-lock); per-record signature held by an orchestrator-only key."
      detail: |
        Pair the integrity finding intg-5152e7ba (per-record
        signature) with a WORM storage substrate. For non-cloud
        deployments, content-addressable storage (CAS) with periodic
        Merkle anchoring to an external TSA is acceptable. For cloud
        deployments, S3 with object-lock in compliance mode is the
        canonical answer. Retention: match the customer-MSA audit
        clause (typically 3-7 years).
    related_concerns: [integrity, non_repudiation, confidentiality]

  - schema_version: 1
    id: immut-6352dd54
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: medium
    confidence: high
    title: "No retention enforcement for any data class — no automated lifecycle, no legal-hold mechanism"
    summary: "Tech plan and runbook describe no automated retention or deletion policy; operators delete data/ contents manually."
    detail: |
      The security-tooling immutability classes specify retention
      floors for operator-action audit (longest customer-MSA window,
      commonly 3-7 years), engagement-start records, command-issued
      log, result-harvest log, operator authentication events. None
      are enforced by Caldera. Retention is operator-discretion via
      manual filesystem cleanup. No legal-hold mechanism exists
      (an operator under litigation cannot mark a record as
      retain-against-policy-delete).

      Medium per the security-tooling rubric clause "Result data
      retained beyond engagement-completion + customer-policy window"
      — the rubric's primary framing is over-retention; under-
      retention is the symmetric concern (premature deletion of
      legally-required records). Escalates to high when combined
      with absent audit (the operator who deletes can do so
      undetectably).
    cross_references:
      - ephem-d6c8d458
    evidence:
      - artifact: tech_plan.md
        locator: "§9 'Persistence'"
        excerpt: "data/ directory tree is the store ... no persistent transaction log"
      - artifact: runbook.md
        locator: "§6 (GAP marker)"
        excerpt: "GAP: retention not documented"
    control_mappings:
      nist_800_53r5: [AU-11, "AU-11(1)", SI-12]
      mitre_attack: []
    recommendation:
      posture: recommended
      summary: "Define per-class retention policy with floor + ceiling; automate enforcement; support legal-hold override."
      detail: |
        Define retention policy per data class:
        - Operator-action audit: floor 7 years, no ceiling.
        - Command-issued log: floor 7 years.
        - Engagement-start records: floor 7 years.
        - Result-harvest log: per-customer-MSA floor (default 3 years).
        - Plugin install records: floor 7 years.
        - Operator authentication events: floor 1 year.
        Automate retention enforcement via a periodic lifecycle job.
        Legal-hold: per-engagement marker that overrides automated
        deletion until removed by privileged-role action (which is
        itself audited).
    related_concerns: [non_repudiation, ephemeral, availability]

  - schema_version: 1
    id: immut-88339a4a
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    disposition: gap
    severity: medium
    confidence: high
    title: "Configuration drift between conf/<env>.yml and runtime state is not detected"
    summary: "conf/<env>.yml is loaded once at startup; runtime modifications via REST (e.g., adding a user, enabling a plugin path) are not reflected back into conf, and conf edits require restart with no diff detection."
    detail: |
      Tech plan §2.1 confirms conf is loaded at startup. Operator-
      driven runtime mutations (creating a new ability, enabling a
      contact, editing the planner) update in-memory state; the
      file-system reflects them through DataService.save_state but
      conf/<env>.yml does not capture them. Conversely, an operator
      editing conf/<env>.yml between restarts may produce silent
      drift between two sequential server lifetimes. There is no
      declared-state-vs-actual-state reconciliation.

      Medium per the security-tooling rubric (general immutability
      clause; no specific severity in the rubric for config-drift,
      so scored mid-band per the discipline). The concern is
      forensic: incident reconstruction depends on knowing the conf
      that was actually in force at a given timestamp.
    evidence:
      - artifact: tech_plan.md
        locator: "§2.1 'Top-level entrypoint' step 1"
        excerpt: "Loads conf/<env>.yml ... into BaseWorld"
      - artifact: tech_plan.md
        locator: "§9 'Persistence'"
        excerpt: "no persistent transaction log; the file system is the source of truth between restarts"
    control_mappings:
      nist_800_53r5: [CM-2, "CM-2(2)", "CM-2(3)", CM-3, CM-6]
      mitre_attack: []
      cwe: [CWE-1071]
    recommendation:
      posture: recommended
      summary: "Capture configuration-as-code with version history and signed commits; hash-snapshot the conf at every server start and emit to audit."
      detail: |
        Treat conf/<env>.yml as configuration-as-code: version-
        controlled, with signed commits (commit signature verified
        at server start). Emit a startup_configuration event
        containing the conf digest; subsequent runtime changes that
        cannot be persisted to conf are also surfaced as events.
        Add a periodic drift-check: compare in-memory effective conf
        to the on-disk conf and alert on divergence.
    related_concerns: [non_repudiation, integrity, authenticity]
