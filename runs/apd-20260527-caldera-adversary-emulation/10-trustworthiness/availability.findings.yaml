finding:
  - schema_version: 1
    id: avail-c583c332
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: blocked
    severity: medium
    confidence: high
    title: "No declared SLO or availability target for operator console, orchestrator, or any listener"
    summary: "Tech plan and runbook are silent on availability targets; no error budget, no uptime commitment per surface."
    detail: |
      The tech plan, the runbook, and the architecture index do not
      declare a Service Level Objective for any service. The /health
      endpoint exists but no SLI/SLO ties to it. The runbook §2 lists
      health checks as ad-hoc operator commands. There is no error
      budget, no per-component reliability target.

      Medium (blocked) per the security-tooling rubric clause "No
      SLO declared for engagement-active services" — security tooling
      with an active engagement is a system the operator depends on
      mid-fight; an undeclared SLO means reliability work cannot be
      prioritized against the surfaces that matter most. Pending
      evidence that any operator runbook captures an internal target.
    evidence:
      - artifact: runbook.md
        locator: "§2 'Health checks'"
        excerpt: "curl -s http://localhost:8888/api/v2/health"
      - artifact: tech_plan.md
        locator: "§11 'Known security posture'"
        excerpt: "No production-grade audit story"
    prerequisite_evidence:
      - "Per-component availability target for operator console, listener, orchestrator"
      - "Error budget policy if SLO is adopted"
      - "Customer-MSA uptime expectations typical for Caldera deployments"
    control_mappings:
      nist_800_53r5: [CP-2, "CP-2(3)", SI-13]
      mitre_attack: []
    recommendation:
      posture: recommended
      summary: "Declare per-component SLO (e.g., listener 99.9%, operator console 99%, audit pipeline 99.95% once it exists)."
      detail: |
        Capture per-component availability targets in the runbook.
        Tie /health to a structured /metrics endpoint emitting RED
        (Rate, Errors, Duration) per surface. Establish an error
        budget tied to engagement-criticality (listener > operator
        UI > /api/docs).
    related_concerns: [resilient, distributed, non_repudiation]

  - schema_version: 1
    id: avail-623b8e59
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: high
    confidence: high
    title: "Single asyncio process is a blast-radius SPOF — one blocking call takes everything down"
    summary: "Operator UI, every listener, planner, plugin code share one asyncio event loop in one process; any in-process pathology takes down the whole platform."
    detail: |
      ADR-0001 documents the single-process choice. Tech plan §2.3
      confirms: "One asyncio event loop hosts the aiohttp
      web.Application. Every incoming request — operator REST call,
      operator UI page render, agent beacon, GraphQL query,
      plugin-contributed route — is dispatched into the same loop."
      A blocking call in any plugin, a memory leak in the
      KnowledgeService fact store, a long-running go build via the
      builder plugin, a buggy parser running on a result — all of
      these stall the event loop and degrade every other surface
      simultaneously.

      High per the security-tooling rubric clause "Audit pipeline
      single-broker, single-sink" applied to the orchestrator analog
      — the rubric notes that a single point of failure in a
      security-tool component impairs every active engagement at
      once. For Caldera the blast radius includes the operator's
      ability to observe what is happening AND the listener's
      ability to accept beacons AND the planner's ability to
      schedule new abilities.
    evidence:
      - artifact: adrs/0001-asyncio-single-process-server.md
        locator: "ADR-0001"
        excerpt: "asyncio single-process server"
      - artifact: tech_plan.md
        locator: "§2.3 'Process model'"
        excerpt: "One asyncio event loop hosts the aiohttp web.Application"
      - artifact: threat-model.md
        locator: "D-3"
        excerpt: "single-process single-eventloop is a SPOF"
    control_mappings:
      nist_800_53r5: [SC-5, "SC-5(1)", CP-2, "CP-2(3)", "SC-39"]
      mitre_attack:
        - technique: T1499
          sub_technique: "T1499.004"
          tactic: TA0040
          rationale: "Any blocking call in any plugin or any handler in the shared event loop is a DoS amplifier against every surface."
      cwe: [CWE-400, CWE-410]
    recommendation:
      posture: recommended
      summary: "Split the agent listener path into a separate process; bulkhead operator-console traffic from beacon handling."
      detail: |
        Adopt at minimum a 2-process model: one process for the
        agent listeners (the high-volume, attacker-adjacent path);
        one process for the operator console + planner. Communicate
        via a local IPC (UNIX socket + shared store). The listener
        process can be replicated horizontally; the operator-console
        process remains singleton if simplicity is preferred. The
        process boundary also enables the plugin-sandbox finding's
        recommendation (run plugins in the listener process at lower
        privilege).
    related_concerns: [distributed, resilient]

  - schema_version: 1
    id: avail-e4b13596
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "Beacon listener has no rate limit — agent registry grows unboundedly under flood"
    summary: "POST /beacon accepts unbounded new paws; ContactService.handle_heartbeat upserts; no cap on registry size, no rate-limit per source IP."
    detail: |
      ContactService.handle_heartbeat creates a fresh Agent for each
      previously-unseen paw. There is no rate limit on /beacon, no
      cap on agent_registry size, no per-source-IP throttle. An
      attacker who can reach the listener (HTTP /beacon on :8888 is
      reachable on the same port as the operator console) can script
      thousands of beacons with unique paws and bloat the registry
      until memory exhausts or the operator UI is unusably slow
      enumerating agents. Threat-model D-1 confirms the gap.

      Medium per the security-tooling rubric clause "No detection on
      listener probe activity" applied to the volumetric variant —
      the platform fails to detect AND fails to bound the
      consequence. Escalates to high if combined with no audit
      coverage (the operator may not notice the registry bloat until
      OOM).
    evidence:
      - artifact: tech_plan.md
        locator: "§7 'Agent communication' step 2"
        excerpt: "Server's contact_svc.handle_heartbeat upserts the agent in the in-memory registry"
      - artifact: threat-model.md
        locator: "D-1"
        excerpt: "registry grows unboundedly until OOM"
    control_mappings:
      nist_800_53r5: [SC-5, "SC-5(1)", SC-6, AU-12]
      mitre_attack:
        - technique: T1498
          sub_technique: null
          tactic: TA0040
          rationale: "Unbounded beacon registration is a network-DoS vector at the listener with secondary memory-pressure DoS at the server."
      cwe: [CWE-770, CWE-400]
    recommendation:
      posture: required
      summary: "Apply per-source-IP rate-limit on /beacon, cap agent_registry size, and emit a structured alert when the cap is approached."
      detail: |
        Add a token-bucket rate limiter at the /beacon handler
        keyed by source IP (default 60 beacons per minute per IP,
        operator-tunable). Cap agent_registry size (default 10k
        agents, operator-tunable). Emit an alert (to the
        structured audit emitter once it exists) when registry
        approaches 80% of cap. Reject new beacon registrations at
        cap and surface to the operator with a clear "registry
        full" error.
    related_concerns: [resilient, distributed, non_repudiation]

  - schema_version: 1
    id: avail-8d19a4b5
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: medium
    confidence: high
    title: "Builder plugin invokes go build with no concurrency cap or disk-usage bound"
    summary: "builder plugin runs go build on operator-supplied configuration; no cap on concurrent builds, no retention bound on compiled artifacts."
    detail: |
      The builder plugin compiles payloads on demand via go build.
      Tech plan §6 confirms the toolchain runs in-process. Threat
      model D-2 notes the operator can trigger many concurrent
      builds; nothing in the artifacts caps concurrency, bounds
      output artifact retention under data/payloads/, or enforces
      a CPU/disk budget. A bulk-build pattern (legitimate or
      adversarial) starves the orchestrator of CPU and exhausts
      disk.

      Medium per the security-tooling rubric clause "Command-
      execution queue depth unbounded" — bulk operation against a
      shared resource starves the orchestrator's other paths. The
      severity is bounded by the operator-needed-authentication
      barrier; an attacker with operator privilege could already
      destroy more than disk via plugin code, so the additional
      blast radius is moderate.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 'Shipped plugins'"
        excerpt: "compiles payloads on the server, meaning it ships and uses a Go toolchain in-process"
      - artifact: threat-model.md
        locator: "D-2"
        excerpt: "compile-on-demand exhausts CPU/disk"
    control_mappings:
      nist_800_53r5: [SC-6, SC-5, SI-13]
      mitre_attack: []
      cwe: [CWE-770]
    recommendation:
      posture: recommended
      summary: "Cap concurrent go builds, set a per-tenant build budget, garbage-collect built artifacts on a policy."
      detail: |
        Add a builder.max_concurrent_builds config (default 2) and
        queue subsequent requests. Add builder.artifact_retention
        (default 24 hours after last download) and a periodic
        sweeper. Surface build-queue depth on /health.
    related_concerns: [resilient, ephemeral]

  - schema_version: 1
    id: avail-5399f916
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: gap
    severity: high
    confidence: high
    title: "No DR / BCP posture — engagement state lives only on one server's filesystem"
    summary: "data/ tree is the source of truth; no documented off-host backup, replication, or recovery procedure with RTO/RPO targets."
    detail: |
      Tech plan §9 confirms file-system primary persistence; data/
      under the server directory is the source of truth. data/backup/
      exists for periodic state dumps but the runbook does not
      describe an off-host destination, encryption, or restoration
      procedure. There is no documented RTO, no documented RPO, no
      multi-region story, no automated failover. Mid-engagement loss
      of the server filesystem loses every operation state, every
      harvested fact in the knowledge store, every Link record.

      High per the security-tooling rubric clause "Single-region
      deployment for SaaS-delivered tooling" applied to the single-
      host pattern — Caldera does not promise multi-customer SaaS so
      the rubric clause is rated on the single-tenant operational
      analog: mid-engagement loss is a customer-deliverable failure
      and frequently a contractual obligation breach.
    evidence:
      - artifact: tech_plan.md
        locator: "§9 'Persistence'"
        excerpt: "data/ directory tree is the store ... no persistent transaction log"
      - artifact: runbook.md
        locator: "§6 (GAP marker)"
        excerpt: "GAP: backup integrity / off-host destination not documented"
    control_mappings:
      nist_800_53r5: [CP-9, "CP-9(1)", "CP-9(8)", CP-10, "CP-10(2)", CP-2, CP-7]
      mitre_attack: []
      cwe: [CWE-1188]
    recommendation:
      posture: required
      summary: "Define RTO/RPO targets, document a restore procedure, and require off-host backup with periodic restore drills."
      detail: |
        Specify RTO/RPO per data class (operations, agents, facts,
        results). Document an off-host backup destination with
        retention. Document a restore procedure end-to-end in the
        runbook. Schedule a quarterly restore drill (the
        non_repudiation finding's audit-of-audit applies — the drill
        should emit structured events).
    related_concerns: [distributed, resilient, immutability]
