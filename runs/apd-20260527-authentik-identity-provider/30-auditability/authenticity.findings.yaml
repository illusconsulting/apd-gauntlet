    title: "OIDC `pairwise` subject type support is not enumerated; default subject mode is hashed user ID (per happy-path §9 step 3)"
    summary: "Per `happy-path.md` §9 the OAuth Provider creation 'Subject mode' defaults to hashed user ID; whether OIDC `pairwise` per-issuer-per-audience pseudonymous subject is supported is not enumerated."
    detail: |
      Happy-path §9 step 3: "Subject mode (hashed user ID is the
      default)." The OIDC Core 1.0 specification §8.1 defines two
      subject types: `public` (same `sub` to every RP) and `pairwise`
      (per-issuer-per-audience pseudonymous `sub`). Pairwise reduces
      cross-RP user-correlation risk: if RP1 and RP2 both receive
      tokens for the same user, the `sub` values differ and the user
      cannot be correlated across RP1 and RP2 by `sub` alone. The
      authentik inputs document the hashed-user-ID default but do not
      enumerate whether pairwise is supported, how to configure it,
      or what the deployment trade-offs are.

      Disposition is blocked: the inputs are silent on pairwise
      support. Severity is medium per the identity-security data
      taxonomy: "flag findings on `public` subject type when
      re-identification risk is in scope." For deployments where the
      user population spans multiple RPs that should not be able to
      cross-correlate users (e.g., a public IdP serving multiple
      independent vendor RPs), pairwise is a privacy-relevant control.
    evidence:
      - artifact: happy-path.md
        locator: "§9 'Operator creates an OAuth Application + Provider pair', step 3"
        excerpt: "Subject mode (hashed user ID is the default)."
    prerequisite_evidence:
