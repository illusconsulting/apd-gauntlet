finding:
  - schema_version: 1
    id: auth-4793933a
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "MFA enforcement on the admin Flow / admin Groups is operator-action-required; default-authentication-flow does not require MFA for admins"
    summary: "Per `runbook.md` §10 hardening checklist and `agents.md`, MFA on admin Groups is in the hardening checklist; default install does not enforce it."
    detail: |
      Runbook §10 hardening checklist: "Configure MFA enforcement on
      the default-authentication-flow for admin Groups; consider a
      separate flow for non-admin users with relaxed MFA." `agents.md`
      reinforces: "Enforce MFA on the default-authentication-flow for
      admin Groups" is in the operator-expected list. The default
      shipped flow per `tech_plan.md` §4 is "Identification stage →
      (Password OR WebAuthn) → Authenticator validation → User Login"
      — `authenticator_validate` is in the flow but the configuration
      of WHEN it activates (which Groups, which Policy bindings) is
      operator-driven.

      Severity is critical per the identity-security severity rubric:
      this matches the Critical clause "MFA optional on administrative
      surfaces (IdP admin console, federation-trust editor,
      signing-key-rotation surface)" — but the inputs frame this as
      "operator can configure MFA" rather than "MFA is structurally
      required for admin." For an unhardened community install with
      the default flow, the admin surface accepts password-only,
      which is the AAL2-required-but-AAL1-achieved scenario.

      I am ranking this at high rather than critical because (a) the
      Authenticator Validation stage IS in the default flow and
      (b) the IncludeSec / Cobalt audit history did not flag admin
      MFA-default as an open issue. The realistic posture is that
      the platform provides the primitives but ships defaults that
      require operator-action to reach the AAL2-on-admin posture.
    evidence:
      - artifact: runbook.md
        locator: "§10 'Production hardening checklist', MFA bullet"
        excerpt: "Configure MFA enforcement on the default-authentication-flow for admin Groups; consider a separate flow for non-admin users with relaxed MFA."
      - artifact: agents.md
        locator: "§'The operator is expected to', MFA bullet"
        excerpt: "Enforce MFA on the default-authentication-flow for admin Groups."
      - artifact: tech_plan.md
        locator: "§4 'Interactive flow', default flow specification"
        excerpt: "Identification stage → (Password OR WebAuthn) → Authenticator validation → User Login"
    control_mappings:
      nist_800_53r5:
        - "IA-2"
        - "IA-2(1)"
        - "IA-2(2)"
        - "IA-2(6)"
        - "AC-6"
        - "AC-6(2)"
        - "AC-6(7)"
      mitre_attack:
        - technique: "T1078"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Admin surface accepting password-only when the default flow does not bind MFA for admin Groups produces the Valid Accounts pattern against the most privileged tier of the IdP."
        - technique: "T1556"
          sub_technique: null
          tactic: "TA0006"
          rationale: "An attacker with a password-only admin account can edit the default-authentication-flow to disable MFA for all users; the admin tier compromise is the hinge."
      cwe:
        - "CWE-308"
        - "CWE-307"
      owasp_top10:
        - "A07:2021"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Ship a default-shipped Policy binding on the default-authentication-flow that requires the Authenticator Validation stage for any user in an admin Group; operator can relax but not silently bypass."
      detail: |
        Add a platform-shipped Policy that asserts "if pending_user is
        in any Group with a Role granting admin-tier permissions, the
        authenticator_validate stage MUST execute and accept only
        AAL2-or-higher authenticators (WebAuthn, Duo, TOTP, NOT
        recovery-codes)." Bind this Policy to the default-authentication-flow
        as a hard requirement. Operators who wish to relax it
        (development environments, AAL1-only deployments) explicitly
        remove the binding, which is an audit-emitting consequential
        action.

        Pair with finding ephem-* on session-lifetime-per-AAL and
        with Availability finding avail-3a9189a2 on Reputation-policy
        default binding — these three ship as the "hardened default
        flow" pass.
      references:
        - "external: NIST SP 800-63B §4.4 (AAL2 minimum for administrative access)"
    related_concerns: [ephemeral, non_repudiation, integrity]
    cross_references: [intg-568208e5]

  - schema_version: 1
    id: auth-190b06f7
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "SMS-OTP and email-OTP fallback per Authenticator Validation stage; AAL3 surfaces have no platform-enforced 'no SMS/email fallback' policy"
    summary: "Per `tech_plan.md` §4 stage taxonomy, SMS-OTP, email-OTP, and TOTP are first-class authenticator options; no policy prevents SMS fallback on phishing-resistant flows."
    detail: |
      Tech plan §4 enumerates the authenticator stages:
      `authenticator_validate` supports TOTP, WebAuthn, Duo, static
      recovery codes, email-OTP, SMS-OTP (Twilio), and (Enterprise)
      endpoint device, GDTC. Per the identity-security common-patterns
      Authenticity guidance: "SMS or voice fallback permitted on
      phishing-resistant MFA enrollments. Severity: high (effective
      AAL downgrade; SMS interception via SIM-swap is a documented
      incident pattern that defeats the WebAuthn/FIDO2 target). NIST
      SP 800-63B §5.1.3 specifically deprecates SMS for new AAL3
      implementations."

      The authentik platform allows operators to compose flows that
      include both WebAuthn (AAL3-capable) and SMS-OTP (NOT AAL3)
      in the same authenticator-validate stage — and there is no
      platform-enforced rule preventing SMS from being accepted as a
      fallback on a flow whose AAL target is AAL3. The
      AuthnContextClassRef / `acr` claim populates from "which
      authenticators the user actually used" (INV-AUTH-006), so the
      RP can observe AAL2 vs AAL3 at the claim level — but the IdP
      itself does not refuse the SMS path.

      Severity is high per the identity-security severity rubric (the
      common-pattern High clause directly).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 stage taxonomy, authenticator_validate bullet"
        excerpt: "authenticator_validate — MFA validation; supports TOTP, WebAuthn (FIDO2 via fido2==2.2.0), Duo (duo-client==5.6.1), static recovery codes, email-OTP, SMS-OTP (Twilio), Duo, endpoint device (Enterprise), GDTC (Enterprise)."
      - artifact: invariants.md
        locator: "§INV-AUTH-006"
        excerpt: "MFA assurance is composed from authenticator types used"
    control_mappings:
      nist_800_53r5:
        - "IA-2"
        - "IA-2(1)"
        - "IA-2(8)"
        - "IA-5"
      mitre_attack:
        - technique: "T1621"
          sub_technique: null
          tactic: "TA0006"
          rationale: "SMS-OTP fallback on a flow whose AAL target is phishing-resistant degrades the effective AAL to SIM-swap-vulnerable, defeating the WebAuthn/FIDO2 anti-MFA-fatigue posture."
        - technique: "T1556"
          sub_technique: "T1556.006"
          tactic: "TA0006"
          rationale: "Authenticator-validation stage accepting SMS path when AAL3 was the operator intent matches the Modify Authentication Process - MFA Bypass technique."
      cwe:
        - "CWE-287"
      owasp_top10:
        - "A07:2021"
    recommendation:
      posture: required
      summary: "Add a per-Flow 'minimum acceptable AAL' setting on the authenticator_validate stage; default high-assurance flows to phishing-resistant-only; SMS/email-OTP allowed only as recovery-step-down with explicit operator opt-in."
      detail: |
        Per-Flow on `authenticator_validate`:

        - `minimum_aal: aal3` enforces only WebAuthn / FIDO2 /
          hardware-token; SMS/email-OTP rejected
        - `minimum_aal: aal2` accepts WebAuthn, TOTP, Duo, recovery
          codes; SMS/email-OTP rejected by default
        - `minimum_aal: aal1` accepts everything (current behavior)
        - Per-Flow `allow_sms_recovery: true` opt-in for the recovery
          path only, with audit Event on every SMS-OTP use marked
          as recovery rather than primary

        Document the AAL claim composition per NIST 800-63B AAL
        boundaries; warn loudly on Flow editing when an SMS path is
        bound to a Flow whose Provider would assert AAL3 to RPs.
      references:
        - "external: NIST SP 800-63B §4.4, §5.1.3 (AAL3 authenticator requirements; SMS deprecation)"
    related_concerns: [ephemeral, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: auth-04c4919b
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: gap
    severity: high
    confidence: high
    title: "OAuth client authentication mechanism options: `private_key_jwt` and `tls_client_auth` (mTLS) are not enumerated as first-class alternatives to client_secret"
    summary: "Per `happy-path.md` §9 operator workflow and `tech_plan.md` §6, OAuth Provider creation does not present `private_key_jwt` (RFC 7523) or mTLS (RFC 8705) client-auth options."
    detail: |
      The happy-path documents OAuth Provider creation as: "Client
      type (Confidential / Public). Redirect URI(s). Signing Key
      (CertificateKeyPair selection). Encryption Key (optional)." No
      client-authentication mechanism is presented as a choice — the
      platform defaults to `client_secret_basic` / `client_secret_post`
      (the implicit posture given no mechanism enumeration). For
      modern OAuth deployments, `private_key_jwt` and `tls_client_auth`
      eliminate the shared-secret class entirely.

      Severity is high per the identity-security severity rubric: this
      matches the High clause "OAuth client authentication is
      `client_secret_basic` or `client_secret_post` for confidential
      clients; private_key_jwt, client_secret_jwt, and
      tls_client_auth (mTLS) not offered as alternatives." The
      platform-not-offering-alternatives is the structural finding;
      Ephemeral finding ephem-07f6fad6 frames the rotation-cadence
      half from the credential-lifetime lens.
    evidence:
      - artifact: happy-path.md
        locator: "§9 'Operator creates an OAuth Application + Provider pair', step 3"
        excerpt: "Client type (Confidential / Public). Redirect URI(s). Signing Key (CertificateKeyPair selection). Encryption Key (optional)."
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, opening paragraph"
        excerpt: "OAuth 2.0 (RFC 6749) including authorization-code, implicit, hybrid, client-credentials, device-code grants, with optional PKCE (RFC 7636)."
    control_mappings:
      nist_800_53r5:
        - "IA-2"
        - "IA-5"
        - "IA-5(2)"
        - "SC-12"
        - "IA-3(1)"
      cwe:
        - "CWE-321"
        - "CWE-287"
      owasp_top10:
        - "A07:2021"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Add a `token_endpoint_auth_method` selector at OAuth Provider creation: `private_key_jwt` (default for new confidential clients), `tls_client_auth`, `client_secret_basic`, `client_secret_post`; document the per-method onboarding workflow."
      detail: |
        Standard OAuth client-auth dropdown:

        - `private_key_jwt`: RP registers its JWK Set URL or static
          public key; RP signs a JWT bearer assertion at /token. This
          is the modern default; eliminates the shared-secret leak
          class.
        - `tls_client_auth`: RP registers a client X.509 certificate;
          mTLS to /token authenticates the client. Suitable for B2B
          server-to-server clients.
        - `client_secret_basic` / `client_secret_post`: legacy shared
          secret; retained for compatibility; deprecation banner in UI.

        For public clients (SPAs, native mobile): require PKCE
        (RFC 7636) and disallow client_secret-based auth (per
        OAuth 2.1).

        This pairs with Ephemeral ephem-07f6fad6 — they ship together.
      references:
        - "external: RFC 7523, RFC 8705, RFC 9700 §4"
    related_concerns: [ephemeral, integrity]
    cross_references: [ephem-07f6fad6]

  - schema_version: 1
    id: auth-22bd304a
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: blocked
    severity: high
    confidence: medium
    title: "Outpost-to-Server WebSocket TLS requirement is not enumerated; without TLS the outpost service-account token traverses plaintext"
    summary: "Per `invariants.md` INV-OPS-005 GAP and threat-model S-6, the WebSocket TLS requirement is unspecified; the service-account token is the outpost's authentication assertion to the Server."
    detail: |
      This is the Authenticity lens on the same architectural fact
      that Confidentiality conf-e08662e7 surfaced. The Confidentiality
      lens is about secret-data-in-transit; the Authenticity lens is
      about the identity-assertion-in-transit: the outpost
      service-account token IS the outpost's authentication credential
      to the Server, and if the channel is plaintext, the credential is
      passively recoverable. A passive observer who recovers the token
      can then impersonate the outpost at any time (S-6).

      Disposition is blocked because the inputs do not enumerate the
      TLS requirement; severity is high per the rubric (matches
      "Service-to-service authentication inside the IdP cluster uses
      shared bearer tokens, not mTLS or workload identity").
    evidence:
      - artifact: invariants.md
        locator: "§INV-OPS-005, Reviewer note"
        excerpt: "GAP — architecture.md describes the WebSocket transport without enumerating whether TLS is mandatory vs. operator-configured."
      - artifact: threat-model.md
        locator: "§S-6 'Outpost-to-Server WebSocket impersonation', Attack scenario paragraph"
        excerpt: "A second-class attacker on the outpost network steals the outpost's service-account token (from outpost container env, from a logging sink, from a misconfigured outpost image)"
    prerequisite_evidence:
      - "Explicit assertion that /ws/outpost/ requires TLS"
      - "Outpost-side identity binding option: mTLS client cert rather than (or in addition to) bearer token"
    control_mappings:
      nist_800_53r5:
        - "IA-3"
        - "IA-3(1)"
        - "IA-9"
        - "SC-8(1)"
        - "SC-23"
      cwe:
        - "CWE-319"
        - "CWE-294"
    recommendation:
      posture: required
      summary: "Make WebSocket TLS required-by-default at the /ws/outpost/ endpoint; offer mTLS workload-identity as an upgrade option for outposts that hold a per-outpost X.509 client certificate."
      detail: |
        See Confidentiality finding conf-e08662e7 §recommendation. The
        Authenticity-specific extension:

        - Offer an optional mTLS workload-identity mode where the
          outpost holds an X.509 client certificate issued by an
          operator-controlled internal CA; the Server validates the
          cert at WebSocket handshake. This eliminates the bearer-token
          replay surface (the token, if recovered, is useless without
          the X.509 private key).
        - For deployments using SPIFFE/SPIRE or cloud-native workload
          identity (GKE Workload Identity, EKS IRSA), document the
          binding between workload identity and the outpost's auth
          credential.

        Pair with conf-e08662e7 — same architectural change, two lens
        framings.
      references:
        - "external: SPIFFE workload identity specification"
        - "internal: conf-e08662e7 (the paired Confidentiality finding)"
    related_concerns: [confidentiality, ephemeral]
    cross_references: [conf-e08662e7]

  - schema_version: 1
    id: auth-c80d79e6
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: risk
    severity: high
    confidence: high
    title: "Federation-trust onboarding for SAML SPs and OAuth confidential clients has no domain-control-validation or contact-attestation requirement"
    summary: "Per `tech_plan.md` §6 SAML, the SP metadata + verification cert is per-Provider operator-configured; no platform-enforced workflow for federation-trust establishment."
    detail: |
      The identity-security common-patterns Authenticity guidance:
      "Federation trust is established without contact attestation,
      domain-control validation on the redirect_uri host, or human
      approval workflow — the SP self-asserts its identity at
      registration. Severity: high (malicious-RP onboarding surface;
      the registered SP can request scopes from any user lured to
      /authorize)." For authentik this lands at OAuth Provider
      creation (`happy-path.md` §9) and SAML Provider creation: the
      operator configures redirect URIs, signing keys, scopes — but
      no platform mechanism validates that the redirect_uri host is
      actually controlled by the entity claiming to operate the RP, no
      contact attestation, no approval workflow.

      For an operator-driven deployment where each Provider is created
      by a trusted operator, this is acceptable risk. For deployments
      with self-service Provider creation (a B2B identity-as-a-service
      pattern), the absence of these controls is a malicious-RP
      onboarding surface.

      Severity is high per the rubric (the common-pattern High clause
      directly).
    evidence:
      - artifact: happy-path.md
        locator: "§9 'Operator creates an OAuth Application + Provider pair', step 4"
        excerpt: "Saves. The Application appears in the user-UI launcher; the OAuth endpoints are immediately functional."
      - artifact: tech_plan.md
        locator: "§3 boundary 2"
        excerpt: "Federated relying party → Server (OAuth / OIDC / SAML). TLS to /application/o/... (OAuth) or /application/saml/... (SAML)."
    control_mappings:
      nist_800_53r5:
        - "IA-3(1)"
        - "AC-2"
        - "AC-2(4)"
        - "SR-3"
      mitre_attack:
        - technique: "T1199"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Federation-trust onboarding without domain-control validation or human approval enables a malicious party to register a Provider with attacker-controlled redirect_uri (Trusted Relationship)."
      cwe:
        - "CWE-1284"
        - "CWE-345"
      owasp_top10:
        - "A07:2021"
    recommendation:
      posture: recommended
      summary: "Add a per-Provider 'trust establishment workflow' that requires (a) domain-control validation on redirect_uri hosts (HTTP-01 / DNS-01 style), (b) operator approval workflow with documented audit, (c) periodic re-attestation."
      detail: |
        Add a Provider lifecycle state:

        - `pending_trust_establishment` (initial state): redirect_uri
          hosts undergo automated domain-control validation; operator
          contact for the Provider is captured; an approval signature
          is collected
        - `active` (post-validation): Provider serves requests; the
          trust-establishment evidence is retained for the lifetime
          of the Provider
        - `pending_re_attestation` (after N months): the operator
          re-validates domain control and re-attests contact; trust
          establishment evidence is appended

        This is recommended-not-required because for many deployments
        (closed-enterprise, single-operator-controls-all-Providers)
        the absence is acceptable; for deployments accepting
        third-party Providers it is critical. The recommendation is a
        feature, not a default behavior change.
      references:
        - "external: NIST SP 800-63C §5 (Federation establishment discipline)"
    related_concerns: [non_repudiation, immutability]
    cross_references: []

  - schema_version: 1
    id: auth-f667a1e6
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: risk
    severity: high
    confidence: high
    title: "RAC `Ignore Server certificate` per-Endpoint setting silently bypasses RDP TLS verification for that endpoint"
    summary: "Per `tech_plan.md` §10 and threat-model S-11, the RAC endpoint property mapping can set 'Ignore Server certificate' which suppresses TLS verification of the RDP target."
    detail: |
      `architecture-index.md` rac-outpost: "'Ignore Server certificate'
      is a per-endpoint setting that suppresses RDP TLS verification —
      a hardening misstep if set." Threat-model S-11: "With it
      enabled, the RAC outpost does not verify the RDP server's TLS
      certificate, enabling on-path attackers to MITM the user-to-
      remote-machine session ... MITM on remote desktop session;
      capture of remote-machine credentials and session content."
      ADR-0003 §Negative item 5: "A hardening misstep at the
      property-mapping layer disables RDP authentication of the remote
      server entirely."

      The Authenticity lens: this is identity-binding-discarded on the
      RDP server side — the RAC outpost holds (via property mapping)
      the remote-machine credential, opens a session, but does not
      verify the remote machine is the intended target. A MITM
      attacker presents an attacker-controlled RDP target, the RAC
      outpost authenticates, and the user's session is mediated by
      the attacker.

      Severity is high per the identity-security severity rubric:
      this matches the High clause "SAML IdP allows unsigned
      AuthnRequest or unsigned SP metadata; the trust relies on TLS
      only" — by analogy, the RDP target authentication is similarly
      reduced to operator-asserted hostname trust. Threat-model S-11
      flags the residual: "Is there a dashboard alert for Endpoints
      with 'Ignore Server certificate' enabled? Unclear."
    evidence:
      - artifact: architecture-index.md
        locator: "`rac-outpost` component, Trust boundary line"
        excerpt: "'Ignore Server certificate' is a per-endpoint setting that suppresses RDP TLS verification — a hardening misstep if set."
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Consequences > Negative / trade-offs, item 5"
        excerpt: "'Ignore Server certificate' on RAC endpoints suppresses TLS verification of the RDP target ... A hardening misstep at the property-mapping layer disables RDP authentication of"
    control_mappings:
      nist_800_53r5:
        - "IA-3"
        - "IA-3(1)"
        - "SC-23"
        - "SI-7"
      mitre_attack:
        - technique: "T1557"
          sub_technique: null
          tactic: "TA0006"
          rationale: "Disabled RDP server-cert verification opens the RAC-outpost-to-remote-machine path to AitM, enabling capture of remote-machine credentials and session content."
      cwe:
        - "CWE-295"
        - "CWE-296"
      owasp_top10:
        - "A02:2021"
    recommendation:
      posture: required
      summary: "Default 'Ignore Server certificate' to false on new RAC Endpoints; surface a dashboard tile listing endpoints with the setting enabled; emit an audit Event when the setting changes from false to true."
      detail: |
        Three changes:

        - Default the Endpoint setting to `verify_server_cert: true`
          (it should already default this way; the residual concern is
          drift from default to operator-modified)
        - Add a `Dashboards > Outpost Hardening` view that lists every
          RAC Endpoint with `verify_server_cert: false` so operators
          can audit
        - Emit a high-severity audit Event when the setting transitions
          from true to false, with the operator and the Endpoint
          captured

        Pair with the Non-Repudiation finding on RAC property-mapping
        change auditability.
      references:
        - "external: RFC 9466 (RDP security considerations)"
    related_concerns: [non_repudiation, integrity]
    cross_references: []

  - schema_version: 1
    id: auth-3bd1768d
    agent: authenticity
    apd_tier: auditability
    apd_goal: authenticity
    disposition: risk
    severity: high
    confidence: high
    title: "Service-to-service auth inside the IdP cluster (Server↔Worker, Server↔PostgreSQL) uses Django session / bearer tokens not workload identity"
    summary: "Per ADR-0002 and `tech_plan.md` §3 boundary 8, the Server and Worker authenticate to PostgreSQL via static credentials; no SPIFFE / workload-identity / mTLS layer is described."
    detail: |
      Tech plan §3 boundary 8: "All processes → PostgreSQL. TCP (TLS
      if configured per the PostgreSQL configuration reference).
      Schema-per-tenant under `django-tenants`." The architecture
      index for `postgresql` extends: "Inbound: Server, Worker."
      Authentication is by the PostgreSQL user credentials provided
      via `.env` (`PG_PASS=$(openssl rand -base64 36)` per the
      docker-compose install doc) — a static long-lived shared
      credential. The Server-to-Worker boundary uses
      `django-dramatiq-postgres` queueing inside the same database,
      so there is no separate IdP-internal service-to-service
      authentication to consider — but the Server / Worker → Postgres
      static credential is the static-shared-secret class.

      The identity-security common-patterns Authenticity guidance:
      "Service-to-service authentication inside the IdP cluster uses
      shared bearer tokens, not mTLS or workload identity. Severity:
      high (lateral-movement amplification; no identity binding on
      the credential; IdP-tier compromise is the gate to credential-
      store compromise)."

      Severity is high per the rubric (common-pattern High clause).
      Cross-references the Confidentiality finding on Postgres TLS
      (conf-6dd9d98a) and the Ephemeral finding on static service-
      account credentials inside the IdP (the PG_PASS is the
      cleanest example).
    evidence:
      - artifact: tech_plan.md
        locator: "§3 boundary 8"
        excerpt: "All processes → PostgreSQL. TCP (TLS if configured per the PostgreSQL configuration reference)."
      - artifact: runbook.md
        locator: "§1 'Bring the stack up', Docker Compose section"
        excerpt: "echo \"PG_PASS=$(openssl rand -base64 36 | tr -d '\\n')\" >> .env"
    control_mappings:
      nist_800_53r5:
        - "IA-3"
        - "IA-9"
        - "SC-8(1)"
        - "IA-5"
        - "IA-5(1)"
      cwe:
        - "CWE-798"
        - "CWE-307"
      owasp_top10:
        - "A07:2021"
    recommendation:
      posture: recommended
      summary: "Document SPIFFE / workload-identity / cloud-native-workload-identity binding patterns for the Server-Worker → Postgres authentication; ship Kubernetes Helm values for cloud-native workload identity (IRSA, GKE Workload Identity)."
      detail: |
        For Kubernetes deployments using the published Helm chart,
        ship optional values for:

        - AWS EKS with IRSA: the Server / Worker Service Account is
          annotated with the IAM role; Postgres IAM auth provides
          short-lived credentials
        - GKE with Workload Identity: same pattern with GCP IAM
        - Azure AKS with Workload Identity: same pattern with
          Microsoft Entra ID
        - On-prem / self-hosted: SPIFFE/SPIRE with a per-pod SVID;
          Postgres mTLS authentication using the SVID

        For deployments that retain static PG_PASS, document the
        rotation cadence and the mechanism (Kubernetes Secret
