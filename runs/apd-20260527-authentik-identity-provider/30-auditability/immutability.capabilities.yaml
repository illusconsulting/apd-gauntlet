capability:
  - schema_version: 1
    id: immut-cap-14525881
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    title: "Blueprint-driven declarative configuration apply with filesystem `/blueprints/` and `/api/v3/managed/blueprints*` endpoints"
    description: |
      Per `tech_plan.md` §8 Blueprint and `runbook.md` §10 hardening
      checklist, the platform provides Blueprints as a declarative
      configuration-apply unit that can create any object type
      (Flows, Stages, Policies, Providers, Sources, RBAC). When
      operators force changes through filesystem blueprints (the
      hardening posture) and version the blueprints in a config
      repository, this provides a GitOps-style configuration-as-code
      story with version history for the IdP configuration surface.
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level. Not addressed:
      out-of-the-box drift detection between blueprint-declared state
      and admin-UI-modified state (Immutability finding immut-df287568);
      signed-commit discipline on the blueprint repository is
      operator-driven; blueprints can read arbitrary filesystem paths
      (per SECURITY.md — intentional, see threat-model T-2).
    evidence:
      - artifact: tech_plan.md
        locator: "§8 'Data model', Blueprint entry"
        excerpt: "Blueprint — declarative configuration apply unit; can create any object type. Per SECURITY.md blueprints \"can access all files on the filesystem\" by design."
      - artifact: runbook.md
        locator: "§10 'Production hardening checklist', API blocklist bullet"
        excerpt: "Force changes through filesystem blueprints in /blueprints/."
    control_mappings:
      nist_800_53r5:
        - "CM-2"
        - "CM-2(2)"
        - "CM-3"
        - "CM-3(1)"
        - "CM-6"
    caveats:
      - "Drift detection between blueprint and live state is not shipped (immut-df287568)."
      - "Blueprints can read arbitrary filesystem paths (intentional per SECURITY.md; threat-model T-2)."
      - "Signed-commit discipline on the blueprint repo is operator-driven."
    related_concerns: [non_repudiation, integrity]

  - schema_version: 1
    id: immut-cap-d25dafcc
    agent: immutability
    apd_tier: auditability
    apd_goal: immutability
    title: "Per-Provider signing-key rotation supported via CertificateKeyPair model with declarative blueprint-driven rotation"
    description: |
      Per ADR-0004 §Positive paragraph 4 and `runbook.md` §6, per-
      Provider signing-key rotation is supported manually via the
      Admin UI and declaratively via blueprints. The CertificateKeyPair
      model provides the unified rotation surface. Each Provider's
      signing key can be rotated independently without affecting
      other Providers (INV-AUTH-002).
    maturity: designed
    scope: |
      Confirmed for the platform-mechanism level (manual + blueprint).
      Not addressed: rotation history retention beyond current and
      previous kid is not enumerated (Immutability finding
      immut-1dc13874); no enforced rotation cadence (Ephemeral
      finding ephem-0fb143ce); no shipped expiry-warning Notification
      Rule (runbook §6 GAP). This capability shares scope with
      Ephemeral cap ephem-cap-efe92498.
    evidence:
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Positive, paragraph 4"
        excerpt: "Blueprints can express certificate-rotation declaratively"
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(2)"
        - "CM-3"
        - "AU-11"
    caveats:
      - "Rotation history retention not enumerated (immut-1dc13874)."
      - "No enforced rotation cadence (ephem-0fb143ce)."
      - "Per-Provider isolation breached on master-key (AUTHENTIK_SECRET_KEY) compromise (conf-477ff8a1)."
    related_concerns: [ephemeral, authenticity]
