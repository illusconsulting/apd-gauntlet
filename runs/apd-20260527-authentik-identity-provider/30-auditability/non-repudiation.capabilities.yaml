capability:
  - schema_version: 1
    id: nonrep-cap-9d3d9d4c
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    title: "Every Flow execution emits at least one audit Event (INV-AUTH-001) via the Flow executor's event emitter"
    description: |
      Per `invariants.md` INV-AUTH-001 and `sys-mgmt/events/index.md`:
      "Every event is logged, whether it is initiated by a user or
      by authentik." The Flow executor materialises an Event per
      Flow execution (and per Stage execution and per Policy
      evaluation per ADR-0001 §Invariants). This is the platform's
      baseline auditability story for the Flow + Stage + Policy
      pipeline.
    maturity: designed
    scope: |
      Confirmed for Flow-mediated actions. Not addressed:
      Expression-policy side-effecting helpers (Non-Repudiation
      finding nonrep-6ff98de3) — `ak_send_email`, `ak_create_jwt`,
      `ak_call_policy` do not auto-emit; cached LDAP outpost bind
      events (nonrep-fd5e012c) are emitted only on cache-miss; the
      per-token audit anchor (nonrep-c772c9f2) is not enumerated as
      captured.
    evidence:
      - artifact: invariants.md
        locator: "§INV-AUTH-001, Asserted-in line"
        excerpt: "sys-mgmt/events/index.md (Every event is logged, whether it is initiated by a user or by authentik.)"
    control_mappings:
      nist_800_53r5:
        - "AU-2"
        - "AU-3"
        - "AU-12"
        - "AU-12(1)"
    caveats:
      - "Expression-policy side-effecting helpers do not auto-emit (nonrep-6ff98de3)."
      - "Cached LDAP outpost binds audited per-cache-miss only (nonrep-fd5e012c)."
      - "Per-token audit anchor not enumerated (nonrep-c772c9f2)."
    related_concerns: [integrity, immutability]

  - schema_version: 1
    id: nonrep-cap-f303cd8d
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    title: "Notification Rules bound to Event Matcher policies enable per-Event-class alerting and Account Lockdown stream forwarding"
    description: |
      Per `tech_plan.md` §8 and `happy-path.md` §11, the platform
      provides NotificationRule + NotificationTransport models that
      let operators bind Event Matcher policies to alert on specific
      Event classes (e.g., Account Lockdown events, signing-key
      rotations, federation-trust modifications, blueprint applies).
      This is the platform's operator-driven alerting story for
      identity-relevant events.
    maturity: designed
    scope: |
      Confirmed for the platform-mechanism level. Not addressed:
      shipped default Notification Rules for high-impact event
      classes (none ship by default; operator-action-required); the
      alert-delivery mechanism is operator-configured per Transport.
    evidence:
      - artifact: tech_plan.md
        locator: "§8 'Data model', Notification entry"
        excerpt: "Notification, NotificationRule, NotificationTransport — delivery of Event-triggered alerts."
      - artifact: happy-path.md
        locator: "§11 'Operator audits Events', step 4"
        excerpt: "Optionally configures Notification Rules bound to Event Matcher policies (e.g., 'alert on user_write where context.action_id = account_lockdown')"
    control_mappings:
      nist_800_53r5:
        - "AU-6"
        - "AU-6(1)"
        - "IR-4"
        - "IR-5"
    caveats:
      - "No default Notification Rules shipped (operator-action-required)."
      - "Pairs with Authenticity finding auth-4793933a and Ephemeral finding ephem-0fb143ce — the recommended shipped Notification Rules would land here."
    related_concerns: [resilient, availability]

  - schema_version: 1
    id: nonrep-cap-d9e5c53d
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    title: "Event audit retention default 365 days; configurable in System > Settings"
    description: |
      Per `sys-mgmt/events/index.md` and `invariants.md` INV-OPS-002,
      the platform's in-platform Event retention default is 365 days,
      configurable in System > Settings. For operators forwarding to
      a SIEM (recommended posture), the in-platform retention can be
      reduced to a short window and the SIEM becomes the
      long-retention source-of-truth.
    maturity: designed
    scope: |
      Confirmed for the in-platform retention mechanism. Not addressed:
      mutability of the Postgres-resident Event records during the
      retention window (Immutability finding); operator-driven log
      forwarding (Non-Repudiation finding nonrep-c3d8f98d);
      consent / federation / token-lifecycle retention not
      separately enumerated per the identity-security
      immutability-classes catalog.
    evidence:
      - artifact: runbook.md
        locator: "§4 'Audit log inspection and forwarding', Default retention bullet"
        excerpt: "Default retention: 365 days (configurable in System > Settings)."
      - artifact: invariants.md
        locator: "§INV-OPS-002"
        excerpt: "Event audit trail retention default is 365 days"
    control_mappings:
      nist_800_53r5:
        - "AU-11"
        - "AU-11(1)"
    caveats:
      - "Postgres-resident Event records are mutable (Immutability finding)."
      - "Log forwarding is operator-driven; without it the audit substrate is the same Postgres as the data plane (nonrep-c3d8f98d)."
      - "Per-Event-class retention discipline (consent, federation, token lifecycle) not separately enumerated."
    related_concerns: [immutability, availability]
