finding:
  - schema_version: 1
    id: nonrep-6ff98de3
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "Expression-policy side-effecting helpers (`ak_send_email`, `ak_create_jwt`, `ak_call_policy`) do not auto-emit audit Events; `ak_create_event` is opt-in"
    summary: "Per ADR-0001 and threat-model R-1, the helper functions perform consequential actions but audit-emission is the policy author's responsibility."
    detail: |
      ADR-0001 §Negative item 4: "`ak_create_event` is opt-in.
      Side-effecting helpers (`ak_send_email`, `ak_create_jwt`,
      `ak_call_policy`) do not auto-emit audit events; expression
      authors choose whether to call `ak_create_event` explicitly.
      Audit-completeness becomes a code-review property of every
      expression." Threat-model R-1 confirms: "A malicious Expression
      policy or property mapping makes a side-effect call (an
      outbound HTTP request, a database UPDATE via a helper, an
      `ak_send_email`) without emitting a corresponding Event. The
      audit trail is incomplete with respect to what the expression
      actually did." INV-AUTH-001 echoes: "Holds for Flow-mediated
      actions. Per threat-model R-1, side-effecting Expression-policy
      helpers (`ak_send_email`, `ak_create_jwt`) do not auto-emit;
      the `ak_create_event` helper exists but is opt-in."

      Severity is high per the identity-security severity rubric:
      this matches the High clause "Audit completeness on the IdP's
      consequential-action surface unverified — the consequential-
      actions list contains 50+ event classes; the artifacts confirm
      logging for only a subset." The Expression-policy helper
      surface is precisely where post-incident forensic
      reconstruction breaks: an attacker with Expression-edit
      privilege (per ADR-0001 the documented architectural trust
      boundary) can emit emails, create JWTs, call out to arbitrary
      HTTP destinations, and chain policy invocations — none of
      which produces an audit anchor by default.

      Cross-references the Authenticity finding on per-Provider OAuth
      signing (token-issuance audit) and the Immutability finding on
      Event-log mutability (audit-trail-altered-after-the-fact).
    evidence:
      - artifact: adrs/0001-flows-stages-policies-pipeline.md
        locator: "§Consequences > Negative / trade-offs, item 4"
        excerpt: "ak_create_event is opt-in. Side-effecting helpers (ak_send_email, ak_create_jwt, ak_call_policy) do not auto-emit audit events; expression authors choose whether to call ak_create_event explicitly."
      - artifact: threat-model.md
        locator: "§R-1 'Audit-log completeness for Expression-policy actions', Existing mitigation paragraph"
        excerpt: "Per expressions/reference/_functions.mdx, the ak_create_event helper exists, but its use is not mandatory."
      - artifact: invariants.md
        locator: "§INV-AUTH-001, Reviewer note"
        excerpt: "Holds for Flow-mediated actions. Per threat-model R-1, side-effecting Expression-policy helpers (ak_send_email, ak_create_jwt) do not auto-emit; the ak_create_event helper exists but is opt-in."
    control_mappings:
      nist_800_53r5:
        - "AU-2"
        - "AU-3"
        - "AU-3(1)"
        - "AU-12"
        - "AU-12(1)"
        - "AU-10"
      mitre_attack:
        - technique: "T1070"
          sub_technique: null
          tactic: "TA0005"
          rationale: "A malicious Expression policy can call ak_send_email or ak_create_jwt without emitting a corresponding Event; the action exists, the audit anchor does not, achieving Indicator Removal at the audit-completeness layer."
      cwe:
        - "CWE-778"
        - "CWE-223"
      owasp_top10:
        - "A09:2021"
    recommendation:
      posture: required
      summary: "Make side-effecting Expression helpers auto-emit audit Events with the calling policy, the calling Flow, the actor, and the action context; allow operators to opt-out per-policy only via an explicit `audit_emission_disabled: true` flag captured in audit."
      detail: |
        Modify the Expression helper library so that
        `ak_send_email`, `ak_create_jwt`, `ak_call_policy`, and any
        other helper that performs an effect outside the local
        in-memory policy evaluation context automatically emits an
        Event with:

        - The calling policy's identifier
        - The calling Flow's identifier
        - The actor (pending_user or admin operator)
        - The action specifics (recipient for email, token-claim set
          for JWT, target policy for ak_call_policy)
        - The request context (IP, user agent, AAL/FAL if known)

        Operators who legitimately want to disable per-helper audit
        for performance (e.g., a high-volume notification flow) set
        `audit_emission_disabled: true` per policy — itself an audit
        event so the operator decision is durably recorded.

        This converts the Expression-policy auditability from "policy
        author must remember" to "platform-guaranteed unless
        explicitly disabled," which materially closes the post-
        incident-reconstruction gap.
      references:
        - "external: NIST SP 800-92 §3.5 (Audit completeness for consequential actions)"
        - "internal: expressions/reference/_functions.mdx (the helper reference)"
    related_concerns: [integrity, immutability, authenticity]
    cross_references: []

  - schema_version: 1
    id: nonrep-c3d8f98d
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: risk
    severity: high
    confidence: high
    title: "Audit pipeline is operator-driven via container stdout aggregation; absent log forwarding, the source-of-truth is the mutable Postgres-resident Event log"
    summary: "Per `sys-mgmt/events/index.md` and `runbook.md` §4, audit forwarding is operator-configured; the default install has no SIEM integration; without it the Postgres Event rows are the sole audit substrate."
    detail: |
      Runbook §4: "Default retention: 365 days (configurable in
      System > Settings). Forwarding posture: container stdout. The
      doc recommends 'If you want to forward these events to another
      application, forward the log output of all authentik
      containers.' Every event creation is logged with the log level
      info' and combining this with a shortened internal retention
      (`days=1`)." Threat-model R-2: "Out-of-the-box, what fraction
      of operators configure log forwarding? The shipped
      configuration does not enable it. Without forwarding, the
      database-resident Event log is mutable and there is no tamper-
      evidence." INV-OPS-002 echoes: "Holds for in-platform retention.
      Log forwarding is operator-driven; absent forwarding, the
      Postgres-resident Event records are mutable by anyone with
      database write (or per threat-model T-1, Expression engine RCE)."

      The Non-Repudiation lens: the audit pipeline has a documented
      SPOF (the same Postgres that holds the rest of the platform's
      state, per ADR-0002) and no shipped log-forwarding integration.
      For an unhardened community install without operator-configured
      log forwarding, an attacker with Expression-policy RCE (per
      ADR-0001) walks straight to the audit substrate and can edit /
      delete Event rows.

      Severity is high per the identity-security severity rubric:
      this matches the High clause "Audit pipeline single-point-of-
      failure — single broker, single sink, no buffer between
      application and broker; broker outage produces silent audit
      loss." The substrate here is Postgres rather than Kafka, but the
      pattern is identical and the consequence is worse (the audit
      substrate is in the same data plane as the system being
      audited).
    evidence:
      - artifact: runbook.md
        locator: "§4 'Audit log inspection and forwarding', Forwarding posture paragraph"
        excerpt: "Forwarding posture: container stdout. The doc recommends 'If you want to forward these events to another application, forward the log output of all authentik containers.'"
      - artifact: threat-model.md
        locator: "§R-2 'Audit-log immutability and tamper-evidence', Residual question line"
        excerpt: "Out-of-the-box, what fraction of operators configure log forwarding? The shipped configuration does not enable it. Without forwarding, the database-resident Event log is mutable and there"
      - artifact: invariants.md
        locator: "§INV-OPS-002, Reviewer note"
        excerpt: "Holds for in-platform retention. Log forwarding is operator-driven; absent forwarding, the Postgres-resident Event records are mutable by anyone with database write"
    control_mappings:
      nist_800_53r5:
        - "AU-4"
        - "AU-5"
        - "AU-5(1)"
        - "AU-5(2)"
        - "AU-9"
        - "AU-9(2)"
        - "CP-9(1)"
      mitre_attack:
        - technique: "T1070"
          sub_technique: null
          tactic: "TA0005"
          rationale: "Audit-substrate co-residency with the data plane means an attacker with database-write access (from Expression-policy RCE or DB compromise) achieves Indicator Removal on the Event rows."
      cwe:
        - "CWE-778"
        - "CWE-117"
      owasp_top10:
        - "A09:2021"
    recommendation:
      posture: required
      summary: "Ship a default log-forwarding integration for common SIEMs (Fluent Bit / Vector / Filebeat sidecar configurations); document the SIEM-side parser for authentik Event JSON; recommend a short internal retention when SIEM is the source-of-truth."
      detail: |
        Three changes:

        1. **Default log-forwarding deployment artifacts** — ship in
           `examples/log-forwarding/` Fluent Bit configurations for
           common SIEM targets (Elastic, Splunk, Loki, Datadog,
           OpenSearch). Operators copy-paste-tune.
        2. **Canonical SIEM-side parser** — author the Event JSON
           schema and ship grok / parser-rule examples per SIEM. This
           closes runbook §4 GAP.
        3. **Audit-pipeline buffer** — when log forwarding is
           configured, buffer Events to a local file on the Server /
           Worker so a SIEM outage does not cause silent loss; reconcile
           the buffer to the SIEM on recovery. Surface metrics on
           buffer depth.

        Pair with the Immutability findings on Event-log immutability
        and the Confidentiality finding on log-aggregation-tier
        sensitivity (audit content carries credentials' worth of
        metadata per the identity-security data taxonomy).
      references:
        - "external: NIST SP 800-92 §4 (Audit log management infrastructure)"
        - "internal: runbook.md §4 (the GAP this resolves)"
    related_concerns: [immutability, confidentiality, availability]
    cross_references: []

  - schema_version: 1
    id: nonrep-c772c9f2
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "Per-token audit anchor (linking issuance, refresh, revocation, use via JWT `jti` or opaque token ID) is not enumerated"
    summary: "Per the identity-security common-patterns Non-Repudiation guidance and threat-model R-1 / R-2, per-token audit linking is the foundation for token-loss investigation; the authentik inputs do not enumerate the per-token audit anchor."
    detail: |
      The identity-security common-patterns Non-Repudiation guidance:
      "Token issuance audit lacks the token identifier (jti, opaque
      token ID) — log says 'user X received a token' but does not
      link the token back to a later use. Severity: high (forensic
      reconstruction of 'which token did the attacker use, when did
      we issue it, and which other tokens were issued in the same
      session' is impossible without per-token identifiers)."

      The authentik inputs document Event types (`tech_plan.md` §8
      Event model: "Action, app, context (JSON), user, client_ip")
      but do not enumerate the per-token audit fields. For
      forensic-reconstruction purposes — given a leaked access token,
      identifying when it was issued, by what Flow execution, with
      what refresh-token family, against which RP, and which other
      tokens are derivative — the platform should capture the JWT
      `jti` for JWT tokens and an opaque identifier for opaque
      tokens, and audit the issuance / refresh / revocation /
      introspection events linked through those identifiers.

      Severity is high per the rubric — common-pattern High clause
      directly. Cross-references Resilient finding resil-0e6a988b
      (refresh-token rotation chain auditability) and Ephemeral
      finding (rotation cadence) — the same architectural change
      enables both rotation discipline and per-token audit.
    evidence:
      - artifact: tech_plan.md
        locator: "§8 'Data model', Event entry"
        excerpt: "Event — append-only audit record. Action, app, context (JSON), user, client_ip."
      - artifact: threat-model.md
        locator: "§R-1 'Audit-log completeness for Expression-policy actions', Impact line"
        excerpt: "Auditability gap: post-incident reconstruction misses expression-driven side effects."
    prerequisite_evidence:
      - "Per-token audit anchor specification — what identifier (jti for JWT, opaque ID for opaque tokens) is captured per issuance event"
      - "Per-refresh-token-family audit linking — chain identifier for rotation tracking"
      - "Token revocation event linkage to the original issuance"
    control_mappings:
      nist_800_53r5:
        - "AU-3"
        - "AU-3(1)"
        - "AU-10"
        - "AU-12"
        - "AU-12(1)"
        - "IA-5"
      mitre_attack:
        - technique: "T1528"
          sub_technique: null
          tactic: "TA0006"
          rationale: "Investigation of T1528 (Steal Application Access Token) requires per-token forensic anchor; absent the jti / opaque-ID capture, lateral movement via stolen token cannot be reconstructed."
      cwe:
        - "CWE-223"
        - "CWE-778"
      owasp_top10:
        - "A09:2021"
      owasp_api_top10:
        - "API9:2023"
    recommendation:
      posture: required
      summary: "Ensure every token issuance Event captures the token identifier (JWT `jti` or opaque token-ID); link refresh-token rotation chains via a family-ID; link revocation and introspection events to the issuance event by identifier."
      detail: |
        Audit field additions (per the identity-security data
        taxonomy):

        - Per-Issuance Event: `token_id` (jti for JWT, opaque ID for
          opaque), `token_type` (access / refresh / id_token / saml_assertion),
          `client_id` (for OAuth), `audience`, `scope` (granted set),
          `aal_claim`, `fal_claim`, `expires_at`, `refresh_token_family_id`
          (if refresh)
        - Per-Refresh Event: `inbound_token_id`, `outbound_token_id`,
          `refresh_token_family_id`, all of the above for the new
          access token
        - Per-Revocation Event: `revoked_token_id`,
          `revocation_reason` (user-initiated, admin-initiated,
          credential-change, reuse-detected, expiry)
        - Per-Introspection Event: `introspected_token_id`,
          `introspecting_client_id`

        This converts token-lifecycle audit from "user received a
        token" to "user X received token jti=abc at time T against
        RP=Y, refreshed to jti=def at time T+1, revoked at time T+5"
        — the foundational per-token audit anchor.
      references:
        - "external: RFC 7519 §4.1.7 (JWT jti claim)"
        - "external: RFC 7662 (Token introspection — the introspection event itself should be auditable)"
    related_concerns: [authenticity, ephemeral, immutability]
    cross_references: [resil-0e6a988b]

  - schema_version: 1
    id: nonrep-fd5e012c
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: risk
    severity: high
    confidence: high
    title: "Cached LDAP outpost bind-success events are audited only on cache-miss; per-bind audit is incomplete during the cache lifetime"
    summary: "Per threat-model R-3 and ADR-0003, the LDAP cached-bind mode handles bind locally for cache lifetime; per-bind Server-side audit captures cache-misses only."
    detail: |
      Threat-model R-3: "Outposts perform authentication decisions
      locally (cached bind in particular). The Server may not see
      every bind as a discrete event. An attacker exercising the LDAP
      outpost may have actions visible only in the outpost's stdout,
      not in the Server's Event log ... Residual question: Are
      cached-bind successes audited per-bind or only per-cache-miss?
      The provider doc strongly implies per-cache-miss only."

      The Non-Repudiation consequence: a user authenticating against
      a legacy LDAP application via a cached-bind LDAP outpost
      generates one Server-side bind Event per cache lifetime, not
      per bind. For audit-completeness against the identity-security
      consequential-actions list, "Authentication success" is meant
      to be per-event; the cached-bind mode emits per-cache-miss. An
      attacker who knows this can pace their bind attempts to fall
      within an existing cache window and avoid producing a discrete
      audit event for each authentication.

      Severity is high per the identity-security severity rubric:
      this matches the High clause "Audit completeness on the IdP's
      consequential-action surface unverified — partial coverage is
      the dominant real-world finding pattern, and any unaudited
      event class can hide breach activity." Authentication success
      is the dominant event class; per-bind invisibility is a
      breach-detection blind spot.

      Cross-references Resilient finding resil-32c37d49 (the
      cache-invalidation-push mechanism) and Ephemeral finding
      ephem-4018416d (cache TTL).
    evidence:
      - artifact: threat-model.md
        locator: "§R-3 'Audit-event coverage for outpost actions', Residual question line"
        excerpt: "Are cached-bind successes audited per-bind or only per-cache-miss? The provider doc strongly implies per-cache-miss only."
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Consequences > Negative / trade-offs, item 3"
        excerpt: "Cached modes (LDAP-cached-bind, LDAP-cached-search) break the session-revocation invariant."
    control_mappings:
      nist_800_53r5:
        - "AU-2"
        - "AU-3"
        - "AU-12"
        - "AU-12(1)"
      cwe:
        - "CWE-778"
      owasp_top10:
        - "A09:2021"
    recommendation:
      posture: required
      summary: "Make cached-bind outposts emit a per-bind audit Event back to the Server (over the existing WebSocket transport) even when the bind itself is served from cache; document this in the LDAP provider doc as a trade-off-mitigation."
      detail: |
        The outpost continues to serve the bind from cache (preserving
        the latency benefit) but emits a per-bind audit Event to the
        Server via the WebSocket. The Server materialises the Event
        with `bind_source: cached_outpost`,
        `outpost_id: <outpost>`, `cache_hit: true`, plus the actor /
        timestamp / source-IP. This restores per-bind auditability
        without restoring the per-bind round-trip latency cost.

        For environments where the outpost-to-Server WebSocket is
        unreliable or unavailable, document the failure mode (audit
        Events buffer locally; if buffer fills, the outpost should
        fail-closed on new binds rather than serve from cache without
        an audit anchor).
      references:
        - "internal: add-secure-apps/providers/ldap/index.md (the LDAP provider doc this updates)"
        - "internal: resil-32c37d49 (the paired cache-invalidation-push finding)"
    related_concerns: [resilient, ephemeral, immutability]
    cross_references: [resil-32c37d49]

  - schema_version: 1
    id: nonrep-a18644b2
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Audit time-source policy is not enumerated; timestamp precision and NTP discipline for token-issuance audit are unconfirmed"
    summary: "Per the identity-security common-patterns Non-Repudiation guidance, audit timestamp precision and NTP discipline are required for ordering token-issuance events; the inputs do not enumerate authentik's time-source posture."
    detail: |
      The identity-security common-patterns Non-Repudiation guidance:
      "No time-source policy — audit timestamps are local system
      clocks with no NTP discipline, no drift bounds, no fallback to
      a secondary stratum. Disposition: uncertainty or blocked."

      For an IdP, audit ordering is consequential: a sub-second
      ordering of "token issued, user signed in, admin disabled MFA,
      token used at RP" determines reconstruction of an incident.
      Without microsecond timestamp precision and bounded clock-skew
      between Server / Worker instances, post-incident timeline
      reconstruction has uncertainty at every multi-component step.

      Disposition is blocked because the inputs are silent on this;
      severity is medium because the consequence depends on the
      actual platform behavior — Linux container default time-source
      discipline is typically NTP-from-host with reasonable precision,
      but the absence of platform-asserted bounds is the GAP.
    evidence:
      - artifact: tech_plan.md
        locator: "§2 'Architecture', diagram footer"
        excerpt: "PostgreSQL ← Background Worker (Celery-style task runner: events, notifications, SCIM sync, Source sync, outpost lifecycle)"
    prerequisite_evidence:
      - "Time-source posture: NTP topology, time-source authority"
      - "Drift bounds enforced between Server / Worker instances"
      - "Timestamp precision per audit-Event class (millisecond required for token-issuance audit per common-patterns guidance)"
      - "Behavior on time-source failure"
    control_mappings:
      nist_800_53r5:
        - "AU-8"
        - "AU-12"
        - "AU-12(1)"
    recommendation:
      posture: recommended
      summary: "Document the time-source posture in `sys-mgmt/`; recommend microsecond-precision timestamps on token-issuance Events; assert drift bounds across multi-replica deployments."
      detail: |
        Author `sys-mgmt/ops/time-source-discipline.md`:

        - Required: NTP synchronization across Server / Worker
          replicas (most container deployments inherit from the host
          which is typically NTP-disciplined)
        - Recommended: microsecond timestamp precision for token-
          issuance, authn-success, authz-decision, key-lifecycle events
        - Drift bounds: alert when inter-replica skew exceeds 50ms
        - Failure handling: log time-source-failure events themselves
          as security-relevant; refuse new token issuance if drift
          exceeds 500ms

        This converts time-discipline from inherited-from-environment
        to platform-asserted; supports SOC 2 CC7.2 (time precision in
        audit trails).
      references:
        - "external: NIST SP 800-92 §4.4 (Audit timing)"
    related_concerns: [immutability, distributed]
    cross_references: []

  - schema_version: 1
    id: nonrep-4ff2b1ac
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: risk
    severity: medium
    confidence: high
    title: "Account Lockdown audit Event captures actor and reason but not actor AAL / source IP / geographic context"
    summary: "Per threat-model R-4, the Account Lockdown event records actor and reason; the doc does not enumerate actor authentication context fields."
    detail: |
      Threat-model R-4: "The reason field is operator-supplied
      free-text. There is no field for 'actor authentication
      assurance' — i.e. the audit event records *who* locked the
      account but not *under what assurance level* the actor was
      authenticated ... Residual question: Does the actor
      authentication context (auth_method, MFA used, source IP,
      geographic location) get written into the lockdown event
      context? The doc says 'an audit event with the provided reason'
      but does not enumerate the context fields."

      The Non-Repudiation lens: for a high-impact consequential
      action (Account Lockdown deactivates a user, revokes all
      tokens, terminates all sessions), the audit record should
      capture the AAL claim of the actor performing it. If an admin
      whose session is AAL1 (password-only) can execute Lockdown,
      and the audit does not record the AAL, post-incident review
      cannot distinguish "an MFA-protected admin executed this" from
      "a compromised password-only admin executed this" — the latter
      being the dominant post-compromise scenario.

      Severity is medium per the rubric (the common-pattern "Audit
      content sensitivity / completeness gap on high-impact
      consequential actions" pattern). Cross-references Authenticity
      finding auth-4793933a (admin-MFA default binding) — if admins
      were required to be AAL2, the consequence of this gap would be
      bounded.
    evidence:
      - artifact: threat-model.md
        locator: "§R-4 'Account Lockdown event provenance', Residual question line"
        excerpt: "Does the actor authentication context (auth_method, MFA used, source IP, geographic location) get written into the lockdown event context? The doc says 'an audit event"
    control_mappings:
      nist_800_53r5:
        - "AU-3"
        - "AU-3(1)"
        - "AU-10"
        - "AU-12(1)"
        - "AC-6(9)"
    recommendation:
      posture: recommended
      summary: "Extend the Account Lockdown audit Event schema to capture actor `aal_claim`, `auth_method` (password, MFA, WebAuthn), `source_ip`, `geo_country_code`, `user_agent`, and `session_age_seconds`."
      detail: |
        Modify the Account Lockdown stage to populate the Event
        context with the actor's authentication context at the time
        of execution. This applies to any consequential admin action,
        not just Lockdown — extend the same context to Flow
        modifications, Stage modifications, Policy modifications,
        signing-key rotations, audit-config changes, federation-trust
        changes (the full identity-security consequential-actions
        admin-tier list).

        Document the schema in `sys-mgmt/events/event-schema.md`
        (which the runbook §4 GAP indicates does not currently exist).
      references:
        - "external: NIST SP 800-53r5 AU-3(1) (additional audit fields)"
    related_concerns: [authenticity, immutability]
    cross_references: [auth-4793933a]

  - schema_version: 1
    id: nonrep-a8ea0a0c
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "OAuth consent grant events are audited at grant; per-use of the granted scope is not audited (GDPR Article 5(2) accountability gap)"
    summary: "Per the identity-security common-patterns Non-Repudiation guidance, consent is auditable at grant but per-use scope audit is the additional control for GDPR accountability."
    detail: |
      The identity-security common-patterns Non-Repudiation guidance:
      "OAuth consent grants audited at the grant event but not at use
      — 'user X granted scopes S to client C' is logged, but per-use
      of the granted scope is not. Severity: medium (the IdP can
      prove consent existed; cannot prove which uses occurred within
      the consent window without the per-use audit). Detail: GDPR
      Article 5(2) accountability defense for processing under the
      consent basis benefits from per-use audit when consent disputes
      arise."

      The authentik inputs document UserConsent and the consent stage
      (`tech_plan.md` §4 consent stage; §6 OAuth scope), but do not
      enumerate per-use scope audit on /userinfo and /token endpoint
      uses. For GDPR Article 5(2) accountability under the
      consent-as-lawful-basis pattern, the IdP should be able to
      prove not just that consent was granted but that the processing
      that occurred within the consent window aligned with the
      granted scope.

      I am ranking this at high rather than medium per the rubric
      because the IdP holds the consent record AND is the choke
      point for token issuance and userinfo retrieval — the per-use
      audit is structurally available, and the absence forfeits the
      attestation. Cross-references the SAML attribute-release per-
      assertion auditing (nonrep-52e5e762).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 stage taxonomy, consent bullet"
        excerpt: "consent — OAuth scope consent prompt."
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, Default scopes bullet"
        excerpt: "Default scopes: openid, profile, email, entitlements, offline_access."
    control_mappings:
      nist_800_53r5:
        - "AU-2"
        - "AU-3"
        - "AU-12"
        - "AC-21"
    recommendation:
      posture: required
      summary: "Audit per-token-use of each granted scope; link the use Event to the consent-grant Event by consent-record ID; expose per-user consent-history + use-history as a GDPR Article 15 data subject access response."
      detail: |
        Three changes:

        1. Per-token issuance Event records `granted_scopes` and
           `consent_record_id` (the UserConsent that authorised the
           grant)
        2. Per /userinfo and /token use that releases scope-resolved
           claims emits a `consent_use_event` linked to the
           consent_record_id and the token_id
        3. The Data Subject Access workflow (Article 15) returns the
           full consent grant + use history for the user

        This converts the IdP from "we have the consent record"
        to "we have the consent record and we have the per-use
        attestation" — the proportional GDPR accountability posture.
      references:
        - "external: GDPR Articles 5(2), 6(1)(a), 15 (accountability and data-subject access)"
    related_concerns: [confidentiality, immutability]
    cross_references: []

  - schema_version: 1
    id: nonrep-52e5e762
    agent: non_repudiation
    apd_tier: auditability
    apd_goal: non_repudiation
    disposition: gap
    severity: high
    confidence: high
    title: "SAML assertion log captures issuance; per-assertion attribute-release set is not enumerated as captured"
    summary: "Per the identity-security common-patterns Non-Repudiation guidance, SAML attribute-release per-SP is privacy-relevant audit; the inputs document SAML signing but not per-assertion attribute capture."
    detail: |
      The identity-security common-patterns Non-Repudiation guidance:
      "SAML assertion log captures assertion issuance but does not
      capture the attribute-release set per assertion — privacy
      attestation for 'which attributes were released to which SP at
      which time' is incomplete. Severity: high (GDPR Article 5(1)(c)
      data-minimization defense requires evidence of what was actually
      released; this is the equivalent of record-level access logging
      for federation)."

      The authentik inputs document SAML assertion issuance
      (`tech_plan.md` §6 SAML, `happy-path.md` §5) but the audit
      content for SAML assertions is not enumerated. Given the
      default SAML attribute-release maximalism (Confidentiality
      finding conf-22a9ce55 — default property mappings release
      UPN + Group + Email + Name + User ID + Username +
      WindowsAccountName), per-assertion attribute capture is
      especially load-bearing for GDPR defense: the IdP should be
      able to prove which attributes left the boundary per assertion.

      Severity is high per the rubric. Cross-references the SAML
      attribute-release Confidentiality finding.
    evidence:
      - artifact: happy-path.md
        locator: "§5 'Application access (SAML happy path)', step 2"
        excerpt: "The AuthnAssertion includes the NameID per the Provider's NameID policy (Persistent / x509 / Windows / Transient / Email) and the configured attribute set per"
      - artifact: tech_plan.md
        locator: "§6 SAML, NameID bullet"
        excerpt: "NameID policy is configurable per-Provider"
    control_mappings:
      nist_800_53r5:
        - "AU-2"
        - "AU-3"
        - "AU-12"
        - "AC-21"
    recommendation:
      posture: required
      summary: "Capture per-SAML-assertion attribute-release set in the SAML assertion-issuance Event; include assertion_id, audience SP entity ID, subject NameID, attribute names (not values for sensitive attributes), signing-key kid."
      detail: |
        SAML assertion-issuance Event fields per the identity-security
        consequential-actions catalog:

        - `assertion_id` (per SAML spec)
        - `audience_sp_entity_id`
        - `subject_nameid` (the actual NameID; for Persistent /
          x509 / Windows this is the stable identifier)
        - `attribute_names_released` (list of attribute names; values
          captured only for non-sensitive attributes; sensitive
          attribute values redacted to "<released>")
        - `signing_key_kid`
        - `not_on_or_after` (assertion expiry)
        - `assertion_size_bytes` (for anomaly detection on attribute
          over-release)

        This pairs with the OAuth per-token audit recommendation
        (nonrep-c772c9f2) — together they cover the federation audit
        surface.
      references:
        - "external: GDPR Article 5(1)(c) (data minimization evidence requirement)"
        - "external: SAML 2.0 Core §2.2 (Assertion identifier)"
    related_concerns: [confidentiality, immutability]
    cross_references: [conf-22a9ce55]
