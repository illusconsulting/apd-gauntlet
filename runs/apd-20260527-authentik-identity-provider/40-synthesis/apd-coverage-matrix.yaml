notes: |
  All nine APD goals are exercised. The finding distribution is
  identity-provider-shaped: Confidentiality and Integrity dominate the
  Trustworthiness tier (the crypto / identity-binding surface), with
  Non-Repudiation and Immutability heavy in Auditability (the audit
  obligation surface). Capability counts are evenly distributed across
  tiers (10/7/6) reflecting the platform's mature primitives across
  most APD goals, but with single-capability count in Immutability
  reflecting the absence of in-platform hash-chaining / WORM / drift-
  detection mechanisms (the dominant Immutability findings).

  Note: zero low and zero informational findings is correct for this
  run; the severity rubric's Low / Informational clauses (hygiene,
  documentation deficiency, defense-in-depth gap fully compensated)
  did not match the architectural gaps surfaced. Specialists
  consistently anchored to the High and Medium clauses.
