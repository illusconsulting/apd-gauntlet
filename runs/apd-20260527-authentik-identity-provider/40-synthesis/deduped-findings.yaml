  title: Account Lockdown audit Event captures actor and reason but not actor AAL / source IP / geographic context
  summary: Per threat-model R-4, the Account Lockdown event records actor and reason; the doc does not enumerate actor authentication
    context fields.
  detail: 'Threat-model R-4: "The reason field is operator-supplied

    free-text. There is no field for ''actor authentication

    assurance'' — i.e. the audit event records *who* locked the

    account but not *under what assurance level* the actor was

    authenticated ... Residual question: Does the actor

    authentication context (auth_method, MFA used, source IP,

    geographic location) get written into the lockdown event

    context? The doc says ''an audit event with the provided reason''

    but does not enumerate the context fields."


    The Non-Repudiation lens: for a high-impact consequential

    action (Account Lockdown deactivates a user, revokes all

    tokens, terminates all sessions), the audit record should

    capture the AAL claim of the actor performing it. If an admin

    whose session is AAL1 (password-only) can execute Lockdown,

    and the audit does not record the AAL, post-incident review

    cannot distinguish "an MFA-protected admin executed this" from

    "a compromised password-only admin executed this" — the latter

    being the dominant post-compromise scenario.


    Severity is medium per the rubric (the common-pattern "Audit

    content sensitivity / completeness gap on high-impact

    consequential actions" pattern). Cross-references Authenticity

    finding auth-4793933a (admin-MFA default binding) — if admins

    were required to be AAL2, the consequence of this gap would be

    bounded.

    '
  evidence:
  - artifact: threat-model.md
    locator: §R-4 'Account Lockdown event provenance', Residual question line
    excerpt: Does the actor authentication context (auth_method, MFA used, source IP, geographic location) get written into
      the lockdown event context? The doc says 'an audit event
  control_mappings:
    nist_800_53r5:
    - AU-3
    - AU-3(1)
    - AU-10
    - AU-12(1)
    - AC-6(9)
  recommendation:
    posture: recommended
    summary: Extend the Account Lockdown audit Event schema to capture actor `aal_claim`, `auth_method` (password, MFA, WebAuthn),
      `source_ip`, `geo_country_code`, `user_agent`, and `session_age_seconds`.
    detail: 'Modify the Account Lockdown stage to populate the Event

      context with the actor''s authentication context at the time

      of execution. This applies to any consequential admin action,

      not just Lockdown — extend the same context to Flow

      modifications, Stage modifications, Policy modifications,

      signing-key rotations, audit-config changes, federation-trust

      changes (the full identity-security consequential-actions

      admin-tier list).


      Document the schema in `sys-mgmt/events/event-schema.md`

      (which the runbook §4 GAP indicates does not currently exist).

      '
    references:
    - 'external: NIST SP 800-53r5 AU-3(1) (additional audit fields)'
  related_concerns:
  - authenticity
  - immutability
  cross_references:
  - auth-4793933a
