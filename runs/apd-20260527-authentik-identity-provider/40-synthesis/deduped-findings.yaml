  title: AUTHENTIK_SECRET_KEY rotation procedure is not documented; key compromise is effectively permanent in current operational
    guidance; rotation cadence absent
  summary: Per runbook §5 GAP and ADR-0004, the rotation runbook for AUTHENTIK_SECRET_KEY is not documented; rotation requires
    re-keying every encrypted field across the database.
  detail: 'Runbook §5 is explicit: "No rotation runbook for AUTHENTIK_SECRET_KEY

    ships in `sys-mgmt/`. Per ADR-0004, the secret_key is the master

    decryption key for every encrypted secret field; rotation requires

    re-keying every secret-bearing record." The runbook then

    reconstructs a five-step procedure that the operator would need to

    perform — but this is not an authentik-shipped runbook. ADR-0004

    §Consequences §Negative item 3 says the same: "The rotation runbook

    for secret_key is not documented in `sys-mgmt/`; reviewers should

    surface this as a finding against operational discipline."


    The confidentiality lens on this is: if `AUTHENTIK_SECRET_KEY` is

    compromised — by any of the routes flagged in finding conf-477ff8a1

    (Expression policy, embedded outpost bug, host compromise, sidecar

    with shared env) — the operator has no documented procedure to

    rotate. The compromise is effectively permanent until the operator

    improvises a rotation, which is a high-risk multi-step database

    operation under incident pressure.


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Defense-in-depth gap on signing-key access"

    because the supposed-mitigation (rotate the master key) is not

    actually operationally available. Note the Ephemeral specialist

    will own the lifetime/rotation framing; the Confidentiality lens is

    that key confidentiality cannot be restored after exposure without

    a documented procedure.

    '
  evidence:
  - artifact: runbook.md
    locator: §5 'AUTHENTIK_SECRET_KEY rotation', opening GAP paragraph
    excerpt: No rotation runbook for AUTHENTIK_SECRET_KEY ships in sys-mgmt/. Per ADR-0004, the secret_key is the master decryption
      key for every encrypted secret field; rotation requires re-keying
  - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
    locator: §Consequences > Negative / trade-offs, item 3
    excerpt: Rotation of AUTHENTIK_SECRET_KEY requires re-encrypting every secret-bearing field. The blueprint mechanism supports
      this ... but the operational impact is non-trivial
  control_mappings:
    nist_800_53r5:
    - SC-12
    - SC-12(2)
    - IA-5
    - IA-5(1)
    - IA-5(7)
  recommendation:
    posture: required
    summary: Publish a step-by-step secret_key rotation runbook in `sys-mgmt/`, with a tested re-key blueprint and a smoke-test
      verification step.
    detail: "Author a `sys-mgmt/ops/secret-key-rotation.md` document that:\n\n1. Establishes the OLD_KEY + NEW_KEY dual-key\
      \ state.\n2. Ships a `rekey-secrets.yaml` blueprint that decrypts every\n   secret-bearing field under OLD_KEY and re-encrypts\
      \ under NEW_KEY\n   within a single transaction (with progress reporting and\n   rollback semantics).\n3. Coordinates\
      \ the cutover: swap `AUTHENTIK_SECRET_KEY` in the\n   Server/Worker process env, restart in a rolling fashion, verify\n\
      \   that each Provider can issue a test token, each Source can\n   re-authenticate, each outpost reconnects.\n4. Documents\
      \ the recovery path if the cutover fails mid-flight\n   (the OLD_KEY + NEW_KEY state must remain decryptable until\n\
      \   cutover completes).\n5. Recommends a baseline rotation cadence (annual or\n   post-incident) and an alert for \"\
      secret_key has not been\n   rotated in N days.\"\n"
    references:
    - 'internal: runbook.md §5 (the GAP this resolves)'
    - 'internal: adrs/0004-encrypted-secrets-via-certificatekeypair.md §Consequences (the rotation requirement)'
  related_concerns:
  - ephemeral
  - authenticity
  - availability
  cross_references: []
  lens_perspectives:
    confidentiality:
      summary: Key cannot be re-protected after exposure without a documented procedure.
      detail: Per runbook §5 GAP and ADR-0004 §Negative item 3.
    ephemeral:
      summary: Effective master-key lifetime is unbounded; no rotation cadence shipped.
      detail: Per common-pattern High clause 'Signing-key rotation cadence absent or longer than the longest token lifetime'
        — generalised to master key.
