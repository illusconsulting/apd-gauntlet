  title: OAuth client_secret rotation procedure is undocumented; private_key_jwt and mTLS client authentication alternatives
    are not first-class in the registration flow
  summary: Per `tech_plan.md` §6 OAuth and `happy-path.md` §9, OAuth Provider creation defaults to client_secret-based authentication;
    rotation cadence and alternative-auth onboarding are not asserted.
  detail: 'OAuth Provider creation (`happy-path.md` §9 step 3) configures

    "Client type (Confidential / Public). Redirect URI(s). Signing

    Key (CertificateKeyPair selection). Encryption Key (optional)" —

    no client-authentication-method choice is enumerated; the platform

    default is `client_secret_basic` / `client_secret_post`. The

    identity-security common-patterns Ephemeral guidance flags:

    "OAuth client_secret unrotated since initial issuance; rotation

    procedure undocumented. Severity: high (client_secret leak is a

    recurring incident pattern via repository exposure, CI log leak,

    mobile-app extraction, vendor compromise; without rotation, leak

    is permanent)."


    Without first-class `private_key_jwt` or `tls_client_auth`

    (mTLS) alternatives at registration, every confidential client

    relies on a shared symmetric secret that is itself the signing

    key in HMAC-fallback (Integrity finding intg-96d4de40). The

    modern OAuth Security BCP posture is to deprecate

    `client_secret_*` for new confidential clients in favor of

    asymmetric client authentication.


    Severity is high per the identity-security severity rubric — this

    is the High clause directly. Cross-references Authenticity

    (the client-authentication mechanism quality) and Integrity

    (the HMAC-fallback secret-as-signing-key surface from

    intg-96d4de40).

    '
  evidence:
  - artifact: happy-path.md
    locator: §9 'Operator creates an OAuth Application + Provider pair', step 3
    excerpt: 'Configures: Authentication flow ... Authorization flow ... Client type (Confidential / Public). Redirect URI(s).
      Signing Key (CertificateKeyPair selection). Encryption Key (optional). Scopes (default + custom'
  - artifact: tech_plan.md
    locator: §6 OAuth 2.0 / OIDC, Grant types bullet
    excerpt: 'Grant types: authorization-code, implicit (with the note that the OAuth Security BCP recommends against it),
      hybrid, client-credentials, device-code, refresh-token.'
  control_mappings:
    nist_800_53r5:
    - IA-5
    - IA-5(1)
    - IA-5(2)
    - SC-12
    - IA-2
    mitre_attack:
    - technique: T1552
      sub_technique: T1552.001
      tactic: TA0006
      rationale: client_secret leak via repository check-in or CI log capture (T1552.001) is the dominant OAuth-credential
        loss vector; no rotation procedure means the leak is permanent until manual remediation.
    cwe:
    - CWE-798
    - CWE-321
    owasp_api_top10:
    - API2:2023
  recommendation:
    posture: required
    summary: Add first-class `private_key_jwt` and `tls_client_auth` (mTLS) client-authentication options at OAuth Provider
      creation; default new confidential clients to private_key_jwt; document client_secret rotation procedure with overlap
      window.
    detail: "Three changes:\n\n1. **Add client-auth mechanism selector** at Provider creation:\n   `client_secret_basic` (legacy),\
      \ `client_secret_post`\n   (legacy), `private_key_jwt` (recommended new default),\n   `tls_client_auth` (mTLS). Default\
      \ to `private_key_jwt` for\n   new confidential clients.\n2. **Document client_secret rotation** with overlap window:\n\
      \   generate new secret, register at the RP, switch over,\n   retire old secret. Add a per-Provider rotation cadence\n\
      \   default (90 days) and an Event Matcher Notification Rule\n   shipped by default.\n3. **Deprecation timeline** for\
      \ `client_secret_*` in new\n   confidential clients (announced in release notes; warning\n   banner in UI; eventual\
      \ removal of `client_secret_*` as a\n   new-client option, retained for legacy clients).\n\nCross-references Integrity\
      \ finding intg-96d4de40 (the\nHMAC-fallback surface that disappears when private_key_jwt is\nthe default).\n"
    references:
    - 'external: RFC 7523 (JWT bearer for client authentication)'
    - 'external: RFC 8705 (mTLS for client authentication)'
    - 'external: RFC 9700 §4 (OAuth Security BCP on client authentication)'
  related_concerns:
