  title: Source attribute mapping can write `is_superuser=True` to local User; INV-FED-001 is not platform-enforced
  summary: Per `invariants.md` INV-FED-001 and threat-model S-7, Source-driven user-write writes are operator-policy not platform-enforced;
    a poorly written or malicious property mapping escalates federated identity to admin.
  detail: 'INV-FED-001 is explicit: "**Not platform-enforced.** Per ADR-0001

    and the SECURITY.md classification, property mappings are arbitrary

    Python; an operator who writes a mapping that sets `is_superuser=True`

    from an upstream attribute will see exactly that behavior."

    Threat-model S-7 elaborates: "A malicious upstream IdP (or a

    compromised one) returns attributes claiming the user is

    `superuser=True`, or claims a `username` that collides with an

    existing admin''s. A poorly-written property mapping accepts these

    as-authoritative and writes them to the local User."


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Privilege escalation via group/role

    mapping bug — federation attribute mapping ... permits a user to

    declare or influence their own group membership." For

    authentik specifically this is a write-path integrity gap — the

    User model accepts a `is_superuser=True` write from a Source

    property mapping with no platform-level deny on privileged-field

    writes from non-platform-trusted attribute sources. The

    compensating control is operator-authored property-mapping

    discipline, which is a code-review property rather than a platform

    property. Combined with a compromised upstream Source (the

    compromised_third_party_relying_party / federation-source variant

    in the attacker positions list), this becomes the cross-source

    admin-takeover path.

    '
  evidence:
  - artifact: invariants.md
    locator: §INV-FED-001, Reviewer note
    excerpt: Not platform-enforced. Per ADR-0001 and the SECURITY.md classification, property mappings are arbitrary Python;
      an operator who writes a mapping that sets is_superuser=True from an upstream
  - artifact: threat-model.md
    locator: §S-7 'Source attribute-injection at first login', Existing mitigation line
    excerpt: Per the SECURITY.md classification, the expression engine is intentionally arbitrary-Python; the property-mapping
      authoring discipline is the control.
  - artifact: adrs/0001-flows-stages-policies-pipeline.md
    locator: §Consequences > Negative / trade-offs, item 1
    excerpt: Expressions (property mappings/policies/prompts) can execute arbitrary Python code without safeguards.
  control_mappings:
    nist_800_53r5:
    - SI-10
    - AC-3
    - AC-6
    - AC-6(7)
    - IA-8
    mitre_attack:
    - technique: T1098
      sub_technique: null
      tactic: TA0003
      rationale: Source property-mapping that writes is_superuser from an attacker-controlled upstream attribute manipulates
        account privileges to attacker advantage.
    - technique: T1199
      sub_technique: null
      tactic: TA0001
      rationale: Compromised upstream Source IdP exploits the trusted-relationship to escalate federated identities to local
        admin via attribute injection.
    cwe:
    - CWE-915
    - CWE-269
    owasp_top10:
    - A01:2021
    - A04:2021
    owasp_api_top10:
    - API3:2023
  recommendation:
    posture: required
    summary: Enforce a platform-level deny on write-from-Source to privileged User fields (`is_superuser`, `is_staff`, role
      assignments, group memberships of admin groups); make exceptions explicit per-Source rather than implicit-on-property-mapping.
    detail: 'Add a `protected_user_fields` allowlist enforced in the

      User-write path: by default, Source-driven writes cannot set

      `is_superuser`, `is_staff`, group memberships of any group whose

      Role grants admin permissions, or any Role assignment. Operators

      who legitimately need to JIT-provision admins via federation set

      a per-Source `allow_privileged_writes: true` flag and accept the

      risk explicitly. The Source''s property mapping continues to

      operate; the User-write enforcer simply ignores forbidden field

      writes when the per-Source flag is not set, emitting a

      high-severity Event so the operator can see attempted escalations.


      This makes INV-FED-001 actually platform-enforced and converts

      the threat into "operator deliberately chose to weaken the

      boundary" rather than "operator forgot to write defensive

      property mapping."

