- schema_version: 1
  id: immut-d98cdc96
  agent: immutability
  apd_tier: auditability
  apd_goal: immutability
  disposition: gap
  severity: high
  confidence: high
  title: Event audit records live in mutable PostgreSQL rows with no hash-chain, no WORM substrate, no append-only enforcement
  summary: Per threat-model R-2 and `tech_plan.md` §8, Event records are standard ORM rows in PostgreSQL; attacker with DB
    write or Expression-policy RCE can edit/delete them.
  detail: 'Threat-model R-2: "An attacker with database write access (or

    expression-engine code execution per T-1) deletes or modifies

    Event records to hide their tracks. PostgreSQL has no

    cryptographic tamper-evidence by default; the rows are

    mutable ... Existing mitigation: event forwarding is

    recommended ... Out-of-the-box, what fraction of operators

    configure log forwarding? The shipped configuration does not

    enable it. Without forwarding, the database-resident Event log

    is mutable and there is no tamper-evidence."


    The identity-security immutability-classes catalog frames this

    directly: "Authentication event log — credential-compromise

    reconstruction depends on a tamper-evident authn record ...

    Retention floor must match or exceed the longest plausible

    breach-detection window." The authentik Event records are not

    tamper-evident in the platform: no per-stream hash-chain, no

    WORM substrate, no signed-entry discipline.


    Severity is high per the identity-security severity rubric:

    this matches the High clause "Authentication event log written

    to a mutable RDS table or document collection; no append-only

    enforcement, no WORM substrate, no hash-chain. Severity: high

    (authn log alteration breaks every regulatory accountability

    claim; combines with any Non-Repudiation gap into a critical-

    merged record — the authn log is the first thing an attacker

    tampers with after gaining IdP-admin)." This is precisely the

    pattern. Cross-references the Non-Repudiation findings on

    audit-pipeline operator-driven forwarding (nonrep-c3d8f98d).

    '
  evidence:
  - artifact: threat-model.md
    locator: §R-2 'Audit-log immutability and tamper-evidence', Attack scenario
    excerpt: An attacker with database write access (or expression-engine code execution per T-1) deletes or modifies Event
      records to hide their tracks. PostgreSQL has no cryptographic
  - artifact: tech_plan.md
    locator: §8 'Data model', Event entry
    excerpt: Event — append-only audit record. Action, app, context (JSON), user, client_ip. Created by Flow execution, by
      direct API actions, and by ak_create_event(...) calls from Expression
  control_mappings:
    nist_800_53r5:
    - AU-9
    - AU-9(2)
    - AU-9(3)
    - AU-11
    - SI-7
    - SI-7(8)
    mitre_attack:
    - technique: T1070
      sub_technique: null
      tactic: TA0005
      rationale: Mutable Postgres-resident Event rows allow an attacker with DB write access (via Expression-policy RCE per
        ADR-0001 or DB compromise) to clear or modify audit entries, defeating Indicator Removal countermeasures.
    - technique: T1565
      sub_technique: null
      tactic: TA0040
      rationale: Direct ORM access to Event rows enables Data Manipulation of the audit substrate; the row says 'admin X executed
        Y' but the row is editable.
    cwe:
    - CWE-117
    - CWE-285
    owasp_top10:
    - A09:2021
  recommendation:
    posture: required
    summary: Add per-stream hash-chaining for Event records; ship a chain-verifier; anchor chain heads daily to a separate
      trust domain (operator's external KMS signature, or an external timestamp authority).
    detail: "Three changes:\n\n1. **Per-stream hash-chaining**: each Event row includes a\n   `prev_hash` (SHA-256 of the\
      \ prior Event in its stream) and\n   a `signature` (HMAC or asymmetric over the row contents\n   plus prev_hash, keyed\
      \ by a chain-signing key distinct\n   from AUTHENTIK_SECRET_KEY). Chain-break is detectable on\n   audit read.\n2. **Chain-head\
      \ anchoring**: the per-stream chain head is\n   signed daily by an operator-controlled external key (KMS\n   signature)\
      \ and published to a separate trust domain\n   (separate cloud account, external timestamp authority,\n   transparency\
      \ log). Tampering can be detected against the\n   anchored chain head.\n3. **Audit-read-time verification**: the audit\
      \ query\n   endpoint verifies chain continuity at read time and\n   surfaces chain breaks as a security-relevant Event\
      \ of its\n   own.\n\nThis converts the audit posture from \"trust the database\" to\n\"verify the chain at read time,\"\
      \ which is the proportional\ndefense against the T1070 attack class.\n\nCross-references the Non-Repudiation finding\
      \ nonrep-c3d8f98d\n(shipped log forwarding) — the chain-head anchoring is the\ncomplementary control to log forwarding.\n"
    references:
    - 'external: NIST SP 800-92 §5.3 (Audit log integrity)'
    - 'external: RFC 9162 (Certificate Transparency Logs — applicable hash-chain pattern)'
  related_concerns:
  - non_repudiation
  - integrity
  - confidentiality
  cross_references:
  - nonrep-c3d8f98d
