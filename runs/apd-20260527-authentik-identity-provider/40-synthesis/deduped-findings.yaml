    - CWE-345
    owasp_top10:
    - A07:2021
  recommendation:
    posture: recommended
    summary: Add a per-Provider 'trust establishment workflow' that requires (a) domain-control validation on redirect_uri
      hosts (HTTP-01 / DNS-01 style), (b) operator approval workflow with documented audit, (c) periodic re-attestation.
    detail: "Add a Provider lifecycle state:\n\n- `pending_trust_establishment` (initial state): redirect_uri\n  hosts undergo\
      \ automated domain-control validation; operator\n  contact for the Provider is captured; an approval signature\n  is\
