    summary: Add an HMAC-signed header pair (`X-authentik-signature` + `X-authentik-signature-timestamp`) per request so the
      protected app can verify the headers originated from the outpost; document a per-Provider HMAC secret rotation procedure.
    detail: 'Stamp a deterministic HMAC-SHA256 over the canonical header set

      plus a timestamp, signed with a per-outpost-Provider HMAC secret

      the protected app holds (out-of-band). The protected app rejects

      requests whose signature does not validate or whose timestamp

