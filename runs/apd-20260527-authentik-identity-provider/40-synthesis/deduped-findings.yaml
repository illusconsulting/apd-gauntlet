  title: SAML signing digest SHA-1 remains configurable per Provider despite deprecation; hardening misstep is one-click
  summary: Per `tech_plan.md` §6 SAML and `invariants.md` INV-FED-002, SHA-1 digest is configurable per Provider; SHA-1 is
    widely deprecated.
  detail: 'Tech plan §6: "Signing certificates are per-Provider; algorithms

    RSA-SHA256 or ECDSA-SHA256; digest SHA-1 or SHA-256 (configurable).

    Note that SHA-1 is configurable but is widely deprecated — picking

    it is a hardening misstep." INV-FED-002 echoes: "Algorithm

    selection (RSA-SHA256 / ECDSA-SHA256, SHA-1 / SHA-256 digest) is

    per-Provider; SHA-1 is configurable and is a hardening misstep if

    chosen."


    Severity is medium per the identity-security severity rubric:

    this matches the Medium clause "Hygiene issue with no realistic

    exploit path — deprecated TLS cipher with no client population

    that requires it" — SHA-1 in SAML signing is the analog. Modern

    SPs reject SHA-1 signatures; the misstep usually produces

    interop failure rather than silent exploitation, but the platform

    should not present SHA-1 as a current option without a deprecation

    banner.

