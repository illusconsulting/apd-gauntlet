  title: Federation-trust changes are admin-tier consequential actions without GitOps drift detection between declared and
    actual state
  summary: Per the identity-security immutability-classes catalog, federation-trust configuration history must be retained;
    the inputs document blueprint-driven configuration but not drift detection.
  detail: 'The identity-security immutability-classes catalog: "Federation-

    trust establishment records — the human approval trail for

    SP/IdP onboarding, the metadata-validation evidence, the

    contact attestation. Required for post-compromise attribution if

    a federated party turns out to be malicious or compromised."

    And: "Configuration history — RBAC policy changes, ABAC policy

    changes, federation-trust changes (signing-key rotation,

    attribute-release-policy mutation, redirect_uri allowlist

    edits), audit-pipeline configuration."


    The corresponding High-severity rubric clause: "Federation-trust

    configuration partly IaC, partly manual via admin console; no

    drift detection between declared and actual federation-trust

    state. Severity: high (federation-trust mutations are admin-tier

    consequential actions; manual mutation breaks GitOps attribution,

    evades signed-commit discipline, and produces ''where did this SP

    entry come from?'' forensic gaps)."


    The authentik inputs document Blueprints (`tech_plan.md` §8, §11)

    as the declarative configuration apply mechanism, and runbook §10

    hardening recommends "force changes through filesystem blueprints

    in `/blueprints/`" — but the in-admin-console editing of Providers,

    Sources, Flows is still supported, and the inputs do not document

    drift detection between blueprint-declared state and admin-UI-

    modified state.


    Severity is high per the rubric. Cross-references Integrity

    finding intg-294a9c9e (Policy binding-mode defaults) and Non-

    Repudiation finding nonrep-4ff2b1ac (admin-action audit context).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §11 'Known security posture', secrets bullet
    excerpt: Rotation is blueprint-driven.
  - artifact: runbook.md
    locator: §10 'Production hardening checklist', API blocklist bullet
    excerpt: Block /api/v3/policies/expression*, /api/v3/propertymappings*, /api/v3/managed/blueprints*, /api/v3/stages/captcha*
      at the reverse proxy. Force changes through filesystem blueprints in /blueprints/.
  control_mappings:
    nist_800_53r5:
    - CM-2
    - CM-2(2)
    - CM-2(3)
    - CM-3
    - CM-3(1)
    - CM-6
    - CM-6(2)
    - CM-8
    - AU-12
    mitre_attack:
    - technique: T1098
      sub_technique: null
      tactic: TA0003
      rationale: Admin-UI mutation of federation trust (Provider redirect_uri allowlist, attribute mapping, signing key) bypasses
        GitOps attribution; an attacker with admin access can mutate the trust surface without leaving a config-repo commit
        attribution.
    cwe:
    - CWE-732
    - CWE-1188
  recommendation:
    posture: required
    summary: Ship a drift-detection subsystem comparing blueprint-declared state to live state for Flows / Stages / Policies
      / Providers / Sources / RBAC / federation-trust; surface drifts on a dashboard; emit drift events to audit; require
      operator-acknowledgment of drift before reconciliation.
    detail: "Continuous drift detection:\n\n- Worker periodically reconciles `/blueprints/` filesystem\n  state against live\
      \ Flow / Stage / Policy / Provider / Source\n  / RBAC state\n- Drift between declared and live emits a `ConfigDriftDetected`\n\
      \  Event of severity high, with the affected object, the\n  declared state, the live state, and the diff\n- Dashboard\
      \ tile `Dashboards > Configuration Drift` lists all\n  current drifts\n- Operator can either (a) accept live state and\
      \ update the\n  blueprint to match, or (b) reconcile back to blueprint\n  (overwriting live state). Both are audit-emitting.\n\
      \nTogether with the Non-Repudiation finding nonrep-4ff2b1ac\n(admin-action audit context) and runbook §10 hardening\n\
      recommendation, this closes the \"where did this Provider come\nfrom?\" forensic gap.\n"
    references:
    - 'external: GitOps principles (declarative state + drift detection + reconciliation)'
  related_concerns:
  - non_repudiation
  - integrity
  cross_references:
  - nonrep-4ff2b1ac
