  id: nonrep-fd5e012c
  agent: non_repudiation
  apd_tier: auditability
  apd_goal: non_repudiation
  disposition: risk
  severity: high
  confidence: high
  title: Cached LDAP outpost bind-success events are audited only on cache-miss; per-bind audit is incomplete during the cache
    lifetime
  summary: Per threat-model R-3 and ADR-0003, the LDAP cached-bind mode handles bind locally for cache lifetime; per-bind
    Server-side audit captures cache-misses only.
  detail: 'Threat-model R-3: "Outposts perform authentication decisions

    locally (cached bind in particular). The Server may not see

    every bind as a discrete event. An attacker exercising the LDAP

    outpost may have actions visible only in the outpost''s stdout,

    not in the Server''s Event log ... Residual question: Are

    cached-bind successes audited per-bind or only per-cache-miss?

    The provider doc strongly implies per-cache-miss only."


    The Non-Repudiation consequence: a user authenticating against

    a legacy LDAP application via a cached-bind LDAP outpost

    generates one Server-side bind Event per cache lifetime, not

    per bind. For audit-completeness against the identity-security

    consequential-actions list, "Authentication success" is meant

    to be per-event; the cached-bind mode emits per-cache-miss. An

    attacker who knows this can pace their bind attempts to fall

    within an existing cache window and avoid producing a discrete

    audit event for each authentication.


    Severity is high per the identity-security severity rubric:

    this matches the High clause "Audit completeness on the IdP''s

    consequential-action surface unverified — partial coverage is

    the dominant real-world finding pattern, and any unaudited

    event class can hide breach activity." Authentication success

    is the dominant event class; per-bind invisibility is a

    breach-detection blind spot.


    Cross-references Resilient finding resil-32c37d49 (the

    cache-invalidation-push mechanism) and Ephemeral finding

    ephem-4018416d (cache TTL).

    '
  evidence:
  - artifact: threat-model.md
    locator: §R-3 'Audit-event coverage for outpost actions', Residual question line
    excerpt: Are cached-bind successes audited per-bind or only per-cache-miss? The provider doc strongly implies per-cache-miss
      only.
  - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
    locator: §Consequences > Negative / trade-offs, item 3
    excerpt: Cached modes (LDAP-cached-bind, LDAP-cached-search) break the session-revocation invariant.
  control_mappings:
    nist_800_53r5:
    - AU-2
    - AU-3
    - AU-12
    - AU-12(1)
    cwe:
    - CWE-778
    owasp_top10:
    - A09:2021
  recommendation:
    posture: required
    summary: Make cached-bind outposts emit a per-bind audit Event back to the Server (over the existing WebSocket transport)
      even when the bind itself is served from cache; document this in the LDAP provider doc as a trade-off-mitigation.
    detail: 'The outpost continues to serve the bind from cache (preserving

      the latency benefit) but emits a per-bind audit Event to the

      Server via the WebSocket. The Server materialises the Event

      with `bind_source: cached_outpost`,

      `outpost_id: <outpost>`, `cache_hit: true`, plus the actor /

      timestamp / source-IP. This restores per-bind auditability

      without restoring the per-bind round-trip latency cost.


      For environments where the outpost-to-Server WebSocket is

      unreliable or unavailable, document the failure mode (audit

      Events buffer locally; if buffer fills, the outpost should

      fail-closed on new binds rather than serve from cache without

      an audit anchor).

      '
    references:
    - 'internal: add-secure-apps/providers/ldap/index.md (the LDAP provider doc this updates)'
    - 'internal: resil-32c37d49 (the paired cache-invalidation-push finding)'
  related_concerns:
  - resilient
  - ephemeral
  - immutability
  cross_references:
  - resil-32c37d49
