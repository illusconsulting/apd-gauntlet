    apd_goal: confidentiality
    disposition: gap
    source_file: 10-trustworthiness/confidentiality.findings.yaml

  - id: conf-68ab158e
    severity: high
    title: "PostgreSQL backups encrypt rows only with AUTHENTIK_SECRET_KEY; off-site dump encryption, key separation, and backup immutability (object-lock/WORM) are not documented"
    apd_goal: confidentiality
    disposition: gap
    source_file: 10-trustworthiness/confidentiality.findings.yaml
    lens_perspectives:
      confidentiality:
        summary: "Off-site dump encryption with operator-managed key distinct from AUTHENTIK_SECRET_KEY is not specified."
        detail: "Co-located pg_dump and .env compromise = total unmasking. Runbook §8 explicitly flags two GAPs."
      immutability:
        summary: "Backup immutability (object-lock / compliance-mode / WORM) is not described; deletion-by-single-credential is the canonical ransomware target."
        detail: "Per identity-security immutability-classes catalog: IdP backup is post-breach recovery anchor; mutability or deletion-by-single-credential is a critical pattern."

  - id: conf-22a9ce55
    severity: high
    title: "Default SAML attribute mappings release UPN + Group + Email + Name + User ID + Username + WindowsAccountName to every SP unless operator strips them"
    apd_goal: confidentiality
    disposition: risk

