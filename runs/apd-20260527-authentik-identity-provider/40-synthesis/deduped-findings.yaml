  id: conf-92954884
  agent: confidentiality
  apd_tier: trustworthiness
  apd_goal: confidentiality
  disposition: risk
  severity: medium
  confidence: high
  title: Prompt stage HTML is unescaped by design; user-controlled or operator-misconfigured prompts can render exfiltrating
    content
  summary: Per `SECURITY.md` and tech plan §4 / §11, the Prompt stage allows raw HTML by design; the resulting render context
    contains the user's authenticated session and consent state.
  detail: '`tech_plan.md` §4 lists the `prompt` stage and notes: "supports HTML

    rendering (per `SECURITY.md`: ''Prompt HTML is not escaped'' is an

    intentional design choice)." Tech plan §11 echoes "Prompt HTML is

    not escaped by design; intentional to support rich interactive

    prompts." The intentionality is documented; the confidentiality

    consequence is that an operator who crafts a prompt with attacker-

    influenceable content (a placeholder that interpolates a

    user-controlled attribute, or a template imported from an

    untrusted blueprint per T-2) can render `<script>` or `<img src>`

    that exfiltrates session cookies, CSRF tokens, or stage-flow

    state during the authentication ceremony.


    Severity is medium per the identity-security severity rubric: this

    sits between the "Verbose error messages on /authorize or /token"

    medium clause (information leak about auth state) and the higher

    "Mass-assignment on user profile / consent surface" pattern

    (consent-surface integrity). The Confidentiality lens is the

    session/CSRF/state-cookie disclosure risk; the Integrity lens is

    the consent-surface tampering risk (related_concerns: integrity).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §4 prompt stage description
    excerpt: 'supports HTML rendering (per SECURITY.md: ''Prompt HTML is not escaped'' is an intentional design choice).'
  - artifact: tech_plan.md
    locator: §11 'Known security posture', Prompt HTML bullet
    excerpt: Prompt HTML is not escaped by design; intentional to support rich interactive prompts.
  control_mappings:
    nist_800_53r5:
    - SI-10
    - SI-15
    - SC-18
    cwe:
    - CWE-79
    owasp_top10:
    - A03:2021
  recommendation:
    posture: recommended
    summary: Default prompt placeholders to escape interpolated user-controlled values; preserve raw-HTML opt-in per placeholder;
      ship a CSP that constrains the Flow executor render context.
    detail: 'The intentional raw-HTML design need not change, but the

      per-placeholder default should: interpolated `{{user.attribute}}`

      values should be escaped unless the operator explicitly opts that

      placeholder into raw-HTML render mode. This preserves the

      documented rich-prompt capability while removing the

      "operator accidentally interpolated an attacker-controlled

      attribute" failure mode. Additionally, the Flow executor''s render

      context should ship with a CSP header (per the existing

      operator-driven CSP guidance in `security-hardening.md`) that

      prevents inline script execution by default — operators who

      legitimately need inline script in a prompt can relax the CSP

      per-Flow.

      '
    references:
    - 'internal: SECURITY.md ''Intended functionality'' (the documented design)'
    - 'internal: security/security-hardening.md (the operator-driven CSP recommendation this would extend)'
  related_concerns:
  - integrity
  - authenticity
  cross_references: []
- schema_version: 1
  id: intg-96d4de40
  agent: integrity
  apd_tier: trustworthiness
  apd_goal: integrity
  disposition: risk
  severity: critical
  confidence: high
  title: OAuth Provider with no Signing Key configured silently falls back to HMAC-signing JWTs with the Provider client_secret
  summary: Per `tech_plan.md` §6 and `invariants.md` INV-AUTH-003, when a Provider's Signing Key field is empty the platform
    signs tokens symmetrically with the client_secret — a leaked secret becomes signing-key-equivalent.
  detail: 'Tech plan §6: "Signing keys are per-Provider ... If no Signing Key

    is selected, JWTs are HMAC-signed with the Provider''s client secret —

    the symmetric-fallback surface." INV-AUTH-003: "When Signing Key is

    not configured, the OAuth provider falls back to HMAC signing with

    the client_secret (per the doc) — see threat-model S-3. Operators

    relying on the fallback have a fundamentally weaker signing

    posture." Threat-model S-3 supplies the consequence: any RP-side

    leak (CI log, repository check-in, mobile-app extraction, vendor

    compromise) of the client_secret immediately becomes a forge-any-

    JWT-for-any-user capability against that Provider.


    Severity is critical per the identity-security severity rubric:

    this matches the Critical clause "JWT algorithm confusion at the

    issuer" — specifically the variant where the asymmetric/symmetric

    boundary is misused. The platform default-when-empty makes

    symmetric signing the un-opted choice, which inverts the modern

    OAuth Security BCP posture (RFC 9700 §4 emphasizes asymmetric

    signing for any non-trivial deployment). Forgery scope is

    RP-bounded but for that RP it is universal-subject-impersonation.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §6 OAuth 2.0 / OIDC, Signing Keys bullet
    excerpt: If no Signing Key is selected, JWTs are HMAC-signed with the Provider's client secret — the symmetric-fallback
      surface.
  - artifact: invariants.md
    locator: §INV-AUTH-003, Reviewer note
    excerpt: When Signing Key is not configured, the OAuth provider falls back to HMAC signing with the client_secret
  - artifact: threat-model.md
    locator: §S-3 'JWT signing fallback to HMAC-with-client-secret', Existing mitigation line
    excerpt: Operators can (and should) configure a Signing Key per Provider. The fallback is the platform default posture
      when none is selected.
  control_mappings:
    nist_800_53r5:
    - SI-7
    - SC-13
    - IA-5(2)
    - IA-2
    mitre_attack:
    - technique: T1606
      sub_technique: T1606.001
      tactic: TA0006
      rationale: A leaked client_secret used as HMAC signing key allows the attacker to forge OAuth web cookies (ID tokens,
        access tokens) for any user against that RP.
    cwe:
    - CWE-347
    - CWE-327
    owasp_top10:
    - A02:2021
    owasp_api_top10:
    - API2:2023
  recommendation:
    posture: required
    summary: Make Signing Key required-on-create for new OAuth Providers; deprecate the HMAC-with-client_secret fallback;
      auto-issue a per-Provider asymmetric key at Provider creation if the operator does not select one.
    detail: 'At Provider creation, default the Signing Key field to a new

      auto-generated per-Provider RSA-2048 or ECDSA-P256 keypair drawn

      from a Provider-creation blueprint, rather than leaving the field

      empty and falling back to HMAC. For existing Providers without a

      Signing Key, emit a high-severity Event at the next token issuance

      and surface it on the Admin UI dashboard until remediated.

      Document the deprecation timeline for HMAC-with-client_secret in

      the OAuth provider doc; remove the fallback in a future major

      version.


      This reverses the default from "weakest signing posture unless

      operator opts in" to "modern signing posture unless operator

      opts out."

      '
    references:
    - 'external: RFC 9700 (OAuth 2.0 Security BCP) §4 on asymmetric signing for issued tokens'
    - 'external: OIDC Core 1.0 §10 on JWT signing-key handling'
  related_concerns:
  - authenticity
  - ephemeral
  - confidentiality
  cross_references: []
