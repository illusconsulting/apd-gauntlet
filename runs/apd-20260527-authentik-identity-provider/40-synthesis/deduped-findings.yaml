  title: Multi-region active-active topology and cross-region replication policy are unspecified
  summary: Per `agents.md` and ADR-0002, production HA is documented at the AZ level via replication; multi-region failover,
    write-conflict resolution, and per-tenant residency are not addressed.
  detail: '`agents.md` describes the production posture as "PostgreSQL with

    replication or managed-Postgres (RDS, Cloud SQL)" — which covers

    single-region multi-AZ HA but does not address multi-region

    topology. ADR-0002 establishes PostgreSQL as the universal SPOF

    for identity / session / audit / secret material. The

    identity-security common-patterns Distributed guidance flags

    this as a critical pattern: "Multi-region topology asserted but

    failover behavior unspecified — active-active vs. active-passive

    vs. standby, write-conflict policy on the credential store,

    failover trigger, RTO/RPO targets."


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Single-AZ deployment of the IdP

    application tier, the session store, or the signing-key backend"

    — extended to the single-region case. The IdP is the topmost

    availability dependency for every dependent application, so a

    regional outage cascades. Cross-references Availability finding

    avail-cfd2b6e8 (which framed the SLO consequence); this finding

    owns the topology framing.

    '
  evidence:
  - artifact: agents.md
    locator: §'Operator characteristics', 'High-availability expectations' bullet
    excerpt: PostgreSQL with replication or managed-Postgres (RDS, Cloud SQL); outposts deployed redundantly per protocol.
  - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
    locator: §Consequences > Negative / trade-offs, item 2
    excerpt: Loss of the database means loss of all identity, audit, session, and secret-encrypted material.
  prerequisite_evidence:
  - Multi-region topology specification (active-active, active-passive, or standby)
  - Write-conflict policy for credential and session stores
  - Cross-region replication RPO targets per data class
  - Per-tenant data-residency policy if multi-tenant (Brand/Tenancy)
  control_mappings:
    nist_800_53r5:
    - SC-7
    - SC-36
    - SC-36(1)
    - CP-7
    - CP-7(1)
    mitre_attack:
    - technique: T1485
      sub_technique: null
      tactic: TA0040
      rationale: A single-region IdP topology means a regional incident destroys the IdP's data plane in one substrate; without
        multi-region replication the identity authority is non-recoverable within the regional outage window.
  recommendation:
    posture: required
    summary: Author a multi-region reference architecture document covering active-active and active-passive options, with
      explicit RTO/RPO targets per data class and the operational discipline for cross-region credential / session / audit
      replication.
    detail: "Author `sys-mgmt/ops/multi-region-architecture.md` with:\n\n- Active-active option: per-region Server replicas,\
      \ regional\n  PostgreSQL primary + cross-region async replica, session-store\n  replication topology, signing-key access\
      \ pattern (regional\n  KMS recommended)\n- Active-passive option: warm secondary in another region with\n  documented\
      \ failover trigger, RTO target, manual / automated\n  failover playbook\n- Per-tenant data-residency: if multi-tenant\
      \ deployments need\n  per-tenant region binding (GDPR Article 44+ flows), document\n  the tenant-to-region pinning mechanism\
      \ (application-tier\n  routing or database-level constraints)\n- Cross-region audit replication policy (the audit log\
      \ is the\n  highest-priority cross-region replicated data class — losing\n  regional audit during failover is a Non-Repudiation\
      \ gap;\n  cross-references the Non-Repudiation specialist)\n\nAdopt the recommendation from Availability finding\navail-cfd2b6e8\
      \ (reference Postgres HA topology) as the\nsingle-region foundation this builds on.\n"
    references:
    - 'external: NIST SP 800-34 Rev. 1 (Contingency planning across geographic regions)'
    - 'external: AWS Well-Architected Framework — Reliability Pillar (multi-region patterns)'
  related_concerns:
