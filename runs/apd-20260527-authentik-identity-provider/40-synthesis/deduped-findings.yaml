  id: immut-1dc13874
  agent: immutability
  apd_tier: auditability
  apd_goal: immutability
  disposition: gap
  severity: high
  confidence: high
  title: Signing-key rotation history retention is not enumerated; after-the-fact 'which kid signed which token at what time'
    verification not supported
  summary: Per the identity-security immutability-classes catalog, signing-key lifecycle records must be queryable for post-incident
    token-verification; the inputs document rotation capability but not rotation-history retention.
  detail: 'The identity-security immutability-classes catalog: "Cryptographic

    key lifecycle records — key creation, rotation, revocation, and

    destruction events. Required for proving NIST SP 800-63B

    §5.1.4 key-management discipline ... The JWKS rotation history

    specifically must be queryable for after-the-fact assertion

    validation." The corresponding High clause: "Signing-key

    rotation history not retained — only the current and previous

    kid are queryable; older kids are dropped from JWKS-history

    table. Severity: high (after-the-fact verification of ''which

    kid signed which token at what time'' is impossible; post-

    incident compromise scoping fails)."


    The authentik inputs describe per-Provider signing-key rotation

    (`runbook.md` §6, ADR-0004) but not the JWKS rotation history

    retention. For a signing-key-compromise incident, the response

    requires: identify when the new key took effect, identify all

    tokens signed under the (now-suspect) old key during its

    active window, revoke / re-issue accordingly. Without rotation

    history retention, the question "is this token from before or

    after the rotation?" cannot be answered.


    Severity is high per the rubric. Cross-references Ephemeral

    finding ephem-0fb143ce (rotation cadence) and Non-Repudiation

    finding nonrep-c772c9f2 (per-token audit anchor).

    '
  evidence:
  - artifact: runbook.md
    locator: §6 'Provider signing-key rotation', steps 4-5
    excerpt: For OAuth providers, the JWKS endpoint at /application/o/<slug>/jwks/ automatically reflects the new key. RPs
      that fetch the JWKS will pick up the new key on
  - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
    locator: §Consequences > Positive, paragraph 3
    excerpt: each is individually rotatable.
  prerequisite_evidence:
  - 'JWKS rotation history retention specification: how long are old kids retained in the JWKS history table?'
  - Per-key active-window tracking (kid X was active from T1 to T2)
  - Linkage from per-token audit Event (Non-Repudiation nonrep-c772c9f2) to the kid that signed it
  control_mappings:
    nist_800_53r5:
    - SC-12
    - SC-12(2)
    - AU-11
    - SI-7
    mitre_attack:
    - technique: T1606
      sub_technique: T1606.001
      tactic: TA0006
      rationale: Investigation of T1606.001 (Forge Web Credentials) after signing-key compromise requires kid-level rotation
        history to scope blast radius; absent history, every token issued ever is suspect or none are.
    cwe:
    - CWE-778
    - CWE-916
  recommendation:
    posture: required
    summary: Retain signing-key rotation history indefinitely (or for the longest applicable regulatory retention); make every
      kid that has ever been published queryable with its active window, rotation event, and revocation event.
    detail: 'Add a `JWKSKeyHistory` model: every kid ever published has a

      row with `kid`, `key_provider`, `not_before`, `not_after`

      (active window), `rotation_event_id`, `revocation_event_id`

      (if any), `signing_algorithm`, `public_key` (PEM/JWK form for

      verification). Retention is at minimum the longest token

      lifetime issued under the kid plus the longest applicable

      regulatory retention.


      The Per-Token Issuance Event from nonrep-c772c9f2 captures

      the `signing_kid`; the JWKSKeyHistory table closes the loop —

      "this token was signed by kid X; kid X was active T1 to T2;

      tokens signed in that window are subject to investigation."

      '
    references:
    - 'external: NIST SP 800-57 Part 1 Rev. 5 §5.3.4 (Key lifecycle records)'
  related_concerns:
  - ephemeral
  - non_repudiation
  cross_references:
  - ephem-0fb143ce
  - nonrep-c772c9f2
