  id: dist-9b598237
  agent: distributed
  apd_tier: scalability
  apd_goal: distributed
  disposition: risk
  severity: high
  confidence: high
  title: PostgreSQL serves identity, audit, session, secret material, AND the task queue / channels-layer — single substrate
    concentrates failure domains
  summary: Per ADR-0002, the Postgres-backed alternatives (`django-dramatiq-postgres`, `django-channels-postgres`, `django-postgres-cache`)
    put queue, pub/sub, and cache on the same substrate as primary state.
  detail: 'ADR-0002 §Decision establishes the "single primary datastore"

    posture: "Operators who want to run authentik without Redis can

    do so; PostgreSQL alone is the supported posture." The

    consequence per §Negative item 5: "Channels-layer transport on

    PostgreSQL. Outpost-to-Server WebSocket signaling traffic

    ultimately rides PostgreSQL pubsub (LISTEN/NOTIFY) when

    `django-channels-postgres` is in use. A slow PostgreSQL impacts

    outpost responsiveness."


    The Distributed lens: this concentrates failure domains. A

    single Postgres incident (a long-running query, replication lag,

    connection pool exhaustion, an autovacuum stall) simultaneously

    degrades: authentication (auth-data reads), session lookup,

    audit writes, outpost configuration push (channels-layer),

    background tasks (dramatiq queue), and cache operations. The

    blast radius of "PostgreSQL is slow" is the entire platform,

    not a single subsystem.


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Session-store backpressure absent —

    Redis/PostgreSQL session store can be saturated by authentication

    storm, taking the entire IdP offline" — generalised to "every

    shared subsystem is saturated together." Cross-references

    Availability finding avail-cfd2b6e8 (the SLO consequence) and

    Resilient specialist for the bulkhead pattern.

    '
  evidence:
  - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
    locator: §Consequences > Negative / trade-offs, item 5
    excerpt: Channels-layer transport on PostgreSQL. Outpost-to-Server WebSocket signaling traffic ultimately rides PostgreSQL
      pubsub (LISTEN/NOTIFY) when django-channels-postgres is in use. A slow PostgreSQL impacts outpost responsiveness.
  - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
    locator: §Consequences > Negative / trade-offs, item 3
    excerpt: PostgreSQL-backed task queue load. Heavy SCIM sync / notification dispatch / Source sync all write to the same
      database that serves user-facing auth flows.
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-6
    - SC-36
    - SI-13
    mitre_attack:
    - technique: T1499
      sub_technique: null
      tactic: TA0040
      rationale: An adversary or accidental load spike against any single Postgres-served subsystem (queue, pub/sub, cache,
        primary state) saturates the shared substrate and produces a platform-wide endpoint denial.
  recommendation:
    posture: recommended
    summary: 'Document the trade-off in `install-config/`: Postgres-only is operationally simpler but concentrates failure
      domains; Redis (or dedicated queue) for cache + channels-layer reduces blast radius at the cost of more moving parts.'
    detail: "Update `install-config/` and ADR-0002 §Notes with explicit\nguidance on when to deploy Redis as a separate failure\
      \ domain:\n\n- Lab / single-tenant / small-scale: Postgres-only is fine\n- Production multi-tenant or production with\
      \ substantial SCIM\n  / Source-sync workload: deploy Redis (or a dedicated managed\n  cache/queue) for `django-channels-postgres`\
      \ and the dramatiq\n  queue, leaving Postgres to serve primary state\n- High-availability production: separate Redis\
      \ cluster +\n  Postgres HA topology, with explicit per-subsystem\n  monitoring so a single subsystem's saturation is\
      \ detectable\n\nCross-references Distributed finding dist-b8b7603b\n(multi-region) — the substrate-decomposition pattern\
      \ composes\nwith multi-region for fully resilient deployment.\n"
    references:
    - 'internal: adrs/0002-django-celery-redis-postgresql-stack.md (the ADR this updates)'
  related_concerns:
  - availability
  - resilient
  cross_references:
  - avail-cfd2b6e8
