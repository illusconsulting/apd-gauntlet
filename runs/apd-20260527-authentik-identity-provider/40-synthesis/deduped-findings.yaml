    severity: critical
    title: "AUTHENTIK_SECRET_KEY is single master decryption key for all stored secrets; in-process reachable from any Expression policy"
    apd_goal: confidentiality
    disposition: risk
    source_file: 10-trustworthiness/confidentiality.findings.yaml
    cross_references: []

  - id: conf-6dd9d98a
    severity: high
