  - artifact: architecture-index.md
    locator: '`redis` component, Notable surface line'
    excerpt: Anyone with network access to Redis can read every cached session and, if the channels layer is on Redis, every
      outpost-signaling WebSocket frame.
  prerequisite_evidence:
  - Whether the active deployment uses Redis for channels-layer (vs. the django-channels-postgres alternative)
  - Whether outpost-signaling WebSocket payloads on the channels layer carry plaintext client_secret material
