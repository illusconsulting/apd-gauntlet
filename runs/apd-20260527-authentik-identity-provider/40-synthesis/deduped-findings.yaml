    summary: Ship a default log-forwarding integration for common SIEMs (Fluent Bit / Vector / Filebeat sidecar configurations);
      document the SIEM-side parser for authentik Event JSON; recommend a short internal retention when SIEM is the source-of-truth.
    detail: "Three changes:\n\n1. **Default log-forwarding deployment artifacts** — ship in\n   `examples/log-forwarding/`\
      \ Fluent Bit configurations for\n   common SIEM targets (Elastic, Splunk, Loki, Datadog,\n   OpenSearch). Operators\
