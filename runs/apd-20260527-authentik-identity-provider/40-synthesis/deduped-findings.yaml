  title: PostgreSQL is the universal SPOF for identity / session / audit / secret material — loss = total platform unavailability
  summary: 'Per ADR-0002 §Negative item 2: ''Loss of the database means loss of all identity, audit, session, and secret-encrypted
    material.'''
  detail: 'ADR-0002 makes the trade-off explicit: "Postgres becomes the

    single point of failure. Loss of the database means loss of all

    identity, audit, session, and secret-encrypted material. Per the

    backup-restore doc: ''Without it, authentik cannot be restored to

    a usable state.''" `sys-mgmt/ops/backup-restore.md` echoes:

    "The PostgreSQL database is the most important part of an

    authentik backup. Without it, authentik cannot be restored to a

    usable state." Tech plan §9 confirms all persistent state lives

    in PostgreSQL.


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Single-region IdP deployment with a

    99.9%+ availability target asserted to downstream RPs" — and

    escalates because the same Postgres instance also carries the

    session store, the audit log, and the encrypted secret material.

    A Postgres outage simultaneously denies new authentication, drops

    in-flight sessions (depending on session backend choice), and

    prevents audit-log writes — the latter cross-references the

    Non-Repudiation lens (audit pipeline depending on the same

    substrate as the auth flow it audits is a known anti-pattern).


    Note: this is a topology/SPOF finding; the Distributed specialist

    will own the failure-domain framing; the Availability lens here

    is the contractual SLO question (can the IdP deliver its asserted

    uptime with this topology?).

    '
  evidence:
  - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
    locator: §Consequences > Negative / trade-offs, item 2
    excerpt: Postgres becomes the single point of failure. Loss of the database means loss of all identity, audit, session,
      and secret-encrypted material.
  - artifact: tech_plan.md
    locator: §9 'Persistence and storage', PostgreSQL bullet
    excerpt: PostgreSQL — primary store. ... Without it, authentik cannot be restored to a usable state.
  control_mappings:
    nist_800_53r5:
    - CP-2
    - CP-7
    - CP-7(1)
    - CP-9
    - SC-36
    - SC-6
    mitre_attack:
    - technique: T1485
      sub_technique: null
      tactic: TA0040
      rationale: PostgreSQL destruction (deliberate or accidental) destroys the IdP's identity, session, audit, and secret-bearing
        state in a single substrate, denying authentication to every dependent application.
  recommendation:
    posture: required
    summary: Document a reference high-availability Postgres topology (managed RDS / Cloud SQL with multi-AZ failover, or
      Patroni-on-Kubernetes with two replicas + arbiter) as the production-recommended deployment posture; promote it from
      operator-improvised to platform-recommended.
    detail: "Author a `sys-mgmt/ops/high-availability.md` doc that prescribes:\n\n- Managed Postgres options per cloud (RDS\
      \ Multi-AZ, Cloud SQL HA,\n  Azure Database for PostgreSQL HA) — with the trade-offs (RTO,\n  RPO, failover latency)\
      \ per option\n- Self-hosted Patroni topology on Kubernetes with three-node\n  quorum, automated failover, and synchronous-replication\n\
      \  options\n- Continuous archiving for PITR with off-site WAL shipping\n- Cross-region disaster-recovery story with\
      \ an explicit RPO\n  target\n- Failover drill cadence\n\nFor the application tier: document the multi-replica\nServer/Worker\
      \ posture with sticky-session-NOT-required (per\nthe identity-security common-patterns warning against sticky\nsessions);\
      \ document how the active-active topology coordinates\nacross replicas (sessions in Postgres or Redis, both\nexternalised\
      \ from process memory).\n"
    references:
    - 'external: NIST SP 800-34 Rev. 1 §3.3 (Contingency planning for HA)'
    - 'internal: install-config/install/kubernetes.md (the existing Helm install reference)'
