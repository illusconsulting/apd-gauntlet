    excerpt: Source attribute mapping is via Python expression property mappings; the same expression engine that powers Policies.
  - artifact: happy-path.md
    locator: §8 'Source-driven first login', What happens steps 2-3
    excerpt: The Source stage hands the user off to the upstream IdP. The upstream IdP authenticates the user and returns
      the assertion / token to authentik.
  prerequisite_evidence:
