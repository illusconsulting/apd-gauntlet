  severity: high
  confidence: high
  title: OAuth UserConsent records appear to be mutable; consent revocation as a new event vs. consent-record overwrite is
    not asserted
  summary: Per the identity-security immutability-classes catalog, consent records must preserve the proof-of-prior-consent
    obligation across the consent window even after revocation.
  detail: 'The identity-security immutability-classes catalog: "Consent

    grant records (OAuth/OIDC and SAML attribute-release

    acknowledgements) — GDPR Article 6(1)(a) lawful-basis evidence

    for the processing that occurred during the consent window.

    Consent withdrawal must be recorded as a new event, never as

    overwriting the prior grant. The proof-of-prior-consent

    obligation outlives the grant itself." The corresponding High-

    severity rubric clause: "OAuth/OIDC consent records mutable —

    consent revocation overwrites the consent record rather than

    recording revocation as a new event. Severity: high (the

    proof-of-consent for processing that occurred during the

    consent window is destroyed; GDPR Article 6(1)(a) defense fails

    for any processing that occurred during the consent window)."


    The authentik inputs document UserConsent records

    (`tech_plan.md` §8 data model implicitly via the consent stage)

    but do not enumerate the consent-lifecycle discipline. Whether

    revocation creates a new event vs. updates the existing record

    is not asserted. For an IdP that needs to support GDPR

    Article 15 (data subject access) and Article 5(2) (accountability),

    this is consequential — the consent history must be

    reconstructable.


    Severity is high per the rubric. Cross-references the Non-

    Repudiation finding nonrep-a8ea0a0c (per-use consent audit).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §4 stage taxonomy, consent bullet
    excerpt: consent — OAuth scope consent prompt.
  - artifact: tech_plan.md
    locator: §8 'Data model', overview
    excerpt: Application — façade for Providers; carries the access policy binding.
  prerequisite_evidence:
  - 'Consent-lifecycle specification: does revocation create a new ConsentRevocation record or update the UserConsent in place?'
  - Per-user consent history queryability
  - Retention policy for revoked consent records (must outlive the consent window for accountability)
  control_mappings:
    nist_800_53r5:
    - AU-11
    - AU-9
    - CM-2(3)
    - AC-21
  recommendation:
    posture: required
    summary: Make consent grant and revocation immutable append-only events; UserConsent represents 'currently effective'
      state derived from the event stream; per-Provider per-user query returns the full history.
    detail: "Event-sourced consent model:\n\n- `OAuthConsentGranted` event records the grant (user,\n  client_id, scope set,\
      \ expiry, source flow, AAL claim) — never\n  mutated\n- `OAuthConsentRevoked` event records the revocation (user,\n\
      \  client_id, scope set, source — user-initiated / admin /\n  credential change) — never mutated; does not delete the\n\
      \  prior grant event\n- `UserConsent` is the derived \"currently effective consent\"\n  read-model, materialised from\
      \ the event stream; revoking\n  consent updates the read-model but does not destroy the\n  history\n- The full consent\
      \ history is queryable for Article 15 data\n  subject access requests and for breach-investigation\n  forensic reconstruction\n\
      \nCross-references nonrep-a8ea0a0c (per-use consent audit) — the\nfull picture is \"consent granted, consent used, consent\n\
      revoked\" all immutably captured.\n"
    references:
    - 'external: GDPR Article 6(1)(a) (consent as lawful basis)'
    - 'external: GDPR Article 15 (data subject access to consent history)'
  related_concerns:
  - non_repudiation
  - confidentiality
  cross_references:
  - nonrep-a8ea0a0c
