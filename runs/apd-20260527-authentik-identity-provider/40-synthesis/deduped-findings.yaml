  summary: Per `architecture-index.md` Redis component, in the bundled compose Redis is not authenticated; channels-layer
    pub/sub frames may include outpost-signaling payloads.
  detail: '`architecture-index.md` documents the boundary: "Not authenticated

    by default in the bundled compose ... Anyone with network access to

    Redis can read every cached session and, if the channels layer is

    on Redis, every outpost-signaling WebSocket frame." This is a

    conditional surface — operators may choose the Postgres-backed

    alternatives per ADR-0002 and not run Redis at all — but for

    operators who configure Redis (which the docs still describe as

    supported via `AUTHENTIK_REDIS__*` settings), the default posture

    is no-auth.


    Severity is medium per the identity-security severity rubric (which

    doesn''t have an exact clause for this; the closest analog is the

    "Anonymous LDAP bind permitted by upstream directory" medium pattern

    — an in-cluster credentialless read of identity-platform state).

    Escalates to high if the channels layer is on Redis AND the

    WebSocket frames include per-Provider client_secret material per

    the outpost configuration push.

    '
