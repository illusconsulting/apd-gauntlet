      sub_technique: null
      tactic: TA0006
      rationale: Investigation of T1528 (Steal Application Access Token) requires per-token forensic anchor; absent the jti
        / opaque-ID capture, lateral movement via stolen token cannot be reconstructed.
    cwe:
