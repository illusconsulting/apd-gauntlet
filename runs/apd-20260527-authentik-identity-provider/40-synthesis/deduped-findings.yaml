    - A04:2021
    owasp_api_top10:
    - API3:2023
  recommendation:
    posture: recommended
    summary: Add a per-Provider 'sensitive groups allowlist' on the OAuth Provider so admin/superuser-shaped groups are filtered
      out of federated claims by default; require explicit operator opt-in to release them.
    detail: 'Add a `released_groups_filter` field on `OAuth2Provider` defaulting

      to a regex that excludes `^authentik Admins$`,

      `^Administrators$`, `*-admin$` patterns. Custom claim mappings

