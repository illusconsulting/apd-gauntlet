  title: OIDC `pairwise` subject type support is not enumerated; default subject mode is hashed user ID
  summary: Per `happy-path.md` §9 the OAuth Provider creation 'Subject mode' defaults to hashed user ID; whether OIDC `pairwise`
    per-issuer-per-audience pseudonymous subject is supported is not enumerated.
  detail: 'Happy-path §9 step 3: "Subject mode (hashed user ID is the

    default)." The OIDC Core 1.0 specification §8.1 defines two

    subject types: `public` (same `sub` to every RP) and `pairwise`

    (per-issuer-per-audience pseudonymous `sub`). Pairwise reduces

    cross-RP user-correlation risk: if RP1 and RP2 both receive

    tokens for the same user, the `sub` values differ and the user

    cannot be correlated across RP1 and RP2 by `sub` alone. The

    authentik inputs document the hashed-user-ID default but do not

    enumerate whether pairwise is supported, how to configure it,

    or what the deployment trade-offs are.


    Disposition is blocked: the inputs are silent on pairwise

    support. Severity is medium per the identity-security data

    taxonomy: "flag findings on `public` subject type when

    re-identification risk is in scope." For deployments where the

    user population spans multiple RPs that should not be able to

    cross-correlate users (e.g., a public IdP serving multiple

    independent vendor RPs), pairwise is a privacy-relevant control.

    '
  evidence:
  - artifact: happy-path.md
    locator: §9 'Operator creates an OAuth Application + Provider pair', step 3
    excerpt: Subject mode (hashed user ID is the default).
  prerequisite_evidence:
  - Whether OIDC `pairwise` subject type is supported
  - Per-Provider configuration of subject type
  - Whether the hashed-user-ID default is hashed-with-RP-salt (pairwise-equivalent) or just hashed-globally (public-equivalent)
  control_mappings:
    nist_800_53r5:
    - IA-4
    - AC-21
  recommendation:
    posture: recommended
    summary: Document OIDC pairwise subject-type support in the OAuth provider doc; if not currently supported, add it as
      a per-Provider option.
    detail: 'Confirm the current behavior of the ''hashed user ID'' default —

      if it is per-Provider-salted then it is functionally pairwise

      and just needs naming clarification; if it is globally hashed

      then it is functionally `public` and pairwise needs to be

      added as an option.


      Document the privacy trade-offs of public vs pairwise in the

      OAuth provider doc; recommend pairwise for B2C / multi-tenant

      / public-IdP-serving-independent-vendors deployments.

      '
    references:
    - 'external: OIDC Core 1.0 §8.1 (Subject Types)'
  related_concerns:
  - confidentiality
  cross_references: []
