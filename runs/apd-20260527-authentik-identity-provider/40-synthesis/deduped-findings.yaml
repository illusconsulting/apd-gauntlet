  detail: 'Runbook §4: "Default retention: 365 days (configurable in

    System > Settings). Forwarding posture: container stdout. The

    doc recommends ''If you want to forward these events to another

    application, forward the log output of all authentik

    containers.'' Every event creation is logged with the log level

    info'' and combining this with a shortened internal retention

    (`days=1`)." Threat-model R-2: "Out-of-the-box, what fraction

    of operators configure log forwarding? The shipped

    configuration does not enable it. Without forwarding, the

    database-resident Event log is mutable and there is no tamper-

    evidence." INV-OPS-002 echoes: "Holds for in-platform retention.

    Log forwarding is operator-driven; absent forwarding, the

    Postgres-resident Event records are mutable by anyone with

    database write (or per threat-model T-1, Expression engine RCE)."


    The Non-Repudiation lens: the audit pipeline has a documented

    SPOF (the same Postgres that holds the rest of the platform''s

    state, per ADR-0002) and no shipped log-forwarding integration.

    For an unhardened community install without operator-configured

    log forwarding, an attacker with Expression-policy RCE (per

    ADR-0001) walks straight to the audit substrate and can edit /

    delete Event rows.


    Severity is high per the identity-security severity rubric:

    this matches the High clause "Audit pipeline single-point-of-

    failure — single broker, single sink, no buffer between

    application and broker; broker outage produces silent audit

    loss." The substrate here is Postgres rather than Kafka, but the

    pattern is identical and the consequence is worse (the audit

    substrate is in the same data plane as the system being

    audited).

    '
