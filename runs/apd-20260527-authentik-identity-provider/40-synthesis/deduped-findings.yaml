  title: Circuit breakers on outbound calls to upstream Source IdPs, SCIM targets, and webhook subscribers are not enumerated
  summary: The platform makes substantial outbound calls (Source sync, SCIM provisioning, email, webhooks) but the inputs
    do not document circuit-breaker, retry-budget, or backoff discipline.
  detail: 'Per `tech_plan.md` §3 boundary 5 and the architecture index, the

    Server and Worker make outbound calls to: upstream Source IdPs

    (OAuth, SAML, LDAP, OIDC, SCIM, Plex, Kerberos, social-logins),

    SCIM target endpoints, email providers (SMTP), HIBP API (when

    Password policy enabled), arbitrary HTTP for blueprint URL

    fetching. None of these are documented with circuit-breaker

    thresholds, retry budgets, or jitter discipline. Threat-model

    D-7 confirms this for SCIM: "What is the default SCIM-call

    timeout?" — unenumerated.


    The identity-security common-patterns Resilient guidance is

    explicit: "No circuit breaker on the IdP-to-user-store path

    (LDAP, AD, upstream IdP for federation chains, user database).

    Severity: high (user-store degradation cascades to user-facing

    latency and request-handler exhaustion; without circuit-breaker,

    a slow LDAP backend takes down every IdP worker by tying up its

    connection pool)." Same pattern applies to SCIM-out, webhook-out.


    Severity is high per the identity-security severity rubric: the

    Resilient common-pattern High clause directly anchors this.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §3 boundary 5, SECURITY.md quote
    excerpt: Outgoing network requests are not filtered ... these requests should be restricted at the network level using
      appropriate firewall or network policies.
  - artifact: architecture-index.md
    locator: '`worker` component, Outbound paragraph'
    excerpt: SMTP; Source IdPs (during sync); SCIM target endpoints; Docker socket (Docker integration); Kubernetes API (K8s
      integration); external HTTP for blueprint URL fetching; HIBP API
  control_mappings:
    nist_800_53r5:
    - SI-13
    - SI-13(4)
    - SC-5
    - SC-5(1)
    mitre_attack:
    - technique: T1499
      sub_technique: T1499.001
      tactic: TA0040
      rationale: A slow upstream Source IdP without a circuit breaker exhausts the IdP's outbound connection pool and produces
        a self-DoS via OS resource exhaustion.
    cwe:
    - CWE-400
  recommendation:
    posture: required
    summary: 'Implement circuit breakers with documented thresholds on every outbound call path: Source IdPs, SCIM targets,
      email, webhooks, HIBP. Default per-call timeout of 30s; circuit opens after N consecutive failures or M-percentile-latency
      breach; half-open recovery.'
    detail: "For each outbound integration:\n\n- Source sync (per Source): per-call timeout 30s; circuit opens\n  after 5\
      \ consecutive failures; half-open after 60s\n- SCIM provisioning (per target): per-call timeout 30s; circuit\n  opens\
      \ after 5 consecutive failures; half-open after 60s;\n  queue draining policy when circuit is open (per-target queue\n\
      \  rather than blocking other targets)\n- Email (per provider): per-call timeout 60s; circuit opens after\n  10 consecutive\
      \ SMTP errors; half-open after 5min\n- Webhook subscribers (per subscriber): per-call timeout 10s;\n  circuit opens\
      \ after 3 consecutive failures; subscribers with\n  repeated open-circuit failures are notified to subscriber-side\n\
      \  oncall (an out-of-band signal)\n\nDocument the circuit-breaker observability (Prometheus metrics\nper dependency,\
      \ alerting rule on extended circuit-open state).\nCross-references Availability finding avail-311725ea (per-task\nqueue\
      \ isolation) — the bulkhead and circuit-breaker patterns\nship together.\n"
    references:
    - 'external: Michael Nygard, Release It!, Circuit Breaker pattern'
    - 'external: Google SRE Workbook chapter 22 (Cascading Failures)'
  related_concerns:
  - availability
  - distributed
  cross_references:
  - avail-311725ea
