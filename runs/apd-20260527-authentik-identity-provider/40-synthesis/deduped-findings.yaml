  title: Per-audit-class retention policy is not enumerated; the platform-wide '365 days' default does not differentiate authn
    / token / consent / federation / key-lifecycle / admin retention
  summary: Per the identity-security immutability-classes catalog, per-class retention should align with regulatory requirements;
    the authentik default is a single platform-wide value.
  detail: '`runbook.md` §4 / `INV-OPS-002`: "Default retention: 365 days

    (configurable in System > Settings)." This is a single

    platform-wide retention value. The identity-security

    immutability-classes catalog calls for per-class retention

    aligned to regulatory exposure: authentication events (longest

    plausible breach-detection window), authorization decision log

    (SOC 2 CC6.3 + GDPR 5(2)), consent records (GDPR Article 6(1)(a)

    proof-of-prior-consent obligation outliving the grant window),

    token issuance log (after-the-fact signing-key compromise scope),

    cryptographic key lifecycle records (NIST 800-63B + PCI 3.6),

    federation-trust establishment (post-compromise attribution).


    Disposition is blocked: the inputs document the global

    retention default; the per-class differentiation is unconfirmed.

    Severity is medium because the consequence depends on regulatory

    exposure — operators with SOC 2 or PCI commitments must

    manually compose per-class retention from the global default

    and operator-driven log forwarding.

    '
  evidence:
  - artifact: runbook.md
    locator: §4 'Audit log inspection and forwarding'
    excerpt: 'Default retention: 365 days (configurable in System > Settings).'
  - artifact: invariants.md
    locator: §INV-OPS-002
    excerpt: Event audit trail retention default is 365 days
  prerequisite_evidence:
  - Per-audit-class retention policy (authentication, authorization, consent, federation, admin, token-lifecycle, key-lifecycle)
  - Per-class regulatory anchor (which compliance regime drives each retention)
  - Enforcement mechanism (storage-tier lifecycle vs. application-level)
  - Legal-hold override procedure
  control_mappings:
    nist_800_53r5:
    - AU-11
    - AU-11(1)
    - MP-4
  recommendation:
    posture: recommended
    summary: 'Add per-audit-class retention configuration: separate retention values for authentication, authorization, consent,
      federation, admin, token-lifecycle, key-lifecycle event classes; document the per-class regulatory anchors.'
    detail: "Per-class retention defaults aligned to identity-security\ncommon patterns:\n\n- Authentication events: 7 years\
      \ (SOC 2 / breach-detection\n  window per NIST 800-92)\n- Authorization events: 7 years (SOC 2 CC6.3)\n- Token issuance\
      \ / lifecycle: longest active token lifetime\n  plus 7 years (post-incident reconstruction)\n- Consent grant + revocation:\
      \ indefinite (GDPR 6(1)(a)\n  accountability)\n- Federation-trust changes: indefinite (post-compromise\n  attribution)\n\
      - Admin actions: 7 years (SOC 2 CC8.1)\n- Key-lifecycle events: indefinite (NIST 800-63B §5.1.4)\n\nEach retention configurable;\
      \ document the per-class regulatory\nanchor in `sys-mgmt/events/retention.md`.\n"
    references:
    - 'external: NIST SP 800-92 §3.5 (Audit retention guidance)'
