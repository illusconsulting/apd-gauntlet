  title: SAML assertion log captures issuance; per-assertion attribute-release set is not enumerated as captured
  summary: Per the identity-security common-patterns Non-Repudiation guidance, SAML attribute-release per-SP is privacy-relevant
    audit; the inputs document SAML signing but not per-assertion attribute capture.
  detail: 'The identity-security common-patterns Non-Repudiation guidance:

    "SAML assertion log captures assertion issuance but does not

    capture the attribute-release set per assertion — privacy

    attestation for ''which attributes were released to which SP at

    which time'' is incomplete. Severity: high (GDPR Article 5(1)(c)

    data-minimization defense requires evidence of what was actually

    released; this is the equivalent of record-level access logging

    for federation)."


    The authentik inputs document SAML assertion issuance

    (`tech_plan.md` §6 SAML, `happy-path.md` §5) but the audit

    content for SAML assertions is not enumerated. Given the

    default SAML attribute-release maximalism (Confidentiality

    finding conf-22a9ce55 — default property mappings release

    UPN + Group + Email + Name + User ID + Username +

    WindowsAccountName), per-assertion attribute capture is

    especially load-bearing for GDPR defense: the IdP should be

    able to prove which attributes left the boundary per assertion.


    Severity is high per the rubric. Cross-references the SAML

    attribute-release Confidentiality finding.

    '
  evidence:
  - artifact: happy-path.md
    locator: §5 'Application access (SAML happy path)', step 2
    excerpt: The AuthnAssertion includes the NameID per the Provider's NameID policy (Persistent / x509 / Windows / Transient
      / Email) and the configured attribute set per
  - artifact: tech_plan.md
    locator: §6 SAML, NameID bullet
    excerpt: NameID policy is configurable per-Provider
  control_mappings:
    nist_800_53r5:
    - AU-2
    - AU-3
    - AU-12
    - AC-21
  recommendation:
    posture: required
    summary: Capture per-SAML-assertion attribute-release set in the SAML assertion-issuance Event; include assertion_id,
      audience SP entity ID, subject NameID, attribute names (not values for sensitive attributes), signing-key kid.
    detail: "SAML assertion-issuance Event fields per the identity-security\nconsequential-actions catalog:\n\n- `assertion_id`\
      \ (per SAML spec)\n- `audience_sp_entity_id`\n- `subject_nameid` (the actual NameID; for Persistent /\n  x509 / Windows\
      \ this is the stable identifier)\n- `attribute_names_released` (list of attribute names; values\n  captured only for\
      \ non-sensitive attributes; sensitive\n  attribute values redacted to \"<released>\")\n- `signing_key_kid`\n- `not_on_or_after`\
      \ (assertion expiry)\n- `assertion_size_bytes` (for anomaly detection on attribute\n  over-release)\n\nThis pairs with\
      \ the OAuth per-token audit recommendation\n(nonrep-c772c9f2) — together they cover the federation audit\nsurface.\n"
    references:
