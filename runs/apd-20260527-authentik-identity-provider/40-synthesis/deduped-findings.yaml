    owasp_api_top10:
    - API9:2023
  recommendation:
    posture: required
    summary: Ensure every token issuance Event captures the token identifier (JWT `jti` or opaque token-ID); link refresh-token
      rotation chains via a family-ID; link revocation and introspection events to the issuance event by identifier.
    detail: "Audit field additions (per the identity-security data\ntaxonomy):\n\n- Per-Issuance Event: `token_id` (jti for\
