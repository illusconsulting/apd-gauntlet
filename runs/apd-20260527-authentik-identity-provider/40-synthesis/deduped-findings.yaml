  severity: medium
  confidence: medium
  title: Audit time-source policy is not enumerated; timestamp precision and NTP discipline for token-issuance audit are unconfirmed
  summary: Per the identity-security common-patterns Non-Repudiation guidance, audit timestamp precision and NTP discipline
    are required for ordering token-issuance events; the inputs do not enumerate authentik's time-source posture.
  detail: 'The identity-security common-patterns Non-Repudiation guidance:

    "No time-source policy — audit timestamps are local system

    clocks with no NTP discipline, no drift bounds, no fallback to

    a secondary stratum. Disposition: uncertainty or blocked."


    For an IdP, audit ordering is consequential: a sub-second

    ordering of "token issued, user signed in, admin disabled MFA,

    token used at RP" determines reconstruction of an incident.

    Without microsecond timestamp precision and bounded clock-skew

    between Server / Worker instances, post-incident timeline

    reconstruction has uncertainty at every multi-component step.


    Disposition is blocked because the inputs are silent on this;

    severity is medium because the consequence depends on the

    actual platform behavior — Linux container default time-source

    discipline is typically NTP-from-host with reasonable precision,

    but the absence of platform-asserted bounds is the GAP.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §2 'Architecture', diagram footer
    excerpt: 'PostgreSQL ← Background Worker (Celery-style task runner: events, notifications, SCIM sync, Source sync, outpost
      lifecycle)'
  prerequisite_evidence:
  - 'Time-source posture: NTP topology, time-source authority'
  - Drift bounds enforced between Server / Worker instances
  - Timestamp precision per audit-Event class (millisecond required for token-issuance audit per common-patterns guidance)
  - Behavior on time-source failure
  control_mappings:
    nist_800_53r5:
    - AU-8
    - AU-12
    - AU-12(1)
  recommendation:
    posture: recommended
    summary: Document the time-source posture in `sys-mgmt/`; recommend microsecond-precision timestamps on token-issuance
      Events; assert drift bounds across multi-replica deployments.
    detail: "Author `sys-mgmt/ops/time-source-discipline.md`:\n\n- Required: NTP synchronization across Server / Worker\n\
      \  replicas (most container deployments inherit from the host\n  which is typically NTP-disciplined)\n- Recommended:\
      \ microsecond timestamp precision for token-\n  issuance, authn-success, authz-decision, key-lifecycle events\n- Drift\
      \ bounds: alert when inter-replica skew exceeds 50ms\n- Failure handling: log time-source-failure events themselves\n\
      \  as security-relevant; refuse new token issuance if drift\n  exceeds 500ms\n\nThis converts time-discipline from inherited-from-environment\n\
      to platform-asserted; supports SOC 2 CC7.2 (time precision in\naudit trails).\n"
    references:
    - 'external: NIST SP 800-92 §4.4 (Audit timing)'
  related_concerns:
  - immutability
  - distributed
  cross_references: []
