  - id: conf-e08662e7
    severity: high
    title: "Outpost-to-Server WebSocket TLS requirement is not enumerated; outpost service-account token plus configuration payload travel on possibly-plaintext channel"
    apd_goal: confidentiality
    disposition: gap
    lens_perspectives:
      confidentiality:
        summary: "Configuration payload (with per-Provider client_secrets) and outpost service-account token traverse possibly-plaintext WebSocket."
        detail: "Network-positioned attacker between outpost and Server reads service-account token plus payload."
      authenticity:
        summary: "Outpost service-account token is the outpost's identity assertion to the Server; plaintext channel makes credential passively recoverable."
        detail: "Common-pattern High clause 'shared bearer tokens, not mTLS or workload identity'; mTLS workload identity is the proportional upgrade."

