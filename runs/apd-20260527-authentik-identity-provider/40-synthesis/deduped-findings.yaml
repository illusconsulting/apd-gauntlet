  title: Account Lockdown atomic-revocation is Enterprise-only; Community-tier operators must execute a multi-step racy manual
    procedure
  summary: Per `runbook.md` §12 and `invariants.md` INV-OPS-001, the atomic single-action lockdown (deactivate user + sets
    unusable password + terminates sessions + revokes all tokens) is Enterprise; Community operators run a five-step manual
    procedure with race-condition exposure.
  detail: 'Runbook §12: "For Community-tier installs without the Lockdown stage,

    the equivalent manual procedure is: 1. Edit the user; set Inactive.

    2. Use the Set Password control to set an unusable password.

    3. Navigate to the user''s Sessions tab and revoke each session.

    4. Navigate to the user''s Tokens tab and revoke each token.

    5. Create an Event manually (or rely on the model-write events for

    each of the above actions). The manual procedure is multi-step

    and racy; the Enterprise Lockdown stage is single-action and

    atomic." INV-OPS-001: "Holds for Enterprise installs. Community

    installs require the manual multi-step procedure in runbook §12."


    Severity is high per the identity-security severity rubric — this

    sits between the High clause "Service account token long-lived and

    unrotated" (because the multi-step procedure leaves a window

    during which the compromised account still holds valid tokens)

    and the lower-severity "Recovery flow weaker than primary login"

    pattern. The integrity lens is transactional: deactivating the

    User without simultaneously revoking sessions and tokens means the

    attacker holding a valid session token continues to act as the

    user between steps 1 and 3. The race is observable in production

    incident response — the responder cannot tell whether they have

    completely contained the compromise without checking each tab

    separately.


    Cross-references the Availability/Ephemeral specialists for the

    consequential-action-incompleteness framing and the

    Non-Repudiation specialist for the partial-audit-trail framing

    (the manual procedure may emit multiple uncorrelated Events

    rather than one atomic lockdown Event).

    '
  evidence:
  - artifact: runbook.md
    locator: §12 'Account compromise response', final paragraph
    excerpt: The manual procedure is multi-step and racy; the Enterprise Lockdown stage is single-action and atomic.
  - artifact: invariants.md
    locator: §INV-OPS-001, Reviewer note
    excerpt: Holds for Enterprise installs. Community installs require the manual multi-step procedure in runbook §12.
  control_mappings:
    nist_800_53r5:
    - AC-2
    - AC-2(13)
    - AC-12
    - AC-12(1)
    - IR-4
    - IR-4(1)
    mitre_attack:
    - technique: T1098
      sub_technique: null
      tactic: TA0003
      rationale: Multi-step manual lockdown leaves a window during which compromised session tokens remain valid; an attacker
        with an active session evades partial-state remediation.
    cwe:
    - CWE-362
    owasp_top10:
    - A07:2021
  recommendation:
    posture: required
    summary: Ship an atomic compromise-response mechanism in the Community tier — either backport the Account Lockdown stage
      to Community or document a single-API-call atomic-lockdown procedure.
    detail: 'The simplest path is to make Account Lockdown a Community-tier

      feature. The functional requirement (atomic deactivation +

      password invalidation + session termination + token revocation

      + audit event) does not appear to depend on enterprise-specific

      infrastructure; if the EE-licensing posture must remain, then

      ship a single Community API call (e.g.

      `POST /api/v3/core/users/<id>/atomic_lockdown/`) that performs

      the five steps in a single database transaction with a

      single composite Event, and document it in the Community

      runbook.


      Without this, Community operators cannot meet GDPR Article 32

      "ability to ensure the ... confidentiality, integrity ... of

      processing systems" under post-incident pressure.

      '
    references:
    - 'internal: security/account-lockdown.md (the Enterprise feature this generalises)'
    - 'external: GDPR Article 32 (security of processing)'
