  title: Per-token audit anchor (linking issuance, refresh, revocation, use via JWT `jti` or opaque token ID) is not enumerated
  summary: Per the identity-security common-patterns Non-Repudiation guidance and threat-model R-1 / R-2, per-token audit
    linking is the foundation for token-loss investigation; the authentik inputs do not enumerate the per-token audit anchor.
  detail: 'The identity-security common-patterns Non-Repudiation guidance:

    "Token issuance audit lacks the token identifier (jti, opaque

    token ID) — log says ''user X received a token'' but does not

    link the token back to a later use. Severity: high (forensic

    reconstruction of ''which token did the attacker use, when did

    we issue it, and which other tokens were issued in the same

    session'' is impossible without per-token identifiers)."


    The authentik inputs document Event types (`tech_plan.md` §8

    Event model: "Action, app, context (JSON), user, client_ip")

    but do not enumerate the per-token audit fields. For

    forensic-reconstruction purposes — given a leaked access token,

    identifying when it was issued, by what Flow execution, with

    what refresh-token family, against which RP, and which other

    tokens are derivative — the platform should capture the JWT

    `jti` for JWT tokens and an opaque identifier for opaque

    tokens, and audit the issuance / refresh / revocation /

    introspection events linked through those identifiers.


    Severity is high per the rubric — common-pattern High clause

    directly. Cross-references Resilient finding resil-0e6a988b

    (refresh-token rotation chain auditability) and Ephemeral

    finding (rotation cadence) — the same architectural change

    enables both rotation discipline and per-token audit.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §8 'Data model', Event entry
    excerpt: Event — append-only audit record. Action, app, context (JSON), user, client_ip.
  - artifact: threat-model.md
    locator: §R-1 'Audit-log completeness for Expression-policy actions', Impact line
    excerpt: 'Auditability gap: post-incident reconstruction misses expression-driven side effects.'
