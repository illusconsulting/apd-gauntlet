  title: 'Signing-key availability vs. latency: per-Provider signing happens in the Server process; HSM/KMS round-trip latency
    not characterized'
  summary: Per ADR-0004 the per-Provider signing private keys are stored in PostgreSQL encrypted under AUTHENTIK_SECRET_KEY;
    signing is in-process; if operators bind external KMS the round-trip latency is not characterized.
  detail: 'ADR-0004 establishes that signing private keys are in PostgreSQL,

    encrypted under the secret_key, and (implicitly) signing happens

    in the Server process after decrypting the key. For deployments

    where operators have wrapped the secret_key delivery with an

    external KMS at the infrastructure layer (e.g., Kubernetes

    Secret + KMS encryption-at-rest on etcd), the per-token signing

    itself remains in-process because the secret_key is loaded into

    process env at startup. For deployments that might want

    per-token KMS calls (a stronger HSM-backed posture), the

    identity-security common-patterns availability guidance applies:

    "Signing-key availability vs. latency tradeoff unaddressed — HSM

    in one region, IdP serves traffic from three; signing-operation

    latency drives p99 token-issuance latency through the floor."


    Severity is medium per the identity-security severity rubric:

    this is the same Medium-to-high "Signing-key availability vs.

    latency tradeoff" clause — medium because the current

    architecture avoids the per-token HSM round-trip by holding the

    key in-process, but that has the consequence noted in finding

    conf-477ff8a1 (any Expression policy can read it). The tradeoff

    is currently weighted toward latency at the cost of confidentiality.

    '
  evidence:
  - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
    locator: §Decision, paragraph 2
    excerpt: The key lives in the .env file (operator-managed) and is loaded into the Server and Worker process environments
      at startup.
  control_mappings:
    nist_800_53r5:
    - SC-12
    - SC-12(3)
    - CP-7
    - SI-13
  recommendation:
    posture: consider
    summary: Document the signing-latency-vs-confidentiality trade-off in ADR-0004 §Notes; when external-KMS-binding is added
      per finding conf-477ff8a1, characterize the per-token signing latency profile and recommend regional KMS topology.
    detail: 'When (per finding conf-477ff8a1) the platform offers an

      external-KMS binding for signing keys, add to that documentation

      a per-token latency profile (RSA-2048 sign with AWS KMS:

      ~10-30ms; ECDSA-P256 sign with AWS KMS: ~10-20ms; HashiCorp

      Vault Transit RSA-2048 sign: variable per Vault scale) and

      recommend a regional Vault/KMS deployment pattern that keeps

      signing-key callouts within-region.


      Cross-references finding conf-477ff8a1 (the external-KMS-binding

      recommendation) — these should ship together.

      '
    references:
    - 'external: AWS KMS latency characterization (per AWS KMS docs)'
