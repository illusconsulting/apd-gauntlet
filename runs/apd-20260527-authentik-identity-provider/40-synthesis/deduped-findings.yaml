  title: Identity-proofing artifact retention (IAL2/IAL3 verification evidence) is not addressed in inputs
  summary: Per the identity-security immutability-classes catalog, NIST 800-63A IAL claims require retention of underlying
    proofing evidence; the authentik inputs do not address IAL claim issuance or evidence retention.
  detail: 'The identity-security immutability-classes catalog: "Identity-

    proofing artifacts — NIST SP 800-63A IAL3 in-person

    verification records, IAL2 attribute-verification records

    (driver''s-license image, attribute-source attestation). Required

    for proving the IAL claim that the IdP asserts to downstream

    RPs." The authentik inputs focus on AAL (authenticator

    assurance) and FAL (federation assurance) but do not address

    IAL (identity assurance) issuance or evidence retention. For

    deployments where authentik is the identity-proofing IdP (vs.

    consuming an IAL claim from an upstream Source), this is a

    load-bearing capability gap.


    Disposition is uncertainty: the absence of IAL framing in the

    inputs may reflect that authentik does not target IAL2/IAL3

    proofing (relying on upstream Sources for identity proofing

    and asserting only AAL+FAL itself), in which case the IAL claim

    to downstream RPs would inherit from the Source. Severity is

    medium because the consequence depends on deployment posture —

    for an IdP claiming IAL3 to downstream RPs, this is high; for

    an IdP that explicitly does not assert IAL, this is

    informational.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §4 'MFA assurance' paragraph
    excerpt: authentik does not expose a single AAL knob; assurance is composed by the Flow author from the available authenticator-validate
      stage configuration.
  prerequisite_evidence:
  - Whether authentik supports IAL claim issuance (vs. inheriting from upstream Source)
  - 'If yes: identity-proofing evidence retention policy'
  - 'If yes: IAL claim communication to downstream RPs (via OIDC `acr` or SAML AuthnContext)'
  control_mappings:
    nist_800_53r5:
    - IA-12
    - AU-11
    - SI-7
  recommendation:
    posture: consider
    summary: Clarify in the OAuth/SAML provider docs whether authentik asserts an IAL claim and, if so, the retention discipline
      for the underlying proofing evidence.
    detail: "Two-part documentation:\n\n1. State explicitly that authentik does not issue IAL2/IAL3\n   proofing claims; deployments\
      \ that need IAL claims to\n   downstream RPs source them from an upstream IAL-proofing\n   IdP (e.g., a corporate IdP\
      \ that performs identity\n   verification) and pass through via the federated `acr` /\n   AuthnContextClassRef\n2. If\
      \ IAL claim issuance IS a future feature, document the\n   identity-proofing-artifact retention policy aligned to\n\
      \   NIST 800-63A\n\nFor most deployments, option 1 is the realistic posture —\nthe documentation just needs to make\
      \ it explicit.\n"
    references:
    - 'external: NIST SP 800-63A (Identity Proofing and Enrollment)'
  related_concerns:
  - authenticity
  - non_repudiation
  cross_references: []
