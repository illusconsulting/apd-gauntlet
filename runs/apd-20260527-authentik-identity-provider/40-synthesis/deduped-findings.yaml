    infrastructure" but on-by-default-in-platform is unclear),

    D-2 (login-flow race-condition reputation bypass — fixed in

    2025.12 by replacing session counters with reputation-driven),

    D-4 (session-store fill via mass-anonymous Flow execution —

    "Reputation policy can throttle; WAF recommended"),

    D-6 (email-stage flood — "Reputation policy; rate-limiting at the

    reverse proxy"), and S-8 (password recovery brute-force —

    "Reputation policy and Password Expiry policy can be bound").


