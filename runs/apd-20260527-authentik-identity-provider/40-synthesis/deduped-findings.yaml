  title: OAuth redirect-URI regex supports operator-error pattern (`.` un-escaped matches arbitrary character)
  summary: Per threat-model T-4 and the OAuth provider doc, redirect URIs accept regex with a documented authoring trap —
    `.` must be escaped or the regex matches `appXexample.com` for `app.example.com`.
  detail: 'Threat-model T-4 documents the surface: "Per the OAuth provider

    doc, redirect URIs are operator-configured per Provider; regex

    support is available with the caveat that `.` must be escaped (a

    common authoring mistake — `https://app.example.com` regex

    without escaping matches `https://appXexample.com`)." Residual

    question: "Is there a default-deny on regex-shaped redirect URIs

    without an escape audit? Unclear from inputs." Threat-model E-4

    reframes the same as elevation of privilege: "Attacker registers

    an RP with a client_id similar to a high-trust RP''s; relies on

    partial-match in the Provider''s redirect-URI regex (per T-4) to

    receive codes intended for the other RP."


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Open redirect on OAuth callback —

    redirect_uri allowlist permissive (suffix match, wildcard, missing

    path check), permitting authorization-code or token leak via

    redirect manipulation" — the regex-trap case is exactly the

    "permissive allowlist" pattern. Confidentiality consequence is the

    authorization-code interception; the Integrity lens here is that

    the redirect_uri validation is an input-validation primitive that

    accepts inputs the operator did not actually intend to allow.

    '
  evidence:
