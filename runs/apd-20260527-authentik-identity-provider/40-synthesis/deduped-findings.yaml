  title: Flow Policy-binding default `policy_engine_mode=ANY` permits operator-error defense-in-depth gap
  summary: Per ADR-0001, Flow stage Policy bindings default to ANY semantics — a single passing policy advances the stage;
    operators intending defense-in-depth must explicitly choose ALL.
  detail: 'ADR-0001 §Consequences §Negative item 5: "The Flow ordering +

    Policy-binding-mode (Any/All) interaction is operator-error-prone.

    Default `policy_engine_mode=ANY` means a single passing policy

    advances the stage; operators intending defense-in-depth must

    explicitly choose `ALL`." A specific example: an operator binds a

    GeoIP policy AND an Expression policy to an admin-stage,

    intending both must pass. Without changing the default the

    bindings collectively allow access if EITHER passes — which is

    the opposite of the operator''s intent in defense-in-depth

    framing.


    Severity is medium per the identity-security severity rubric:

    this is the Medium-default-misconfiguration pattern; it does not

    directly enable a compromise but inverts the typical

    defense-in-depth posture operators expect from a policy engine.

    Severity escalates to high in production deployments where

    operators have layered multiple policies expecting AND-semantics.

    '
  evidence:
  - artifact: adrs/0001-flows-stages-policies-pipeline.md
    locator: §Consequences > Negative / trade-offs, item 5
    excerpt: Default policy_engine_mode=ANY means a single passing policy advances the stage; operators intending defense-in-depth
      must explicitly choose ALL.
