  title: Expression-policy side-effecting helpers (`ak_send_email`, `ak_create_jwt`, `ak_call_policy`) do not auto-emit audit
    Events; `ak_create_event` is opt-in
  summary: Per ADR-0001 and threat-model R-1, the helper functions perform consequential actions but audit-emission is the
    policy author's responsibility.
  detail: 'ADR-0001 §Negative item 4: "`ak_create_event` is opt-in.

    Side-effecting helpers (`ak_send_email`, `ak_create_jwt`,

    `ak_call_policy`) do not auto-emit audit events; expression

    authors choose whether to call `ak_create_event` explicitly.

    Audit-completeness becomes a code-review property of every

    expression." Threat-model R-1 confirms: "A malicious Expression

    policy or property mapping makes a side-effect call (an

    outbound HTTP request, a database UPDATE via a helper, an

    `ak_send_email`) without emitting a corresponding Event. The

    audit trail is incomplete with respect to what the expression

    actually did." INV-AUTH-001 echoes: "Holds for Flow-mediated

    actions. Per threat-model R-1, side-effecting Expression-policy

    helpers (`ak_send_email`, `ak_create_jwt`) do not auto-emit;

    the `ak_create_event` helper exists but is opt-in."


    Severity is high per the identity-security severity rubric:

    this matches the High clause "Audit completeness on the IdP''s

    consequential-action surface unverified — the consequential-

    actions list contains 50+ event classes; the artifacts confirm

    logging for only a subset." The Expression-policy helper

    surface is precisely where post-incident forensic

    reconstruction breaks: an attacker with Expression-edit

    privilege (per ADR-0001 the documented architectural trust

    boundary) can emit emails, create JWTs, call out to arbitrary

    HTTP destinations, and chain policy invocations — none of

    which produces an audit anchor by default.


    Cross-references the Authenticity finding on per-Provider OAuth

    signing (token-issuance audit) and the Immutability finding on

    Event-log mutability (audit-trail-altered-after-the-fact).

    '
  evidence:
  - artifact: adrs/0001-flows-stages-policies-pipeline.md
    locator: §Consequences > Negative / trade-offs, item 4
    excerpt: ak_create_event is opt-in. Side-effecting helpers (ak_send_email, ak_create_jwt, ak_call_policy) do not auto-emit
      audit events; expression authors choose whether to call ak_create_event explicitly.
  - artifact: threat-model.md
    locator: §R-1 'Audit-log completeness for Expression-policy actions', Existing mitigation paragraph
    excerpt: Per expressions/reference/_functions.mdx, the ak_create_event helper exists, but its use is not mandatory.
  - artifact: invariants.md
    locator: §INV-AUTH-001, Reviewer note
    excerpt: Holds for Flow-mediated actions. Per threat-model R-1, side-effecting Expression-policy helpers (ak_send_email,
      ak_create_jwt) do not auto-emit; the ak_create_event helper exists but is opt-in.
  control_mappings:
    nist_800_53r5:
    - AU-2
    - AU-3
    - AU-3(1)
    - AU-12
    - AU-12(1)
    - AU-10
    mitre_attack:
    - technique: T1070
      sub_technique: null
      tactic: TA0005
      rationale: A malicious Expression policy can call ak_send_email or ak_create_jwt without emitting a corresponding Event;
        the action exists, the audit anchor does not, achieving Indicator Removal at the audit-completeness layer.
    cwe:
    - CWE-778
    - CWE-223
    owasp_top10:
    - A09:2021
  recommendation:
    posture: required
    summary: 'Make side-effecting Expression helpers auto-emit audit Events with the calling policy, the calling Flow, the
      actor, and the action context; allow operators to opt-out per-policy only via an explicit `audit_emission_disabled:
      true` flag captured in audit.'
    detail: "Modify the Expression helper library so that\n`ak_send_email`, `ak_create_jwt`, `ak_call_policy`, and any\nother\
      \ helper that performs an effect outside the local\nin-memory policy evaluation context automatically emits an\nEvent\
      \ with:\n\n- The calling policy's identifier\n- The calling Flow's identifier\n- The actor (pending_user or admin operator)\n\
      - The action specifics (recipient for email, token-claim set\n  for JWT, target policy for ak_call_policy)\n- The request\
      \ context (IP, user agent, AAL/FAL if known)\n\nOperators who legitimately want to disable per-helper audit\nfor performance\
      \ (e.g., a high-volume notification flow) set\n`audit_emission_disabled: true` per policy — itself an audit\nevent so\
      \ the operator decision is durably recorded.\n\nThis converts the Expression-policy auditability from \"policy\nauthor\
      \ must remember\" to \"platform-guaranteed unless\nexplicitly disabled,\" which materially closes the post-\nincident-reconstruction\
      \ gap.\n"
    references:
    - 'external: NIST SP 800-92 §3.5 (Audit completeness for consequential actions)'
    - 'internal: expressions/reference/_functions.mdx (the helper reference)'
  related_concerns:
  - integrity
  - immutability
  - authenticity
  cross_references: []
