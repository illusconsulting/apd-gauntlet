      \  credential-change, reuse-detected, expiry)\n- Per-Introspection Event: `introspected_token_id`,\n  `introspecting_client_id`\n\
      \nThis converts token-lifecycle audit from \"user received a\ntoken\" to \"user X received token jti=abc at time T against\n\
      RP=Y, refreshed to jti=def at time T+1, revoked at time T+5\"\n— the foundational per-token audit anchor.\n"
