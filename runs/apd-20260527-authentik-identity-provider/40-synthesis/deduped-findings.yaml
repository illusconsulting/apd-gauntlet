merge_decisions:
  - merge_group: master-secret-key-reachability
    merged_into: conf-477ff8a1
    merged_from: []
    notes: |
      The master AUTHENTIK_SECRET_KEY findings cluster (conf-477ff8a1
      authoritative; conf-7174bf6f on embedded-outpost reachability
      to the same secret retained as a related-but-distinct
      finding because the architectural mechanism is different —
      Expression-policy os.environ vs. embedded-outpost in-process
      bug; both ship together).

  - merge_group: secret-key-rotation-gap
    merged_into: conf-3d461eb8
    merged_from: [ephem-5a6042dc]
    notes: |
      Confidentiality finding (key cannot be re-protected after exposure)
      and Ephemeral finding (key has unbounded lifetime) merge into a
      single record presenting both lenses. The Ephemeral perspective is
      preserved in lens_perspectives. Both flagged the same
      runbook §5 / ADR-0004 §Negative item 3 GAP from different lenses.

  - merge_group: outpost-ws-tls
    merged_into: conf-e08662e7
    merged_from: [auth-22bd304a]
    notes: |
      Confidentiality (secret-data-in-transit) and Authenticity (identity-
      assertion-in-transit) merge into one record. Both cite INV-OPS-005
      GAP and threat-model S-6. The remediation (TLS-required + optional
      mTLS workload identity) addresses both lenses.

  - merge_group: oauth-client-auth-mechanism-and-rotation
    merged_into: ephem-07f6fad6
    merged_from: [auth-04c4919b]
    notes: |
      Ephemeral (client_secret rotation gap, no rotation procedure) and
      Authenticity (no private_key_jwt/mTLS alternatives at registration)
      merge into one record with both lens perspectives. They prescribe
      the same architectural change.

  - merge_group: backup-encryption-and-immutability
    merged_into: conf-68ab158e
    merged_from: [immut-fd3aafdd]
    notes: |
      Confidentiality (backup-file encryption GAP, key-separation between
      secret_key and dump) and Immutability (object-lock / compliance-mode
      retention) merge: same backup substrate, complementary controls,
      same runbook §8 location. The merged finding documents both
      perspectives.

link_decisions:
  - cross_link_group: rate-limiting-and-bruteforce-related
    findings: [avail-3a9189a2, auth-4793933a, ephem-0fb143ce]
    rationale: "Default-deny rate-limiting (Availability), default admin-MFA binding (Authenticity), and signing-key rotation cadence (Ephemeral) are three of the four 'shipped default hardening' recommendations that converge into the production-default-hardening pass."

  - cross_link_group: postgres-spof-and-failure-concentration
    findings: [avail-cfd2b6e8, dist-b8b7603b, dist-9b598237]
    rationale: "Postgres as universal SPOF (Availability SLO consequence), multi-region topology gap (Distributed topology consequence), and substrate concentration (Distributed failure-domain consequence) cite the same ADR-0002 architectural facts from three lenses; ship together."

  - cross_link_group: bulkhead-and-circuit-breaker-pattern
    findings: [avail-311725ea, resil-4d9c7873, resil-8ebcae62, resil-0af10c5c]
    rationale: "Per-task queue isolation (Availability), circuit breakers on outbound calls (Resilient), bulkhead between user-facing and admin paths (Resilient), and retry-with-jitter discipline (Resilient) form a coherent Resilient hardening pass; ship together."

  - cross_link_group: cached-ldap-outpost-trade-offs
    findings: [resil-32c37d49, ephem-4018416d, nonrep-fd5e012c]
    rationale: "Cached LDAP outpost mode trade-offs surface in Resilient (no failure-mode signaling of bypassed revocation), Ephemeral (cache TTL unenumerated), and Non-Repudiation (per-bind audit only on cache-miss); the cache-invalidation-push mechanism resolves all three."

  - cross_link_group: expression-engine-rce-second-order
    findings: [conf-477ff8a1, intg-0a313721, immut-d98cdc96, nonrep-6ff98de3]
    rationale: "Expression engine RCE per ADR-0001 is a documented architectural fact. Its second-order consequences land in Confidentiality (master-secret reachability), Integrity (Source mapping privilege escalation), Immutability (Event-log alteration via DB write), and Non-Repudiation (helper functions without audit emission). The hardening recommendation (reverse-proxy API blocklist) is the same compensating control; the specialists frame the second-order consequence from their lens."

  - cross_link_group: audit-pipeline-substrate-and-immutability
    findings: [nonrep-c3d8f98d, immut-d98cdc96, immut-d9147be5]
    rationale: "Audit-pipeline substrate (Postgres-resident, operator-driven log forwarding), Event-log immutability (mutable rows), and per-class retention (single platform-wide default) form the audit-substrate hardening pass."

  - cross_link_group: federation-trust-establishment-and-drift
    findings: [auth-c80d79e6, immut-df287568, nonrep-4ff2b1ac]
    rationale: "Federation-trust onboarding without domain-control-validation (Authenticity), GitOps drift detection (Immutability), and admin-action audit context (Non-Repudiation) cover the federation-trust hygiene surface from three lenses."

  - cross_link_group: signing-key-lifecycle-end-to-end
    findings: [ephem-0fb143ce, immut-1dc13874, intg-96d4de40]
    rationale: "Per-Provider signing-key rotation cadence (Ephemeral), rotation-history retention for after-the-fact verification (Immutability), and HMAC-fallback-when-empty (Integrity) describe the signing-key lifecycle from three lenses; ship as a coordinated key-management pass."

  - cross_link_group: per-token-audit-anchor-pattern
    findings: [nonrep-c772c9f2, resil-0e6a988b, immut-1dc13874]
    rationale: "Per-token audit anchor (Non-Repudiation), refresh-token rotation with family-revocation (Resilient), and JWKS rotation history (Immutability) form the token-lifecycle observability + integrity pass."

finding:
