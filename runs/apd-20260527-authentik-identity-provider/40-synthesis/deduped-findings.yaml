  title: OAuth consent grant events are audited at grant; per-use of the granted scope is not audited (GDPR Article 5(2) accountability
    gap)
  summary: Per the identity-security common-patterns Non-Repudiation guidance, consent is auditable at grant but per-use scope
    audit is the additional control for GDPR accountability.
  detail: 'The identity-security common-patterns Non-Repudiation guidance:

    "OAuth consent grants audited at the grant event but not at use

    — ''user X granted scopes S to client C'' is logged, but per-use

    of the granted scope is not. Severity: medium (the IdP can

    prove consent existed; cannot prove which uses occurred within

    the consent window without the per-use audit). Detail: GDPR

    Article 5(2) accountability defense for processing under the

    consent basis benefits from per-use audit when consent disputes

    arise."


    The authentik inputs document UserConsent and the consent stage

    (`tech_plan.md` §4 consent stage; §6 OAuth scope), but do not

    enumerate per-use scope audit on /userinfo and /token endpoint

    uses. For GDPR Article 5(2) accountability under the

    consent-as-lawful-basis pattern, the IdP should be able to

    prove not just that consent was granted but that the processing

    that occurred within the consent window aligned with the

    granted scope.


    I am ranking this at high rather than medium per the rubric

    because the IdP holds the consent record AND is the choke

    point for token issuance and userinfo retrieval — the per-use

    audit is structurally available, and the absence forfeits the

    attestation. Cross-references the SAML attribute-release per-

    assertion auditing (nonrep-52e5e762).

    '
  evidence:
  - artifact: tech_plan.md
    locator: §4 stage taxonomy, consent bullet
    excerpt: consent — OAuth scope consent prompt.
  - artifact: tech_plan.md
    locator: §6 OAuth 2.0 / OIDC, Default scopes bullet
    excerpt: 'Default scopes: openid, profile, email, entitlements, offline_access.'
  control_mappings:
    nist_800_53r5:
    - AU-2
    - AU-3
    - AU-12
    - AC-21
  recommendation:
    posture: required
    summary: Audit per-token-use of each granted scope; link the use Event to the consent-grant Event by consent-record ID;
      expose per-user consent-history + use-history as a GDPR Article 15 data subject access response.
    detail: "Three changes:\n\n1. Per-token issuance Event records `granted_scopes` and\n   `consent_record_id` (the UserConsent\
      \ that authorised the\n   grant)\n2. Per /userinfo and /token use that releases scope-resolved\n   claims emits a `consent_use_event`\
      \ linked to the\n   consent_record_id and the token_id\n3. The Data Subject Access workflow (Article 15) returns the\n\
      \   full consent grant + use history for the user\n\nThis converts the IdP from \"we have the consent record\"\nto \"\
      we have the consent record and we have the per-use\nattestation\" — the proportional GDPR accountability posture.\n"
    references:
    - 'external: GDPR Articles 5(2), 6(1)(a), 15 (accountability and data-subject access)'
  related_concerns:
  - confidentiality
  - immutability
  cross_references: []
