    - technique: T1621
      sub_technique: null
      tactic: TA0006
      rationale: SMS-OTP fallback on a flow whose AAL target is phishing-resistant degrades the effective AAL to SIM-swap-vulnerable,
        defeating the WebAuthn/FIDO2 anti-MFA-fatigue posture.
    - technique: T1556
      sub_technique: T1556.006
      tactic: TA0006
      rationale: Authenticator-validation stage accepting SMS path when AAL3 was the operator intent matches the Modify Authentication
        Process - MFA Bypass technique.
