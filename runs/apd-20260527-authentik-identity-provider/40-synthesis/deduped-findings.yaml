  title: SAML NameID email-policy is documented as unstable but remains a configurable option per Provider
  summary: Per `tech_plan.md` §6 SAML and the SAML provider doc, email-as-NameID is configurable per Provider with an explicit
    doc warning that users can change their email — yielding identity drift at the SP.
  detail: 'Tech plan §6 SAML, NameID policy bullet: "NameID policy is

    configurable per-Provider, including Persistent (hashed user ID),

    x509-subject, Windows (UPN), Transient (session-bound), Email

    (with the warning in the doc that email-as-NameID is unstable

    because users can change their email)." Email-as-NameID is

    consequentially the identity claim the SP keys its account-lookup

    against. A user who self-service-updates their email at the IdP

    and re-federates to the SP arrives as a different NameID — the SP

    either creates a duplicate account or fails to authenticate the

    same user against their existing record.


    Severity is high per the identity-security severity rubric: this

    matches the High clause "Privilege escalation via group/role

    mapping bug" by analogy — the IdP-asserted identity at the SP is

    mutable in a way that violates the "stable identity binding"

    property a federated identity is meant to provide. The integrity

    lens is the data-quality contract: the IdP commits to a stable

    assertion-subject but allows configuration that produces unstable

    assertions.

    '
  evidence:
  - artifact: tech_plan.md
    locator: §6 SAML, NameID policy bullet
    excerpt: Email (with the warning in the doc that email-as-NameID is unstable because users can change their email)
  control_mappings:
    nist_800_53r5:
    - SI-10
    - IA-4
    - IA-8
    cwe:
    - CWE-345
    owasp_top10:
    - A07:2021
  recommendation:
    posture: recommended
    summary: Deprecate Email NameID-policy in new Provider creation; warn loudly on existing Providers using Email NameID;
      recommend Persistent (hashed user ID) or x509-subject as the stable alternatives.
    detail: 'Remove Email from the default NameID-policy dropdown; restore

      via a "Show deprecated NameID policies" toggle. For existing

      Providers configured with Email NameID, surface a deprecation

      banner on the Provider detail page and a platform-wide

      dashboard tile listing affected Providers. Document the

      recommended NameID policies (Persistent, x509-subject) as the

      production defaults in the SAML provider doc.

      '
    references:
    - 'external: SAML 2.0 Core §8.3 (NameID format stability requirements)'
  related_concerns:
  - authenticity
