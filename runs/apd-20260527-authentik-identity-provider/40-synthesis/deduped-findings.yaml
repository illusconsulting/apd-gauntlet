  title: RAC `Ignore Server certificate` per-Endpoint setting silently bypasses RDP TLS verification for that endpoint
  summary: Per `tech_plan.md` §10 and threat-model S-11, the RAC endpoint property mapping can set 'Ignore Server certificate'
    which suppresses TLS verification of the RDP target.
  detail: '`architecture-index.md` rac-outpost: "''Ignore Server certificate''

    is a per-endpoint setting that suppresses RDP TLS verification —

    a hardening misstep if set." Threat-model S-11: "With it

    enabled, the RAC outpost does not verify the RDP server''s TLS

    certificate, enabling on-path attackers to MITM the user-to-

    remote-machine session ... MITM on remote desktop session;

    capture of remote-machine credentials and session content."

    ADR-0003 §Negative item 5: "A hardening misstep at the

    property-mapping layer disables RDP authentication of the remote

    server entirely."


    The Authenticity lens: this is identity-binding-discarded on the

    RDP server side — the RAC outpost holds (via property mapping)

    the remote-machine credential, opens a session, but does not

    verify the remote machine is the intended target. A MITM

    attacker presents an attacker-controlled RDP target, the RAC

    outpost authenticates, and the user''s session is mediated by

    the attacker.


    Severity is high per the identity-security severity rubric:

    this matches the High clause "SAML IdP allows unsigned

    AuthnRequest or unsigned SP metadata; the trust relies on TLS

    only" — by analogy, the RDP target authentication is similarly

    reduced to operator-asserted hostname trust. Threat-model S-11

    flags the residual: "Is there a dashboard alert for Endpoints

    with ''Ignore Server certificate'' enabled? Unclear."

    '
  evidence:
  - artifact: architecture-index.md
    locator: '`rac-outpost` component, Trust boundary line'
    excerpt: '''Ignore Server certificate'' is a per-endpoint setting that suppresses RDP TLS verification — a hardening misstep
      if set.'
  - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
    locator: §Consequences > Negative / trade-offs, item 5
    excerpt: '''Ignore Server certificate'' on RAC endpoints suppresses TLS verification of the RDP target ... A hardening
      misstep at the property-mapping layer disables RDP authentication of'
  control_mappings:
    nist_800_53r5:
    - IA-3
    - IA-3(1)
    - SC-23
    - SI-7
    mitre_attack:
    - technique: T1557
      sub_technique: null
      tactic: TA0006
      rationale: Disabled RDP server-cert verification opens the RAC-outpost-to-remote-machine path to AitM, enabling capture
        of remote-machine credentials and session content.
    cwe:
    - CWE-295
    - CWE-296
    owasp_top10:
    - A02:2021
  recommendation:
    posture: required
    summary: Default 'Ignore Server certificate' to false on new RAC Endpoints; surface a dashboard tile listing endpoints
      with the setting enabled; emit an audit Event when the setting changes from false to true.
    detail: "Three changes:\n\n- Default the Endpoint setting to `verify_server_cert: true`\n  (it should already default\
      \ this way; the residual concern is\n  drift from default to operator-modified)\n- Add a `Dashboards > Outpost Hardening`\
      \ view that lists every\n  RAC Endpoint with `verify_server_cert: false` so operators\n  can audit\n- Emit a high-severity\
      \ audit Event when the setting transitions\n  from true to false, with the operator and the Endpoint\n  captured\n\n\
      Pair with the Non-Repudiation finding on RAC property-mapping\nchange auditability.\n"
    references:
    - 'external: RFC 9466 (RDP security considerations)'
