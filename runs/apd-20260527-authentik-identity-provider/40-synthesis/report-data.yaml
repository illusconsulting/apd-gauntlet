schema_version: 1

exec_summary:
  paragraphs:
    - "This APD gauntlet run reviews authentik v2026.8.0-rc1, an open-source Identity Provider and SSO platform (MIT-licensed core). The identity-security domain pack applies. The 13-artifact intake covers the tech plan, architecture index, threat model, happy path, runbook, prior IncludeSec audit (2025.12), and four ADRs. The platform's architecture is grounded in four key decisions: a Django/Celery/Redis/PostgreSQL stack, a Flows-Stages-Policies pipeline with arbitrary-Python expression support, an outpost architecture for protocol handlers, and symmetric field-level encryption anchored by a single master key (AUTHENTIK_SECRET_KEY)."
    - "Across 9 specialists, 66 deduped findings emerged (down from 71 inputs after 5 cross-lens merges). 2 critical, 42 high, 22 medium; 9 blocked on prerequisite evidence; 0 contradictions; 0 severity disagreements. The two critical findings share a root cause: the AUTHENTIK_SECRET_KEY is the single master encryption key for all stored secrets and is process-env-resident; any Expression policy (arbitrary Python without sandbox per ADR-0001) can read it via os.environ. The second critical finding is that OAuth Providers with no Signing Key silently fall back to HMAC-signing JWTs with the client_secret, making any RP-side credential leak a forge-any-JWT capability."
    - "The highest-leverage hardening cluster is master-key risk surface reduction: shipping the reverse-proxy API blocklist for Expression/PropertyMapping/Blueprint write endpoints as a deployment-time default (rather than operator opt-in per security-hardening.md), and documenting an external-KMS binding for per-field secret encryption. These two changes would reduce the blast radius of a compromised admin from cluster-wide-secret-unmasking to per-Provider scope. A companion gap is the absence of a AUTHENTIK_SECRET_KEY rotation procedure in the runbook — runbook §5 explicitly flags this as a GAP."
    - "The auditability tier surfaces a structurally weak audit pipeline: Event rows are mutable PostgreSQL records with no hash chain; log forwarding to a SIEM is operator-driven rather than default. Without forwarding, an attacker with DB write access or Expression RCE can erase the audit trail. The Non-Repudiation and Immutability specialists identify seven related findings including missing per-token audit anchors, missing per-assertion attribute audit, and absent GitOps drift detection on federation-trust configuration."
    - "The scalability tier reflects the architectural concentration risk of PostgreSQL as the universal SPOF: identity, session, audit, and secret material all live in a single database whose loss equals total platform unavailability. The Distributed and Resilient specialists find no documented multi-region topology, no circuit breakers on outbound calls to Sources and SCIM targets, and no per-task queue isolation between user-facing and background work. The Ephemeral specialist notes absent rotation procedures for AUTHENTIK_SECRET_KEY, per-Provider signing keys, and SCIM target static tokens."
    - "The prior IncludeSec audit (2025.12) addressed H1 (Blueprint RCE — compensating control documented), H2 (TOTP rate limiting added), H3 (Expression RCE risk-accepted), and L2 (timing variance on recovery flow). The four ADRs candidly document the architectural trade-offs, including the no-sandbox Expression engine and the master-key architecture. The gauntlet's role is to frame the second-order operational consequences of these documented choices and identify the remaining hardening surface."

