posture_summary:
  trustworthiness: "High-severity deficiencies in confidentiality (master-key architecture, PostgreSQL TLS default-off, key rotation gap) and integrity (HMAC fallback, Source attribute injection, forward-auth header trust) dominate. The platform ships strong primitives — argon2id password hashing, per-Provider signing-key isolation, defusedxml/xmlsec SAML stack — but their effectiveness is contingent on operator configuration choices that are not enforced by default. The two critical findings share a single architectural root cause (master-key in process env plus no-sandbox Expression engine) that is explicitly documented as intentional; the hardening path is shipping the compensating control (API blocklist) as a default rather than optional."
  scalability: "PostgreSQL concentration risk is the structural SPOF across availability, distributed topology, and secret storage. No multi-region topology is documented. Resilience primitives (refresh-token rotation, reputation policies) exist but circuit breakers on outbound calls, per-task queue isolation, and bulkheading between user-facing and background work are absent from the input set. Ephemeral posture is weakest on key rotation: AUTHENTIK_SECRET_KEY has no documented rotation cadence or procedure, and per-Provider signing-key rotation is operator-discretion only."
  auditability: "The audit substrate (mutable PostgreSQL Event rows, operator-driven log forwarding, no hash chain) provides a foundation but does not meet the immutability requirements for a security-critical identity platform. Non-Repudiation gaps (Expression helper functions without automatic Event emission, cached LDAP per-bind audit only on cache-miss, absent per-token audit anchor) reduce forensic reconstruction fidelity post-incident. Authenticity posture for admin actions is weak without default MFA enforcement. The IncludeSec 2025.12 fixes (TOTP rate limiting, reputation-based brute-force resistance) are targeted improvements; the structural audit posture requires a coordinated investment in forwarding, immutability, and per-class retention policies."
