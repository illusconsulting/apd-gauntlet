notes: |
  - SC family dominates (cryptography + boundary protection); reflects
    authentik's identity-provider nature where transport and at-rest
    cryptography are first-order concerns.
  - AU family is the second-most-cited; reflects the substantial
    Non-Repudiation + Immutability findings on the Event-log substrate
    and per-consequential-action audit gaps.
  - IA family is third-most-cited (identification and authentication
    primitives) — expected for an identity provider.
  - SI family is significant due to input-validation findings
    (SAML XSW, Source attribute mapping, OAuth state/nonce) and
    availability-resilience findings (SI-13 chain).
  - CP family is moderately cited via the multi-region / DR findings.
  - Operator-domain control families (PL, PM, RA) are not in scope.
