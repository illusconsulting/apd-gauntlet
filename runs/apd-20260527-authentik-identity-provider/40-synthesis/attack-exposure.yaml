summary:
  total_unique_techniques_with_findings: 24
  total_findings_with_attack_mappings: 38
  total_capabilities_with_mitigation_mappings: 11
  highest_net_exposure_techniques:
    - T1606.001: "4 findings (JWT forgery — HMAC fallback, master-key, rotation, history)"
    - T1485: "3 findings (Data Destruction — PG SPOF, backup mutability, multi-region)"
    - T1070: "3 findings (Indicator Removal — audit pipeline + helper non-emission + mutability)"
    - T1078: "2 findings + 3 mitigations (Valid Accounts — admin MFA + Source injection + SCIM token + RP onboarding)"
    - T1499: "2 findings (Endpoint DoS — substrate concentration + circuit breakers)"

notes: |
  Credential Access (TA0006) dominates the attack surface, with 25
  finding-mappings and only 5 capability-mitigations — net exposure 20.
  This is expected for an IdP: the platform's purpose is to issue,
  validate, and protect credentials, so credential-touching ATT&CK
  techniques inherently form the bulk of the threat surface. The
  remediation pattern across this tactic clusters around three themes:

  1. Token-forgery (T1606) blast-radius bounding — HMAC-fallback removal,
     master-key external-KMS, per-Provider rotation cadence, JWKS
     rotation history retention
  2. MFA-bypass (T1556, T1621) — default admin MFA binding, structural
     SMS-fallback policy, WebAuthn default for high-AAL flows
  3. Credential exposure (T1552, T1040) — TLS by default on PG / WS,
     reverse-proxy API blocklist by default, external KMS for master-key

  Impact (TA0040) is the second-largest exposure cluster, dominated by
  the substrate concentration findings (Postgres SPOF + backup mutability
  + multi-region absence). The pattern: a single substrate compromise
  yields catastrophic data loss; the remediation is multi-substrate
  isolation + object-lock + multi-region.
