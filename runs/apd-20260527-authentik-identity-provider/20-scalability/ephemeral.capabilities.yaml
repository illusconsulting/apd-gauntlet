capability:
  - schema_version: 1
    id: ephem-cap-efe92498
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    title: "Per-Provider signing-key rotation supported via Admin UI and blueprint-driven configuration"
    description: |
      Per `runbook.md` §6 and ADR-0004 §Positive paragraph 4,
      certificate rotation is supported per Provider via the
      `CertificateKeyPair` model. Operators can generate or import new
      keys via `/if/admin/#/crypto/certificates`, switch the affected
      Provider's Signing Key field, and the OAuth JWKS endpoint
      automatically reflects the new key for RP refresh. Blueprints
      can drive rotation declaratively via configuration-as-code.
    maturity: designed
    scope: |
      Confirmed for the platform-mechanism level (manual and blueprint-
      driven rotation). Not addressed: no enforced rotation cadence
      (Ephemeral finding ephem-0fb143ce); no shipped expiry-warning
      Notification Rule (runbook §6 GAP); JWKS grace-window discipline
      not documented (Integrity / Ephemeral joint concern).
    evidence:
      - artifact: runbook.md
        locator: "§6 'Provider signing-key rotation', step list"
        excerpt: "Open /if/admin/#/crypto/certificates. Generate a new CertificateKeyPair (or import). Edit the affected Provider; switch the Signing Key field to the new certificate."
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Positive, paragraph 4"
        excerpt: "Blueprints can express certificate-rotation declaratively (per the blueprints doc); operators can drive rotation via configuration-as-code."
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(2)"
        - "SC-17"
        - "CM-3"
    caveats:
      - "No enforced rotation cadence (ephem-0fb143ce)."
      - "No shipped expiry-warning Notification Rule (runbook §6 GAP)."
      - "JWKS grace-window discipline (next-key publish + old-key linger) not asserted."
    related_concerns: [integrity, authenticity, immutability]

  - schema_version: 1
    id: ephem-cap-9095fc38
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    title: "Per-Flow session lifetime, idle timeout, and absolute timeout configurable via User Login stage settings"
    description: |
      Per `invariants.md` INV-AUTH-005, the User Login stage exposes
      session-lifetime knobs that operators tune per-Flow. This allows
      different session policies for different surfaces (admin
      surfaces with shorter sessions, end-user surfaces with longer
      sessions, step-up flows with very short sessions). The platform
      provides the primitive; the operator binds the values.
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level. Not addressed:
      platform-recommended defaults per AAL tier are not shipped
      (Ephemeral finding ephem-6f83fa77); behavior on credential
      change / AAL elevation is operator-tuned per Flow; SAML SLO and
      OIDC front-channel logout integration is operator-configured
      per Provider.
    evidence:
      - artifact: invariants.md
        locator: "§INV-AUTH-005"
        excerpt: "Session lifetime, idle timeout, max-age are enforced per Flow. Holds. Operators configure per-Flow."
    control_mappings:
      nist_800_53r5:
        - "AC-12"
        - "AC-12(1)"
        - "SC-10"
        - "IA-5"
    caveats:
      - "Per-AAL-tier session-lifetime recommendations not shipped (ephem-6f83fa77)."
      - "Credential-change / AAL-elevation behavior is per-Flow operator decision."
    related_concerns: [authenticity, non_repudiation]
