finding:
  - schema_version: 1
    id: ephem-5a6042dc
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "AUTHENTIK_SECRET_KEY rotation cadence and procedure are not documented; effective lifetime is unbounded"
    summary: "Per `runbook.md` §5 GAP and ADR-0004, the rotation runbook for the master decryption key is not shipped; the secret_key is effectively never rotated in the typical deployment."
    detail: |
      Runbook §5 explicitly flags this as a GAP: "No rotation runbook
      for AUTHENTIK_SECRET_KEY ships in `sys-mgmt/`." ADR-0004
      §Negative item 3 confirms: "The blueprint mechanism supports
      this ... but the operational impact is non-trivial: every
      Provider's secret is re-keyed in a single transaction. GAP in
      the inputs: the rotation runbook for secret_key is not
      documented in `sys-mgmt/`; reviewers should surface this as a
      finding against operational discipline." INV-OPS-004 echoes:
      "GAP — no rotation runbook ships in sys-mgmt/."

      The Ephemeral lens here is the effective lifetime of the master
      cryptographic credential. With no documented rotation procedure,
      the practical operator behavior is "set at install and never
      change," which:

      - Yields permanent confidentiality compromise on any leak event
        (Confidentiality finding conf-3d461eb8)
      - Defeats the modern "credentials should be short-lived"
        discipline that underpins every NIST 800-63B authenticator
        management clause
      - Means every secret-bearing field encrypted at install time
        remains under the same key for the platform's entire lifetime

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Signing-key rotation cadence absent or
      longer than the longest token lifetime" — generalised: master-key
      rotation cadence absent is even higher-impact because the
      master key wraps all signing keys. Cross-references the
      Confidentiality lens (conf-3d461eb8) on the same architectural
      facts; the Confidentiality lens is "key cannot be re-protected
      after exposure"; the Ephemeral lens is "key has unbounded
      lifetime."
    evidence:
      - artifact: runbook.md
        locator: "§5 'AUTHENTIK_SECRET_KEY rotation', opening line"
        excerpt: "GAP. No rotation runbook for AUTHENTIK_SECRET_KEY ships in sys-mgmt/."
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Negative / trade-offs, item 3, last sentence"
        excerpt: "GAP in the inputs: the rotation runbook for secret_key is not documented in sys-mgmt/"
      - artifact: invariants.md
        locator: "§INV-OPS-004, Reviewer note"
        excerpt: "GAP — no rotation runbook ships in sys-mgmt/"
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(1)"
        - "SC-12(2)"
        - "IA-5"
        - "IA-5(7)"
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Unbounded master-key lifetime means the key recovered from a single Expression-policy os.environ read (per ADR-0001 trust model) remains valid for the platform's entire operational life; rotation would be the proportional response."
    recommendation:
      posture: required
      summary: "Ship a `sys-mgmt/ops/secret-key-rotation.md` runbook with a tested `rekey-secrets` blueprint, dual-key cutover procedure, and recommended rotation cadence (annual baseline; immediate post-incident)."
      detail: |
        See the detailed recommendation in Confidentiality finding
        conf-3d461eb8. The Ephemeral lens adds:

        - Recommended baseline rotation cadence (annual)
        - Trigger conditions for unplanned rotation (suspected
          compromise per the Expression-policy reachability concern,
          host compromise, sidecar with shared env breach, backup leak)
        - Monitoring on "secret_key has not been rotated in N days"
          with alert thresholds
        - Audit Event class for secret_key rotation events (the
          rotation itself is a consequential action per the
          identity-security consequential-actions list — "Signing-key
          rotation" extends naturally to master-key rotation)

        The Confidentiality recommendation and this Ephemeral
        recommendation should ship together; they address the same
        operational gap from two lenses.
      references:
        - "external: NIST SP 800-57 Part 1 Rev. 5 §5.3.4 (Key rotation cadence guidance)"
        - "internal: conf-3d461eb8 (the paired Confidentiality finding)"
    related_concerns: [confidentiality, authenticity, non_repudiation]
    cross_references: [conf-3d461eb8]

  - schema_version: 1
    id: ephem-0fb143ce
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "Per-Provider OAuth/SAML signing key rotation cadence is not enforced; operator-initiated rotation is the only mechanism"
    summary: "Per `invariants.md` INV-OPS-003 and `runbook.md` §6, certificate rotation is supported but not enforced; no rotation cadence ships."
    detail: |
      INV-OPS-003: "Holds. The doc notes the default self-signed
      certificate is 1-year-valid and may need rotation for SPs that
      enforce expiry (Slack is cited)." Runbook §6 documents the
      operator-initiated rotation procedure for Provider signing keys.
      Runbook §6 explicitly notes a related GAP: "there is no shipped
      alerting rule for 'Provider signing key approaching expiry';
      operators must configure their own via Event Matcher policies."

      The identity-security common-patterns Ephemeral guidance is
      explicit: "Signing-key rotation cadence absent or longer than
      the longest token lifetime. Severity: high (the JWKS rotation
      gives a revocation window for token forgery in the event of key
      compromise; without rotation, key compromise is permanent)."

      Severity is high per the rubric — this is the High clause
      directly. Cross-references the JWKS rotation grace window
      discipline (Integrity lens — does the JWKS publish next-key
      before activation? does old-kid linger for token-lifetime?
      neither asserted in inputs).
    evidence:
      - artifact: invariants.md
        locator: "§INV-OPS-003, Reviewer note"
        excerpt: "The doc notes the default self-signed certificate is 1-year-valid and may need rotation for SPs that enforce expiry (Slack is cited)."
      - artifact: runbook.md
        locator: "§6 'Provider signing-key rotation', last paragraph"
        excerpt: "The platform does not enforce a rotation cadence. GAP — there is no shipped alerting rule for 'Provider signing key approaching expiry'; operators must configure"
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(2)"
        - "SC-12(3)"
        - "SR-11"
        - "AU-12"
      mitre_attack:
        - technique: "T1606"
          sub_technique: "T1606.001"
          tactic: "TA0006"
          rationale: "Without rotation, a stolen signing key forges tokens indefinitely (T1606.001); rotation discipline bounds the post-compromise forgery window to the cadence interval."
    recommendation:
      posture: required
      summary: "Ship a default rotation cadence (e.g., 90-day rotation, 180-day expiry warning) per-Provider signing key; add an out-of-the-box Notification Rule for expiring keys; document the JWKS grace-window posture."
      detail: |
        Platform-level defaults:

        - Per-Provider signing key rotation cadence default: 90 days
          (configurable per Provider)
        - Expiry-warning Notification Rule shipped by default, bound to
          an Event Matcher policy that fires at expiry - 30 days,
          expiry - 7 days, expiry - 1 day
        - Auto-rotation toggle per Provider (when enabled, the Worker
          rotates the signing key on the cadence, publishes the new key
          in the JWKS with a documented grace window, retires the old
          key after the longest plausible token lifetime)
        - JWKS grace-window discipline: next-key published in JWKS at
          least N hours before becoming the active signer; old key
          retained in JWKS for at least the longest token lifetime
          plus a buffer

        Cross-references the JWKS rotation-history retention from the
        Immutability specialist (key-lifecycle audit must outlive every
        token signed under the retired key).
      references:
        - "external: OAuth 2.1 §5 (key management discipline)"
        - "external: NIST SP 800-63B §5.1.4 (authenticator key-management)"
    related_concerns: [integrity, authenticity, immutability]
    cross_references: []

  - schema_version: 1
    id: ephem-07f6fad6
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "OAuth client_secret rotation procedure is undocumented; private_key_jwt and mTLS client authentication alternatives are not first-class in the registration flow"
    summary: "Per `tech_plan.md` §6 OAuth and `happy-path.md` §9, OAuth Provider creation defaults to client_secret-based authentication; rotation cadence and alternative-auth onboarding are not asserted."
    detail: |
      OAuth Provider creation (`happy-path.md` §9 step 3) configures
      "Client type (Confidential / Public). Redirect URI(s). Signing
      Key (CertificateKeyPair selection). Encryption Key (optional)" —
      no client-authentication-method choice is enumerated; the platform
      default is `client_secret_basic` / `client_secret_post`. The
      identity-security common-patterns Ephemeral guidance flags:
      "OAuth client_secret unrotated since initial issuance; rotation
      procedure undocumented. Severity: high (client_secret leak is a
      recurring incident pattern via repository exposure, CI log leak,
      mobile-app extraction, vendor compromise; without rotation, leak
      is permanent)."

      Without first-class `private_key_jwt` or `tls_client_auth`
      (mTLS) alternatives at registration, every confidential client
      relies on a shared symmetric secret that is itself the signing
      key in HMAC-fallback (Integrity finding intg-96d4de40). The
      modern OAuth Security BCP posture is to deprecate
      `client_secret_*` for new confidential clients in favor of
      asymmetric client authentication.

      Severity is high per the identity-security severity rubric — this
      is the High clause directly. Cross-references Authenticity
      (the client-authentication mechanism quality) and Integrity
      (the HMAC-fallback secret-as-signing-key surface from
      intg-96d4de40).
    evidence:
      - artifact: happy-path.md
        locator: "§9 'Operator creates an OAuth Application + Provider pair', step 3"
        excerpt: "Configures: Authentication flow ... Authorization flow ... Client type (Confidential / Public). Redirect URI(s). Signing Key (CertificateKeyPair selection). Encryption Key (optional). Scopes (default + custom"
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, Grant types bullet"
        excerpt: "Grant types: authorization-code, implicit (with the note that the OAuth Security BCP recommends against it), hybrid, client-credentials, device-code, refresh-token."
    control_mappings:
      nist_800_53r5:
        - "IA-5"
        - "IA-5(1)"
        - "IA-5(2)"
        - "SC-12"
        - "IA-2"
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "client_secret leak via repository check-in or CI log capture (T1552.001) is the dominant OAuth-credential loss vector; no rotation procedure means the leak is permanent until manual remediation."
      cwe:
        - "CWE-798"
        - "CWE-321"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Add first-class `private_key_jwt` and `tls_client_auth` (mTLS) client-authentication options at OAuth Provider creation; default new confidential clients to private_key_jwt; document client_secret rotation procedure with overlap window."
      detail: |
        Three changes:

        1. **Add client-auth mechanism selector** at Provider creation:
           `client_secret_basic` (legacy), `client_secret_post`
           (legacy), `private_key_jwt` (recommended new default),
           `tls_client_auth` (mTLS). Default to `private_key_jwt` for
           new confidential clients.
        2. **Document client_secret rotation** with overlap window:
           generate new secret, register at the RP, switch over,
           retire old secret. Add a per-Provider rotation cadence
           default (90 days) and an Event Matcher Notification Rule
           shipped by default.
        3. **Deprecation timeline** for `client_secret_*` in new
           confidential clients (announced in release notes; warning
           banner in UI; eventual removal of `client_secret_*` as a
           new-client option, retained for legacy clients).

        Cross-references Integrity finding intg-96d4de40 (the
        HMAC-fallback surface that disappears when private_key_jwt is
        the default).
      references:
        - "external: RFC 7523 (JWT bearer for client authentication)"
        - "external: RFC 8705 (mTLS for client authentication)"
        - "external: RFC 9700 §4 (OAuth Security BCP on client authentication)"
    related_concerns: [authenticity, integrity, confidentiality]
    cross_references: [intg-96d4de40]

  - schema_version: 1
    id: ephem-6af8665b
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: high
    confidence: high
    title: "SCIM target static-token rotation is not enumerated; Community-tier deployments cannot use the OAuth-token mode"
    summary: "Per `tech_plan.md` §6 SCIM and threat-model S-9, SCIM static tokens are the community default; OAuth-token mode is Enterprise-only; rotation cadence is unspecified."
    detail: |
      Tech plan §6 SCIM provisioning: "authenticated with static token
      (default) or OAuth (Enterprise)." Threat-model S-9: "Community-
      tier installs cannot use the OAuth-token mode and must rely on
      static tokens. There is no documented in-platform rotation
      cadence for SCIM static tokens." If a SCIM target's static
      token leaks (Provider config in Postgres, API exposure, Worker
      log capture per S-9), the attacker provisions / deprovisions
      arbitrary users at the target.

      Severity is high per the identity-security severity rubric: this
      is the High clause "Service account token long-lived and
      unrotated — non-human identities authenticating to the IdP
      backend via static credentials (LDAP bind, SMTP, database,
      vendor APIs). The IdP's own backend-credential hygiene is in
      scope because IdP-tier compromise pivots outward."
    evidence:
      - artifact: tech_plan.md
        locator: "§6 SCIM provisioning"
        excerpt: "Authentication is static-token (default) or OAuth (Enterprise)."
      - artifact: threat-model.md
        locator: "§S-9 'SCIM endpoint static-token theft', Residual question line"
        excerpt: "Community-tier installs cannot use the OAuth-token mode and must rely on static tokens. There is no documented in-platform rotation cadence for SCIM static tokens."
    control_mappings:
      nist_800_53r5:
        - "IA-5"
        - "IA-5(1)"
        - "IA-5(7)"
        - "AC-2"
        - "SC-12(1)"
      mitre_attack:
        - technique: "T1078"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Static SCIM target tokens are long-lived non-human credentials that survive operator changes; a leaked token provides persistent access (T1078) to the SCIM target without authentik mediation."
      cwe:
        - "CWE-798"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Make OAuth-token mode for SCIM a Community-tier feature OR ship a documented per-target rotation procedure with shipped Notification Rule for static-token age."
      detail: |
        Two options:

        1. **Make OAuth-token SCIM auth Community-tier.** The
           feature is operationally simple and the security benefit
           (short-lived tokens, no static-secret leak) is meaningful
           for every operator.
        2. **Ship rotation tooling for static tokens.** Add a
           per-SCIM-Provider rotation cadence default (e.g., 90 days);
           Worker runs a quarterly rotation task that generates a new
           static token, calls the SCIM target's token-rotation
           endpoint if supported (vendor-specific), or surfaces an
           operator-action-required Notification when the target does
           not support rotation. Audit Event captures every rotation.

        Either path closes the high-severity gap.
      references:
        - "external: SCIM 2.0 specification (token-authentication patterns)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: ephem-a0d1afcd
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: gap
    severity: medium
    confidence: high
    title: "Outpost service-account token rotation UI control is unconfirmed; per runbook §7 rotation may require outpost recreation"
    summary: "Per `runbook.md` §7 GAP, the outpost edit form does not enumerate a regenerate-token control; rotation procedure may require recreating the outpost."
    detail: |
      Runbook §7: "GAP — the inputs do not enumerate a rotation control
      on the outpost edit form. Reviewers should confirm against the
      live admin UI whether the operator can regenerate the
      service-account token without recreating the outpost. If not, the
      rotation procedure is to recreate the outpost (re-deploy outpost
      containers with the new token), which is a brief outage." The
      Ephemeral lens is the per-outpost service-account token
      lifetime — currently effectively the lifetime of the outpost
      record, with no documented in-place rotation.

      Severity is medium per the identity-security severity rubric:
      this matches the Medium "Service-account / non-human-identity
      credentials inside the IdP ... are static long-lived secrets
      with no rotation" — the consequence is bounded because outpost
      tokens have read-only scope per ADR-0003 §Decision, but the
      principle of credential hygiene applies regardless.
    evidence:
      - artifact: runbook.md
        locator: "§7 'Outpost certificate / token rotation', GAP paragraph"
        excerpt: "GAP — the inputs do not enumerate a rotation control on the outpost edit form. Reviewers should confirm against the live admin UI whether the"
    prerequisite_evidence:
      - "Whether the Admin UI exposes a 'regenerate service-account token' control on the outpost edit form"
      - "If not, the documented in-place rotation procedure"
      - "Default cadence recommendation (currently none)"
    control_mappings:
      nist_800_53r5:
        - "IA-5"
        - "IA-5(1)"
        - "IA-5(7)"
        - "AC-2"
        - "AC-2(2)"
    recommendation:
      posture: recommended
      summary: "Add an explicit 'Rotate service-account token' control to the outpost edit form; document the rotation procedure with the outpost's automatic re-fetch / reconnect cycle; recommend a 180-day rotation cadence."
      detail: |
        Surface a single-click rotation control that:

        - Issues a new service-account token
        - Pushes the new token to the outpost via the existing
          WebSocket transport (the outpost re-authenticates with the
          new token without recreating its container)
        - Retires the old token after a brief grace window
        - Emits an audit Event

        Document the recommended 180-day rotation cadence; ship an
        Event Matcher Notification Rule shipped by default for
        "outpost token older than N days."
      references:
        - "internal: runbook.md §7 (the GAP this resolves)"
        - "internal: add-secure-apps/outposts/index.mdx (where the rotation UX lands)"
    related_concerns: [authenticity, distributed]
    cross_references: []

  - schema_version: 1
    id: ephem-6f83fa77
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: uncertainty
    severity: medium
    confidence: medium
    title: "Session lifetime defaults per AAL tier are not enumerated; per-Flow User Login stage settings are operator-tuned"
    summary: "Per `invariants.md` INV-AUTH-005, session lifetime / idle timeout / max-age are per-Flow configurable; default values and AAL-tier discipline are not enumerated in inputs."
    detail: |
      INV-AUTH-005: "Holds. Operators configure per-Flow." The User
      Login stage holds the session-lifetime knobs; the platform does
      not enumerate defaults or recommend per-AAL-tier values. The
      identity-security common-patterns Ephemeral guidance flags this
      as a Block-on-evidence pattern: "Session lifetime unspecified —
      no maximum absolute lifetime, no idle timeout, no behavior on
      credential change, no behavior on AAL elevation. Disposition:
      uncertainty or blocked."

      The runbook §10 hardening checklist confirms operator-action-
      required: "Configure session inactivity timeout and absolute
      timeout per the User Login stage settings."

      Disposition is uncertainty: the mechanism exists; specific
      defaults and AAL-tier discipline are not enumerated. Severity
      is medium because the consequence depends on whether operators
      configure sane values or leave at unsafe defaults; in the
      absence of platform-recommended values, operator drift is the
      expected outcome.
    evidence:
      - artifact: invariants.md
        locator: "§INV-AUTH-005, Reviewer note"
        excerpt: "Holds. Operators configure per-Flow."
      - artifact: runbook.md
        locator: "§10 'Production hardening checklist', session-timeout bullet"
        excerpt: "Configure session inactivity timeout and absolute timeout per the User Login stage settings."
    prerequisite_evidence:
      - "Default User Login stage session-lifetime values"
      - "Per-AAL-tier session-lifetime recommendations (AAL3 sessions shorter than AAL1)"
      - "Behavior on credential change (revoke all sessions vs. preserve)"
      - "Behavior on AAL elevation (does step-up issue a new session?)"
    control_mappings:
      nist_800_53r5:
        - "AC-12"
        - "AC-12(1)"
        - "IA-5"
        - "SC-10"
    recommendation:
      posture: recommended
      summary: "Document recommended per-AAL-tier session lifetimes and the credential-change / AAL-elevation behavior in `add-secure-apps/flows-stages/stages/user_login/`."
      detail: |
        Per-AAL-tier recommendations:

        - AAL1 (single-factor): max absolute 12h, idle 30min
        - AAL2 (MFA): max absolute 24h, idle 1h
        - AAL3 (hardware-bound): max absolute 8h, idle 15min;
          additional re-auth required for sensitive operations
        - Credential change: revoke all sessions
        - AAL elevation: issue a new session (not upgrade)
        - SAML SLO and OIDC front-channel logout integration documented

        These are recommendations, not enforced defaults — operators
        can tune per their compliance posture — but converting
        from "unspecified" to "platform-recommended" is the
        proportional response to the GAP.
      references:
        - "external: NIST SP 800-63B §4.4 (session management per AAL)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: ephem-d87f9e6e
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: risk
    severity: medium
    confidence: high
    title: "Default self-signed certificate at first startup is 1-year-valid; no rotation reminder shipped"
    summary: "Per `sys-mgmt/certificates.md` and `invariants.md` INV-OPS-003, the default self-signed `authentik Self-signed Certificate` is 1-year-valid; rotation is operator-initiated; no expiry-warning rule ships."
    detail: |
      INV-OPS-003: "The doc notes the default self-signed certificate
      is 1-year-valid and may need rotation for SPs that enforce
      expiry (Slack is cited)." Tech plan §11: "All secrets are
      encrypted at rest in PostgreSQL via the CertificateKeyPair
      model + per-installation AUTHENTIK_SECRET_KEY ... Rotation is
      blueprint-driven." Runbook §6 GAP: "there is no shipped
      alerting rule for 'Provider signing key approaching expiry'."

      The Ephemeral lens here is the certificate lifetime + the
      absence of an automated expiry path. A 1-year-valid self-signed
      certificate that is never rotated and never expires-into-warning
      is a foot-gun: a deployment quietly continues issuing tokens
      signed by an expired certificate until an SP rejects them in
      production.

      Severity is medium per the identity-security severity rubric:
      this matches the Medium hygiene pattern; it is the same
      operational discipline gap as ephem-0fb143ce (Provider key
      rotation) but specifically for the default self-signed
      certificate that ships with every install.
    evidence:
      - artifact: tech_plan.md
        locator: "§11 'Known security posture', secrets bullet"
        excerpt: "All secrets are encrypted at rest in PostgreSQL via the CertificateKeyPair model + per-installation AUTHENTIK_SECRET_KEY (set in .env per the docker-compose install doc). Rotation is"
      - artifact: invariants.md
        locator: "§INV-OPS-003, Reviewer note"
        excerpt: "Holds. The doc notes the default self-signed certificate is 1-year-valid and may need rotation for SPs that enforce expiry (Slack is cited)."
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-17"
        - "SA-22"
    recommendation:
      posture: recommended
      summary: "Reduce default self-signed certificate validity from 1 year to 90 days; ship a Notification Rule shipped by default that alerts on certificate expiry at 30d / 7d / 1d."
      detail: |
        Reduce the default validity to 90 days, forcing operators to
        confront the rotation question early. Ship an Event Matcher
        Notification Rule (default off, default-shipped) that alerts
        on `CertificateKeyPair.not_after - now < 30d`. Together with
        ephem-0fb143ce's per-Provider rotation cadence, this converts
        the certificate-lifecycle posture from "operator-improvised"
        to "platform-recommended with alerting hooks ready to enable."
      references:
        - "external: NIST SP 800-57 Part 1 Rev. 5 §5.3 (cryptoperiod guidance)"
    related_concerns: [integrity, authenticity]
    cross_references: [ephem-0fb143ce]

  - schema_version: 1
    id: ephem-4018416d
    agent: ephemeral
    apd_tier: scalability
    apd_goal: ephemeral
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Cached LDAP outpost bind cache TTL is not enumerated"
    summary: "Per threat-model T-6 residual question, the LDAP provider doc mentions 'session duration' for the cache lifetime but the default value is not enumerated."
    detail: |
      Threat-model T-6: "What is the cache TTL? 'Session duration' is
      mentioned but the default value is not enumerated in the
      inputs." This is consequential because the cached bind mode
      explicitly violates session revocation and credential changes
      for the cache lifetime (Resilient finding resil-32c37d49). The
      effective credential lifetime in cached mode = min(actual
      credential lifetime, cache TTL); operators evaluating the
      trade-off need to know the cache TTL.

      Disposition is blocked because the inputs do not enumerate the
      default; severity is medium because the consequence depends on
      the actual TTL value (1 hour is acceptable; 24 hours is high-
      severity given the implications for credential-change
      propagation).
    evidence:
      - artifact: threat-model.md
        locator: "§T-6 'Cached LDAP outpost stale-credential acceptance', Residual question line"
        excerpt: "What is the cache TTL? 'Session duration' is mentioned but the default value is not enumerated in the inputs."
    prerequisite_evidence:
      - "Default cache TTL for LDAP outpost cached-bind mode"
      - "Whether 'session duration' refers to authentik session (configurable per Flow) or a fixed value"
