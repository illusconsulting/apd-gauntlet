capability:
  - schema_version: 1
    id: dist-cap-8cbb523a
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    title: "Outposts deployable as separate failure domains per protocol family; standalone Proxy / LDAP / RADIUS / RAC outpost binaries"
    description: |
      Per ADR-0003, the four standalone outposts (Proxy, LDAP, RADIUS,
      RAC) are independently deployable Go binaries packaged as
      separate container images
      (`ghcr.io/goauthentik/{proxy,ldap,radius,rac}`). Each can be
      deployed close to the protected resource (DMZ for legacy LDAP
      consumers, branch office for RADIUS NAS, customer network for
      RAC targets) and connects back to Core via WebSocket. This is
      the platform's distributed-deployment story for non-HTTP
      protocols. The embedded outpost is the exception (Distributed
      finding dist-71a64a88).
    maturity: designed
    scope: |
      Confirmed for the four standalone outposts. Not addressed:
      embedded outpost is in-process (dist-71a64a88); outpost-to-Server
      WebSocket TLS requirement is GAP (Conf finding conf-e08662e7).
      Backup / DR story for outpost-local state (if any per
      INV-OUTPOST-002 GAP) is not asserted (dist-bf087181).
    evidence:
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Decision, opening paragraph"
        excerpt: "Each outpost is a Go binary built from go.mod, with its own image (ghcr.io/goauthentik/proxy, ldap, radius, rac). Outposts are deployed separately from the Server, anywhere"
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Consequences > Positive, paragraph 2"
        excerpt: "Outposts can deploy where they are needed. An LDAP outpost in a DMZ talks to legacy apps over the local network and to the Server"
    control_mappings:
      nist_800_53r5:
        - "SC-7"
        - "SC-7(21)"
        - "SC-36"
        - "CP-7"
      mitre_attack_mitigations:
        - id: "M1030"
          rationale: "Network Segmentation analog — per-protocol outpost separation limits blast radius of a protocol-handler bug (T1190) to the affected outpost rather than Core."
    caveats:
      - "Embedded outpost is in-process and does not benefit from this isolation (dist-71a64a88)."
      - "Outpost-to-Server WebSocket TLS requirement is GAP (conf-e08662e7)."
    related_concerns: [resilient, confidentiality]

  - schema_version: 1
    id: dist-cap-1e67e7bc
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    title: "Externalised primary state in PostgreSQL with `django-tenants` schema-per-tenant for the Enterprise multi-tenancy feature"
    description: |
      Per ADR-0002 and `tech_plan.md` §2 / §9, all persistent state
      (identity, configuration, audit, session, encrypted secret
      material) lives in PostgreSQL with the `django-tenants==3.10.1`
      schema-per-tenant routing for the multi-tenant case. This
      satisfies the stateless-application-tier prerequisite for
      horizontal scale (multiple Server replicas behind a load
      balancer) when the Postgres-backed alternatives for cache, queue,
      and channels-layer are used.
    maturity: designed
    scope: |
      Confirmed for the platform-level externalisation. Not addressed:
      tenancy is alpha (`INV-AUTHZ-004` partially-false per the
      tenancy doc; Expression-policy cross-tenant access is documented
      caveat — see Confidentiality / Authenticity findings on the
      tenant-boundary leak); cross-region replication policy not
      enumerated (dist-b8b7603b); Flow-executor sticky-session
      requirement unconfirmed (dist-b07412b8).
    evidence:
      - artifact: invariants.md
        locator: "§INV-PERSIST-003"
        excerpt: "All persistent state lives in PostgreSQL"
      - artifact: tech_plan.md
        locator: "§9 'Persistence and storage', PostgreSQL bullet"
        excerpt: "PostgreSQL — primary store. ... Without it, authentik cannot be restored to a usable state."
    control_mappings:
      nist_800_53r5:
        - "CM-2"
        - "SC-36"
        - "CP-9"
    caveats:
      - "Tenancy is alpha; cross-tenant Expression-policy access is a documented known caveat."
      - "Postgres concentrates failure domains for primary state + cache + queue + channels-layer (dist-9b598237)."
    related_concerns: [availability, immutability]
