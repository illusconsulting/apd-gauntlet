finding:
  - schema_version: 1
    id: dist-b8b7603b
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: risk
    severity: high
    confidence: high
    title: "Multi-region active-active topology and cross-region replication policy are unspecified"
    summary: "Per `agents.md` and ADR-0002, production HA is documented at the AZ level via replication; multi-region failover, write-conflict resolution, and per-tenant residency are not addressed."
    detail: |
      `agents.md` describes the production posture as "PostgreSQL with
      replication or managed-Postgres (RDS, Cloud SQL)" — which covers
      single-region multi-AZ HA but does not address multi-region
      topology. ADR-0002 establishes PostgreSQL as the universal SPOF
      for identity / session / audit / secret material. The
      identity-security common-patterns Distributed guidance flags
      this as a critical pattern: "Multi-region topology asserted but
      failover behavior unspecified — active-active vs. active-passive
      vs. standby, write-conflict policy on the credential store,
      failover trigger, RTO/RPO targets."

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Single-AZ deployment of the IdP
      application tier, the session store, or the signing-key backend"
      — extended to the single-region case. The IdP is the topmost
      availability dependency for every dependent application, so a
      regional outage cascades. Cross-references Availability finding
      avail-cfd2b6e8 (which framed the SLO consequence); this finding
      owns the topology framing.
    evidence:
      - artifact: agents.md
        locator: "§'Operator characteristics', 'High-availability expectations' bullet"
        excerpt: "PostgreSQL with replication or managed-Postgres (RDS, Cloud SQL); outposts deployed redundantly per protocol."
      - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
        locator: "§Consequences > Negative / trade-offs, item 2"
        excerpt: "Loss of the database means loss of all identity, audit, session, and secret-encrypted material."
    prerequisite_evidence:
      - "Multi-region topology specification (active-active, active-passive, or standby)"
      - "Write-conflict policy for credential and session stores"
      - "Cross-region replication RPO targets per data class"
      - "Per-tenant data-residency policy if multi-tenant (Brand/Tenancy)"
    control_mappings:
      nist_800_53r5:
        - "SC-7"
        - "SC-36"
        - "SC-36(1)"
        - "CP-7"
        - "CP-7(1)"
      mitre_attack:
        - technique: "T1485"
          sub_technique: null
          tactic: "TA0040"
          rationale: "A single-region IdP topology means a regional incident destroys the IdP's data plane in one substrate; without multi-region replication the identity authority is non-recoverable within the regional outage window."
    recommendation:
      posture: required
      summary: "Author a multi-region reference architecture document covering active-active and active-passive options, with explicit RTO/RPO targets per data class and the operational discipline for cross-region credential / session / audit replication."
      detail: |
        Author `sys-mgmt/ops/multi-region-architecture.md` with:

        - Active-active option: per-region Server replicas, regional
          PostgreSQL primary + cross-region async replica, session-store
          replication topology, signing-key access pattern (regional
          KMS recommended)
        - Active-passive option: warm secondary in another region with
          documented failover trigger, RTO target, manual / automated
          failover playbook
        - Per-tenant data-residency: if multi-tenant deployments need
          per-tenant region binding (GDPR Article 44+ flows), document
          the tenant-to-region pinning mechanism (application-tier
          routing or database-level constraints)
        - Cross-region audit replication policy (the audit log is the
          highest-priority cross-region replicated data class — losing
          regional audit during failover is a Non-Repudiation gap;
          cross-references the Non-Repudiation specialist)

        Adopt the recommendation from Availability finding
        avail-cfd2b6e8 (reference Postgres HA topology) as the
        single-region foundation this builds on.
      references:
        - "external: NIST SP 800-34 Rev. 1 (Contingency planning across geographic regions)"
        - "external: AWS Well-Architected Framework — Reliability Pillar (multi-region patterns)"
    related_concerns: [availability, resilient, non_repudiation, confidentiality]
    cross_references: [avail-cfd2b6e8]

  - schema_version: 1
    id: dist-71a64a88
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: risk
    severity: high
    confidence: high
    title: "Embedded outpost shares Server image and process space; no process boundary across outpost protocol-handler surface and Core"
    summary: "Per ADR-0003 and threat-model E-8, the embedded proxy outpost is colocated with the Server in a single image / process; the four standalone outposts have process boundaries but the embedded variant does not."
    detail: |
      ADR-0003 §Notes explicitly documents this: "The embedded outpost
      does not benefit from the process-isolation that a separate
      outpost provides." `tech_plan.md` §2 confirms: "A lightweight Go
      router (statically compiled into the same image) performs the
      prefix-match routing between core, embedded outpost, static
      assets, and the WebSocket upgrade path." `architecture-index.md`
      describes the embedded-outpost component as "In-process. Inherits
      the Server's network posture."

      The Distributed lens here is the failure-domain topology: the
      four standalone outposts are explicitly designed as isolated
      failure domains (ADR-0003 §Positive paragraph 3: "An outpost
      crash does not take down the Server"). The embedded variant
      violates that topology principle — a crash, an OOM, or an
      exploit in the embedded outpost's handler degrades or compromises
      Core. This is a structural Distributed-and-Resilient finding,
      not just the Confidentiality reading already covered by
      conf-7174bf6f.

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Single-AZ deployment of the IdP
      application tier" by topological analogy — the embedded outpost's
      failure domain is the same as Core's. Cross-references the
      Confidentiality finding on master-secret reachability (conf-7174bf6f)
      and the Resilient specialist for the failure-isolation story.
    evidence:
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Notes, paragraph 1"
        excerpt: "The embedded outpost does not benefit from the process-isolation that a separate outpost provides — a bug in the embedded outpost's HTTP handler lands in"
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Consequences > Positive, paragraph 3"
        excerpt: "Failure isolation. An outpost crash does not take down the Server. A Server restart does not require simultaneously restarting every outpost."
      - artifact: tech_plan.md
        locator: "§2 'Server', paragraph after Embedded outpost"
        excerpt: "A lightweight Go router (statically compiled into the same image) performs the prefix-match routing between core, embedded outpost, static assets, and the WebSocket upgrade path."
    control_mappings:
      nist_800_53r5:
        - "SC-3"
        - "SC-7"
        - "SC-39"
        - "CP-7"
    recommendation:
      posture: recommended
      summary: "Recommend standalone proxy-outpost deployments for production; deprecate the embedded outpost for production posture; preserve embedded outpost for laboratory / single-server installs."
      detail: |
        Document the production-recommended posture as the standalone
        `ghcr.io/goauthentik/proxy` outpost deployed in its own pod /
        container, with the embedded outpost disabled. The embedded
        outpost continues to ship for laboratory and small-server
        deployments where the single-image convenience outweighs the
        topology trade-off. Surface this recommendation in
        `install-config/install/` (parallel to the existing
        reverse-proxy recommendation) and in the production-hardening
        checklist in `runbook.md` §10.
      references:
        - "internal: adrs/0003-outpost-architecture-for-protocol-handlers.md (the separation rationale for the four standalone outposts)"
        - "internal: conf-7174bf6f (the master-secret reachability finding paired with this topology finding)"
    related_concerns: [confidentiality, resilient]
    cross_references: [conf-7174bf6f]

  - schema_version: 1
    id: dist-9b598237
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: risk
    severity: high
    confidence: high
    title: "PostgreSQL serves identity, audit, session, secret material, AND the task queue / channels-layer — single substrate concentrates failure domains"
    summary: "Per ADR-0002, the Postgres-backed alternatives (`django-dramatiq-postgres`, `django-channels-postgres`, `django-postgres-cache`) put queue, pub/sub, and cache on the same substrate as primary state."
    detail: |
      ADR-0002 §Decision establishes the "single primary datastore"
      posture: "Operators who want to run authentik without Redis can
      do so; PostgreSQL alone is the supported posture." The
      consequence per §Negative item 5: "Channels-layer transport on
      PostgreSQL. Outpost-to-Server WebSocket signaling traffic
      ultimately rides PostgreSQL pubsub (LISTEN/NOTIFY) when
      `django-channels-postgres` is in use. A slow PostgreSQL impacts
      outpost responsiveness."

      The Distributed lens: this concentrates failure domains. A
      single Postgres incident (a long-running query, replication lag,
      connection pool exhaustion, an autovacuum stall) simultaneously
      degrades: authentication (auth-data reads), session lookup,
      audit writes, outpost configuration push (channels-layer),
      background tasks (dramatiq queue), and cache operations. The
      blast radius of "PostgreSQL is slow" is the entire platform,
      not a single subsystem.

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Session-store backpressure absent —
      Redis/PostgreSQL session store can be saturated by authentication
      storm, taking the entire IdP offline" — generalised to "every
      shared subsystem is saturated together." Cross-references
      Availability finding avail-cfd2b6e8 (the SLO consequence) and
      Resilient specialist for the bulkhead pattern.
    evidence:
      - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
        locator: "§Consequences > Negative / trade-offs, item 5"
        excerpt: "Channels-layer transport on PostgreSQL. Outpost-to-Server WebSocket signaling traffic ultimately rides PostgreSQL pubsub (LISTEN/NOTIFY) when django-channels-postgres is in use. A slow PostgreSQL impacts outpost responsiveness."
      - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
        locator: "§Consequences > Negative / trade-offs, item 3"
        excerpt: "PostgreSQL-backed task queue load. Heavy SCIM sync / notification dispatch / Source sync all write to the same database that serves user-facing auth flows."
    control_mappings:
      nist_800_53r5:
        - "SC-5"
        - "SC-6"
        - "SC-36"
        - "SI-13"
      mitre_attack:
        - technique: "T1499"
          sub_technique: null
          tactic: "TA0040"
          rationale: "An adversary or accidental load spike against any single Postgres-served subsystem (queue, pub/sub, cache, primary state) saturates the shared substrate and produces a platform-wide endpoint denial."
    recommendation:
      posture: recommended
      summary: "Document the trade-off in `install-config/`: Postgres-only is operationally simpler but concentrates failure domains; Redis (or dedicated queue) for cache + channels-layer reduces blast radius at the cost of more moving parts."
      detail: |
        Update `install-config/` and ADR-0002 §Notes with explicit
        guidance on when to deploy Redis as a separate failure domain:

        - Lab / single-tenant / small-scale: Postgres-only is fine
        - Production multi-tenant or production with substantial SCIM
          / Source-sync workload: deploy Redis (or a dedicated managed
          cache/queue) for `django-channels-postgres` and the dramatiq
          queue, leaving Postgres to serve primary state
        - High-availability production: separate Redis cluster +
          Postgres HA topology, with explicit per-subsystem
          monitoring so a single subsystem's saturation is detectable

        Cross-references Distributed finding dist-b8b7603b
        (multi-region) — the substrate-decomposition pattern composes
        with multi-region for fully resilient deployment.
      references:
        - "internal: adrs/0002-django-celery-redis-postgresql-stack.md (the ADR this updates)"
    related_concerns: [availability, resilient]
    cross_references: [avail-cfd2b6e8]

  - schema_version: 1
    id: dist-bf087181
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: uncertainty
    severity: medium
    confidence: medium
    title: "Outpost-local PostgreSQL access via `gorm.io/driver/postgres` is in go.mod but its boundary is unconfirmed"
    summary: "Per `invariants.md` INV-OUTPOST-002 GAP, `gorm.io/driver/postgres v1.6.0` is in `go.mod`; outposts are documented to have no direct PostgreSQL access but the dependency suggests an exception."
    detail: |
      INV-OUTPOST-002: "GAP — `go.mod` lists `gorm.io/driver/postgres
      v1.6.0`, which suggests outpost-local PostgreSQL access for some
      outpost type (likely RAC for session persistence). Reviewers
      should confirm the boundary; the documentation states outposts
      go through the Server API for configuration but the GORM/PG
      dependency suggests an exception." The Distributed lens: if an
      outpost holds its own Postgres handle, the topology has an extra
      data plane the documentation doesn't acknowledge — which means
      replication policy, backup policy, and HA topology for that
      outpost-local store are not described and not coordinated with
      the Core Postgres story.

      Disposition is uncertainty: the dependency presence is confirmed;
      the actual boundary (which outpost type uses it; whether it
      points back to Core Postgres or to an outpost-local Postgres) is
      not. Severity is medium because the consequence depends on the
      actual usage pattern — if RAC holds session state locally for
      tunneling, that's a small additional data plane; if other
      outposts also use it for caching, the architecture index needs
      updating.
    evidence:
      - artifact: invariants.md
        locator: "§INV-OUTPOST-002, Reviewer note"
        excerpt: "GAP — go.mod lists gorm.io/driver/postgres v1.6.0, which suggests outpost-local PostgreSQL access for some outpost type (likely RAC for session persistence)."
    prerequisite_evidence:
      - "Which outpost type uses the gorm/Postgres dependency"
      - "Whether the outpost connects to its own Postgres or to Core's Postgres"
      - "Backup / replication / HA topology for any outpost-local Postgres"
      - "Update to architecture-index.md and the trust-boundary inventory in tech_plan.md §3 to reflect the actual boundary"
    control_mappings:
      nist_800_53r5:
        - "SC-7"
        - "CP-9"
        - "CM-2"
    recommendation:
      posture: recommended
      summary: "Resolve the INV-OUTPOST-002 GAP: confirm which outpost type uses the gorm/Postgres dependency and update the architecture index, trust-boundary inventory, and backup-restore runbook accordingly."
      detail: |
        Audit `go.mod` against the four outpost source trees (proxyv2,
        ldap, radius, rac) to confirm which outpost(s) import the
        Postgres driver. Update:

        - INV-OUTPOST-002 to reflect actual platform state (remove GAP)
        - architecture-index.md to add the outpost-local Postgres
          datastore as a fifth data plane (if applicable)
        - tech_plan.md §3 trust-boundary inventory to add boundary 9
          (outpost ↔ outpost-local Postgres)
        - sys-mgmt/ops/backup-restore.md to document backup of the
          outpost-local store
      references:
        - "internal: invariants.md §INV-OUTPOST-002 (the GAP this resolves)"
    related_concerns: [availability, immutability]
    cross_references: []

  - schema_version: 1
    id: dist-b07412b8
    agent: distributed
    apd_tier: scalability
    apd_goal: distributed
    disposition: blocked
    severity: medium
    confidence: medium
    title: "Session affinity / sticky-session requirements across the Server load-balancer are not specified for the Flow executor"
    summary: "Per `tech_plan.md` §4 the Flow executor materialises stage state; whether mid-flow state is in-process or fully externalised to Postgres is not asserted."
    detail: |
      The Flow executor runs an ordered sequence of Stages with mid-flow
      state (the flow plan, the partial-stage inputs, the policy
      evaluation context). For a horizontally-scaled multi-replica
      Server topology to scale freely without sticky sessions, that
      state must be fully externalised. The inputs document that all
      persistent state lives in PostgreSQL (`INV-PERSIST-003`), but
      mid-flow state during a multi-step interactive Flow execution
      (between an HTTP POST submitting the password and the next HTTP
      GET rendering the MFA stage) is not explicitly addressed.

      The identity-security common-patterns Distributed guidance flags
      the inverse anti-pattern: "Session affinity / sticky sessions on
      the IdP load balancer because state is in-process (interactive
      auth flow state cached in pod memory). Severity: medium to high
      (impairs horizontal scale, deploy-time rolling restarts produce
      mid-flow session loss, AZ failover invalidates all in-flight
      authentications)."

      Disposition is blocked because the inputs are silent on this;
      severity is medium because the consequence depends on whether
      sticky sessions are actually required (and many operators
      configure them defensively without checking).
    evidence:
      - artifact: invariants.md
        locator: "§INV-PERSIST-003, Reviewer note"
        excerpt: "Holds. File uploads live under /data and are separately backup-managed; everything else is in PostgreSQL."
      - artifact: tech_plan.md
        locator: "§4 'Interactive flow', opening paragraph"
        excerpt: "User-interactive authentication is always a Flow. A Flow is a named, ordered sequence of Stage Bindings"
    prerequisite_evidence:
      - "Whether mid-flow Flow-executor state is in-process or fully externalised to Postgres / Redis"
      - "Whether sticky sessions are required, recommended, or unnecessary across Server replicas"
      - "Whether rolling restarts during a Flow execution are graceful or produce mid-flow session loss"
    control_mappings:
      nist_800_53r5:
        - "SC-36"
        - "SC-6"
        - "CP-7"
    recommendation:
      posture: recommended
      summary: "Document the Flow-executor state externalisation in `tech_plan.md` or `architecture-index.md`; explicitly state whether sticky sessions are required, recommended, or unnecessary across Server replicas."
      detail: |
        Add a section to `architecture-index.md` for the Server component
        stating: "Flow-executor mid-flow state is fully externalised to
        PostgreSQL via the dramatiq-postgres-locked FlowPlan model.
        Sticky sessions are NOT required across Server replicas; rolling
        restarts mid-flow are graceful." OR document the actual contrary
        state if state is in-process. Update the production
        deployment guide accordingly.
      references:
        - "internal: tech_plan.md §4 (the Flow executor description)"
    related_concerns: [availability, resilient]
    cross_references: []
