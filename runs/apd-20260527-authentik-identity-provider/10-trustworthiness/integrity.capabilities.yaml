capability:
  - schema_version: 1
    id: intg-cap-f8801874
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "defusedxml + xmlsec XML-processing stack for SAML signature verification"
    description: |
      Per `tech_plan.md` §6 SAML and `pyproject.toml`, SAML XML
      processing uses `defusedxml==0.7.1` (conventional Python defense
      against XXE and XML-bomb attacks) and `xmlsec==1.3.17` for XMLDSig
      signature verification, layered on `lxml==6.1.1`. Per-Provider SP
      verification certificates are configurable. This is the
      dependency-stack mitigation against the classical SAML XSW and
      XXE attack classes (threat-model S-4, D-3).
    maturity: designed
    scope: |
      Confirmed at the dependency level (pinned in `pyproject.toml`).
      Not addressed in this capability: code-level confirmation that the
      higher-level signature-validation logic re-verifies the
      canonical signed region against the parsed assertion (see
      Integrity finding intg-e1d79aee — disposition: uncertainty).
      Per-Provider digest algorithm choice (SHA-1 vs. SHA-256) is
      operator-configurable; SHA-1 hardening misstep is finding
      intg-7111d094.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 SAML, XML processing paragraph"
        excerpt: "XML processing uses lxml==6.1.1 + xmlsec==1.3.17. The defusedxml==0.7.1 dependency is in pyproject.toml"
      - artifact: invariants.md
        locator: "§INV-FED-002"
        excerpt: "Holds. Algorithm selection (RSA-SHA256 / ECDSA-SHA256, SHA-1 / SHA-256 digest) is per-Provider"
    control_mappings:
      nist_800_53r5:
        - "SI-7"
        - "SI-10"
        - "SC-13"
      mitre_attack_mitigations:
        - id: "M1049"
          rationale: "Antivirus/Antimalware analog — defusedxml prevents the XXE / XML-bomb class (T1499.001 resource exhaustion)."
    caveats:
      - "Higher-level XSW resistance (re-parse-and-compare after signature validation) is not asserted in inputs; see intg-e1d79aee."
      - "SHA-1 digest remains configurable per Provider (deprecated); see intg-7111d094."
    related_concerns: [authenticity, availability]

  - schema_version: 1
    id: intg-cap-20ca5f2c
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "Per-Provider OAuth scope and SAML attribute-release filtering via Property Mappings (Python expression)"
    description: |
      Per ADR-0001 and the OAuth/SAML provider docs, Property Mappings
      allow operator-authored Python expressions to filter, transform,
      or shape claims and attributes released per Provider. This is the
      mechanism by which an operator implements least-privilege
      attribute release for a specific RP/SP, including the recommended
      mitigation for findings I-4, I-5 (over-release of user data).
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level: Property Mappings exist
      and are bindable per Provider. Not addressed: default mappings are
      maximal-release (see Confidentiality findings conf-22a9ce55,
      conf-2a905f1d), so the capability is the platform-supplied
      mechanism but defaults work against it. Property Mappings are
      arbitrary Python (no sandbox) — see Integrity finding
      intg-0a313721 for the privilege-escalation surface.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, scope bullet and §6 SAML, default attribute bullet"
        excerpt: "scope mappings are property mappings (Python expressions). An operator can write a custom mapping that filters group memberships per-application."
      - artifact: adrs/0001-flows-stages-policies-pipeline.md
        locator: "§Decision, paragraph 6"
        excerpt: "Property Mappings (used by Sources, OAuth Providers, SAML Providers, SCIM Providers, RAC Providers, and LDAP Providers) share the same Python-expression environment."
    control_mappings:
      nist_800_53r5:
        - "AC-4"
        - "AC-21"
        - "SI-15"
        - "AU-2"
    caveats:
      - "Default property mappings release maximal attribute set (Confidentiality findings conf-22a9ce55, conf-2a905f1d)."
      - "Property Mappings are arbitrary Python with no sandbox; permission to edit them is the trust boundary per ADR-0001."
    related_concerns: [confidentiality, authenticity]

  - schema_version: 1
    id: intg-cap-8613272f
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "JWE encryption support for sensitive ID-token claims (RSA-OAEP-256 + A256CBC-HS512) when Encryption Key configured per Provider"
    description: |
      Per `tech_plan.md` §6 OAuth 2.0 / OIDC, when an Encryption Key is
      configured on an OAuth Provider, ID tokens can be JWE-encrypted
      using RSA-OAEP-256 key wrapping plus A256CBC-HS512 content
      encryption. This allows the IdP to release sensitive claims to
      audiences that hold the decryption key, preventing
      log-aggregator / proxy / APM-tier disclosure of claim contents.
      The mechanism cross-cuts Confidentiality (claim contents
      protected) and Integrity (authenticated encryption binds
      ciphertext to plaintext).
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level (operator opt-in per
      Provider). Not addressed: the default posture for new Providers
      is no-encryption (signed JWT only); JWE is opt-in. Key rotation
      cadence for encryption keys is operator-driven (INV-OPS-003);
      see Ephemeral specialist.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, JWE bullet"
        excerpt: "Optional JWE encryption: RSA-OAEP-256 key wrapping plus A256CBC-HS512 content encryption when an Encryption Key is configured on the Provider."
    control_mappings:
      nist_800_53r5:
        - "SC-8(1)"
        - "SC-12"
        - "SC-13"
        - "AC-4"
      mitre_attack_mitigations:
        - id: "M1041"
          rationale: "Encrypt Sensitive Information — JWE on ID tokens mitigates collection of identity claims (T1530) at intermediaries between IdP and RP."
    caveats:
      - "Opt-in per Provider; default is unencrypted signed JWT."
      - "Encryption-Key rotation cadence is operator-driven."
    related_concerns: [confidentiality, ephemeral]

  - schema_version: 1
    id: intg-cap-13411b16
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    title: "Object-level RBAC via Django-Guardian; Roles bundle permissions for least-privilege scoping"
    description: |
      Per `tech_plan.md` §5 RBAC and `invariants.md` INV-AUTHZ-003, the
      platform uses Django-Guardian (`ak-guardian==3.2.0` workspace
      dependency) for object-level permissions. Roles bundle permissions
      such that an operator can scope a service account or human
      operator to "edit this specific Provider" rather than "edit all
      Providers." Per the LDAP provider doc, this is also what gates
      the `Search full LDAP directory` permission introduced in 2024.8.
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level. Not addressed: default
      admin tokens are full-access (threat-model I-3 residual question);
      operators must opt into the role-based scoping rather than
      receiving it by default.
    evidence:
      - artifact: tech_plan.md
        locator: "§5 RBAC, paragraph 1"
        excerpt: "authentik has a Django-Guardian-backed RBAC layer (per pyproject.toml: ak-guardian==3.2.0 workspace dependency). Roles bundle permissions; permissions are object-level"
      - artifact: invariants.md
        locator: "§INV-AUTHZ-003, Reviewer note"
        excerpt: "Holds. Roles bundle object-level permissions; service accounts can be scoped tightly per the sys-mgmt/service-accounts.md documentation."
    control_mappings:
      nist_800_53r5:
        - "AC-3"
        - "AC-3(7)"
        - "AC-6"
        - "AC-6(1)"
      mitre_attack_mitigations:
        - id: "M1018"
          rationale: "User Account Management — object-level role-based scoping limits horizontal escalation surface (T1078) when a non-admin token leaks."
    caveats:
      - "Default admin-issued API tokens are full-scope; least-privilege is opt-in."
      - "INV-AUTHZ-004 (tenant boundaries via django-tenants) is partially-false in alpha — Expression policies have cross-tenant access per the tenancy doc."
    related_concerns: [authenticity, confidentiality]
