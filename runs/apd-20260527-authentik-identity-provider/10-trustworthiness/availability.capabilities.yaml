capability:
  - schema_version: 1
    id: avail-cap-594bb90c
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    title: "Liveness and readiness probes exposed at `/-/health/live/` and `/-/health/ready/`; Prometheus metrics at `/-/metrics/` and per-outpost `:9300/metrics`"
    description: |
      Per `runbook.md` §3 the platform exposes standard Kubernetes-shape
      liveness and readiness probes for the Server (the readiness probe
      checks DB connectivity), with Prometheus metrics at the Server's
      `/-/metrics/` endpoint and per-outpost `:9300/metrics`. This is
      the foundation for operator-side health monitoring and alerting.
      The capability is the platform-supplied substrate that enables
      operator-defined SLO targets (see Availability finding
      avail-1160b595 for the SLO finding).
    maturity: designed
    scope: |
      Confirmed for the Server's basic liveness/readiness endpoints and
      the Prometheus metrics surface. Not addressed: per-protocol-
      endpoint SLO targets shipped by the platform (finding
      avail-1160b595); deep health checks beyond DB connectivity
      (finding avail-57898caa); SLO-driven alerting rule definitions.
      Per-outpost `:9300/metrics` is unauthenticated and operator-
      protected (INV-OPS-006).
    evidence:
      - artifact: runbook.md
        locator: "§3 'Health checks', endpoint list"
        excerpt: "GET /-/health/live/ — liveness probe. GET /-/health/ready/ — readiness probe (checks DB connectivity). GET /-/metrics/ — Prometheus metrics (Server)."
    control_mappings:
      nist_800_53r5:
        - "SI-13"
        - "CP-10"
        - "CA-7"
    caveats:
      - "Readiness probe depth is DB-only per inputs; deeper checks (signing-key, Source, outpost-WS) not asserted."
      - "Per-outpost `:9300/metrics` is unauthenticated by design (INV-OPS-006); operator network policy is the control."
      - "Per-endpoint SLO targets are operator-defined; platform does not ship recommendations."
    related_concerns: [resilient]

  - schema_version: 1
    id: avail-cap-2e726aa6
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    title: "Per-Brand and per-Application policy binding for operator-driven rate-limit, GeoIP, and Reputation gating"
    description: |
      Per `runbook.md` §10 and `customize/policies/types/index.mdx`, the
      platform supplies Reputation, GeoIP, Password, Password Expiry,
      and (Enterprise) Password Uniqueness policies as composable
      gating primitives that can be bound to Stages, Flows, Sources, or
      Applications. The IncludeSec 2025-09 M1 finding's remediation in
      2025.12 (replacing session-based retry counters with
      reputation-driven counters per PR #18643) made the Reputation
      policy the primary in-platform rate-limit primitive.
    maturity: designed
    scope: |
      Confirmed at the platform-mechanism level. Not addressed: the
      defaults do not bind these policies to the shipped flows
      (Availability finding avail-3a9189a2 — the binding is
      operator-action-required). When operator-bound, the policies
      function; the gap is in the default posture.
    evidence:
      - artifact: tech_plan.md
        locator: "§5 'Authorization model', Policy types bullet list"
        excerpt: "Event Matcher, Expression, GeoIP, Password, Password Expiry, Reputation, Password Uniqueness (Enterprise)"
      - artifact: prior-audit.md
        locator: "§IncludeSec 2025-09, M1 row"
        excerpt: "Fixed in 2025.12 by replacing session-based retries with reputation-driven counters (PR #18643)"
    control_mappings:
      nist_800_53r5:
        - "SC-5"
        - "AC-7"
        - "IA-5(13)"
        - "AU-6(1)"
      mitre_attack_mitigations:
        - id: "M1036"
          rationale: "Account Use Policies — Reputation policy + GeoIP enable rate-limiting and location-based gating of authentication attempts (T1110)."
    caveats:
      - "Default flows do not bind these policies (operator-action-required); see Availability finding avail-3a9189a2."
      - "Out-of-the-box install ships without active rate-limiting on /authorize, /token, recovery endpoints."
    related_concerns: [authenticity, resilient]

  - schema_version: 1
    id: avail-cap-119c6e20
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    title: "Multiple Server / Worker replicas behind load balancer; PostgreSQL replication or managed-Postgres for HA topology"
    description: |
      Per `agents.md` and the install guides, production deployments
      run multiple Server replicas behind a load balancer, multiple
      Worker replicas, and PostgreSQL with replication or
      managed-Postgres (RDS, Cloud SQL). The application tier is
      stateless once session state is externalised to PostgreSQL (the
      Postgres-backed default per ADR-0002) or Redis (when configured),
      so horizontal scale is straightforward. The Worker queue is
      Postgres-backed via `django-dramatiq-postgres` and supports
      multiple worker processes consuming concurrently.
    maturity: designed
    scope: |
      Confirmed at the architectural-pattern level. Not addressed:
      specific HA topology recommendations from the upstream project
      (Availability finding avail-cfd2b6e8 — these are
      operator-improvised); the database tier remains the SPOF
      (ADR-0002 §Negative item 2); multi-region story is not
      enumerated (Distributed specialist will cover).
    evidence:
      - artifact: agents.md
        locator: "§'Operator characteristics', 'High-availability expectations' bullet"
        excerpt: "Production deployments run multiple Server replicas behind a load balancer; multiple Worker replicas; PostgreSQL with replication or managed-Postgres (RDS, Cloud SQL); outposts deployed redundantly per"
      - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
        locator: "§Invariants pinned by this ADR, bullet 4"
        excerpt: "Worker tasks are at-least-once with the dramatiq-postgres semantics."
    control_mappings:
      nist_800_53r5:
        - "CP-2"
        - "CP-7"
        - "SC-6"
        - "SC-36"
    caveats:
      - "PostgreSQL remains the SPOF for identity / session / audit / secret material (ADR-0002)."
      - "Multi-region active-active topology is not asserted; cross-region replication story not enumerated."
      - "Sticky-session warning: in-process Flow plan state would impair horizontal scale; the Postgres-backed state externalises this."
    related_concerns: [distributed, resilient]
