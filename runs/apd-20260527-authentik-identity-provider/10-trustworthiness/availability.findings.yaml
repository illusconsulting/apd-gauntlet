  - schema_version: 1
    id: avail-b46582cb
    agent: availability
    apd_tier: trustworthiness
    apd_goal: availability
    disposition: uncertainty
    severity: medium
    confidence: medium
    title: "Source-IdP outage during federated login: behavior is not specified — does the IdP fail-closed or fall back to cached identity?"
    summary: "Per `agents.md` and the identity-security common-patterns guidance, IdP-to-Source-IdP failure modes commonly produce opaque errors without fallback; the inputs do not describe authentik's specific behavior on Source-IdP unreachability."
    detail: |
      The identity-security availability common-patterns calls out:
      "No degraded-mode authentication specified — if the
      credential-verification path (LDAP, database, upstream IdP) is
      unavailable, the IdP returns 500 to every request. Severity: high
      (cascading total outage; IdP is the topmost availability
      dependency for every RP — no graceful fallback path defined)."
      The authentik inputs document the Source pattern (`tech_plan.md`
      §7, `happy-path.md` §8) but do not describe degraded-mode behavior
      when the Source is unreachable mid-flow.

      Disposition is uncertainty because the inputs are silent on this;
      severity is medium because the failure mode is real but its
      blast radius depends on whether a Source is required-for-login or
      optional-as-an-additional-login-option (the Identification stage
      can present multiple sources). For deployments where the
      corporate IdP Source is the only login path, a Source outage =
      total auth outage.
    evidence:
      - artifact: tech_plan.md
        locator: "§7 'Federation (Source)', last paragraph"
        excerpt: "Source attribute mapping is via Python expression property mappings; the same expression engine that powers Policies."
      - artifact: happy-path.md
        locator: "§8 'Source-driven first login', What happens steps 2-3"
        excerpt: "The Source stage hands the user off to the upstream IdP. The upstream IdP authenticates the user and returns the assertion / token to authentik."
    prerequisite_evidence:
