  - schema_version: 1
    id: intg-7fb03642
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: high
    confidence: high
    title: "Forward-auth header trust model — protected app trusts `X-authentik-*` headers as authoritative without out-of-band proof"
    summary: "Per ADR-0003 and `architecture-index.md` proxy-outpost, the protected app reads `X-authentik-username` as authoritative; any request that bypasses the outpost reaches the app un-checked."
    detail: |
      ADR-0003 §Negative item 4: "The forward-auth header model trusts
      the outpost. The protected application reads `X-authentik-username`
      and treats it as authoritative. Any request that bypasses the
      outpost (network-policy mistake, reverse-proxy ACL gap, attacker
      pivot onto the app's network) reaches the app without an authentik
      check — and the app cannot tell." The architecture index extends
      this: the proxy outpost's "Trust boundary: Trusted intermediary
      header-stamper" — the app has no way to verify the headers came
      from authentik vs. came from an attacker who reached the protected
      app's listening address directly.

      Severity is high per the identity-security severity rubric: this
      is the federation analog of "OAuth confused deputy / relying-party
      impersonation" — the protected app is the RP and the outpost is
      the issuer, but the assertion is unsigned (plaintext HTTP headers)
      so any actor who can stamp the same headers asserts the same
      identity. The integrity lens is input-validation on the protected
      app side: there is no message-level signature on the header set,
      no nonce, no replay-prevention.
    evidence:
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Consequences > Negative / trade-offs, item 4"
        excerpt: "The forward-auth header model trusts the outpost. The protected application reads X-authentik-username and treats it as authoritative. Any request that bypasses the outpost ... reaches"
      - artifact: architecture-index.md
        locator: "`proxy-outpost`, Trust boundary line"
        excerpt: "Trusted intermediary header-stamper. The protected application trusts the X-authentik-* headers. Any request that bypasses the outpost ... reaches the app without an authentik check —"
    control_mappings:
      nist_800_53r5:
        - "SI-10"
        - "SC-8(1)"
        - "SC-23"
        - "IA-3"
        - "IA-9"
      mitre_attack:
        - technique: "T1078"
          sub_technique: null
          tactic: "TA0001"
          rationale: "An attacker reaching the protected app's listening address can stamp X-authentik-* headers and impersonate any user, bypassing the outpost check entirely."
      cwe:
        - "CWE-345"
        - "CWE-290"
      owasp_top10:
        - "A07:2021"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: recommended
      summary: "Add an HMAC-signed header pair (`X-authentik-signature` + `X-authentik-signature-timestamp`) per request so the protected app can verify the headers originated from the outpost; document a per-Provider HMAC secret rotation procedure."
      detail: |
        Stamp a deterministic HMAC-SHA256 over the canonical header set
        plus a timestamp, signed with a per-outpost-Provider HMAC secret
        the protected app holds (out-of-band). The protected app rejects
        requests whose signature does not validate or whose timestamp
        falls outside a small acceptance window. This converts the
        header-trust from "I trust the network path" to "I trust the
        signature."

        For protected apps that cannot implement HMAC verification, the
        existing posture (network-policy isolation of the protected app
        from any caller other than the outpost) remains the
        fallback — but the platform should provide HMAC-signed headers
        as the modern option.
      references:
        - "external: NIST SP 800-107 Rev. 1 §5 (HMAC for message authentication)"
        - "external: RFC 2104 (HMAC)"
    related_concerns: [authenticity, distributed]
    cross_references: []

