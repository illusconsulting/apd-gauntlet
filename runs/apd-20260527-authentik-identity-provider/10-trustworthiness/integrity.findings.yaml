finding:
  - schema_version: 1
    id: intg-96d4de40
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: critical
    confidence: high
    title: "OAuth Provider with no Signing Key configured silently falls back to HMAC-signing JWTs with the Provider client_secret"
    summary: "Per `tech_plan.md` §6 and `invariants.md` INV-AUTH-003, when a Provider's Signing Key field is empty the platform signs tokens symmetrically with the client_secret — a leaked secret becomes signing-key-equivalent."
    detail: |
      Tech plan §6: "Signing keys are per-Provider ... If no Signing Key
      is selected, JWTs are HMAC-signed with the Provider's client secret —
      the symmetric-fallback surface." INV-AUTH-003: "When Signing Key is
      not configured, the OAuth provider falls back to HMAC signing with
      the client_secret (per the doc) — see threat-model S-3. Operators
      relying on the fallback have a fundamentally weaker signing
      posture." Threat-model S-3 supplies the consequence: any RP-side
      leak (CI log, repository check-in, mobile-app extraction, vendor
      compromise) of the client_secret immediately becomes a forge-any-
      JWT-for-any-user capability against that Provider.

      Severity is critical per the identity-security severity rubric:
      this matches the Critical clause "JWT algorithm confusion at the
      issuer" — specifically the variant where the asymmetric/symmetric
      boundary is misused. The platform default-when-empty makes
      symmetric signing the un-opted choice, which inverts the modern
      OAuth Security BCP posture (RFC 9700 §4 emphasizes asymmetric
      signing for any non-trivial deployment). Forgery scope is
      RP-bounded but for that RP it is universal-subject-impersonation.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, Signing Keys bullet"
        excerpt: "If no Signing Key is selected, JWTs are HMAC-signed with the Provider's client secret — the symmetric-fallback surface."
      - artifact: invariants.md
        locator: "§INV-AUTH-003, Reviewer note"
        excerpt: "When Signing Key is not configured, the OAuth provider falls back to HMAC signing with the client_secret"
      - artifact: threat-model.md
        locator: "§S-3 'JWT signing fallback to HMAC-with-client-secret', Existing mitigation line"
        excerpt: "Operators can (and should) configure a Signing Key per Provider. The fallback is the platform default posture when none is selected."
    control_mappings:
      nist_800_53r5:
        - "SI-7"
        - "SC-13"
        - "IA-5(2)"
        - "IA-2"
      mitre_attack:
        - technique: "T1606"
          sub_technique: "T1606.001"
          tactic: "TA0006"
          rationale: "A leaked client_secret used as HMAC signing key allows the attacker to forge OAuth web cookies (ID tokens, access tokens) for any user against that RP."
      cwe:
        - "CWE-347"
        - "CWE-327"
      owasp_top10:
        - "A02:2021"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Make Signing Key required-on-create for new OAuth Providers; deprecate the HMAC-with-client_secret fallback; auto-issue a per-Provider asymmetric key at Provider creation if the operator does not select one."
      detail: |
        At Provider creation, default the Signing Key field to a new
        auto-generated per-Provider RSA-2048 or ECDSA-P256 keypair drawn
        from a Provider-creation blueprint, rather than leaving the field
        empty and falling back to HMAC. For existing Providers without a
        Signing Key, emit a high-severity Event at the next token issuance
        and surface it on the Admin UI dashboard until remediated.
        Document the deprecation timeline for HMAC-with-client_secret in
        the OAuth provider doc; remove the fallback in a future major
        version.

        This reverses the default from "weakest signing posture unless
        operator opts in" to "modern signing posture unless operator
        opts out."
      references:
        - "external: RFC 9700 (OAuth 2.0 Security BCP) §4 on asymmetric signing for issued tokens"
        - "external: OIDC Core 1.0 §10 on JWT signing-key handling"
    related_concerns: [authenticity, ephemeral, confidentiality]
    cross_references: []

  - schema_version: 1
    id: intg-e1d79aee
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: uncertainty
    severity: high
    confidence: medium
    title: "SAML signature-validation discipline (XSW resistance) is not asserted in inputs beyond dependency posture"
    summary: "Per threat-model S-4 the SAML processor relies on `defusedxml==0.7.1` + `xmlsec==1.3.17`; whether higher-level code re-verifies the canonical signed region against the parsed assertion is not asserted."
    detail: |
      Threat-model S-4 documents the concern and the dependency-level
      mitigation: "`defusedxml==0.7.1` in `pyproject.toml` is the
      conventional Python defense against XXE / XML-bomb (and
      defusedxml-lxml integration). `xmlsec==1.3.17` performs XMLDSig
      verification. Per the SAML provider doc, SP verification
      certificates are per-Provider." Residual question: "Does the SAML
      processor wrap the libxml2 parser in a way that prevents XSW? The
      dependency posture is correct; the higher-level signature-validation
      logic in `authentik/providers/saml/` would need code-level review.
      The inputs do not assert XSW protection."

      Per the identity-security severity rubric, SAML signature wrapping
      accepted is a Critical clause ("arbitrary subject impersonation");
      partially-mitigated XSW (library default with known bypass variants)
      is a High clause. Without code-level confirmation of canonical-region
      re-verification, the disposition is uncertainty at High severity —
      this is the lens-appropriate posture because the dependency stack
      is correct (defusedxml + xmlsec) but the higher-level
      "re-parse-and-compare" discipline is not documented.

      Code reconnaissance is disabled for this run, so the disposition
      remains uncertainty rather than risk-or-blocked — the artifact set
      can support partial reasoning (dependency stack is correct, no
      known CVE has been published against the SAML provider for XSW
      since the project's audit history began) but cannot confirm the
      runtime defense.
    evidence:
      - artifact: threat-model.md
        locator: "§S-4 'SAML signature wrapping (XSW) and signature stripping', Residual question line"
        excerpt: "The dependency posture is correct; the higher-level signature-validation logic in authentik/providers/saml/ would need code-level review."
      - artifact: tech_plan.md
        locator: "§6 SAML, XML processing paragraph"
        excerpt: "XML processing uses lxml==6.1.1 + xmlsec==1.3.17. The defusedxml==0.7.1 dependency is in pyproject.toml"
    prerequisite_evidence:
      - "Code-level review of authentik/providers/saml/ signature-validation path"
      - "Test artifact: XSW corpus regression test in CI"
      - "Documentation in SAML provider doc explicitly asserting canonical-region re-verification"
    control_mappings:
      nist_800_53r5:
        - "SI-7"
        - "SI-7(1)"
        - "SI-10"
        - "SC-13"
        - "AU-12"
      mitre_attack:
        - technique: "T1606"
          sub_technique: "T1606.002"
          tactic: "TA0006"
          rationale: "If the SAML processor accepts attacker-rearranged XML where the signature covers a different region than the parsed assertion, an XSW attack forges SAML assertions for arbitrary subjects."
      cwe:
        - "CWE-347"
        - "CWE-345"
      owasp_top10:
        - "A02:2021"
    recommendation:
      posture: required
      summary: "Document the XSW-resistance discipline in the SAML provider doc with a code-level reference, and add an XSW corpus regression test in CI."
      detail: |
        Add a `security/saml-xsw-resistance.md` doc that walks through
        the implemented defense: which library call validates the
        signature, how the canonical signed region is identified, and
        the re-parse-and-compare step that ensures the parsed assertion
        IS the signed assertion. Reference the specific code path so
        operators can confirm. In CI, ship a regression-test corpus of
        known XSW attack vectors (XSW1 through XSW8 plus the Comment-
        injection variants) and ensure the SAML provider rejects all of
        them; alert on test regressions.
      references:
        - "external: SAML 2.0 Security Considerations §6.3 (signature wrapping)"
        - "external: ducktype-saml-xsw corpus (illustrative testing corpus)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: intg-0a313721
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: high
    confidence: high
    title: "Source attribute mapping can write `is_superuser=True` to local User; INV-FED-001 is not platform-enforced"
    summary: "Per `invariants.md` INV-FED-001 and threat-model S-7, Source-driven user-write writes are operator-policy not platform-enforced; a poorly written or malicious property mapping escalates federated identity to admin."
    detail: |
      INV-FED-001 is explicit: "**Not platform-enforced.** Per ADR-0001
      and the SECURITY.md classification, property mappings are arbitrary
      Python; an operator who writes a mapping that sets `is_superuser=True`
      from an upstream attribute will see exactly that behavior."
      Threat-model S-7 elaborates: "A malicious upstream IdP (or a
      compromised one) returns attributes claiming the user is
      `superuser=True`, or claims a `username` that collides with an
      existing admin's. A poorly-written property mapping accepts these
      as-authoritative and writes them to the local User."

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Privilege escalation via group/role
      mapping bug — federation attribute mapping ... permits a user to
      declare or influence their own group membership." For
      authentik specifically this is a write-path integrity gap — the
      User model accepts a `is_superuser=True` write from a Source
      property mapping with no platform-level deny on privileged-field
      writes from non-platform-trusted attribute sources. The
      compensating control is operator-authored property-mapping
      discipline, which is a code-review property rather than a platform
      property. Combined with a compromised upstream Source (the
      compromised_third_party_relying_party / federation-source variant
      in the attacker positions list), this becomes the cross-source
      admin-takeover path.
    evidence:
      - artifact: invariants.md
        locator: "§INV-FED-001, Reviewer note"
        excerpt: "Not platform-enforced. Per ADR-0001 and the SECURITY.md classification, property mappings are arbitrary Python; an operator who writes a mapping that sets is_superuser=True from an upstream"
      - artifact: threat-model.md
        locator: "§S-7 'Source attribute-injection at first login', Existing mitigation line"
        excerpt: "Per the SECURITY.md classification, the expression engine is intentionally arbitrary-Python; the property-mapping authoring discipline is the control."
      - artifact: adrs/0001-flows-stages-policies-pipeline.md
        locator: "§Consequences > Negative / trade-offs, item 1"
        excerpt: "Expressions (property mappings/policies/prompts) can execute arbitrary Python code without safeguards."
    control_mappings:
      nist_800_53r5:
        - "SI-10"
        - "AC-3"
        - "AC-6"
        - "AC-6(7)"
        - "IA-8"
      mitre_attack:
        - technique: "T1098"
          sub_technique: null
          tactic: "TA0003"
          rationale: "Source property-mapping that writes is_superuser from an attacker-controlled upstream attribute manipulates account privileges to attacker advantage."
        - technique: "T1199"
          sub_technique: null
          tactic: "TA0001"
          rationale: "Compromised upstream Source IdP exploits the trusted-relationship to escalate federated identities to local admin via attribute injection."
      cwe:
        - "CWE-915"
        - "CWE-269"
      owasp_top10:
        - "A01:2021"
        - "A04:2021"
      owasp_api_top10:
        - "API3:2023"
    recommendation:
      posture: required
      summary: "Enforce a platform-level deny on write-from-Source to privileged User fields (`is_superuser`, `is_staff`, role assignments, group memberships of admin groups); make exceptions explicit per-Source rather than implicit-on-property-mapping."
      detail: |
        Add a `protected_user_fields` allowlist enforced in the
        User-write path: by default, Source-driven writes cannot set
        `is_superuser`, `is_staff`, group memberships of any group whose
        Role grants admin permissions, or any Role assignment. Operators
        who legitimately need to JIT-provision admins via federation set
        a per-Source `allow_privileged_writes: true` flag and accept the
        risk explicitly. The Source's property mapping continues to
        operate; the User-write enforcer simply ignores forbidden field
        writes when the per-Source flag is not set, emitting a
        high-severity Event so the operator can see attempted escalations.

        This makes INV-FED-001 actually platform-enforced and converts
        the threat into "operator deliberately chose to weaken the
        boundary" rather than "operator forgot to write defensive
        property mapping."
      references:
        - "internal: invariants.md §INV-FED-001 (the invariant this enforces)"
        - "internal: users-sources/sources/ (the Source attribute-mapping documentation)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: intg-568208e5
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: high
    confidence: high
    title: "Account Lockdown atomic-revocation is Enterprise-only; Community-tier operators must execute a multi-step racy manual procedure"
    summary: "Per `runbook.md` §12 and `invariants.md` INV-OPS-001, the atomic single-action lockdown (deactivate user + sets unusable password + terminates sessions + revokes all tokens) is Enterprise; Community operators run a five-step manual procedure with race-condition exposure."
    detail: |
      Runbook §12: "For Community-tier installs without the Lockdown stage,
      the equivalent manual procedure is: 1. Edit the user; set Inactive.
      2. Use the Set Password control to set an unusable password.
      3. Navigate to the user's Sessions tab and revoke each session.
      4. Navigate to the user's Tokens tab and revoke each token.
      5. Create an Event manually (or rely on the model-write events for
      each of the above actions). The manual procedure is multi-step
      and racy; the Enterprise Lockdown stage is single-action and
      atomic." INV-OPS-001: "Holds for Enterprise installs. Community
      installs require the manual multi-step procedure in runbook §12."

      Severity is high per the identity-security severity rubric — this
      sits between the High clause "Service account token long-lived and
      unrotated" (because the multi-step procedure leaves a window
      during which the compromised account still holds valid tokens)
      and the lower-severity "Recovery flow weaker than primary login"
      pattern. The integrity lens is transactional: deactivating the
      User without simultaneously revoking sessions and tokens means the
      attacker holding a valid session token continues to act as the
      user between steps 1 and 3. The race is observable in production
      incident response — the responder cannot tell whether they have
      completely contained the compromise without checking each tab
      separately.

      Cross-references the Availability/Ephemeral specialists for the
      consequential-action-incompleteness framing and the
      Non-Repudiation specialist for the partial-audit-trail framing
      (the manual procedure may emit multiple uncorrelated Events
      rather than one atomic lockdown Event).
    evidence:
      - artifact: runbook.md
        locator: "§12 'Account compromise response', final paragraph"
        excerpt: "The manual procedure is multi-step and racy; the Enterprise Lockdown stage is single-action and atomic."
      - artifact: invariants.md
        locator: "§INV-OPS-001, Reviewer note"
        excerpt: "Holds for Enterprise installs. Community installs require the manual multi-step procedure in runbook §12."
    control_mappings:
      nist_800_53r5:
        - "AC-2"
        - "AC-2(13)"
        - "AC-12"
        - "AC-12(1)"
        - "IR-4"
        - "IR-4(1)"
      mitre_attack:
        - technique: "T1098"
          sub_technique: null
          tactic: "TA0003"
          rationale: "Multi-step manual lockdown leaves a window during which compromised session tokens remain valid; an attacker with an active session evades partial-state remediation."
      cwe:
        - "CWE-362"
      owasp_top10:
        - "A07:2021"
    recommendation:
      posture: required
      summary: "Ship an atomic compromise-response mechanism in the Community tier — either backport the Account Lockdown stage to Community or document a single-API-call atomic-lockdown procedure."
      detail: |
        The simplest path is to make Account Lockdown a Community-tier
        feature. The functional requirement (atomic deactivation +
        password invalidation + session termination + token revocation
        + audit event) does not appear to depend on enterprise-specific
        infrastructure; if the EE-licensing posture must remain, then
        ship a single Community API call (e.g.
        `POST /api/v3/core/users/<id>/atomic_lockdown/`) that performs
        the five steps in a single database transaction with a
        single composite Event, and document it in the Community
        runbook.

        Without this, Community operators cannot meet GDPR Article 32
        "ability to ensure the ... confidentiality, integrity ... of
        processing systems" under post-incident pressure.
      references:
        - "internal: security/account-lockdown.md (the Enterprise feature this generalises)"
        - "external: GDPR Article 32 (security of processing)"
    related_concerns: [ephemeral, non_repudiation, availability]
    cross_references: []

  - schema_version: 1
    id: intg-3f9318c2
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: high
    confidence: high
    title: "OAuth redirect-URI regex supports operator-error pattern (`.` un-escaped matches arbitrary character) per threat-model T-4"
    summary: "Per threat-model T-4 and the OAuth provider doc, redirect URIs accept regex with a documented authoring trap — `.` must be escaped or the regex matches `appXexample.com` for `app.example.com`."
    detail: |
      Threat-model T-4 documents the surface: "Per the OAuth provider
      doc, redirect URIs are operator-configured per Provider; regex
      support is available with the caveat that `.` must be escaped (a
      common authoring mistake — `https://app.example.com` regex
      without escaping matches `https://appXexample.com`)." Residual
      question: "Is there a default-deny on regex-shaped redirect URIs
      without an escape audit? Unclear from inputs." Threat-model E-4
      reframes the same as elevation of privilege: "Attacker registers
      an RP with a client_id similar to a high-trust RP's; relies on
      partial-match in the Provider's redirect-URI regex (per T-4) to
      receive codes intended for the other RP."

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Open redirect on OAuth callback —
      redirect_uri allowlist permissive (suffix match, wildcard, missing
      path check), permitting authorization-code or token leak via
      redirect manipulation" — the regex-trap case is exactly the
      "permissive allowlist" pattern. Confidentiality consequence is the
      authorization-code interception; the Integrity lens here is that
      the redirect_uri validation is an input-validation primitive that
      accepts inputs the operator did not actually intend to allow.
    evidence:
      - artifact: threat-model.md
        locator: "§T-4 'OAuth state / nonce / c_hash / at_hash validation gaps', Existing mitigation paragraph"
        excerpt: "regex support is available with the caveat that . must be escaped (a common authoring mistake — https://app.example.com regex without escaping matches https://appXexample.com)."
    control_mappings:
      nist_800_53r5:
        - "SI-10"
        - "AC-3"
        - "IA-2"
      mitre_attack:
        - technique: "T1606"
          sub_technique: "T1606.001"
          tactic: "TA0006"
          rationale: "Permissive regex redirect_uri matches an attacker-controlled host; authorization code is delivered to the attacker who exchanges it for tokens that forge web cookies (RFC 9700 §4.1)."
      cwe:
        - "CWE-601"
        - "CWE-185"
      owasp_top10:
        - "A01:2021"
      owasp_api_top10:
        - "API8:2023"
    recommendation:
      posture: required
      summary: "Validate regex redirect_uri values at save time: reject regexes with un-escaped `.` in the host portion; warn on suffix-match patterns; require operator override flag for permissive regexes."
      detail: |
        At Provider save, parse the redirect_uri allowlist and reject
        regex entries that satisfy `.` not preceded by `\\` in the host
        portion. Provide a one-click "fix" that inserts the escape. For
        intentionally permissive regexes (e.g., a wildcard subdomain on
        a tenant boundary), require the operator to tick a "I have
        audited this regex for partial-match risk" checkbox per-redirect
        which is captured in the Provider audit Event. Default the
        Provider UX to exact-match (no regex) on new Provider creation,
        with regex as a deliberate opt-in.
      references:
        - "external: RFC 9700 (OAuth 2.0 Security BCP) §4.1 (redirect URI exact-match preference)"
    related_concerns: [authenticity, confidentiality]
    cross_references: []

  - schema_version: 1
    id: intg-c6371014
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: blocked
    severity: high
    confidence: medium
    title: "OAuth `state` / OIDC `nonce` / `c_hash` / `at_hash` validation discipline at the IdP is not enumerated in inputs"
    summary: "Per threat-model T-4 the IdP generates these values; the residual question of whether the IdP also enforces them on round-trip is unanswered for several validation paths."
    detail: |
      Threat-model T-4 acknowledges authentik IS the OP/IdP and so
      generates `state`, `nonce`, `c_hash`, `at_hash` — but the question
      of whether the IdP enforces each on the inbound side (e.g.,
      `state` round-trip in user-agent-driven flows, `c_hash` binding
      to the issued code, `at_hash` binding to the issued access
      token in hybrid flow) is not enumerated. PKCE `code_verifier`
      enforcement is similarly not asserted at the per-Provider level
      (the OAuth provider doc references PKCE support but the inputs do
      not state whether confidential clients are required to use PKCE
      or whether public clients are required-to-use vs. encouraged-to-use).

      Per the identity-security severity rubric, both High clauses apply:
      "PKCE bypass or absence — confidential clients accepting
      authorization codes without PKCE verification when configured, or
      public clients (native, SPA) onboarded without PKCE requirement"
      and "CSRF on OAuth authorization flow — `state` parameter not
      validated, not bound to session, or omitted entirely; permits
      authorization-code injection / session fixation in OAuth (RFC
      9700 §4.7)."

      Block-on-evidence posture: the inputs are silent on whether the
      OAuth provider enforces these on the inbound side; the dependency
      stack does not by itself answer this; code reconnaissance is
      disabled for this run. The right disposition is `blocked` with
      prerequisite_evidence naming the specific validation paths.
    evidence:
      - artifact: threat-model.md
        locator: "§T-4, full paragraph"
        excerpt: "authentik IS the OP / IdP, so it generates these values. The tampering risk lands when the OP fails to enforce them on incoming requests"
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, opening paragraph"
        excerpt: "OpenID Connect Core 1.0 layered over OAuth 2.0, including the discovery endpoint at /application/o/<slug>/.well-known/openid-configuration"
    prerequisite_evidence:
      - "Per-Provider PKCE-required policy enumeration: confidential clients (PKCE-when-configured? required?), public clients (PKCE-required-always?)"
      - "OAuth `state` parameter handling specification — how the IdP validates the inbound `state` (round-trip preservation, session-binding)"
      - "OIDC `nonce` round-trip enforcement on /token + /userinfo path"
      - "`c_hash` and `at_hash` validation in hybrid flow"
      - "Per-Provider toggle for PKCE-required vs. PKCE-optional"
    control_mappings:
      nist_800_53r5:
        - "SI-10"
        - "IA-2"
        - "SC-23"
        - "AU-12"
      cwe:
        - "CWE-352"
        - "CWE-345"
      owasp_top10:
        - "A01:2021"
        - "A07:2021"
      owasp_api_top10:
        - "API2:2023"
    recommendation:
      posture: required
      summary: "Add to the OAuth provider doc a per-validation-control matrix showing which OAuth/OIDC binding values are validated by authentik per Provider, with default-policy and operator-tunable indication."
      detail: |
        Author a `add-secure-apps/providers/oauth2/security-controls.md`
        documenting:

        - Per-Provider PKCE policy options (required for all, required
          for public clients only, optional)
        - `state` enforcement: how the value is generated, how it is
          bound to the user-agent, how round-trip is validated
        - `nonce` enforcement: round-trip into ID token, validation at
          /token issuance
        - `c_hash`/`at_hash` validation in hybrid flow
        - Redirect-URI matching mode (exact-match default, regex opt-in
          per intg-3f9318c2)

        Make PKCE-required the default for all new Provider creations;
        operators must opt out per-Provider with a flag captured in audit.
      references:
        - "external: RFC 9700 (OAuth 2.0 Security BCP) §4.1, §4.7"
        - "external: OIDC Core 1.0 §15.5.2 (nonce validation)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: intg-7111d094
    agent: integrity
    apd_tier: trustworthiness
    apd_goal: integrity
    disposition: risk
    severity: medium
    confidence: high
    title: "SAML signing digest SHA-1 remains configurable per Provider despite deprecation; hardening misstep is one-click"
    summary: "Per `tech_plan.md` §6 SAML and `invariants.md` INV-FED-002, SHA-1 digest is configurable per Provider; SHA-1 is widely deprecated."
    detail: |
      Tech plan §6: "Signing certificates are per-Provider; algorithms
      RSA-SHA256 or ECDSA-SHA256; digest SHA-1 or SHA-256 (configurable).
      Note that SHA-1 is configurable but is widely deprecated — picking
      it is a hardening misstep." INV-FED-002 echoes: "Algorithm
      selection (RSA-SHA256 / ECDSA-SHA256, SHA-1 / SHA-256 digest) is
      per-Provider; SHA-1 is configurable and is a hardening misstep if
      chosen."

      Severity is medium per the identity-security severity rubric:
      this matches the Medium clause "Hygiene issue with no realistic
      exploit path — deprecated TLS cipher with no client population
      that requires it" — SHA-1 in SAML signing is the analog. Modern
      SPs reject SHA-1 signatures; the misstep usually produces
      interop failure rather than silent exploitation, but the platform
      should not present SHA-1 as a current option without a deprecation
      banner.
    evidence:
      - artifact: tech_plan.md
        locator: "§6 SAML, second bullet 'Signing certificates'"
