  - schema_version: 1
    id: conf-3d461eb8
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Per-installation `secret_key` rotation procedure is not documented; key compromise is effectively permanent in current operational guidance"
    summary: "Per runbook §5 GAP and ADR-0004, the rotation runbook for AUTHENTIK_SECRET_KEY is not documented; rotation requires re-keying every encrypted field across the database."
    detail: |
      Runbook §5 is explicit: "No rotation runbook for AUTHENTIK_SECRET_KEY
      ships in `sys-mgmt/`. Per ADR-0004, the secret_key is the master
      decryption key for every encrypted secret field; rotation requires
      re-keying every secret-bearing record." The runbook then
      reconstructs a five-step procedure that the operator would need to
      perform — but this is not an authentik-shipped runbook. ADR-0004
      §Consequences §Negative item 3 says the same: "The rotation runbook
      for secret_key is not documented in `sys-mgmt/`; reviewers should
      surface this as a finding against operational discipline."

      The confidentiality lens on this is: if `AUTHENTIK_SECRET_KEY` is
      compromised — by any of the routes flagged in finding conf-477ff8a1
      (Expression policy, embedded outpost bug, host compromise, sidecar
      with shared env) — the operator has no documented procedure to
      rotate. The compromise is effectively permanent until the operator
      improvises a rotation, which is a high-risk multi-step database
      operation under incident pressure.

      Severity is high per the identity-security severity rubric: this
      matches the High clause "Defense-in-depth gap on signing-key access"
      because the supposed-mitigation (rotate the master key) is not
      actually operationally available. Note the Ephemeral specialist
      will own the lifetime/rotation framing; the Confidentiality lens is
      that key confidentiality cannot be restored after exposure without
      a documented procedure.
    evidence:
      - artifact: runbook.md
        locator: "§5 'AUTHENTIK_SECRET_KEY rotation', opening GAP paragraph"
        excerpt: "No rotation runbook for AUTHENTIK_SECRET_KEY ships in sys-mgmt/. Per ADR-0004, the secret_key is the master decryption key for every encrypted secret field; rotation requires re-keying"
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Negative / trade-offs, item 3"
        excerpt: "Rotation of AUTHENTIK_SECRET_KEY requires re-encrypting every secret-bearing field. The blueprint mechanism supports this ... but the operational impact is non-trivial"
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(2)"
        - "IA-5"
        - "IA-5(1)"
        - "IA-5(7)"
    recommendation:
      posture: required
      summary: "Publish a step-by-step secret_key rotation runbook in `sys-mgmt/`, with a tested re-key blueprint and a smoke-test verification step."
      detail: |
        Author a `sys-mgmt/ops/secret-key-rotation.md` document that:

        1. Establishes the OLD_KEY + NEW_KEY dual-key state.
        2. Ships a `rekey-secrets.yaml` blueprint that decrypts every
           secret-bearing field under OLD_KEY and re-encrypts under NEW_KEY
           within a single transaction (with progress reporting and
           rollback semantics).
        3. Coordinates the cutover: swap `AUTHENTIK_SECRET_KEY` in the
           Server/Worker process env, restart in a rolling fashion, verify
           that each Provider can issue a test token, each Source can
           re-authenticate, each outpost reconnects.
        4. Documents the recovery path if the cutover fails mid-flight
           (the OLD_KEY + NEW_KEY state must remain decryptable until
           cutover completes).
        5. Recommends a baseline rotation cadence (annual or
           post-incident) and an alert for "secret_key has not been
           rotated in N days."
      references:
        - "internal: runbook.md §5 (the GAP this resolves)"
        - "internal: adrs/0004-encrypted-secrets-via-certificatekeypair.md §Consequences (the rotation requirement)"
    related_concerns: [ephemeral, authenticity, availability]
    cross_references: []

  - schema_version: 1
    id: conf-92954884
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: risk
    severity: medium
    confidence: high
    title: "Prompt stage HTML is unescaped by design; user-controlled or operator-misconfigured prompts can render exfiltrating content"
    summary: "Per `SECURITY.md` and tech plan §4 / §11, the Prompt stage allows raw HTML by design; the resulting render context contains the user's authenticated session and consent state."
    detail: |
      `tech_plan.md` §4 lists the `prompt` stage and notes: "supports HTML
      rendering (per `SECURITY.md`: 'Prompt HTML is not escaped' is an
      intentional design choice)." Tech plan §11 echoes "Prompt HTML is
      not escaped by design; intentional to support rich interactive
      prompts." The intentionality is documented; the confidentiality
      consequence is that an operator who crafts a prompt with attacker-
      influenceable content (a placeholder that interpolates a
      user-controlled attribute, or a template imported from an
      untrusted blueprint per T-2) can render `<script>` or `<img src>`
      that exfiltrates session cookies, CSRF tokens, or stage-flow
      state during the authentication ceremony.

      Severity is medium per the identity-security severity rubric: this
      sits between the "Verbose error messages on /authorize or /token"
      medium clause (information leak about auth state) and the higher
      "Mass-assignment on user profile / consent surface" pattern
      (consent-surface integrity). The Confidentiality lens is the
      session/CSRF/state-cookie disclosure risk; the Integrity lens is
      the consent-surface tampering risk (related_concerns: integrity).
    evidence:
      - artifact: tech_plan.md
        locator: "§4 prompt stage description"
        excerpt: "supports HTML rendering (per SECURITY.md: 'Prompt HTML is not escaped' is an intentional design choice)."
      - artifact: tech_plan.md
        locator: "§11 'Known security posture', Prompt HTML bullet"
        excerpt: "Prompt HTML is not escaped by design; intentional to support rich interactive prompts."
    control_mappings:
      nist_800_53r5:
        - "SI-10"
        - "SI-15"
        - "SC-18"
      cwe:
        - "CWE-79"
      owasp_top10:
        - "A03:2021"
    recommendation:
      posture: recommended
      summary: "Default prompt placeholders to escape interpolated user-controlled values; preserve raw-HTML opt-in per placeholder; ship a CSP that constrains the Flow executor render context."
      detail: |
        The intentional raw-HTML design need not change, but the
        per-placeholder default should: interpolated `{{user.attribute}}`
        values should be escaped unless the operator explicitly opts that
        placeholder into raw-HTML render mode. This preserves the
        documented rich-prompt capability while removing the
        "operator accidentally interpolated an attacker-controlled
        attribute" failure mode. Additionally, the Flow executor's render
        context should ship with a CSP header (per the existing
        operator-driven CSP guidance in `security-hardening.md`) that
        prevents inline script execution by default — operators who
        legitimately need inline script in a prompt can relax the CSP
        per-Flow.
      references:
        - "internal: SECURITY.md 'Intended functionality' (the documented design)"
        - "internal: security/security-hardening.md (the operator-driven CSP recommendation this would extend)"
    related_concerns: [integrity, authenticity]
    cross_references: []
