finding:
  - schema_version: 1
    id: conf-477ff8a1
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: risk
    severity: critical
    confidence: high
    title: "AUTHENTIK_SECRET_KEY is single master decryption key for all stored secrets; in-process reachable from any Expression policy"
    summary: "Per ADR-0004 the per-installation symmetric key encrypts every signing key, OAuth client_secret, Source credential, and Token; per ADR-0001 any Expression policy reads it from process env."
    detail: |
      ADR-0004 is explicit: "AUTHENTIK_SECRET_KEY is the master decryption
      key. Anyone with secret_key + database snapshot can unmask every stored
      secret." The Server's process environment is the canonical location.
      ADR-0001 declares Expression policies are arbitrary Python without
      sandbox, which transitively gives every admin who can edit an
      Expression read access to `os.environ['AUTHENTIK_SECRET_KEY']`. The
      recommended hardening (block the Expression/PropertyMapping/Blueprint
      write APIs at the reverse proxy per `security-hardening.md`) is a
      compensating control but not enforced; an unhardened community install
      with a compromised admin (compromised_admin_account attacker position)
      walks straight to the master key.

      Severity is critical because this falls under "Token signing key
      compromise" per the identity-security severity rubric: mass unmasking
      of per-Provider signing keys yields universal token forgery across
      every RP that trusts authentik, and compromise of the
      service_account_credential_store yields lateral movement out to every
      SCIM target / Source / downstream system whose credentials the IdP
      holds. Recovery requires JWKS rotation per Provider, mass session
      invalidation, mass token revocation, and out-of-band re-attestation
      of every federation trust.
    evidence:
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Negative / trade-offs, item 1"
        excerpt: "AUTHENTIK_SECRET_KEY is the master decryption key. Anyone with secret_key + database snapshot can unmask every stored secret."
      - artifact: adrs/0001-flows-stages-policies-pipeline.md
        locator: "§Consequences > Negative / trade-offs, item 1"
        excerpt: "Expressions (property mappings/policies/prompts) can execute arbitrary Python code without safeguards."
      - artifact: tech_plan.md
        locator: "§11 'Known security posture (per documentation)', bullet 3"
        excerpt: "Expressions (property mappings/policies/prompts) can execute arbitrary Python code without safeguards."
    control_mappings:
      nist_800_53r5:
        - "SC-12"
        - "SC-12(1)"
        - "SC-12(3)"
        - "SC-13"
        - "SC-28"
        - "SC-28(1)"
        - "AC-6"
        - "AC-6(5)"
      mitre_attack:
        - technique: "T1552"
          sub_technique: "T1552.001"
          tactic: "TA0006"
          rationale: "Master decryption key resident in process env is recoverable by any Expression-editing admin, matching Credentials in Files pattern via os.environ read."
        - technique: "T1606"
          sub_technique: "T1606.001"
          tactic: "TA0006"
          rationale: "Compromise of per-Provider signing keys via secret_key+DB-dump enables forgery of OAuth web cookies (ID tokens, access tokens) for any user against any RP."
      cwe:
        - "CWE-321"
        - "CWE-522"
      owasp_top10:
        - "A02:2021"
      owasp_api_top10:
        - "API8:2023"
    recommendation:
      posture: required
      summary: "Make the reverse-proxy API blocklist on Expression/PropertyMapping/Blueprint write endpoints a deployment-time enforcement rather than operator opt-in, and document an external-KMS binding for per-field encryption."
      detail: |
        Two layered changes are required because the architectural choice
        (master key in process env, no platform sandbox on Expressions)
        cannot be reversed without breaking the documented model:

        1. **Ship a default-hardened install profile** that applies the
           reverse-proxy API blocklist for `/api/v3/policies/expression*`,
           `/api/v3/propertymappings*`, `/api/v3/managed/blueprints*`,
           `/api/v3/stages/captcha*` by default in the published Helm chart
           and CloudFormation template. The current posture per
           `security-hardening.md` requires the operator to apply the
           blocklist after install, which is a configuration-drift hazard.
           If operators want in-platform Expression editing, they remove
           the blocklist deliberately.
        2. **Document and supply an external-KMS binding** (AWS KMS, GCP
           KMS, HashiCorp Vault Transit) for the per-field secret encryption
           described in ADR-0004 so that the per-field DEKs are wrapped by
           a KMS-held KEK rather than the in-process `AUTHENTIK_SECRET_KEY`.
           This eliminates the "compromise the process env once = unmask
           everything" failure mode. ADR-0004 itself flags this gap; the
           input set has no documented procedure.
      references:
        - "internal: security/security-hardening.md (the API blocklist origin)"
        - "internal: adrs/0004-encrypted-secrets-via-certificatekeypair.md §Negative item 2 (No external secret-manager integration in Core)"
        - "external: NIST SP 800-57 Part 1 Rev. 5 §5.2 (Key management hierarchy)"
    related_concerns: [authenticity, ephemeral, immutability, integrity]
    cross_references: []

  - schema_version: 1
    id: conf-6dd9d98a
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "PostgreSQL transport TLS is configurable but not default; in-cluster lateral attacker can read secret-bearing rows in transit"
    summary: "Per `architecture-index.md` and ADR-0002, TLS to PostgreSQL is operator-configurable; the bundled compose does not enforce it."
    detail: |
      The architecture index describes the Postgres trust boundary as
      "TCP/TLS — TLS to PostgreSQL is configurable per the install
      reference; not enforced by default." Every secret-bearing model field
      (Provider client_secret, Source credential, Token key,
      CertificateKeyPair private_key per ADR-0004) traverses this link on
      every write. An internal_lateral_attacker_in_idp_tier (per
      attacker_positions in the run config) on the Pod/VM network can
      sniff plaintext rows. The application-layer encryption keyed by
      AUTHENTIK_SECRET_KEY does protect the contents — but the
      transit-layer plaintext exposure also reveals query patterns, plus
      session cookies and audit-log content that are NOT
      secret_key-encrypted (Event rows are plaintext per the data model).

      Severity is high per the identity-security severity rubric: this
      matches the "Defense-in-depth gap on signing-key access" High clause
      (the inner application-layer encryption is strong but the outer
      transport layer is plaintext when not configured) and is escalated
      because the same channel carries the un-encrypted audit log, session
      cookies, and PII attributes.
    evidence:
      - artifact: architecture-index.md
        locator: "`postgresql` component, Trust boundary line"
        excerpt: "TLS to PostgreSQL is configurable per the install reference; not enforced by default."
      - artifact: adrs/0002-django-celery-redis-postgresql-stack.md
        locator: "§Decision, paragraph 2"
        excerpt: "psycopg[c,pool]==3.3.4 ... PostgreSQL to store all of its configuration and other data"
    control_mappings:
      nist_800_53r5:
        - "SC-8"
        - "SC-8(1)"
        - "SC-12(2)"
        - "AC-4"
      mitre_attack:
        - technique: "T1040"
          sub_technique: null
          tactic: "TA0006"
          rationale: "Plaintext PostgreSQL transport from Server pod to database pod allows lateral observer in the IdP namespace to capture session cookies, audit content, and the encrypted secret-bearing rows in motion."
      cwe:
        - "CWE-319"
      owasp_top10:
        - "A02:2021"
    recommendation:
      posture: required
      summary: "Make PostgreSQL TLS required-by-default in the published Helm chart, CloudFormation template, and docker-compose example, with operator opt-out for development."
      detail: |
        Modify the published deployment artifacts so the default state is
        `PGSSLMODE=verify-full` and the bundled PostgreSQL subchart ships
        with TLS material auto-generated at first install. Operators who
        want plaintext for local development can opt out. This closes the
        in-cluster lateral observer path without requiring documentation
        changes to authentik's encryption-at-rest story.
      references:
        - "external: NIST SP 800-52 Rev. 2 §3 (TLS requirements for federal systems)"
        - "internal: install-config/reverse-proxy.md (parallel pattern of recommended-but-not-default hardening)"
    related_concerns: [authenticity, integrity]
    cross_references: []

  - schema_version: 1
    id: conf-7174bf6f
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Embedded outpost runs in same process as Server core — no process boundary protects AUTHENTIK_SECRET_KEY from a colocated outpost bug"
    summary: "Per ADR-0003 and `architecture-index.md`, the embedded proxy outpost shares the Server's image and process address space; per ADR-0004 the master secret_key lives in that process env."
    detail: |
      ADR-0003 §Notes makes the trade-off explicit: "The embedded outpost
      does not benefit from the process-isolation that a separate outpost
      provides — a bug in the embedded outpost's HTTP handler lands in the
      Server process address space." Threat-model E-8 documents the
      consequence: a memory-disclosure or arbitrary-file-read bug in the
      embedded outpost's HTTP handler discloses
      `os.environ['AUTHENTIK_SECRET_KEY']`, which is master-decryption-key-
      equivalent per ADR-0004 (mass unmasking of every stored secret).
      Class-4 outpost protocol-handler bugs are a documented CVE pattern
      per `prior-audit.md` ("The proxy / LDAP / RADIUS outposts each have
      their own protocol parsing surface. Bugs here are isolated from
      Core (per ADR-0003) but still impact identity assurance for the
      affected protocol"). The embedded outpost is the exception to that
      isolation claim — it is co-resident with Core, so an outpost-side
      bug here is NOT isolated.

      Severity is high per the identity-security severity rubric: this is
      a "Defense-in-depth gap on signing-key access" — the inner
      encryption story (secret_key + per-field AEAD) is intentionally
      protected by separating the outpost protocol-handler surface from
      Core via process boundary for the four standalone outposts; that
      protection is structurally absent for the embedded variant.
    evidence:
      - artifact: adrs/0003-outpost-architecture-for-protocol-handlers.md
        locator: "§Notes, paragraph 1"
        excerpt: "The embedded outpost does not benefit from the process-isolation that a separate outpost provides — a bug in the embedded outpost's HTTP handler lands in"
      - artifact: threat-model.md
        locator: "§E-8 'Embedded outpost / Server boundary breach', impact line"
        excerpt: "Master-secret disclosure via co-resident outpost bug."
      - artifact: architecture-index.md
        locator: "`embedded-outpost` component, Trust boundary line"
        excerpt: "**In-process.** Inherits the Server's network posture."
    control_mappings:
      nist_800_53r5:
        - "SC-3"
        - "SC-7(21)"
        - "SC-39"
        - "AC-6"
      mitre_attack:
        - technique: "T1212"
          sub_technique: null
          tactic: "TA0006"
          rationale: "A memory-read bug in the embedded outpost handler reads AUTHENTIK_SECRET_KEY from the shared process env, satisfying credential-access via exploitation of the same address space."
      cwe:
        - "CWE-668"
    recommendation:
      posture: recommended
      summary: "Recommend separate-outpost deployments over embedded for hardened production installs, and document the topology preference in `install-config/reverse-proxy.md` alongside the existing reverse-proxy guidance."
      detail: |
        The fix is operational, not architectural: production-hardened
        deployments should use the standalone proxy outpost image
        (`ghcr.io/goauthentik/proxy`) and disable the embedded outpost.
        Document this in the install guide as the recommended posture for
        operators with admin-account or insider-threat concern. The
        embedded outpost remains appropriate for laboratory and
        small-deployment use.

        Longer-term: separate the embedded outpost into a child process
        with a constrained `seccomp-bpf` profile or a `setresuid`-dropped
        subprocess, preserving the single-image deployment convenience
        while restoring the process boundary.
      references:
        - "internal: adrs/0003-outpost-architecture-for-protocol-handlers.md (the separation rationale for the four standalone outposts)"
        - "internal: install-config/reverse-proxy.md (parallel recommendation pattern)"
    related_concerns: [authenticity, distributed]
    cross_references: []

  - schema_version: 1
    id: conf-68ab158e
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "PostgreSQL backups encrypt rows only with AUTHENTIK_SECRET_KEY; off-site dump encryption and key separation are not documented"
    summary: "Per runbook §8 and ADR-0004, `pg_dump` produces an at-rest-encrypted dump whose encryption key is the per-installation AUTHENTIK_SECRET_KEY — but the dump-file-level encryption is operator-driven and the secret_key backup procedure is unspecified."
    detail: |
      Runbook §8 explicitly flags this: "the backup-restore doc does not
      describe encryption of the dump file. Per ADR-0004, the dump
      contains encrypted secret material; the encryption is keyed by the
      secret_key. Off-site dump storage should be additionally encrypted
      with operator-controlled keys, but the procedure for that is
      operator-driven and not in the input set." A second GAP follows:
      "the secret_key itself is operator-managed in `.env` / Kubernetes
      Secret / equivalent. A dump without the secret_key is useless; a
      dump with the secret_key is total compromise."

      Two failure modes follow: (1) An operator places `pg_dump` output
      and the `.env` containing `AUTHENTIK_SECRET_KEY` in the same backup
      destination, and the destination is compromised — total unmasking
      including signing keys and OAuth client secrets. (2) An attacker
      with access to the backup destination and ability to enumerate
      environment material across cluster snapshots reconstructs both.

      Severity is high per the identity-security severity rubric: this
      matches the High clause on "Defense-in-depth gap on signing-key
      access" — the application-layer encryption story is sound but
      collapses if both halves end up co-located. Escalates to critical
      when paired with the absence of a documented secret_key rotation
      (see Ephemeral finding).
    evidence:
      - artifact: runbook.md
        locator: "§8 'Backup and restore', first GAP paragraph"
        excerpt: "Off-site dump storage should be additionally encrypted with operator-controlled keys, but the procedure for that is operator-driven and not in the input set."
      - artifact: runbook.md
        locator: "§8 'Backup and restore', second GAP paragraph"
        excerpt: "A dump without the secret_key is useless; a dump with the secret_key is total compromise."
      - artifact: adrs/0004-encrypted-secrets-via-certificatekeypair.md
        locator: "§Consequences > Positive, paragraph 1"
        excerpt: "Database backups are not directly exploitable without the AUTHENTIK_SECRET_KEY."
    control_mappings:
      nist_800_53r5:
        - "CP-9"
        - "CP-9(1)"
        - "CP-9(8)"
        - "SC-12"
        - "SC-28"
        - "MP-4"
      mitre_attack:
        - technique: "T1530"
          sub_technique: null
          tactic: "TA0009"
          rationale: "Co-located pg_dump and .env in the same backup destination enables collection from the backup substrate, recovering both ciphertext and key."
    recommendation:
      posture: required
      summary: "Add a Backup & Restore §8 sub-section specifying: (a) dump-file encryption with an operator-managed key distinct from AUTHENTIK_SECRET_KEY, (b) separate-destination policy for secret_key and dump material, (c) backup-restore test cadence."
      detail: |
        The procedure should require the operator to:

        1. Pipe `pg_dump` through `gpg --symmetric --cipher-algo AES256`
           (or `age` for modern installs) with a passphrase NOT derived
           from `AUTHENTIK_SECRET_KEY`.
        2. Store the encrypted dump and the secret_key in two
           independently-credentialed destinations such that compromise
           of one credential set does not yield both halves.
        3. Run a quarterly restore exercise that verifies decryption,
           secret_key rehydration, and a smoke-test sign-in against a
           rebuilt instance.

        Without this written into the project's `sys-mgmt/ops/backup-restore.md`,
        every operator improvises and the failure modes above recur.
      references:
        - "external: NIST SP 800-34 Rev. 1 §3.4 (Backup encryption and key separation)"
    related_concerns: [ephemeral, immutability, availability]
    cross_references: []

  - schema_version: 1
    id: conf-22a9ce55
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: risk
    severity: high
    confidence: high
    title: "Default SAML attribute mappings release UPN + Group + Email + Name + User ID + Username + WindowsAccountName to every SP unless operator strips them"
    summary: "Per threat-model I-5 and the SAML provider doc, the default property-mapping set is the full attribute bundle; an SP needing only Email receives all of it."
    detail: |
      Threat-model I-5 documents the surface: "the default property
      mappings include UPN, Group, Email, Name, User ID, Username,
      WindowsAccountName. An SP that should only see Email receives all
      of these unless the operator removes them per-Provider." The
      operator must affirmatively strip undesired mappings for each new
      SAML Provider; the platform default is over-release. This is the
      identity-provider analog of GDPR Article 5(1)(c) data-minimization
      failure — the IdP is in the path of personal data leaving to a
      federated party, and the default posture maximises rather than
      minimises release.

      Severity is high per the identity-security severity rubric: this
      matches the High clause "JWT access tokens or ID tokens carry
      excessive PII claims — full profile embedded" (the SAML analog of
      the same pattern). Over-release to an RP that subsequently logs,
      aggregates, or exfiltrates the attributes is a confidentiality
      breach against the IdP's user population. Cross-references SAML
      attribute-release audit completeness (Non-Repudiation lens).
    evidence:
      - artifact: threat-model.md
        locator: "§I-5 'SAML attribute over-release via default mappings', Attack scenario"
        excerpt: "the default property mappings include UPN, Group, Email, Name, User ID, Username, WindowsAccountName. An SP that should only see Email receives all of these unless"
      - artifact: tech_plan.md
        locator: "§6 SAML, paragraph after 'NameID policy is configurable per-Provider'"
        excerpt: "SP-side signature verification certificates and assertion encryption certificates are per-Provider"
    control_mappings:
      nist_800_53r5:
        - "AC-4"
        - "AC-21"
        - "SC-8(1)"
        - "AU-2"
      cwe:
        - "CWE-200"
        - "CWE-359"
      owasp_top10:
        - "A04:2021"
    recommendation:
      posture: recommended
      summary: "Change the default SAML Provider template to release only the SP's explicitly-acknowledged attribute set, with a 'minimum necessary' starter mapping and an operator-driven add-attribute workflow."
      detail: |
        Modify the default SAML Provider creation workflow so the operator
        starts with a minimum-necessary mapping (NameID + Email only) and
        affirmatively adds attributes the SP requires. Document the
        attribute-release ceremony as "release only what the SP's metadata
        asks for and confirms in writing." This inverts the default and
        moves the over-release decision into the foreground.

        For installed environments, ship a one-time advisory event when a
        SAML Provider's attribute set exceeds N attributes (configurable
        threshold) so operators can audit existing over-release.
      references:
        - "internal: add-secure-apps/providers/saml/index.md (the per-Provider mapping surface that this change targets)"
        - "external: GDPR Article 5(1)(c) (data minimization)"
    related_concerns: [non_repudiation, integrity]
    cross_references: []

  - schema_version: 1
    id: conf-2a905f1d
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: risk
    severity: medium
    confidence: high
    title: "Default OAuth `profile` scope releases group memberships including superuser-shaped groups unless operator filters per-Application"
    summary: "Per threat-model I-4 and the OAuth provider doc, the default `profile` scope includes group membership; no documented default excludes admin/superuser groups."
    detail: |
      Threat-model I-4 documents the surface: "An RP requests `email
      profile groups` and receives more group memberships than the RP
      needs. The user's consent screen shows the scope name but not the
      resolved data ... The default `profile` scope includes username,
      name, and group membership ... Is there a documented default that
      excludes superuser-shaped groups from federated `profile` claims?
      Unclear." This compounds with the SAML default (I-5): the IdP's
      default posture is to share rich attribute sets across federation
      events. An RP that should never know whether a user is in
      `authentik Admins` receives that bit by default.

      Severity is medium per the identity-security severity rubric:
      "JWT access tokens or ID tokens carry excessive PII claims" is the
      relevant pattern; the medium reflects that this is over-release of
      authorization-shape attributes rather than PII per se, but with a
      meaningful privilege-disclosure dimension. Escalates to high if
      the over-released groups directly drive RP-side authorization
      decisions that the IdP did not intend (delegated admin via
      claim-leak).
    evidence:
      - artifact: threat-model.md
        locator: "§I-4 'OAuth scope abuse for over-release of user data', Residual question"
        excerpt: "Is there a documented default that excludes superuser-shaped groups from federated `profile` claims? Unclear."
      - artifact: tech_plan.md
        locator: "§6 OAuth 2.0 / OIDC, scope bullet"
        excerpt: "Default scopes: openid, profile, email, entitlements, offline_access."
    control_mappings:
      nist_800_53r5:
        - "AC-4"
        - "AC-21"
        - "AU-2"
        - "SC-8"
      cwe:
        - "CWE-200"
      owasp_top10:
        - "A04:2021"
      owasp_api_top10:
        - "API3:2023"
    recommendation:
      posture: recommended
      summary: "Add a per-Provider 'sensitive groups allowlist' on the OAuth Provider so admin/superuser-shaped groups are filtered out of federated claims by default; require explicit operator opt-in to release them."
      detail: |
        Add a `released_groups_filter` field on `OAuth2Provider` defaulting
        to a regex that excludes `^authentik Admins$`,
        `^Administrators$`, `*-admin$` patterns. Custom claim mappings
        that resolve `groups` apply this filter before claim emission to
        the userinfo / id_token surface. Operators who deliberately want
        to federate admin-shape memberships override the filter explicitly.

        This is the OAuth analog of the SAML-attribute-release-minimization
        finding above (conf-22a9ce55) and the two recommendations should
        ship in the same release for consistency.
      references:
        - "external: OIDC Core 1.0 §5.4 (Standard Claims and the principle of need-to-know release)"
    related_concerns: [authenticity, non_repudiation]
    cross_references: []

  - schema_version: 1
    id: conf-e08662e7
    agent: confidentiality
    apd_tier: trustworthiness
    apd_goal: confidentiality
    disposition: gap
    severity: high
    confidence: high
    title: "Outpost-to-Server WebSocket TLS requirement is not enumerated; outpost service-account token plus configuration payload travel on possibly-plaintext channel"
    summary: "Per `INV-OPS-005` and `tech_plan.md` §3 boundary 3, the WebSocket transport is referenced but TLS-or-not is not specified; the payload includes per-Provider client_secrets the outpost legitimately needs."
    detail: |
      Invariant INV-OPS-005 is explicitly flagged GAP: "architecture.md
      describes the WebSocket transport without enumerating whether TLS
      is mandatory vs. operator-configured. Reviewers should confirm
      against the active config." Tech plan §3 boundary 3 echoes the same:
      "the in-repo docs describe websocket signaling and a service-account
      token but do not enumerate whether the websocket is required to be
      over TLS in every deployment topology." Threat-model S-6 supplies
      the consequence: the outpost service-account token plus the
      configuration payload (which includes per-Provider OAuth client
      secrets that the outpost needs in order to authenticate to the
      Server in the OAuth client-credentials grant per the proxy provider
      doc) traverse this link. A network-positioned attacker between
      outpost and Server with plaintext WebSocket access reads the
      service-account token plus the secrets.

      Severity is high per the identity-security severity rubric: this is
      the OAuth-equivalent of "JWT access tokens or ID tokens carry
      excessive PII claims" applied to client_secret transport; the
      configuration payload IS the secret material in this case.
      Compromise of the channel yields plaintext OAuth client_secret for
      every Provider the outpost serves, plus the outpost service-account
      token (which lets the attacker impersonate the outpost and drain
      further config).
    evidence:
      - artifact: invariants.md
        locator: "§INV-OPS-005, Reviewer note"
        excerpt: "GAP — architecture.md describes the WebSocket transport without enumerating whether TLS is mandatory vs. operator-configured."
      - artifact: tech_plan.md
        locator: "§3 boundary 3, GAP paragraph"
        excerpt: "the in-repo docs describe websocket signaling and a service-account token but do not enumerate whether the websocket is required to be over TLS in every"
      - artifact: threat-model.md
        locator: "§S-6 'Outpost-to-Server WebSocket impersonation', Existing mitigation line"
        excerpt: "Tokens are stored encrypted in the Server's PostgreSQL."
    prerequisite_evidence:
      - "Explicit assertion in lifecycle/ config or chart values that the outpost WebSocket transport is TLS-required (or TLS-optional) per topology"
      - "Outpost service-account token rotation procedure (runbook §7 GAP — Edit form may not expose a rotation control)"
    control_mappings:
      nist_800_53r5:
        - "SC-8"
        - "SC-8(1)"
        - "SC-23"
        - "IA-3"
        - "IA-5"
      mitre_attack:
        - technique: "T1040"
          sub_technique: null
          tactic: "TA0006"
          rationale: "Plaintext outpost-to-Server WebSocket allows network-positioned attacker to capture the service-account token and the OAuth client_secret payload streamed at outpost startup."
      cwe:
        - "CWE-319"
        - "CWE-522"
      owasp_top10:
        - "A02:2021"
    recommendation:
      posture: required
      summary: "Make outpost-to-Server WebSocket TLS-required by default; document the requirement in `add-secure-apps/outposts/index.mdx` and reject non-TLS connections at the `/ws/outpost/` route."
      detail: |
        Add a server-side enforcement: reject `/ws/outpost/...` connections
        not arriving over TLS unless an explicit `AUTHENTIK_OUTPOST_WS_ALLOW_PLAINTEXT`
        env flag is set (operator opt-out for development). Update
        `INV-OPS-005` to assert TLS-required and remove the GAP marker.
        Update the outpost documentation to enumerate the TLS requirement
        as boundary 3 in the trust-boundary inventory.
      references:
