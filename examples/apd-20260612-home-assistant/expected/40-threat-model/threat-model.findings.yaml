  - artifact: 00-context/threat-model-normalized.yaml
    locator: entries[entry_id=tm-f8db6c3a].threat
    excerpt: "Android's TLSHelper (cev-f6000002) loads AndroidCAStore and thus TRUSTS\
      \ USER-installed CAs with no fixed-server pinning ... network_mitm via a malicious\
      \ user-CA can impersonate the server"
  - artifact: 40-synthesis/deduped-findings.yaml
    locator: finding[id=conf-2029ce78]
    excerpt: 'KeyStore.getInstance("AndroidCAStore")... builder.sslSocketFactory(...,
      trustManagers[0] as X509TrustManager) -- user-installed CAs trusted, no pinning,
      MitM decrypts the token/PII channel'
  - artifact: 40-synthesis/deduped-findings.yaml
    locator: finding[id=auth-1787eae1]
    excerpt: standard X509 validation with no certificate or public-key pinning; a
      MitM with an installed CA presents an accepted certificate impersonating the
      backend
