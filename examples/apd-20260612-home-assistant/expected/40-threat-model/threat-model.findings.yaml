  recommendation:
    posture: required
    summary: Reconcile the threat model and implementation reality on the Android server-identity
      channel.
    detail: 'Either update the implementation to match the threat model''s intended
      state (add trust-on-first-use public-key pinning captured at instance onboarding
      and exclude user-installed CAs for the configured instance channel, surfacing
      a pin mismatch as a security event, per conf-2029ce78 / auth-1787eae1), or update
      the threat-model cell tm-f8db6c3a to drop "standard X509 validation" as a mitigation
      and record the residual user-CA / no-pinning MitM exposure the specialists confirmed,
      so reviewers do not read the spoofing threat as mitigated. Keep the hardware-backed
      mTLS key credited as the client-identity control it is, separate from the unmet
      server-identity control.'
    references:
    - 'external: OWASP MASVS-NETWORK-2 (server-identity verification / pinning)'
