  title: Threat model asserts standard X509 validation mitigates Android server spoofing
    that conf-2029ce78 and auth-1787eae1 contradict
  summary: 'Authored baseline entry tm-f8db6c3a (Android Companion, Spoofing) claims
    mitigation: "TLSHelper uses standard X509 validation (cev-f6000002); the mTLS client
    key is in the hardware-backed Keystore." Two independent specialist findings on
    the same surface show that standard X509 validation over the AndroidCAStore trusts
    user-installed CAs with no pinning, so a MitM with an installed CA impersonates
    the self-hosted backend and harvests the bearer token in transit.'
  detail: "The authored threat-model cell tm-f8db6c3a (asset \"Android Companion app\
    \ (Kotlin,\nWebView, Keystore, FCM)\", STRIDE letter S, extraction_confidence high)\
    \ offers as its\nmitigation: \"TLSHelper uses standard X509 validation (cev-f6000002);\
    \ the mTLS client\nkey is in the hardware-backed Keystore (cev-f6000001).\" That\
    \ framing presents standard\nX509 validation as the answer to server-spoofing on\
    \ the mobile->Core channel.\n\nTwo independent specialist findings on the SAME surface\
    \ (the Android Companion TLS\nfactory, cev-f6000002) show the asserted control does\
    \ not hold against the threat the\nsame cell raises:\n\n- conf-2029ce78 (confidentiality,\
    \ high/high) shows `TLSHelper.setupOkHttpClient\n  SSLSocketFactory` initializes\
    \ the OkHttp trust manager from `KeyStore.getInstance(\n  \"AndroidCAStore\")`,\
    \ which includes USER-installed CAs, and applies NO certificate\n  or public-key\
    \ pinning — so a user-installed/malicious CA lets a network MitM\n  decrypt the\
    \ token- and PII-bearing channel.\n- auth-1787eae1 (authenticity, high/high) shows\
    \ the same factory verifies the server\n  with default CA trust plus user-installed\
    \ CAs and no pinning, so the backend identity\n  is forgeable to a MitM who can\
    \ place a CA in the store.\n\n\"Standard X509 validation\" is therefore not a mitigation\
    \ for the spoofing threat the\ncell names: validation succeeds for ANY leaf chaining\
    \ to ANY trusted-but-attacker-\ninfluenceable CA, and because the instance is a\
    \ user-entered self-hosted URL there is no\nfixed certificate to pin. The hardware-backed\
    \ mTLS key (cev-f6000001) is a genuine,\nseparately-credited CLIENT-identity control\
    \ (capability auth-cap-42c6a13f / conf-cap-\n01c47d42) but it does not authenticate\
    \ the SERVER — it is opt-in and does not bound\nthe user-CA trust on the default\
    \ channel.\n\nThis is the one place in the authored baseline where a mitigation\
    \ asserts a control as\nadequate that the grounded specialist findings show is bypassable;\
    \ elsewhere the baseline\nis candid (its mitigations either name the residual gap\
    \ or state \"None\"). Confidence is\nhigh because the contradicting cell is extraction_confidence:\
    \ high and both corroborating\nfindings are high/high. Severity is inherited high\
    \ from the corroborating specialist\nfindings (MASVS-NETWORK-2 high-value-channel\
    \ pinning gap)."
  evidence:
  - artifact: 00-context/threat-model-normalized.yaml
