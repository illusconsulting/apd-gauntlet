  title: GET /api/config returns instance latitude/longitude, config_dir and whitelist_external_dirs in cleartext to any bearer holder
  summary: The /api/config response exposes precise instance geolocation, the on-disk config directory, and the external-directory allowlist to any authenticated token holder regardless of scope, with no per-data-element access scoping on these high-sensitivity properties.
  detail: '`GET /api/config` (api/rest.md lines 110-128) returns `latitude`,

    `longitude`, `elevation`, `config_dir`, and `whitelist_external_dirs` in

    cleartext. Unlike entity-state reads — which the code DOES scope per-entity

    via `APIEntityStateView.get` -> `check_entity(entity_id, POLICY_READ)`

    (cev-a1000011) — `/api/config` applies no per-property access scoping: any

    valid bearer (including a low-privilege user or a non-owner Long-Lived

    Access Token) reads the precise home location and internal filesystem

    layout.


    This is an excessive-property-exposure / minimum-necessary failure at

    data-element granularity: the instance''s precise latitude/longitude is the

    single most sensitive privacy datum in the system (it geolocates the home

    itself), and `config_dir` / `whitelist_external_dirs` disclose internal

    paths useful for the path-traversal / file-serving surface. A scope that

    returns aggregate config (units, version) to all holders but reserves

    precise coordinates and filesystem paths to admins would be

    minimum-necessary; the current response is not.


    Medium severity under the *api-security* rubric — it matches the

    "excessive property exposure" pattern (OWASP API3 / BOPLA read-side) but

    is bounded: the exposure requires a valid token (not unauthenticated), the

    data set is single-instance (not bulk multi-subject), and the coordinates

    are coarse-home-location rather than per-person tracking. It escalates if

    combined with a low-privilege token issuance path. The path-disclosure

    facet feeding path traversal routes to Integrity.

    '
  evidence:
  - artifact: api/rest.md
    locator: GET /api/config response, lines 111-128
    excerpt: '"config_dir":"/home/ha/.homeassistant", ... "latitude":45.8781529, ... "longitude":8.458853651'
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.api.APIEntityStateView.get:L242-L255@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'if not user.permissions.check_entity(entity_id, POLICY_READ): raise Unauthorized(entity_id=entity_id)'
  control_mappings:
    nist_800_53r5:
    - AC-3
    - AC-6
    - AC-6(1)
    - SI-15
    - AC-4
    mitre_attack:
    - technique: T1213
      sub_technique: null
      tactic: TA0009
      rationale: Any low-scope token reads precise instance geolocation and config paths from /api/config, the Data from Information Repositories procedure scoped to the config endpoint.
    cwe:
    - CWE-200
    owasp_api_top10:
    - API3:2023
  recommendation:
    posture: recommended
    summary: Scope precise location and filesystem paths in /api/config to admin/owner, returning coarse or omitted values to non-admin holders.
    detail: 'Apply the same per-caller scoping that entity reads already enforce

      (cev-a1000011) to the `/api/config` response: gate `latitude`,

      `longitude`, `config_dir`, and `whitelist_external_dirs` behind

      `user.is_admin` (or a dedicated POLICY), and return either coarse

      location (zone name only) or omit the precise coordinates for

      non-admin/non-owner bearers. This converts the endpoint to a

      minimum-necessary response without breaking the units/version/components

      fields the frontend relies on.

      '
    references:
    - 'external: OWASP API Security Top 10 API3:2023 (BOPLA)'
  related_concerns:
  - integrity
  - authenticity
  cross_references: []
- schema_version: 1
