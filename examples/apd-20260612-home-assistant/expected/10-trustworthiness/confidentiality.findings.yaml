  title: Android Companion trusts user-installed CAs with no certificate pinning, exposing tokens and PII in transit to MitM
  summary: '`TLSHelper.setupOkHttpClientSSLSocketFactory` initializes the OkHttp trust manager from the AndroidCAStore, which includes user-installed CAs, and applies no fixed-server pinning; a user-installed/malicious CA lets a network MitM decrypt the token- and PII-bearing channel to Core.'
  detail: '`common...data.TLSHelper.setupOkHttpClientSSLSocketFactory` (cev-f6000002)

    builds the OkHttp SSL socket factory from

    `KeyStore.getInstance("AndroidCAStore")` and initializes the

    `TrustManagerFactory` with that store. The AndroidCAStore trusts

    USER-installed CA certificates, and no certificate/public-key pinning is

    applied (the recon note: "No fixed-server pinning (self-hosted)"). The

    validation itself is standard X509, so this is not a trust-all/disabled-

    validation case — but the trust anchor set is attacker-influenceable.


    The confidentiality consequence is in-transit exposure: against the

    `network_mitm` position, an attacker who can get a CA into the user store

    (social engineering, MDM, a malicious profile) or who already controls a

    trusted-but-mis-issued CA can transparently intercept the

    mobile->Core channel (cev-0a000005), which carries the bearer token and

    home-occupancy/location PII. Because HA is self-hosted there is no fixed

    server certificate to pin to a vendor root, so the design accepts a broad

    trust anchor by default.


    High severity under the *mobile-applications* rubric clause "No

    certificate or public-key pinning on a high-value channel whose threat

    model includes user-installed MitM CAs or hostile networks" (MAS mapping:

    MASVS-NETWORK-2). High rather than critical because stock-device default

    TLS still defeats the casual on-path attacker who has not placed a CA. The

    *identity*-of-endpoint (pinning-as-authentication) facet routes to

    Authenticity; this finding owns the confidentiality of the data in

    transit.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidCAStore")... builder.sslSocketFactory(..., trustManagers[0] as X509TrustManager)
  - artifact: code-evidence-index.yaml
    locator: cev-f6000002 AndroidCAStore user-CA, no pinning
    excerpt: network_mitm with a user-installed CA (no pinning) reads mobile_stored_session_and_refresh_tokens in transit
  control_mappings:
    nist_800_53r5:
    - SC-8
    - SC-8(1)
    - SC-23
    - SC-17
    mitre_attack:
    - technique: T1557
      sub_technique: null
      tactic: TA0006
      rationale: Trusting user-installed CAs with no pinning lets an attacker-supplied CA terminate TLS as Adversary-in-the-Middle and read the token/PII channel.
    cwe:
    - CWE-295
    masvs:
    - MASVS-NETWORK-2
  recommendation:
    posture: recommended
    summary: Offer optional public-key pinning / trust-on-first-use and exclude user CAs for the configured instance channel.
    detail: 'In `TLSHelper.setupOkHttpClientSSLSocketFactory` (cev-f6000002), since a

      fixed vendor root cannot be pinned for self-hosted instances, support a

      trust-on-first-use (TOFU) public-key pin captured at instance

      onboarding and enforced on subsequent connections, and provide a

      user-visible option to exclude user-installed CAs (build the trust

      manager from the system CA store plus the pinned key only). Surface a

      pin-mismatch as a security event. This preserves self-signed/custom-CA

      support for advanced users while removing the silent-MitM default for

      the token/PII channel.

      '
    references:
    - 'external: OWASP MASTG MASVS-NETWORK-2 (identity pinning)'
  related_concerns:
  - authenticity
  cross_references: []
