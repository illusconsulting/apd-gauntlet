  confidence: medium
  title: iOS Companion compiles git-tracked GoogleService-Info Firebase config secrets into the IPA, recoverable by static analysis
  summary: '`AppDelegate.setupFirebase` initializes Firebase from a git-tracked GoogleService-Info plist bundled into the IPA, so the Firebase project config (API key, sender/app IDs) is recoverable from any installed app by a reverse engineer.'
  detail: '`Sources.App.AppDelegate.setupFirebase` (cev-e5000003) configures Firebase

    from the bundled `GoogleService-Info-*.plist`, which the run scope

    confirms is git-tracked and compiled into the IPA

    (ios_bundled_firebase_config_secrets). Against the

    `reverse_engineer_with_ipa_apk` position, these config values are

    extractable from any copy of the app — they are binary-recoverable, not

    confidential.


    The confidentiality framing must be calibrated: a Firebase

    GoogleService-Info plist is a project CONFIG bundle (API key + sender ID +

    app ID), not a backend signing secret, and Google''s model treats the

    mobile API key as identifying-not-authenticating when backend security

    rules are enforced server-side. So this is not the critical

    "hardcoded backend credential granting backend access for the entire

    install base" case unless the Firebase project''s security rules are

    permissive. It IS a real exposure of a shared-across-the-install-base

    config secret whose abuse (quota/billing abuse, project enumeration,

    push-channel reconnaissance toward the fcm-push relay) is bounded by the

    server-side rules.


    Medium severity: it sits below the *mobile-applications* Critical

    "hardcoded backend credential … granting backend or third-party access for

    the entire install base" clause because the recovered material is config,

    not a backend-access secret, but it remains a shared-secret exposure worth

    remediating. Confidence is medium because the abuse ceiling depends on the

    (unseen) Firebase security-rule posture. If code/config evidence shows the

    bundle carries a privileged key or permissive rules, this escalates to

    critical.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:Sources.App.AppDelegate.AppDelegate.setupFirebase:L1-L1@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: configures Firebase from bundled GoogleService-Info plist
  prerequisite_evidence:
  - Firebase project security-rule posture and whether the bundled key carries privileged scope (determines abuse ceiling)
  control_mappings:
    nist_800_53r5:
    - SC-28
    - IA-5(7)
    - SA-15
    mitre_attack:
    - technique: T1577
      sub_technique: null
      tactic: TA0009
      rationale: The bundled GoogleService-Info plist is recoverable from the distributed IPA, the Compromise Application Executable / embedded-config disclosure pattern on mobile.
    cwe:
    - CWE-312
    masvs:
    - MASVS-STORAGE-1
  recommendation:
    posture: recommended
    summary: Treat the Firebase config as non-confidential and enforce the security boundary server-side; remove it from version control.
    detail: 'Confirm the Firebase project relies on server-side security rules and an

      App Check / attestation gate rather than the bundled key for any

      sensitive operation, so the binary-recoverable config (cev-e5000003)

      confers no backend privilege. Remove the git-tracked

      GoogleService-Info plist from version control (inject at CI build time)

      to limit casual disclosure, and rotate if it ever carried a privileged

      value. Document the asset explicitly as binary-recoverable config so it

      is not relied upon as a secret.

      '
    references:
    - 'external: OWASP MASTG MASVS-CRYPTO-2 (no secrets in the app package)'
  related_concerns:
  - authenticity
  cross_references: []
