  title: Core integrations consume untrusted device/cloud responses with no central response validation while running unsandboxed at Core's full privilege
  summary: Integration responses and forged inbound webhooks from untrusted devices/clouds are trusted per-integration with no central schema/response validation, and a single integration's tampering reaches all Core state because integrations are unsandboxed.
  detail: 'The context brief and trust-boundary map state that Core integrations consume

    responses from untrusted devices/clouds and forged inbound webhooks

    (compromised_third_party_integration; API10 unsafe consumption), and that response/

    endpoint authenticity is "per-integration (not centrally enforced)." The system

    overview is explicit that integrations are NOT sandboxed from each other and run

    with Core''s full privilege, so a single integration that ingests a malicious

    response tampers with all Core state, the permission engine, and .storage with no

    in-process integrity boundary (the threat model records this as tm-d98660ae /

    tm-e185c6a7, Tampering). There is no central response-validation or schema-

    enforcement layer at the Core<->external-device boundary (asset-inventory

    boundary tb-6a2d8c14).


    This is the unsafe-consumption / inbound-integrity facet (validate-before-act on

    untrusted upstream responses), distinct from the SSRF/outbound concern. Severity

    is high under the *api-security* rubric: it matches "Unsafe consumption of

    third-party APIs without response validation (OWASP API10)" (which the rubric bands

    medium) but escalates to high here because the *amplifier* — no inter-integration

    isolation, full Core privilege — turns a single trusted-but-wrong response into

    tampering of the entire Core state machine (the rubric''s "do not average" rule

    takes the higher band driven by the unsandboxed-privilege multiplier). Confidence

    is medium: the unsandboxed-privilege design is high-confidence (overview lines

    20-22), but per-vendor response-validation behavior is modeled at the aggregate

    level and not enumerated per integration in the code-evidence-index.

    '
