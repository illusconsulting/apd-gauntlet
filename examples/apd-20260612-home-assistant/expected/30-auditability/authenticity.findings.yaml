  title: Companion apps and Core have no hardware device attestation (Play Integrity / App Attest), so the backend has no genuine-client proof
  summary: No Play Integrity / App Attest / key attestation anywhere; the backend cannot cryptographically verify a request came from a genuine, untampered app on a genuine device.
  detail: 'The run''s crown-jewel enumeration confirms attestation_tokens_and_jwts is ABSENT —

    no Play Integrity, App Attest, DeviceCheck, or SafetyNet exists in either Companion

    app or Core. Code recon corroborates: the Android client''s only client-side identity

    controls are the mTLS key in the AndroidKeyStore (KeyStoreRepositoryImpl) and the

    custom TLS factory (TLSHelper), and there is no root/jailbreak/Frida detection

    (rooted_device_attacker_with_frida position). Consequently the backend has no

    cryptographic proof that a request originates from a genuine, untampered Companion

    build running on an uncompromised device — a repackaged or emulated client, or a

    direct API caller replaying extracted tokens, is indistinguishable to Core.


    This is the *verifiable* counterpart to the missing runtime-detection signal (which

    Integrity owns as advisory). Per the *mobile-applications* authenticity pattern "No

    hardware attestation (MASVS-RESILIENCE-4)", severity is high here rather than critical

    because the consequential backend writes the client commands (device control via the

    mobile_app webhook / call_service) are additionally guarded by the bearer/permission

    model rather than accepted on the bare client assertion alone; it would be critical if

    a high-value write were accepted on nothing but a client-side root verdict. Recorded as

    the structural gap: the backend has no genuine-client proof at all, so every

    device-trust argument about the mobile clients is unresolvable.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.keychain.KeyStoreRepositoryImpl:L108-L112@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidKeyStore") // hardware-backed key store for mTLS client-cert private key
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidCAStore")... trustManagerFactory.init(androidCaStore)
  - artifact: mobile/android-CLAUDE.md
    locator: run-config crown_jewels EXCLUDED note (attestation_tokens_and_jwts absent)
    excerpt: no Play Integrity / App Attest / DeviceCheck / SafetyNet anywhere
  control_mappings:
    nist_800_53r5:
    - IA-9
    - SI-7
    - SI-7(6)
    - SC-23
    - RA-3
    mitre_attack: []
    masvs:
    - MASVS-RESILIENCE-4
    maswe:
    - MASWE-0099
  recommendation:
    posture: recommended
    summary: Request and server-verify a fresh hardware attestation verdict and bind it to high-value actions.
    detail: 'Add Play Integrity (Android) and DCAppAttest / App Attest (iOS) to the

      Companion apps, request a fresh nonce-bound verdict at session establishment

      and before consequential device-control actions, and verify the

      Google/Apple-signed verdict plus key-attestation chain SERVER-SIDE in the

      mobile_app integration before honoring webhook_call_service / state writes —

      binding the verdict to the issued session or per-action step-up rather than

      logging it. Because self-hosted instances vary, gate this as an opt-in

      hardening tier for users who expose Core to the internet. This is the

      verifiable floor that makes the absent root/Frida heuristics moot.

      '
    references:
    - 'external: OWASP MASVS-RESILIENCE-4 (hardware-backed attestation)'
    - 'external: Google Play Integrity API / Apple App Attest'
  related_concerns:
  - integrity
  - non_repudiation
  cross_references: []
- schema_version: 1
  id: auth-1787eae1
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: high
  confidence: high
  title: Android Companion verifies the server with default CA trust plus user-installed CAs and no pinning, so the backend identity is forgeable to a MitM
  summary: The custom TLS factory trusts user-installed CAs with no certificate/public-key pinning, so a MitM with an installed CA impersonates the self-hosted backend.
  detail: 'The Android Companion''s TLSHelper.setupOkHttpClientSSLSocketFactory loads the

    AndroidCAStore into its trust manager (code: L24-L43), which includes USER-installed

    CAs, and performs standard X509 validation with no certificate or public-key (SPKI)

    pinning. Because the backend is a user-entered self-hosted instance URL with no fixed

    certificate, the client cannot verify the SERVER''s identity beyond "some CA in the

    device trust store signed this leaf". An on-path adversary who can get a CA into the

    store (a user-installed MitM CA, an enterprise/MDM CA, or a compromised public CA —

    the network_mitm position) presents a certificate the client accepts, impersonating

    the Home Assistant backend and harvesting the bearer token passed over the channel or

    rewriting responses the WebView/native bridge then trusts.


    This is the server-identity-verification face of Authenticity (verifying who the

    server is), distinct from the eavesdropping/confidentiality face. Per the

    *mobile-applications* authenticity pattern "No certificate or public-key pinning on a

    high-value channel (MASVS-NETWORK-2)" this is high: stock-device default TLS still

    holds against the casual on-path case with no installed CA, but the device-trust

    assumption is low for the installed-CA case and the blast radius pivots to backend

    impersonation and token theft. Pinning a self-hosted, user-chosen server is genuinely

    hard (no fixed cert), so the finding of record is the absent trust-on-first-use pin or

    user-confirmable certificate identity, not a static pin set.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidCAStore")... builder.sslSocketFactory(..., trustManagers[0] as X509TrustManager)
  - artifact: code-evidence-index.yaml
    locator: TLSHelper AndroidCAStore no SPKI pinning
    excerpt: network_mitm forges backend identity (no pinning, user-CA trust) to intercept mobile_stored_session_and_refresh_tokens
  control_mappings:
    nist_800_53r5:
    - SC-8
    - SC-8(1)
    - SC-23
    - IA-9
    - SC-17
    mitre_attack:
    - technique: T1557
      sub_technique: null
      tactic: TA0006
      rationale: Trusting user-installed CAs with no pinning lets a MitM with an installed CA present an accepted certificate and intercept the bearer token in transit.
    cwe:
    - CWE-295
    masvs:
    - MASVS-NETWORK-2
    maswe:
    - MASWE-0052
  recommendation:
    posture: recommended
    summary: Add trust-on-first-use pinning and exclude user-installed CAs for the configured instance.
    detail: 'For each configured server, capture the leaf/SPKI on first successful

      connection and pin it (trust-on-first-use) so a later MitM with a different

      certificate is rejected and surfaced to the user, and scope the OkHttp trust

      manager to the system CA store (excluding user-added CAs) for the instance

      channel unless the user explicitly opted into a custom CA. Report a pin /

      certificate-identity mismatch to the user as a security event rather than

      silently proceeding. The eavesdropping face of this same channel is owned by

      the Confidentiality finding on user-installed-CA trust.

      '
    references:
    - 'external: OWASP MASVS-NETWORK-2 (server-identity verification / pinning)'
  related_concerns:
  - confidentiality
  - integrity
  cross_references:
  - conf-2029ce78
- schema_version: 1
  id: auth-3dbf15e7
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: high
  confidence: high
  title: IndieAuth authorization-code flow on the mobile public client omits PKCE, so an intercepted code redeems for tokens
  summary: The token endpoint binds the authorization code only to a public client_id (the redirect URL) with no PKCE code_verifier, so a code intercepted at a custom-scheme redirect is redeemable.
  detail: 'Home Assistant''s auth flow is OAuth2 + the IndieAuth extension where the client_id IS

    the application''s website URL and the redirect must share its host (auth_api.md). A

    native app whitelists a custom-scheme redirect such as hass://auth via a link tag. The

    token endpoint requires only that the authorization_code request carry "the exact same

    client_id" used at authorize — there is NO PKCE code_challenge / code_verifier in the

    documented flow (auth_api.md authorize + token sections show client_id and code only).

    A mobile app is an OAuth public client holding no confidential secret (the run-config

    confirms client_id IS the redirect URL, no client secret), so without PKCE the only

    thing binding the authorization code to the requesting app is a PUBLIC client_id that

    any party can replay.


    An authorization code delivered to a hijackable custom-scheme redirect (a co-resident

    app registering the same scheme, or the phishing_deep_link_or_ipc_caller position) can

    therefore be intercepted and exchanged for an access+refresh token by an attacker who

    replays the same public client_id — no device-rooting required. Per the

    *mobile-applications* authenticity pattern "OAuth public client performs authorization

    without PKCE (MASVS-AUTH-1)" this is high: code interception by a co-resident app or

    duplicate-scheme registration needs no rooted device, and the intercepted refresh token

    is long-lived (Ephemeral owns the lifetime). The OAuth/OIDC protocol decision routes to

    identity-security; filed here as the mobile-origin authenticity gap.

    '
  evidence:
  - artifact: auth/auth_api.md
    locator: '#token / Authorization code, lines 72-82'
    excerpt: grant_type=authorization_code& code=12345& client_id=https%3A%2F%2Fhass-auth-demo.glitch.me
  - artifact: auth/auth_api.md
    locator: '#clients, lines 14-23 (client_id is the website; custom-scheme redirect)'
    excerpt: The client ID you need to use is the website of your application ... <link rel='redirect_uri' href='hass://auth'>
  control_mappings:
    nist_800_53r5:
    - IA-2
    - IA-5
    - IA-5(2)
    - IA-8
    mitre_attack:
    - technique: T1528
      sub_technique: null
      tactic: TA0006
      rationale: Without PKCE, an authorization code intercepted at a hijackable custom-scheme redirect is exchanged for an access token by replaying the public client_id.
    cwe:
    - CWE-287
    masvs:
    - MASVS-AUTH-1
    maswe:
    - MASWE-0040
    owasp_api_top10:
    - API2:2023
  recommendation:
    posture: recommended
    summary: Require PKCE (RFC 7636) on the authorization-code flow and prefer domain-verified redirects over custom schemes.
    detail: 'Add PKCE support to the /auth/authorize and /auth/token endpoints: require a

      code_challenge (S256) at authorize and a matching code_verifier at token

      exchange, so an intercepted code is unredeemable without the per-flow secret

      held only by the initiating app. In the Companion apps, prefer a

      domain-verified Android App Link / iOS Universal Link redirect over the

      hijackable hass:// custom scheme. Because IndieAuth public clients hold no

      secret, PKCE is the only mechanism that binds the code to the requesting app.

      '
    references:
    - 'external: RFC 7636 Proof Key for Code Exchange'
    - 'external: OWASP MASVS-AUTH-1'
  related_concerns:
  - ephemeral
  - integrity
  cross_references:
  - ephem-053957f3
- schema_version: 1
  id: auth-23048c0c
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: high
  confidence: high
  title: Inter-service calls (Supervisor->Core, CLI->Supervisor, Core->push relay) carry no payload-level signing, relying on bearer/transport identity only
  summary: Cross-service requests are authenticated by bearer token or local socket only, with no per-message workload-identity signature, so a host-root-plane compromise forges any peer.
  detail: 'Across the ecosystem, service-to-service authenticity rests on bearer tokens and

    local sockets, never on a signed payload binding the message to a verified workload

    identity. Supervisor acts as a privileged Core client: it POSTs {api_url}/auth/token

    and holds a Core access token (code: x0000002), so the host-root control plane can

    mint/forge Core admin requests; the `ha` CLI builds a runtime endpoint URL into the

    Supervisor API with no mutual workload authentication (URLHelper x0000001); Core''s

    notify path calls the external Firebase push relay (x0000006) whose handler

    authenticates no caller (handleRequest consumes push_token from the body with no

    caller authn). None of these hops attaches a producer signature a consumer verifies;

    there is no SPIFFE/SPIRE, no mTLS between Core and Supervisor (the Android mTLS key is

    a client->Core control, not an internal-mesh control), and no event-bus message

    signing.


    Consequently a foothold on any one component (the internal_lateral_attacker /

    malicious_or_compromised_addon positions) cannot be cryptographically distinguished

    from a legitimate peer at the next hop. This is high severity under the *api-security*

    rubric clause "Service-to-service inside the cluster uses shared bearer tokens, not

    mTLS or workload identity" — lateral-movement amplification with no identity binding on

    the credential. The token-lifetime/rotation concern routes to Ephemeral; this finding

    is bounded to the absent per-message workload-identity verification.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.homeassistant.api.HomeAssistantAPI._ensure_access_token -> homeassistant.components.api (Core /auth/token):L145-L173@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: 'CROSS_HTTP_CALLS: Supervisor POSTs {api_url}/auth/token and calls Core''s API as a privileged client'
  - artifact: code-evidence-index.yaml
    locator: code:client.helper.URLHelper:L45-L71@c5f716eb5f62c337c603e144f23cd74ac25da98e
    excerpt: base := viper.GetString("endpoint") ... uri := fmt.Sprintf("%s%s/%s/%s", scheme, base, section, command)
  - artifact: code-evidence-index.yaml
    locator: code:functions.handlers.handleRequest:L51-L95@142579dc41ee534f0d60bc390c4661dba051a995
    excerpt: 'const { push_token: token } = req.body; if (!token) return res.status(403)'
  - artifact: code-evidence-index.yaml
    locator: cev-0a000002 Supervisor POSTs /auth/token as privileged Core client
    excerpt: internal_lateral_attacker presents shared bearer/socket; Supervisor mints Core admin requests reaching user_credentials_store
  control_mappings:
    nist_800_53r5:
    - IA-9
    - IA-3
    - SC-8(1)
    - SC-23
    - SC-23(3)
    mitre_attack:
    - technique: T1557
      sub_technique: null
      tactic: TA0006
      rationale: Absent per-message workload-identity signing, a lateral attacker on one service presents the shared bearer/socket and is accepted as a legitimate peer at the next hop.
    cwe:
    - CWE-345
    owasp_api_top10:
    - API2:2023
  recommendation:
    posture: recommended
    summary: Add workload identity (mTLS or signed payloads) on the Supervisor<->Core and CLI<->Supervisor hops and authenticate the push-relay caller.
    detail: 'Introduce a workload-identity layer on the internal hops: mutually

      authenticate Supervisor<->Core with mTLS using per-component certificates

      (rather than only a bearer token the host-root plane can replay), and require

      the `ha` CLI to present a verifiable client identity to the Supervisor API

      instead of a runtime-trusted endpoint. For the Core->push-relay hop, require

      the relay to authenticate the calling instance (a signed request or

      per-instance credential) so a third party holding a valid-format FCM token

      cannot drive notifications. Where full mTLS is impractical, sign consequential

      inter-service payloads (e.g. with a per-component key) and verify the

      signature at the consumer.

      '
    references:
    - 'external: NIST SP 800-53r5 IA-9 Service Identification and Authentication'
    - 'external: SPIFFE/SPIRE workload identity'
  related_concerns:
  - ephemeral
  - confidentiality
  - non_repudiation
  cross_references:
  - ephem-cf71612d
- schema_version: 1
  id: auth-7162fd48
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: high
  confidence: high
  title: MFA/TOTP is optional and user-opt-in with no enforced AAL, so the all-access owner account can be password-only
  summary: TOTP MFA is available but per-user opt-in via the profile page; no surface — including the unconditional all-access owner — mandates a second factor and no AAL target is declared.
  detail: 'Home Assistant ships a TOTP MFA module, but MFA is purely opt-in: "All available

    modules will be listed in user profile page, user can enable the module he/she wants

    to use" (auth_auth_module.md). The credential path is bcrypt password validation

    (Data.validate_login / hash_password); nothing in the auth flow mandates a second

    factor on any surface. The owner account holds an unconditional all-access grant

    (_OwnerPermissions.access_all_entities returns True; filter short-circuits for admins),

    so a single phished/guessed/breach-reused password on the owner yields total control of

    Core, the integration secret vault, the Recorder DB, and (via the Supervisor proxy) the

    host-root plane — with no second factor required. No NIST 800-63B AAL target is declared

    for any surface.


