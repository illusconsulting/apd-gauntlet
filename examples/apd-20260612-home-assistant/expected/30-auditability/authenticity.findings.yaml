  title: Add-on image signing (Cosign) is a developer recommendation, not enforced by admission control, and base images are pinned to a mutable tag
  summary: Image signing is advisory best-practice with no verification gate at install/run, and the Supervisor base image is a floating tag — unsigned/tampered artifacts run unverified.
  detail: 'Supply-chain artifact authenticity is unenforced. Add-on image signing is documented

    only as a developer best-practice — "Sign published images (the supported publishing

    workflow can sign images with Cosign)" (supervisor-apps-security.md) — with no

    statement that the Supervisor VERIFIES a Cosign signature before installing or running

    an add-on image, and the add-on manifest (mosquitto config.yaml) declares role / mounts

    / startup with no signature requirement. The Supervisor build itself derives from a

    base image pinned to a registry tag (BUILD_FROM ghcr.io/home-assistant/base-python:

    3.14-alpine3.22-2026.05.0) rather than an immutable digest, and installs Python wheels

    with no signature/attestation step. There is therefore no admission-control policy that

    blocks an unsigned or tampered image from running in production, and the identity of a

    pulled artifact (is this the image the publisher signed?) is not verified at deploy time.


    This is high severity under the *api-security* authenticity pattern "Container images

    deployed without signature verification or admission control" — a supply-chain

    compromise vector where a swapped add-on image or a tampered base/wheel runs with no

    authenticity check, and add-ons can escalate to the supervisor/Docker host-root plane.

    The artifact-immutability / digest-pinning lifecycle concern routes to Immutability /

    Ephemeral; this finding is bounded to the absent signature verification.

    '
  evidence:
  - artifact: mobile/supervisor-apps-security.md
    locator: '#making-a-secure-app, line 33'
    excerpt: Sign published images (the supported publishing workflow can sign images with Cosign)
  - artifact: infra/supervisor-Dockerfile
    locator: line 1 (BUILD_FROM floating tag)
    excerpt: ARG BUILD_FROM=ghcr.io/home-assistant/base-python:3.14-alpine3.22-2026.05.0
  - artifact: infra/supervisor-Dockerfile
    locator: lines 36-48 (wheels install, no attestation)
    excerpt: uv pip install --compile-bytecode --no-cache --no-build -r requirements.txt
  - artifact: code-evidence-index.yaml
    locator: '#making-a-secure-app line 33 (Cosign not enforced)'
    excerpt: supply_chain_attacker ships unsigned add-on/base image (no admission verify) escalating to supervisor_docker_control_plane
  control_mappings:
    nist_800_53r5:
    - SI-7
    - SR-4
    - SR-4(3)
    - SR-11
    - CM-5
    mitre_attack:
    - technique: T1195
      sub_technique: T1195.002
      tactic: TA0001
      rationale: With no signature verification at install, a tampered add-on or base image runs unverified, giving an upstream attacker code execution that can escalate to the Docker host-root plane.
    cwe:
    - CWE-494
  recommendation:
    posture: required
    summary: Enforce Cosign signature verification at add-on install/run and pin base images by digest with attestation.
    detail: 'Make image signature verification a hard admission gate in the Supervisor''s

      add-on install/start path: verify a Cosign signature (and ideally a

      keyless/Fulcio identity) against the expected publisher before pulling/running

      any add-on image, and fail closed on an unsigned or mismatched image rather

      than treating signing as a publisher courtesy. Pin the supervisor/core base

      images by immutable digest (FROM ...@sha256:...) instead of the floating

      base-python tag, and verify wheel integrity hashes/attestations at build.

      Pair with SBOM/provenance (see the SBOM finding) so the verified signature

      attests a known artifact.

      '
    references:
    - 'external: Sigstore / cosign image signing and verification'
    - 'external: NIST SP 800-53r5 SR-4 Provenance'
  related_concerns:
  - ephemeral
  - immutability
  - integrity
  cross_references:
  - ephem-9c322627
