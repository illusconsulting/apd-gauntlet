- schema_version: 1
  id: auth-6924f467
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: critical
  confidence: high
  title: os-agent D-Bus host-root methods (AddSSHAuthKey, ScheduleWipeDevice) verify no caller identity before host-root ops
  summary: os-agent exposes host-root D-Bus methods that perform privileged operations with no cryptographic or platform verification of the calling identity.
  detail: 'The os-agent Go daemon exposes system D-Bus methods on the io.hass.os interface

    that perform host-root operations — system.system.AddSSHAuthKey appends an

    arbitrary key to root''s authorized_keys (code: L57-L75), and

    system.system.ScheduleWipeDevice schedules a destructive datadisk/factory wipe

    (L29-L55). Neither method performs any in-method authentication of the D-Bus

    caller: there is no verification of the caller''s bus name, uid, PID, or any

    signed/attested token proving the caller is the legitimate Supervisor. The

    identity of the principal invoking a container->host-root bridge is therefore

    unverifiable at the moment of the privileged action — any process able to reach

    the system D-Bus (a compromised add-on container that has escaped to the

    container->host bridge per the internal_lateral_attacker / malicious_or_

    compromised_addon positions) is indistinguishable from the genuine Supervisor.


    This is an Authenticity gap (is the claimed identity of the caller verifiable),

    distinct from the write-path-authorization concern Integrity owns: even a correct

    authorization policy cannot be enforced when the caller identity it would gate on

    is never established. This is high severity under the *api-security* rubric clause

    "Authentication bypass to high-privilege functions with no factor required" — a

    host-root primitive reachable with no identity factor — escalated to critical

    because the affected functions are host-root SSH-key injection and device wipe (the

    single most consequential privilege boundary in the system), matching the rubric''s

    framing of authentication bypass to high-privilege functions at its sharpest edge.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:system.system.AddSSHAuthKey:L57-L75@bbaf039bab5024f5397f442b081bb964c9d4f7f6
    excerpt: file.WriteString(newKey) ... "key added for user root"
  - artifact: code-evidence-index.yaml
    locator: code:system.system.ScheduleWipeDevice:L29-L55@bbaf039bab5024f5397f442b081bb964c9d4f7f6
    excerpt: schedule factory-reset / datadisk wipe over D-Bus
  - artifact: code-evidence-index.yaml
    locator: code:supervisor (D-Bus client) -> system.system.AddSSHAuthKey (os-agent):L57-L75@bbaf039bab5024f5397f442b081bb964c9d4f7f6
    excerpt: 'CROSS_CHANNEL: Supervisor calls os-agent host methods over the system D-Bus (io.hass.os)'
  - artifact: code-evidence-index.yaml
    locator: code:system.system.AddSSHAuthKey:L57-L75
    excerpt: internal_lateral_attacker reaches os-agent D-Bus AddSSHAuthKey (no caller authz) -> host-root supervisor_docker_control_plane
  control_mappings:
    nist_800_53r5:
    - IA-3
    - IA-9
    - IA-2
    - SC-23
    - AC-6
    mitre_attack:
    - technique: T1543
      sub_technique: null
      tactic: TA0003
      rationale: An unauthenticated AddSSHAuthKey D-Bus call writes an attacker key into root authorized_keys, establishing persistent host-root access without any caller identity check.
    cwe:
    - CWE-306
    - CWE-862
  recommendation:
    posture: required
    summary: Authenticate the D-Bus caller in each os-agent host-root method before acting.
    detail: 'Replace the unauthenticated method dispatch in system/system.go with a

      D-Bus PolicyKit / bus-name + uid check (or an io.hass.os Polkit action

      policy) so AddSSHAuthKey and ScheduleWipeDevice verify the caller is the

      Supervisor service identity before performing the host-root operation.

      Bind the privileged interface to a dedicated system bus name restricted by

      a D-Bus policy file that grants the methods only to the Supervisor''s uid,

      and reject calls whose caller credentials (read via the bus daemon''s

      GetConnectionUnixUser / GetConnectionUnixProcessID) do not match. Do not

      rely on the D-Bus socket''s filesystem permissions alone as the identity

      proof for host-root primitives.

      '
    references:
    - 'external: NIST SP 800-53r5 IA-3 Device Identification and Authentication'
    - 'external: freedesktop.org D-Bus / polkit caller authorization'
  related_concerns:
  - integrity
  - non_repudiation
  cross_references:
  - intg-d5c5bca5
- schema_version: 1
  id: auth-3f2314a4
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: gap
  severity: high
  confidence: high
  title: mobile_app webhook authenticates by possession of a 32-hex webhook_id alone, with no caller identity or signature
  summary: The mobile_app webhook entrypoint accepts a webhook_id as the sole identity proof — no bearer, no per-request signature, no caller authentication.
  detail: 'The mobile_app webhook path (handle_webhook, code: L172-L180) maps an inbound

    webhook_id directly to a config_entry; the only authenticator is possession of

    the 32-hex webhook_id (secrets.token_hex, minted at registration —

    RegistrationsView.post L67-L88). The resulting webhook is bearer-LESS: unlike the

    OAuth bearer path validated by async_validate_access_token, no access token, no

    per-request HMAC, and no caller-identity assertion is required. The optional NaCl

    "secret" provides body confidentiality/integrity only if the app enabled

    supports_encryption; it is not a mandatory request authenticator and the registration

    doc presents encryption as optional (supports_encryption flag). Through this path

    webhook_call_service (L269-L292) invokes ARBITRARY services (locks, alarms) under a

    synthesized registration_context.


    The identity asserting "I am this registered device" is therefore unverifiable beyond

    a single static bearer-equivalent string. Any holder of a leaked webhook_id or

    cloudhook URL (the leaked_device_webhook_id attacker position) is cryptographically

    indistinguishable from the genuine device. This is high severity under the

    *api-security* rubric clause "MFA bypass or weak MFA on PII or payment surfaces" /

    "Broken Authentication (API2)" applied to a consequential control surface — a single

    possession factor with no proof-of-holder gates physical-device actuation. The

    double-actuation and arbitrary-service concerns route to Integrity; this finding is

    bounded to the unverifiable caller identity.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.webhook.handle_webhook:L172-L180@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: config_entry = hass.data[DOMAIN][DATA_CONFIG_ENTRIES][webhook_id]
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.http_api.RegistrationsView.post:L67-L88@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: webhook_id = secrets.token_hex(); ... data[CONF_SECRET] = secrets.token_hex(SecretBox.KEY_SIZE)
  - artifact: api/native-app/setup.md
    locator: registration response, lines 73-87 (webhook_id / secret optional)
    excerpt: '"secret": "qwerty", "webhook_id": "abcdefgh"'
  - artifact: code-evidence-index.yaml
    locator: cev-a1000016 handle_webhook (possession-only)
    excerpt: leaked_device_webhook_id authenticates by possession to mobile_app_webhook_api (no bearer / caller identity)
  control_mappings:
    nist_800_53r5:
    - IA-2
    - IA-9
    - SC-23
    - IA-3(1)
    mitre_attack:
    - technique: T1078
      sub_technique: null
      tactic: TA0001
      rationale: A leaked webhook_id is a permanent valid credential that authenticates arbitrary service calls into Core with no additional identity proof required.
    cwe:
    - CWE-306
    - CWE-345
    owasp_api_top10:
    - API2:2023
  recommendation:
    posture: required
    summary: Make the per-request NaCl signature mandatory and bind webhook calls to a verifiable device identity.
    detail: 'Require the registration-time secret (the NaCl SecretBox key minted in

      RegistrationsView.post) on every webhook request rather than treating

      supports_encryption as optional, so handle_webhook authenticates a

      per-request MAC/signature over the body and replay-protects it with a nonce,

      instead of trusting bare possession of the webhook_id. For consequential

      webhook_call_service actions, additionally bind the device to the issuing

      user''s refresh-token identity so a leaked webhook_id alone cannot actuate

      locks/alarms. Pair with rate-limiting on the bearer-less entrypoint.

      '
    references:
    - 'external: OWASP API Security Top 10 2023 API2 Broken Authentication'
  related_concerns:
  - integrity
  - ephemeral
  - non_repudiation
  cross_references:
  - intg-5df46115
  - ephem-053957f3
