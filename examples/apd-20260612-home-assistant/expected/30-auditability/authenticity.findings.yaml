  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: risk
  severity: medium
  confidence: high
  title: Add-on user identity is asserted via unsigned X-Remote-User-* headers the add-on must trust on faith
  summary: Ingress conveys the authenticated user to an add-on as plain injected X-Remote-User-* headers with no signature, so the add-on cannot independently verify the asserted identity.
  detail: 'When an add-on is reached via Supervisor ingress, the authenticated user is conveyed by

    Supervisor injecting X-Remote-User-Id / X-Remote-User-Name / X-Remote-User-Display-Name

    headers (supervisor-apps-security.md; ingress._init_header code: L320-L349). Supervisor

    does strip inbound copies of these headers in the same loop, which prevents a client

    from spoofing them THROUGH ingress (a real and credited control — see the corresponding

    capability). The residual Authenticity gap is that the asserted user identity reaching

    the add-on is an UNSIGNED plaintext header: the add-on has no cryptographic means to

    verify the identity claim, and the model collapses to "trust whatever sets these

    headers". An add-on placed on the host network, reached by a path that bypasses ingress,

    or a co-resident container able to call the add-on directly, can present forged

    X-Remote-User-* headers the add-on will treat as a genuine identity, because identity

    here is conveyed by header position, not by a verifiable token.


    This is medium severity under the *api-security* rubric clause "Defense-in-depth gap

    where a single compensating control is the only barrier" — the inbound-strip is the only

    thing standing between the header-trust model and identity forgery, and it is enforced

    at the ingress hop only. Recorded as the header-trust authenticity weakness, with the

    anti-spoof strip credited as a partial control in the capabilities file.

    '
  evidence:
  - artifact: mobile/supervisor-apps-security.md
    locator: '#authenticating-a-user-when-using-ingress, lines 40-48'
    excerpt: the supervisor then adds some headers identifying the user ... X-Remote-User-Id / X-Remote-User-Name
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.api.ingress._init_header:L320-L349@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: 'headers[HEADER_REMOTE_USER_ID] = session_data.user.id ... for name in request.headers: ... continue'
  control_mappings:
    nist_800_53r5:
    - IA-9
    - SC-23
    - IA-8
    - AC-4
    mitre_attack: []
    cwe:
    - CWE-290
  recommendation:
    posture: consider
    summary: Convey ingress user identity as a signed, add-on-verifiable token rather than a bare header.
    detail: 'For add-ons that make authorization decisions on the conveyed identity,

      replace (or supplement) the plaintext X-Remote-User-* headers with a

      short-lived signed assertion (e.g. a Supervisor-signed JWT carrying the user

      id/name) the add-on can verify against a Supervisor public key, so the

      identity is verifiable rather than positional. Continue stripping inbound

      copies, document that add-ons reached outside ingress must not trust these

      headers, and keep add-ons off the host network so the ingress strip remains

      the sole inbound path.

      '
    references:
    - 'external: NIST SP 800-53r5 IA-9 Service Identification and Authentication'
  related_concerns:
  - integrity
  - non_repudiation
  cross_references: []
- schema_version: 1
  id: auth-dfed90e4
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  disposition: risk
  severity: medium
  confidence: medium
  title: trusted_networks (IP-address) and legacy api_password auth providers accept network position or a static shared secret as identity proof
  summary: Auth providers include IP-address-based trusted_networks and a legacy shared api_password, both of which prove no individual identity and are spoofable/replayable.
  detail: 'The auth-provider set includes, alongside the homeassistant password provider,

    trusted_networks (which authenticates a user by the SOURCE IP being in a configured

    range) and the legacy_api_password provider (a single static shared secret), per the

    MFA configuration example listing legacy_api_password as a selectable provider

    (auth_auth_module.md) and the run/overview''s record of trusted_networks + legacy

    api_password as enabled provider options. An IP address is not an identity: behind a

    reverse proxy, on a shared LAN, or under source-IP spoofing, "in the trusted range"

    proves only network position, and a trusted_networks user typically bypasses the

    password factor entirely. A shared api_password is a single bearer secret common to all

    callers, with no per-user identity and no second factor.


    Neither provider yields a verifiable individual identity, and trusted_networks in

    particular substitutes network topology for authentication. This is medium severity

    under the *api-security* rubric clause "Defense-in-depth / weak authentication on

    surfaces" — these providers are opt-in and a hardened deployment uses the password

    provider, but where enabled they materially weaken identity assurance. Medium confidence

    because the precise default-enabled state and per-deployment configuration are

    operator-controlled and not fixed in the reviewed artifacts.

    '
  evidence:
  - artifact: auth/auth_auth_module.md
    locator: '#configuration-example, lines 52-63'
    excerpt: 'auth_providers: - type: homeassistant - type: legacy_api_password'
  - artifact: auth/auth_index.md
    locator: '#authentication-providers, lines 12-16'
    excerpt: It's up to the authentication provider to choose the method of authentication and the backend to use.
  prerequisite_evidence:
  - Whether trusted_networks / legacy_api_password are enabled by default or only on explicit operator configuration, and whether trusted_networks bypasses the password/MFA step
  control_mappings:
    nist_800_53r5:
    - IA-2
    - IA-8
    - IA-2(8)
    - SC-7
    mitre_attack: []
    cwe:
    - CWE-291
  recommendation:
    posture: consider
    summary: Deprecate IP-as-identity and shared-secret providers, or constrain them with MFA and proxy-aware source validation.
    detail: 'Treat trusted_networks as a convenience gate, not an authenticator: where it

      is used, still require the homeassistant password provider plus MFA for any

      consequential action, and ensure the source IP is derived from a trusted proxy

      configuration (not a client-settable X-Forwarded-For) so it cannot be spoofed.

      Retire legacy_api_password in favor of per-user credentials and long-lived

      tokens with identity. Document that IP-range trust proves location, not

      identity, and must not gate admin/owner access.

      '
    references:
    - 'external: NIST SP 800-53r5 IA-2 Identification and Authentication'
  related_concerns:
  - ephemeral
  cross_references: []
