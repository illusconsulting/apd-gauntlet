  title: Device-initiated consequential actions from the iOS/Android Companion apps have no authoritative server-side audit record with device/app-version attribution
  summary: Backend actions driven from the mobile clients (service calls, webhook data, deep-link-triggered actions) reach Core's unaudited action path, so a forged or repackaged client and a genuine one are indistinguishable in any record — and none is attestation-attributed.
  detail: 'The mobile-applications pack is explicit that the authoritative audit for a

    device-initiated consequential action must sit server-side, carrying device,

    app-version, and attestation-verdict attribution; an on-device-only trace is

    "an audit gap, not an audit." Home Assistant''s mobile clients drive backend

    actions over the network — service calls and state changes via the Core API

    (cev-0a000005 mobile->Core), and bearer-less data/service calls via the

    mobile_app webhook (cev-a1000015/16). These land on Core''s action path, which

    writes no security audit record (Finding nonrep-00000001) and which, on the

    webhook path, runs under a synthesized context (Finding nonrep-00000002).


    Compounding this, the platform has no client-attestation surface at all: the

    run-config confirmed Play Integrity / App Attest / DeviceCheck / SafetyNet are

    ABSENT across both apps. So even if Core began auditing the action, the record

    could not carry an attestation verdict to distinguish a genuine client on a

    genuine device from a repackaged or Frida-instrumented one — the

    mobile-pattern "consequential backend transactions ... logged server-side but

    without device, app-version, or attestation-verdict attribution" applies in

    its strongest form (here there is neither the server-side record NOR the

    attestation signal).


    Severity HIGH under the mobile-applications rubric: the mobile common-pattern

    "audit trail for consequential actions ... no durable, server-anchored record"

    is rated HIGH (the client-side-only-enforcement and reversibility modifiers

    load, and the blast-radius modifier loads because the unattributed transaction

    surface pivots to the backend at fleet scale via the shared Core API). The

    device-trust modifier does not lower it because the gap is a missing

    server-side invariant, not a device-local-only weakness.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.webhook.handle_webhook:L172-L180@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'config_entry = hass.data[DOMAIN][DATA_CONFIG_ENTRIES][webhook_id] # webhook_id is the authenticator'
  - artifact: code-evidence-index.yaml
    locator: code:iOS WebView (remote frontend) -> Core REST+WS API (user instance URL):L37-L76@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: 'CROSS_HTTP_CALLS: Companion WebView loads + calls the user-configured Core instance'
  control_mappings:
