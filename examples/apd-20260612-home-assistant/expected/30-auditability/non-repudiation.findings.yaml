  title: Time-source discipline for event ordering (NTP topology, drift bounds, timestamp precision) is unspecified across Core, Supervisor, and os-agent
  summary: No artifact specifies the time source, NTP discipline, drift bounds, or timestamp precision that any future audit (or the existing logbook timestamps) would rely on for reliable event ordering.
  detail: 'AU-8 (Time Stamps) requires a reliable, disciplined time source so audit

    events can be ordered and correlated, especially across the Core / Supervisor /

    os-agent / host-Docker tiers that an incident must be reconstructed across. The

    artifacts are silent on the time source: there is no NTP topology, no drift

    bound, no fallback-on-time-source-failure behavior, and no timestamp-precision

    statement (millisecond vs microsecond). The logbook entries carry timestamps

    but the discipline behind them is undocumented.


    Per the evidence-discipline block-on-ambiguity rule and the api-security

    non-repudiation common pattern "No time-source policy — disposition:

    uncertainty or blocked", this is recorded as BLOCKED rather than asserted: the

    artifacts neither confirm a disciplined source nor confirm its absence. It is

    pre-loaded here because any remediation of Findings 1-8 (introducing an audit

    stream) depends on a trustworthy time source to make the records orderable and

    correlatable across tiers.


    Severity MEDIUM reflects that this is a prerequisite-for-correct-audit concern

    rather than a confirmed gap; it would rise if a cross-tier correlation

    requirement were confirmed against an undisciplined clock.

    '
  evidence:
  - artifact: api/rest.md
    locator: /api/logbook sample, lines 360-383
    excerpt: '"when": "2016-...Z" # timestamp present; time-source discipline undocumented'
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#deployment-topologies, lines 108-116'
    excerpt: Home Assistant OS (appliance image) ... Supervised ... Container ... Core
  prerequisite_evidence:
  - Time-source specification for Core/Supervisor/os-agent — NTP topology, time authority, drift bounds, behavior on time-source failure, and audit timestamp precision (ms/us)
  - Whether timestamps are recorded in UTC with monotonic-on-write ordering across the Core/Supervisor/host-Docker tiers
  control_mappings:
    nist_800_53r5:
    - AU-8
    - AU-8(1)
    mitre_attack: []
  recommendation:
    posture: recommended
    summary: Specify and enforce a disciplined UTC time source with documented drift bounds for the audit stream introduced by Findings 1-8.
    detail: 'Document and enforce the time source the audit subsystem (Finding

      nonrep-00000001) will stamp records with: an NTP-disciplined UTC clock on the

      HAOS appliance and the Supervised host, sub-second precision, a documented

      drift bound, and a defined behavior when the time source is unavailable.

      Without this, audit records across the Core / Supervisor / os-agent tiers

      cannot be reliably ordered during incident reconstruction.

      '
    references:
    - 'external: NIST SP 800-53r5 AU-8 Time Stamps'
  related_concerns: []
