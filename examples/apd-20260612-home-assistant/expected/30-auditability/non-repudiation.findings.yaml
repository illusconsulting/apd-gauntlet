    - AU-3(1)
    - AU-10
    - AU-12
    - IA-3
    mitre_attack: []
    cwe:
    - CWE-778
    masvs:
    - MASVS-AUTH-3
  recommendation:
    posture: required
    summary: Record each device-initiated consequential action as an authoritative Core audit event carrying the device/registration identity and app version; the on-device event is corroborating only.
    detail: 'On the new Core audit stream (Finding nonrep-00000001), every consequential

      action originating from a mobile client must produce an authoritative

      server-side record carrying the registered device identity (the

