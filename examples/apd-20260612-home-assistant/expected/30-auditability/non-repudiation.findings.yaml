  title: No audit-read access control or segregation of duties is possible because no audit stream exists, and the existing logbook/logger have no separate audit-read role
  summary: There is no audit-read role distinct from operator roles, no audit-of-audit-access, and no segregation of duties around the diagnostic/logbook traces; whether any future audit stream would have such controls is unspecified.
  detail: 'AU-9 (Protection of Audit Information) and AC-5 (Separation of Duties) require

    that audit-read access be gated by a role distinct from the operators whose

    actions are audited, and that audit reads themselves be recorded. Because Home

    Assistant has no security audit stream (Finding nonrep-00000001), there is

    nothing to which such controls could attach, and the traces that do exist have

    no segregation: the owner (cev-a1000008) is unconditional all-access and can

    read the logbook/logger like everything else, and there is no audit-of-audit

    meta-record.


    This is recorded as BLOCKED on the design of any future audit subsystem: once

    an audit stream is introduced (Findings 1-8), whether its read path is gated by

    a separate role, whether operators who can actuate devices are excluded from

    reading the audit of those actuations, and whether audit reads are themselves

    logged are all open questions the current artifacts cannot answer. The

    owner-all-access fact (cev-a1000008) suggests segregation of duties would be

    difficult to achieve under the present role model without a design change —

    but asserting that as a confirmed gap requires the future audit design, so it

    is blocked rather than a gap.


    Severity MEDIUM as a design-prerequisite concern; the owner-all-access model

    makes it more than informational.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.permissions._OwnerPermissions:L84-L96@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'def access_all_entities(self, key): return True # owner unconditional all-access'
  - artifact: auth/auth_index.md
    locator: '#owner, lines 27-29'
    excerpt: The onboarding user is the owner (all permissions)
  prerequisite_evidence:
  - Design of the audit-read access path for any future audit stream — whether a separate audit-reader role exists distinct from operator/admin/owner
  - Whether audit reads are themselves recorded (audit-of-audit-access) and whether segregation of duties excludes actors from reading the audit of their own actions
  control_mappings:
    nist_800_53r5:
    - AU-9
    - AU-9(4)
    - AU-9(6)
    - AC-5
    mitre_attack: []
  recommendation:
    posture: recommended
    summary: When the audit stream is introduced, gate its read path with a dedicated audit-reader role separate from owner/admin/operator and record audit reads as meta-audit events.
    detail: 'Design the audit subsystem (Finding nonrep-00000001) so its read path is

      gated by a distinct audit-reader role rather than inheriting owner/admin

      all-access (cev-a1000008), exclude an actor from reading the audit of their

      own consequential actions where feasible, and emit a meta-audit event on each

      audit read (AU-9(6) / AU-9(4)). The present owner-all-access model would

      otherwise let the highest-blast-radius principal silently review and act on

      the record of what has been observed.

      '
    references:
    - 'external: NIST SP 800-53r5 AU-9, AC-5 Separation of Duties'
