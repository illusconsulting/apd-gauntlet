  title: SUPERVISOR_TOKEN and add-on service-account token lifecycle (rotation, expiry, revocation) is unspecified
  summary: The artifacts and code recon establish that SUPERVISOR_TOKEN gates the privileged Supervisor API per add-on role, but do not establish its rotation cadence, expiry, or revocation-on-add-on-removal, so the service-account credential lifecycle cannot be assessed.
  detail: '`SUPERVISOR_TOKEN` is the per-add-on service-account credential that

    `SecurityMiddleware.token_validation` resolves to an app and then gates by

    role-based URL ACL (cev-b2000001, cev-b2000002), and the supervisor mints

    and holds a Core access token to call Core as a privileged client

    (cev-0a000002). What the available evidence does NOT establish is the

    Ephemeral lifecycle of these service-account tokens: whether

    SUPERVISOR_TOKEN is rotated on a cadence or is static for the add-on''s

    install lifetime, whether it carries an expiry, whether it is revoked and

    re-minted when an add-on is reinstalled or its protection mode toggles, and

    whether the supervisor''s held Core token (cev-0a000002) rotates. The

    System-token type is documented only as "limited to be generated and used

    by system users … never exposed to the user" (`auth_index.md` line 51) with

    no lifetime stated.


    Per the block-on-ambiguity rule, the silence in the artifacts and the recon

    index on token rotation/expiry is not evidence of absence — but it is also

    not evidence of a healthy lifecycle. Because these are host-root-equivalent

    service-account credentials, their lifecycle is material and must be

    confirmed from code/config rather than inferred. Severity is provisionally

    medium pending the evidence; it would rise if the tokens prove static and

    long-lived (the same pattern as the user tokens in ephem-0a000001).


    No *api-security* rubric clause is cited because this is a blocked finding,

    not a confirmed gap; the governing pattern once resolved would be the

    Ephemeral "static long-lived service-account secret with no rotation"

    clause.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.api.middleware.security.SecurityMiddleware.token_validation:L302-L375@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: if patterns.role_access[app.hassio_role].match(request.path)
  - artifact: auth/auth_index.md
    locator: §'Refresh token types', line 51
    excerpt: System … generated and used by system users … never exposed
  prerequisite_evidence:
  - SUPERVISOR_TOKEN issuance/rotation/expiry policy (how and when the per-add-on token is minted, rotated, and invalidated)
  - Revocation behavior on add-on uninstall, reinstall, or protection-mode toggle
  - Supervisor-held Core access-token (cev-0a000002) lifetime and rotation cadence
  - System refresh-token (auth_index line 51) lifetime / rotation semantics
  control_mappings:
    nist_800_53r5:
    - IA-5
    - IA-5(1)
    - AC-2
    - AC-2(3)
    mitre_attack: []
  recommendation:
    posture: consider
    summary: Confirm the SUPERVISOR_TOKEN and system-token lifecycle from supervisor/core code before relying on it.
    detail: 'Resolve the prerequisite evidence from the supervisor and core

      repositories — specifically the SUPERVISOR_TOKEN minting and rotation

      path feeding `SecurityMiddleware.token_validation` (cev-b2000001) and the

      supervisor''s Core-token acquisition (cev-0a000002) — to confirm whether

      these host-root-equivalent service-account credentials rotate and expire

      or are static for the add-on lifetime. If static, re-file as a confirmed

      high-severity service-account rotation gap.

      '
    references: []
  related_concerns:
  - authenticity
  cross_references: []
- schema_version: 1
