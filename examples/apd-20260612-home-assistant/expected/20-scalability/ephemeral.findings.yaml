  title: Web/portal session absolute lifetime, idle timeout, and behavior on credential change are unspecified
  summary: Beyond the documented 1800s access-token TTL and the never-expiring refresh token, the artifacts do not specify a maximum portal session lifetime, idle timeout, or session-invalidation behavior on password or MFA change, so session-lifetime policy cannot be fully assessed.
  detail: 'The token primitives are partly specified — access tokens expire in 1800s

    (`auth_api.md` `expires_in: 1800`), refresh tokens never expire

    (ephem-0a000001), and the WS handshake registers a revoke callback that

    drops the socket on token revocation (`AuthPhase.async_handle`,

    cev-a1000010). What is NOT specified is the session-management policy as a

    whole: there is no documented maximum absolute session lifetime for the

    frontend/portal session, no idle timeout, and no stated behavior on

    credential change (does changing the password or MFA enrollment revoke all

    existing refresh tokens / sessions, or do they survive?). The

    `auth_permissions.md` and `auth_index.md` docs cover the token model but not

    a session policy.


    Per the Ephemeral common pattern "Session lifetime unspecified — no maximum

    absolute lifetime, no idle timeout, no behavior on credential change", the

    correct disposition is blocked rather than asserting a gap: the artifacts

    are silent, and the WS revoke callback shows some session-termination

    machinery exists. The session-lifetime policy is material because the

    never-expiring refresh token (ephem-0a000001) means that, absent a

    revoke-on-password-change rule, a password reset after a suspected

    compromise may not actually log the attacker out.


    Severity is provisionally medium pending the evidence. No rubric clause is

    cited because this is blocked; the governing pattern once resolved would be

    the api-security session-management clause.

    '
  evidence:
  - artifact: auth/auth_api.md
    locator: §'Authorization code', lines 86-95
    excerpt: '"expires_in": 1800'
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.websocket_api.auth.AuthPhase.async_handle:L85-L123@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: async_register_revoke_token_callback
  prerequisite_evidence:
  - 'Frontend/portal session-management policy: maximum absolute lifetime and idle timeout'
  - Behavior on password change and on MFA-enrollment change (revoke all refresh tokens/sessions vs. preserve)
  - Explicit logout semantics (does logout revoke the backing refresh token server-side)
  control_mappings:
    nist_800_53r5:
    - AC-12
    - AC-12(1)
    - IA-5
    - SC-10
    mitre_attack: []
  recommendation:
    posture: consider
    summary: Document and confirm the session-management policy, especially revoke-on-credential-change.
    detail: 'Confirm from frontend and core code the absolute session lifetime, idle

      timeout, and — most importantly given the never-expiring refresh token

      (ephem-0a000001) — whether a password or MFA-enrollment change revokes all

      existing refresh tokens server-side. If credential change does not cascade

      to refresh-token revocation, re-file as a confirmed gap: a post-compromise

      password reset that leaves the attacker''s refresh token alive is the

      load-bearing failure.

      '
    references: []
  related_concerns:
  - authenticity
  cross_references:
  - conf-a30cca33
