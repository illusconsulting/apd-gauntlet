  title: Add-on images are pinned to a mutable floating base tag (:trixie) rather than an immutable digest
  summary: The add-on build pins its base image to the floating :trixie tag while the Core image pins base layers and binaries by sha256 digest, so add-on rebuilds can silently pull a mutated base, undermining immutable-infrastructure guarantees.
  detail: 'The mosquitto add-on build references its base image by a mutable floating

    tag: `build_from: amd64: ghcr.io/home-assistant/amd64-base-debian:trixie`

    (`infra/addon-mosquitto-build.yaml`), and the add-on manifest declares

    `startup: system` host mounts (`mosquitto/config.yaml`, cev-09000001). By

    contrast the Core image pins its base/buildkit and the go2rtc binary by

    immutable sha256 digest (`infra/core-Dockerfile` lines 1, 29:

    `docker/dockerfile@sha256:…`, `go2rtc:1.9.14@sha256:…`), demonstrating the

    project knows the digest-pinning pattern. The add-on path does not follow

    it, so a rebuild of the add-on against `:trixie` resolves to whatever the

    tag points at that day.


    Ephemeral''s immutable-infrastructure lens asks whether infrastructure is

    deploy-replace against a fixed, reproducible artifact. A floating base tag

    means the add-on''s deployed bytes are not reproducible across rebuilds: the

    same add-on version can carry different base-layer contents over time, which

    is the mutable-infrastructure / configuration-drift failure mode the lens

    flags. The signature/provenance of the image (Cosign signing per

    `mobile/supervisor-apps-security.md`) and whether signatures are verified at

    install are Authenticity concerns; the Ephemeral concern is strictly the

    mutable-tag → non-reproducible-rebuild facet.


    This is medium severity under the *api-security* rubric Ephemeral pattern

    "Container images mutable in production — `:latest` tags … carrying

    production state" (severity medium to high depending on what''s mutable):

    here the mutable tag is a base image rather than the application layer and

    the Core image is digest-pinned, so the blast radius is bounded — hence

    medium.

    '
  evidence:
  - artifact: infra/addon-mosquitto-build.yaml
    locator: lines 2-4, build_from amd64
    excerpt: 'amd64: ghcr.io/home-assistant/amd64-base-debian:trixie'
  - artifact: infra/core-Dockerfile
    locator: line 29, go2rtc COPY --from
    excerpt: go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
  control_mappings:
    nist_800_53r5:
    - CM-2
    - CM-2(2)
    - CM-3
    - SA-15(7)
    mitre_attack: []
    cwe:
    - CWE-1357
  recommendation:
    posture: recommended
    summary: Pin add-on base images by sha256 digest as the Core image already does.
    detail: 'Pin the add-on `build_from` base images in

      `infra/addon-mosquitto-build.yaml` (and the broader add-on collection)

      by immutable `@sha256:` digest rather than the floating `:trixie` tag,

      mirroring the digest pinning already used in `infra/core-Dockerfile`

      (line 29) for go2rtc and the dockerfile frontend. Advance the pinned

      digest through a deliberate, reviewable base-image update so an add-on

      rebuild is reproducible and a base-layer change is an explicit version

      bump rather than an implicit pull. Pair with Authenticity''s image-signing

      verification so the pinned digest is also provenance-checked.

      '
    references:
    - 'external: NIST SP 800-53r5 CM-2(2) — baseline configuration, automation support'
  related_concerns:
  - authenticity
  - immutability
  cross_references: []
