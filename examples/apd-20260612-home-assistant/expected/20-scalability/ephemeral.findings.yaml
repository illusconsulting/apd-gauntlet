  title: Owner account holds a standing unconditional all-access grant with no just-in-time elevation for admin operations
  summary: The owner principal is hard-coded to unconditional all-access for the life of the account, with no just-in-time elevation, time-boxed admin grant, or step-up for consequential operations, so the standing grant is always-on.
  detail: 'The owner created during onboarding "will always have access to all

    permissions" (`auth_index.md` §"Owner"), and in code `_OwnerPermissions`

    returns `access_all_entities → True` and an unconditional

    `lambda entity_id, key: True` (cev-a1000008). Admin-gated consequential

    operations — state writes (`APIEntityStateView.post`, admin-or-deny,

    cev-a1000012), server-side template render (`APITemplateView.post`,

    `@require_admin`, cev-a1000013), and the per-role Supervisor surface — are

    reachable on the strength of the standing admin/owner session with no

    just-in-time request/approve/time-box and no step-up re-authentication for

    the sensitive action.


    Ephemeral owns the access-lifetime facet here: the question is not whether

    the owner''s identity is verified (Authenticity) but whether the

    high-privilege grant is short-lived and requested-as-needed versus

    standing-and-always-on. HA implements the latter — there is no JIT access

    pattern, no time-boxed elevation, and no break-glass-style bounded grant for

    admin operations on a system that controls physical locks/alarms and holds

    home-occupancy data. A compromised_admin_session therefore holds the full

    privilege continuously rather than only during an approved, expiring window.


    This is medium severity under the *api-security* rubric clause "Hardening

    weakness exploitable only after adjacent compromise" — the standing grant

    is consequential only once an owner/admin session or token is already

    compromised (the dominant blast-radius fact noted across tier 1), so its

    independent severity is medium, weighed up by the PHI-equivalent

    consequential-action surface and weighed down because JIT elevation is a

    defense-in-depth control HA does not currently model rather than a missing

    mandatory control. The account-takeover blast radius itself is owned by

    Authenticity/Confidentiality.

    '
  evidence:
  - artifact: auth/auth_index.md
    locator: §'Owner', lines 28-29
    excerpt: The owner … will always have access to all permissions
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.permissions._OwnerPermissions:L84-L96@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'def access_all_entities(self, key): return True'
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.api.APITemplateView.post:L479-L505@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: '@require_admin async def post'
  control_mappings:
    nist_800_53r5:
    - AC-2
    - AC-2(2)
    - AC-6
    - AC-6(5)
    mitre_attack: []
    cwe:
    - CWE-269
  recommendation:
    posture: consider
    summary: Add an optional just-in-time elevation and step-up for owner/admin consequential operations.
    detail: 'Consider an optional just-in-time elevation model for the most

      consequential admin operations (template render cev-a1000013, add-on

      install / Supervisor proxy, backup creation): require a step-up

      re-authentication that opens a short, time-boxed elevated window rather

      than relying on the standing owner/admin session that `_OwnerPermissions`

      (cev-a1000008) grants for the account''s whole life. This bounds the

      window in which a compromised_admin_session can exercise the standing

      grant. Frame as defense-in-depth — it does not replace the existing admin

      gate, it time-bounds it.

      '
    references:
    - 'external: NIST SP 800-53r5 AC-6(5) — privileged accounts, limited use'
