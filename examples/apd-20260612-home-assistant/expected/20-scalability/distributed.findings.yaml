  title: Load distribution is single-instance; mobile/frontend clients and the cloudhook relay all route to one backend with no load balancer or multi-instance fan-out
  summary: The iOS and Android apps, the frontend SPA, and any internet exposure (reverse proxy or single Nabu Casa cloudhook) are all distributed clients of exactly one Core backend with no load balancer, no instance pool, and no client-side failover target.
  detail: 'The system has a genuinely distributed client population — two native mobile

    apps, the Lit/TS frontend SPA (served by Core and embedded in the apps''

    WebViews), and the js-websocket client — but they all converge on a single

    Core backend. The cross-repo edge cev-0a000005 records the mobile-to-Core hop

    as targeting "the user-entered self-hosted instance URL (no fixed host)"; the

    frontend''s availability "is bounded to Core''s single-host availability (no

    separate SPA SLO)" (tm-... frontend entry, inferred_apd_goals availability,

    prerequisite note line 1165). Internet exposure is via a reverse proxy or the

    single Nabu Casa cloudhook/remote-UI URL (asset-6e4c8d13), and the

    registration response hands the device one webhook_id / cloudhook_url

    (cev-a1000014) pointing at the one instance.


    The Distributed concern is load distribution and request routing: there is no

    load balancer, no instance pool, no health-check-driven routing across

    instances, and no second backend a client could fail over to. Every client

    request — bearer-token REST/WS and the bearer-less webhook/cloudhook path —

    resolves to the single Core. This is the client-side mirror of the

    single-host SPOF (dist-0a1b2c3d): the distribution exists only on the client

    side, not the server side.


    Severity is low under the *api-security* rubric: this is a

    topology/defense-in-depth observation on a single-instance design, not an

    exploitable control gap, and for a self-hosted owner-operated product the

    single backend is the intended model. Confidence is medium because a

    reverse-proxy or Nabu Casa relay could add some routing out of band, but the

    artifacts describe only a single-instance target with no multi-instance

    routing. The relay''s own availability dependency is routed to Availability

    (avail-a2cfd41c).

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:iOS WebView (remote frontend) -> Core REST+WS API (user instance URL):L37-L76@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: Target is the user-entered self-hosted instance URL (no fixed host)
  - artifact: api/native-app/setup.md
    locator: registration response, lines 74-79
    excerpt: returns webhook_id, secret, cloudhook_url
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-7
    - SC-5
    - SC-36
  recommendation:
    posture: consider
    summary: State that clients target a single backend with no load balancer or failover target so operators understand the reachability model.
    detail: 'Document that all clients (mobile, frontend, webhook/cloudhook callers)

      resolve to a single Core instance (cev-0a000005, cev-a1000014) with no

      server-side load distribution or failover target. If an operator fronts

      Core with a reverse proxy or the Nabu Casa relay, note what that layer does

      and does not provide (TLS termination and remote reachability, but not a

      second backend). This frames client reconnection expectations and is the

      client-side complement to the single-host SPOF finding; pair the

      relay-outage behavior with Availability and Resilient.

      '
    references:
    - 'internal: 00-context/asset-inventory.yaml (asset-6e4c8d13 Nabu Casa relay; asset-9c2e6a47 reverse-proxy edge)'
  related_concerns:
