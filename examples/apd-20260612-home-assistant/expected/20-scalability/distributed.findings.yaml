  title: No replication topology for the Recorder DB or .storage; the single live copy of all state and secrets has no replica
  summary: The Recorder history DB and the .storage estate (auth, tokens, integration secrets) exist as a single live copy on the one host with no primary/replica, quorum, or cross-node replication; the Supervisor backup archive is the only redundant copy and is a recovery artifact, not a live replica.
  detail: 'Home Assistant persists two state estates: the Recorder history DB

    (SQLite/MariaDB/PostgreSQL per ADR-0018, default SQLite) and the .storage

    config directory holding auth records, refresh tokens, jwt_keys, and

    integration OAuth secrets, all written as plaintext JSON (cev-a1000017). The

    artifacts specify no replication topology for either: there is no

    primary/replica configuration, no multi-primary or quorum scheme, and no

    cross-node or cross-AZ replication. ADR-0018 constrains the supported DB

    engines but says nothing about replicating the recorder; the recommended

    default is the built-in SQLite, which is an in-host file with no replication

    primitive at all. The only redundant copy of this state is the Supervisor

    backup archive (cev-b2000006), which is a point-in-time recovery artifact —

    asynchronous, manually or schedule-triggered, and not a live replica that

    can take over on host loss.


    The Distributed concern is data locality and replication topology: a single

    live copy of the entire state-and-secret estate, bound to one host, with no

    replica. Combined with the single-host SPOF (dist-0a1b2c3d), this means a

    storage-substrate loss (disk failure, the ScheduleWipeDevice path

    cev-c3000002, or host loss) loses the only live copy with no replicated

    fallback. The recovery-objective and restore-verification facet of the backup

    is routed to Availability (avail-5af6fee5); the at-rest-encryption facet to

    Confidentiality; the immutability/retention facet to Immutability. Here the

    concern is strictly the absence of a replication topology for the live state.


    Severity is medium under the *api-security* rubric distributed

    common-patterns (the "single AZ / single failure domain for state" family,

    calibrated below the auth-service-outage high because a recovery path —

    backup — does exist even though no live replica does). It is not high because

    the data is recoverable from backup; it is not low because the loss window

    between backups is the full RPO and there is no replicated copy to bound it.

    '
  evidence:
  - artifact: architecture/adr/0018-supported-databases.md
    locator: '#decision, lines 36-54'
    excerpt: The recommendation is to use the built-in SQLite database when possible.
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.storage.Store._write_prepared_data:L602-L618@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: ALL .storage ... written as PLAINTEXT UTF-8 JSON
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-36
    - SC-36(1)
    - CP-9
    - CP-7
    cwe:
    - CWE-1188
  recommendation:
    posture: recommended
    summary: Document that recorder/.storage state has no live replica and name the replication option for higher-durability deployments.
    detail: 'State in the hardening baseline that the default topology keeps a single

      live copy of the Recorder DB and the .storage estate (cev-a1000017) with no

      replication, and that the Supervisor backup (cev-b2000006) is the only

      redundancy — a point-in-time recovery artifact, not a live replica. For

      deployments needing higher durability, name the available option (point the

      recorder at an external MariaDB/PostgreSQL per ADR-0018 with engine-level

      replication, so at least the history estate has a replicated copy) and note

      that .storage/auth and integration secrets still travel only with the

      backup. Coordinate the RTO/RPO half with Availability and the

      backup-encryption half with Confidentiality.

      '
    references:
    - 'internal: 00-context/asset-inventory.yaml (asset-a5e2c738 recorder DB; asset-1f6a8c40 backup archive)'
  related_concerns:
  - availability
  - confidentiality
  - immutability
  cross_references:
  - avail-5af6fee5
- schema_version: 1
  id: dist-b4e9697a
  agent: distributed
  apd_tier: scalability
