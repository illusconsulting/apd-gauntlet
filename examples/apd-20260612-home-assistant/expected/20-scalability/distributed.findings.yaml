  title: Core application tier is stateful in-process (WS subscriptions, revoke callbacks, integration state), so it cannot be made stateless or horizontally scaled
  summary: WebSocket subscriptions, the token-revocation callback registry, and integration runtime state live in Core's process memory rather than an externalized store, so there is no stateless application tier and no path to running multiple Core instances behind a load balancer.
  detail: 'A horizontally-scalable design externalizes per-connection and per-session

    state to a shared store so any instance can serve any request. Home Assistant

    Core does the opposite: state is held in the single process. The WebSocket

    auth phase registers a per-connection revoke callback in-process

    (cev-a1000010: "registers revoke callback to drop the socket on token

    revocation"), so the binding between a token''s revocation and the live socket

    only exists inside the one process that owns the socket. The 2000+

    integrations hold their runtime state in-process (tm-d98660ae), and the

    permission/authorization state is in-process (cev-a1000007/8). There is no

    externalized session store, no shared subscription registry, and no

    distributed coordination layer.


    The Distributed consequence is that the application tier is inherently

    stateful and instance-bound: a second Core instance could not transparently

    take over the first instance''s WebSocket subscriptions or in-flight

    integration state, and there is no externalized store to make Core stateless.

    This forecloses the standard horizontal-scale and rolling-restart patterns —

    any Core restart drops all WebSocket connections and in-memory subscription

    state, and there is no instance to fail over to (this compounds the

    single-host SPOF, dist-0a1b2c3d). The *behavior* on restart (reconnect,

    resubscribe, replay) is a Resilient concern; the topology fact owned here is

    the in-process, non-externalized state that prevents a stateless tier.


    Severity is medium under the *api-security* rubric distributed

    common-pattern "In-process state in the application tier preventing

    horizontal scale" (the lower end of the medium-to-high band, because for a

    single-host owner-operated product the inability to horizontally scale is a

    design choice rather than an unmet scaling requirement; it becomes material

    only at the rolling-restart / failover boundary, which the single-host

    topology already lacks).

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.websocket_api.auth.AuthPhase.async_handle:L85-L123@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: registers revoke callback to drop the socket on token revocation
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#what-home-assistant-is, lines 20-22'
    excerpt: integrations are not sandboxed from each other and run with Core's full privilege
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-36
    - SC-7(21)
    - CP-7
    cwe:
    - CWE-1189
  recommendation:
    posture: consider
    summary: Document the stateful-in-process boundary so operators do not assume Core can be horizontally scaled or rolling-restarted without connection loss.
    detail: 'Record in the architecture/hardening notes that Core holds WebSocket

      subscription state and the token-revocation binding (cev-a1000010) in

      process memory, so Core is a stateful, single-instance tier: there is no

      externalized session store and no supported multi-instance/load-balanced

      mode. This sets correct operator expectations (a restart drops all live

      WS connections and there is no peer to absorb them) and frames any future

      scale-out work as requiring externalized subscription/session state, not

      just a second process. Pair the reconnect-behavior half with the Resilient

      lens.

      '
    references:
    - 'internal: 00-context/context-brief.md §8 (Availability/Distributed/Resilient are topology-bounded to one node)'
  related_concerns:
  - resilient
  - availability
  cross_references:
  - dist-66e3e208
- schema_version: 1
  id: dist-d08ed969
  agent: distributed
  apd_tier: scalability
  apd_goal: distributed
  disposition: gap
  severity: medium
  confidence: high
  title: Control plane (Supervisor/os-agent) and data plane (Core) share one host and one failure domain
  summary: The Supervisor control plane that manages Core's lifecycle, and the os-agent host bridge, are co-resident host-root processes on the same host as the Core data plane, so a control-plane fault or host incident takes the data plane with it and there is no out-of-band management domain.
  detail: 'A resilient distributed design separates the control plane (which manages,

    schedules, restarts, and recovers workloads) from the data plane (which

    serves traffic) so that one can survive and act on the other''s failure. Home

    Assistant co-locates them: the Supervisor manages the Core container,

    backups, and add-on lifecycle (overview line 34) and binds the Docker socket

    (cev-b2000003), and os-agent exposes host operations over D-Bus

    (cev-c3000001/2) — all on the same host as the Core data plane. There is no

    separate management host or out-of-band control domain. The cross-repo edges

    confirm the tight coupling: Supervisor mints and holds a Core access token

    and calls Core as a privileged client (cev-0a000002), and Supervisor drives

    the host Docker daemon and os-agent over local sockets/D-Bus

    (cev-0a000003/cev-0a000004).


    The Distributed consequence is a shared failure domain across the

    control/data-plane boundary: a host incident, a host-root compromise, or the

    ScheduleWipeDevice path (cev-c3000002) takes down both the workload and the

    plane that would otherwise recover it; conversely the control plane has no

    surviving peer to fail over to. The management plane cannot act on the data

    plane''s failure from outside the failed domain because it is inside it. The

    privilege-escalation and host-root-blast-radius facets of this co-location

    are owned by the tier-1 Integrity/Authenticity findings (tm-83f43c8e,

    tm-cbe50d76); the topology fact owned here is the absence of any

    control-plane/data-plane failure-domain separation.


    Severity is medium under the *api-security* rubric distributed

    common-patterns (single-failure-domain family). It is medium rather than

    high because, for the supported single-host topologies (overview lines

    108-116), control/data-plane co-location is the intended appliance model and

    the dominant security harm (host-root blast radius) is carried by the

    tier-1 trustworthiness findings; the Distributed concern is the topology

    constraint that no out-of-band recovery domain exists.

    '
  evidence:
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#trust-boundaries, lines 88-89'
    excerpt: Supervisor controls the Docker socket ... the container-to-host-root boundary
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.docker.manager.DockerAPI.__init__:L271-L279@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: Supervisor binds the Docker socket (/run/docker.sock)
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-7
    - SC-7(21)
    - SC-36
    - CP-7
    cwe:
    - CWE-1189
  recommendation:
    posture: consider
    summary: Document the control-plane/data-plane co-location and name the out-of-band recovery the appliance topology lacks.
    detail: 'Note in the hardening baseline that the Supervisor control plane and the

      Core data plane share one host and one failure domain, so the management

      plane cannot recover Core from outside a failed/compromised host

      (cev-b2000003, cev-0a000002). For operators who need management-plane

      survivability, name the out-of-band recovery pattern they must supply (a

      separate host that can restore the Supervisor backup, or external

      monitoring that triggers a rebuild), rather than relying on the in-host

      Supervisor watchdog alone. Coordinate the host-root-blast-radius half with

      the tier-1 Integrity/Authenticity findings and the watchdog-behavior half

      with Resilient.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml (tm-83f43c8e, tm-cbe50d76 host-root scope)'
  related_concerns:
  - resilient
  - availability
  - integrity
  cross_references:
  - dist-66e3e208
- schema_version: 1
  id: dist-658bd883
  agent: distributed
