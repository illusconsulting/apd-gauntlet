  title: Single-host single-process Core is a platform-wide single point of failure with no replication or multi-node topology
  summary: HA Core, the auth subsystem, the Recorder DB, Supervisor, and os-agent all run in one process or one host with no clustering, no replication, and no second failure domain, so host loss takes the entire automation platform offline.
  detail: 'Home Assistant is, by design, a single Python asyncio Core process on a

    single host. The system overview states verbatim that "A single trusted

    Python Core process exposes a local-first REST + WebSocket API, runs 2,000+

    in-process integrations ... and persists automation state and history," and

    that "Core is a single, highly-privileged trust domain." The threat model

    records this as a single point of failure (tm-296e2800): "Core is a single

    asyncio process on a single host by design (no clustering claim) ...

    exhausting the event loop, the recorder DB, or the host crashes the whole

    automation platform including locks/alarms." All of the load-bearing

    components co-reside in this one failure domain: the auth subsystem is

    in-process with Core (tm-6fab88e3), the Recorder history DB shares the same

    host (tm-60f1d9cf), and the Supervisor + add-on/plugin containers + os-agent

    sit on the same host.


    This is the topology root cause behind several Availability findings. There

    is no second node, no multi-AZ placement, no multi-region posture, no

    primary/replica or quorum replication of state, and no horizontal scaling.

    The only "copy" of the system is the Supervisor backup archive (a recovery

    artifact, not a live replica), and a host loss or the os-agent

    ScheduleWipeDevice path (cev-c3000002) destroys the single live instance with

    no automatic failover. The deployment-topology section (overview lines

    108-116) enumerates four install methods (OS, Supervised, Container, Core)

    but all four are single-instance; none introduces a clustered or replicated

    mode.


    This finding is strictly the TOPOLOGY fact (one failure domain, no

    replication). The uptime/SLO consequence is routed to Availability

    (avail-754cfc01) and the failure-on-component-loss behavior (degrade,

    restart, recovery) to Resilient. Severity is high under the *api-security*

    rubric distributed common-pattern "Single-AZ deployment of the authentication

    service, session store, or payment service" calibrated to high: here the

    single host is the failure domain for the entire platform including the

    in-process authentication service, so a host incident produces total

    authentication and automation outage. It does not rise to critical in this

    lens because the harm is availability/topology, not a confidentiality or

    authentication-bypass impact; HA is also an owner-operated self-hosted

    product with no contractual multi-node commitment in the artifacts.

    '
  evidence:
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#what-home-assistant-is, lines 12-22'
    excerpt: A single trusted Python Core process ... Core is a single, highly-privileged trust domain
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.recorder.session_scope:L71-L72@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: Recorder DB session for entity-state history
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-36
    - SC-36(1)
    - CP-7
    - CP-7(1)
    - SC-7(21)
    cwe:
    - CWE-1188
  recommendation:
    posture: recommended
    summary: Document the single-host SPOF as an explicit architectural constraint and define the failure domain in the hardening baseline.
    detail: 'State explicitly in the hardening guidance (org/SECURITY.md is currently a

      6-line pointer) that the supported topologies (overview lines 108-116) are

      all single-instance: there is no Core clustering, no state replication, and

      no automated failover, so the host is the platform''s single failure domain.

      Where higher availability of the consequential alarm/lock path is required,

      name the compensating pattern operators must supply out of band (a

      warm-standby host restored from a recent Supervisor backup with a defined

      RTO/RPO, or LAN-local device-side automations that survive a Core outage),

      rather than implying a resilience the single-host topology does not provide.

      Coordinate the SLO half with the Availability lens and the failover-behavior

      half with the Resilient lens.

      '
    references:
    - 'internal: 00-context/context-brief.md §6 (No SLO/RTO/RPO; HA is single-Core single-host by design)'
  related_concerns:
  - availability
  - resilient
  cross_references:
  - avail-754cfc01
  - avail-5af6fee5
- schema_version: 1
  id: dist-b98dc00a
  agent: distributed
  apd_tier: scalability
  apd_goal: distributed
  disposition: gap
  severity: high
  confidence: high
  title: 2000+ integrations share Core's single process and event loop with no failure-domain isolation, preventing fault containment or horizontal scale
  summary: Every integration runs in-process at Core's full privilege on the one asyncio event loop with no isolation boundary, so the integration tier cannot be scaled out, partitioned, or fault-contained — one integration's failure is the whole platform's failure domain.
  detail: 'The integration tier is the largest moving part of Core, and it is entirely

    co-located inside the single Core process. The overview states "integrations

    are not sandboxed from each other and run with Core''s full privilege," and

    the threat model records that integrations "share Core''s single event loop

    with no per-integration resource quota" (tm-35a0b188) and that there is "no

    in-process integrity boundary protecting Core''s state machine from a single

    misbehaving integration" (tm-d98660ae). From the Distributed lens this is an

    in-process-state / no-failure-domain-boundary topology problem: because the

    2000+ integrations and Core''s own state machine occupy one process and one

    event loop, the integration tier has no failure domain of its own. It cannot

    be partitioned across processes or hosts, cannot be horizontally scaled

    independently of Core, and a fault in any one integration is not contained —

    it shares the single failure domain with the auth subsystem, the API

    surface, and the recorder write path (cev-a1000018).


    This is distinct from the Availability finding on the missing per-integration

    resource quota (avail-235dacf0, which owns the capacity-ceiling facet) and

    from the Integrity findings on the absent inter-integration trust boundary

    (tm-e185c6a7). The topology fact owned here is that the design provides no

    process/host boundary along which the integration tier could be isolated into

    its own failure domain — the standard distributed remedy (run untrusted or

    high-fan-out workers in a separate, independently-restartable process or

    container) is structurally absent.


    Severity is high under the *api-security* rubric distributed common-pattern

    "In-process state in the application tier preventing horizontal scale"

    (calibrated medium-to-high "depending on what''s in-process"); here what is

    in-process is the entire 2000+-integration tier plus Core''s authorization

    state, so the upper bound of that band applies. The blast radius of the

    missing isolation is the whole single failure domain. The behavior a healthy

    design would add around an integration (timeout, bulkhead, circuit-break) is

    routed to Resilient; the capacity ceiling to Availability; here the concern

    is strictly the absence of a failure-domain boundary for the integration

    tier.

    '
  evidence:
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#what-home-assistant-is, lines 20-22'
    excerpt: integrations are not sandboxed from each other and run with Core's full privilege
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.recorder.session_scope:L71-L72@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: Recorder DB session for entity-state history
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-36
    - SC-7(21)
    - SC-7(5)
    - SC-6
    cwe:
    - CWE-1189
  recommendation:
    posture: recommended
    summary: Provide a failure-domain boundary for the integration tier (out-of-process or per-integration worker isolation) so one integration is not the whole platform's failure domain.
    detail: 'Introduce a topology boundary that lets high-fan-out, untrusted, or

      blocking integrations run in a separate, independently-restartable failure

      domain (a worker process or sidecar container) rather than on Core''s single

      event loop alongside the auth subsystem and recorder write path

      (cev-a1000018). This is the topology complement to the Availability lens''s

      per-integration resource quota and the Resilient lens''s timeout/bulkhead

      work — isolate the tier into its own failure domain so a fault in one

      integration can be contained and restarted without taking Core down. Do not

      duplicate the quota or bulkhead recommendations; this one is specifically

      about creating the process/host boundary they would then be applied across.

      '
    references:
    - 'internal: 00-context/context-brief.md §8 (integrations run unsandboxed in one process)'
  related_concerns:
  - availability
  - resilient
  - integrity
  cross_references:
  - avail-235dacf0
