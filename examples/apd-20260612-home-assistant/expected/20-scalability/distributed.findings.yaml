  disposition: blocked
  severity: low
  confidence: low
  title: DNS resolution topology (plugin-dns CoreDNS) as a potential single dependency for the HA network is undocumented
  summary: The HAOS topology routes the HA network's DNS through a single CoreDNS plugin container, but the artifacts do not document its redundancy, fallback resolver, or failure behavior, so whether DNS is a hidden single dependency cannot be assessed.
  detail: 'The run config and overview name a plugin-dns CoreDNS plugin container that

    provides "DNS for the HA network" (overview line 38, run-config line 31),

    making it a plausible hidden single dependency: integrations, add-ons, and

    Core''s outbound calls to devices/clouds (the SSRF/outbound surface,

    tb-6a2d8c14) likely resolve names through this one plugin. A single DNS plane

    is a classic hidden SPOF — if it is the only resolver and it fails, name

    resolution for every integration and update path fails even though the rest

    of the host is healthy.


    However, none of the supplied artifacts document the CoreDNS plugin''s

    topology: whether it forwards to redundant upstream resolvers, whether Core

    or add-ons have a fallback resolver if the plugin is down, or how a DNS-plane

    failure propagates. The plugin-dns repo is dependency-role and was not

    deep-read into the input set, and the code-evidence index contains no

    plugin-dns entry. Per the block-on-ambiguity discipline I do not infer the

    DNS plane is a single point of failure from its mere presence — its

    redundancy posture is unknown. This is recorded as blocked with the

    prerequisite evidence named.


