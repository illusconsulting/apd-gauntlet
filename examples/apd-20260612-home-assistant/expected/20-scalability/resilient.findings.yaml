  title: No timeout or circuit breaker on Core integration outbound calls to external devices/clouds
  summary: Outbound calls from 2000+ in-process integrations to external devices/clouds run on Core's shared event loop with no documented per-call timeout or circuit breaker, so a slow or hostile endpoint blocks the loop and cascades to a platform-wide stall.
  detail: 'The Core integration -> external device/cloud boundary (trust-boundary

    item 6) is a cross-service boundary that every one of the 2000+ in-process

    integrations crosses outbound. The threat model records for that boundary,

    verbatim, "None documented: outbound integration calls share Core''s event

    loop with no stated timeout/circuit-breaker" (tm-17b14550), and that "A

    slow/hostile external endpoint blocks the integration on Core''s shared

    event loop." Integrations are not isolated and run at Core''s full privilege

    (00-SYSTEM-OVERVIEW.md lines 20-22), so the failure mode is concrete: a

    single device or cloud endpoint that responds slowly (or never) holds an

    await on the one asyncio loop that serves the REST API, the WS handshake,

    and every automation including the alarm/lock path.


    This is the Resilient lens precisely: the design choice is an unbounded

    outbound call at a cross-service boundary; the failure mode it does not

    address is "dependency degraded but responding" / "dependency unavailable";

    the user-visible consequence is a hung automation platform rather than a

    single failed integration. Timeout discipline (a timeout at every network

    boundary) and a per-dependency circuit breaker (open on repeated

    slow/failed calls, half-open recovery, fail-fast-or-degrade while open) are

    the two missing controls. The artifacts and code-evidence index name no

    timeout, no breaker, no per-integration budget on this path.


    Severity is high under the *api-security* rubric, Resilient common-pattern

    "No circuit breaker on outbound calls to third-party APIs ... vendor

    degradation cascades to user-facing latency and request-handler

    exhaustion; OWASP API10 amplification." Here the request handler is the

    single shared event loop, so the cascade is total rather than bounded to

    one thread pool. Confidence is medium: the absence of a breaker/timeout is

    asserted by the threat model and is consistent with the documented

    single-loop in-process model, but per-integration client libraries may set

    ad-hoc timeouts the code-evidence index does not capture (hence not

    critical, and not a clean code citation for the timeout''s absence).

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.recorder.session_scope:L71-L72@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: Recorder DB session for entity-state history
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.api.APITemplateView.post:L479-L505@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: tpl = _cached_template(data["template"], ...); tpl.async_render(...)
  prerequisite_evidence:
  - Per-integration outbound timeout, circuit-breaker thresholds (open/half-open), and per-dependency retry budget on the Core integration -> external device/cloud path
  control_mappings:
    nist_800_53r5:
    - SI-13
    - SC-5
    - CP-13
    cwe:
    - CWE-400
    owasp_api_top10:
    - API10:2023
  recommendation:
    posture: required
    summary: Add a bounded outbound timeout and a per-dependency circuit breaker around integration calls so a slow/hostile endpoint cannot block the shared event loop.
    detail: 'Wrap the outbound integration -> external device/cloud calls (trust

      boundary item 6) with an enforced per-call timeout and a per-dependency

      circuit breaker rather than leaving them as unbounded awaits on the

      shared loop. The breaker should open after a documented count of

      slow/failed calls to one endpoint, expose a half-open probe for

      recovery, and while open either fail-fast or return a last-known-good

      cached state so the integration degrades instead of hanging the loop.

      Because Core is a single asyncio process, the timeout is the load-bearing

      control: pick a ceiling well below any upstream caller''s budget so a

      stuck integration call cannot starve the alarm/lock automations sharing

      the loop. Cross-reference the Availability lens''s per-integration

      resource-quota finding (avail-235dacf0) — the quota bounds aggregate

      consumption; this finding bounds per-call latency and adds the breaker.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-17b14550 (outbound call shares event loop, no timeout/circuit-breaker)'
  related_concerns:
  - availability
  - distributed
  cross_references:
  - avail-235dacf0
  - avail-4be2dd70
- schema_version: 1
  id: resil-cb12ebae
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  disposition: gap
  severity: high
  confidence: medium
  title: No bulkhead or per-integration execution timeout isolating one integration from the shared Core event loop
  summary: 2000+ integrations and the recorder write path share one asyncio loop with no bulkhead, per-integration execution-time budget, or watchdog, so one blocking integration starves the consequential alarm/lock and recorder paths.
  detail: 'Resource isolation is absent on the in-process integration model. The

    threat model records "a misbehaving integration blocks Core''s single event

    loop or exhausts the recorder DB ... integrations share Core''s single event

    loop with no per-integration resource quota" (tm-35a0b188), and the

    recorder session path (cev-a1000018) that backs the alarm/lock/presence

    history runs on that same loop. There is no bulkhead separating the

    consequential, latency-sensitive path (service calls that actuate locks and

    alarms) from non-critical paths (a reporting integration''s history query, a

    chatty cloud poll), and no per-integration execution-time budget or

    watchdog that would cap how long one integration''s coroutine may hold the

    loop.


    The Resilient concern is bulkheading and resource isolation: critical

    paths should not be starvable by non-critical ones, and a single dependency

    class should not be able to exhaust the shared scheduling resource. The

    *isolation topology* — moving integrations out of the single process into

    separate execution domains (sandboxing) — is a Distributed concern and is

    routed there; the *behavioral* control of a per-integration execution

    budget / cooperative-yield watchdog and a separate scheduling lane for the

    consequential path is the Resilient half. The *capacity ceiling* (a quota

    on aggregate resource use) is Availability''s avail-235dacf0; this finding is

    the missing failure-domain partition, not the quota.


    Severity is high under the *api-security* rubric Resilient common-pattern

    "No bulkhead between consumer-facing API paths and administrative or batch

    paths ... an admin bulk-export or analytics query can starve the

    customer-facing thread pool." Here the starved path is alarm/lock

    automation and the starving path is any of 2000+ unisolated integrations on

    a single loop, which is strictly worse than a thread-pool bulkhead gap.

    Confidence is medium: the absence of isolation is documented, but whether

    integrations are dispatched to executor threads for blocking work (a

    partial bulkhead) is not fully resolved in the code-evidence index.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.recorder.session_scope:L71-L72@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: Recorder DB session for entity-state history
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: lines 20-22 (trust posture)
    excerpt: integrations are not sandboxed from each other and run with Core's full privilege
  prerequisite_evidence:
  - Whether integration blocking work is dispatched to a bounded executor pool (partial bulkhead) and any per-integration execution-time watchdog on the event loop
  control_mappings:
    nist_800_53r5:
    - SC-6
    - SI-13
    - SC-5
    cwe:
    - CWE-400
  recommendation:
    posture: required
    summary: Add a per-integration execution-time budget/watchdog and a separate scheduling lane for the consequential alarm/lock path so one integration cannot starve the shared loop.
    detail: 'Introduce a per-integration execution-time budget enforced on the shared

      event loop (a cooperative watchdog that flags or sheds an integration

      coroutine that holds the loop beyond a documented threshold), and reserve

      a separate scheduling lane / executor for the consequential service-call

      path (the actions that actuate locks and alarms) so a reporting or cloud

      integration cannot starve it. This is the behavioral bulkhead; pair it

      with the Distributed lens''s integration-isolation (out-of-process

      sandbox) recommendation, which is the structural form of the same

      partition, and the Availability lens''s aggregate resource quota

      (avail-235dacf0). Do not duplicate those; this finding''s specific ask is

      the failure-domain partition between critical and non-critical work on

      the loop.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-35a0b188 (no per-integration resource quota on shared loop)'
  related_concerns:
  - distributed
  - availability
  cross_references:
  - avail-235dacf0
- schema_version: 1
