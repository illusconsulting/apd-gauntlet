  confidence: high
  title: mobile_app webhook dispatches blocking service calls with no backpressure or bounded queue
  summary: handle_webhook accepts webhook_id-keyed requests that synchronously dispatch blocking=True service calls onto the single event loop with no backpressure signal or bounded in-flight queue, so a burst converts to unbounded loop-blocking work.
  detail: 'The mobile_app webhook entrypoint handle_webhook (cev-a1000016) maps a

    webhook_id to a config entry and webhook_call_service (cev-a1000015) then

    calls services with blocking=True on Core''s single event loop. The code

    recon notes "No bearer, no rate-limit observed here." Beyond the missing

    rate limit (which Availability owns, avail-a292763c), the Resilient gap is

    the absence of any backpressure mechanism: the webhook does not signal a

    producer to slow down, does not bound the number of in-flight blocking

    service calls it will accept, and does not shed or queue-with-a-ceiling

    when the loop is saturated. A burst of webhook posts — from a registered

    device on a flaky network retrying, or the internet-reachable cloudhook URL

    — converts directly into unbounded blocking work on the one loop, with no

    graceful "busy, retry later" degradation.


    This is the Resilient backpressure facet, distinct from the Availability

    rate-limit: a rate limit caps request admission by policy; backpressure is

    the runtime behavior when the consumer cannot keep up (bounded queue, load

    shed, Retry-After). The webhook has neither. The authentication-by-

    possession and authorization facets are owned by Authenticity/Integrity and

    are routed there; the resource-consumption admission cap is owned by

    Availability; this finding is strictly the missing backpressure/bounded-

    queue behavior on a blocking dispatch path.


    Severity is medium under the *api-security* rubric. It maps to the Resilient

    common-pattern family on retry/queue behavior and the medium "rate-limiting

    absent on an abused surface" band rather than the high single-handler-

    exhaustion band, because Availability already carries the high

    handler-exhaustion finding (avail-a292763c) for the same surface; emitting

    this at high would double-count. The distinct Resilient ask — a bounded

    queue and explicit shed behavior — is a medium hardening of the same path.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.webhook.handle_webhook:L172-L180@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: No bearer, no rate-limit observed here.
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.webhook.webhook_call_service:L269-L292@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: async_call(..., blocking=True, context=registration_context(...))
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-6
    - SI-13
    cwe:
    - CWE-770
  recommendation:
    posture: recommended
    summary: Bound the in-flight blocking work the webhook accepts and shed with Retry-After when the loop is saturated, rather than dispatching unbounded blocking=True calls.
    detail: 'At handle_webhook (cev-a1000016), bound the number of concurrent blocking

      service calls a single webhook_id (and the path overall) may have

      in-flight, and when that bound is reached, shed with an explicit "busy,

      retry later" response (429 + Retry-After) instead of enqueuing unbounded

      work onto the event loop via webhook_call_service (cev-a1000015). This is

      the backpressure complement to the Availability rate-limit finding

      (avail-a292763c): the rate limit caps admission, this caps in-flight work

      and makes the saturation behavior explicit and recoverable rather than a

      silent loop stall. Prefer dispatching the actual service call off the

      loop (executor) so the webhook handler returns promptly.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-1203ba47 (no rate-limit on the webhook entrypoint)'
  related_concerns:
  - availability
  cross_references:
  - avail-a292763c
