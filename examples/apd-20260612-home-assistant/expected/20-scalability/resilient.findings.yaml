  title: Mobile WebView-native bridge has no fail-safe degradation mode for a hostile or unavailable backend response
  summary: The iOS/Android Companion WebView renders the remote Core frontend and acts on its bridge messages with no origin/integrity check and no documented fail-safe, so a hostile or substituted backend response degrades the native app open rather than refusing the action.
  detail: 'The Companion apps render the REMOTE server frontend in a WebView and

    dispatch its messages into native capability with no origin/integrity

    check: on iOS, WebViewExternalMessageHandler.handleExternalMessage

    (cev-e5000001) switches on message type from the remotely-served frontend

    with no source verification; on Android the WebView external bus consumes

    the same remote content, over a TLS stack (TLSHelper, cev-f6000002) that

    trusts user-installed CAs with no pinning. The threat model confirms the

    bridge "dispatches remote-frontend messages with no origin verification —

    the design trusts the rendered remote frontend" (tm-... iOS bridge),

    reachable from the compromised_backend_or_response position.


    Resilient owns the graceful-degradation / fail-open-vs-fail-closed decision

    for this mobile control. The design choice is "trust whatever the backend

    sends and act on it"; the failure mode it does not address is "backend

    unavailable, degraded, or hostile (MitM-substituted) response"; the

    user-visible consequence is that a substituted or malformed response drives

    in-app native actions (the bridge dispatch) rather than the app entering a

    safe, reduced-functionality mode. There is no documented degraded mode

    (show last-known-good state with a freshness/"can''t reach server" banner,

    refuse bridge-driven consequential actions) and no fail-closed default when

    the response cannot be trusted. Per the mobile doctrine, client-side

    enforcement of a server-side control is not itself a control, so the

    finding of record is also the missing server-side invariant — but the

    Resilient-specific gap is the absent fail-safe degradation mode on the

    client when the channel is unavailable or compromised.


    Severity is high under the *mobile-applications* rubric, Resilient

    common-pattern "App degrades unsafely ... silently falls back to a weaker

    mode instead of refusing the sensitive operation," combined with the High

    rubric clause "A WebView JavaScript bridge exposes native capability or

    data to loaded web content without origin allowlisting." The device-trust

    assumption is low (stock device, on-path or compromised backend), the

    blast-radius modifier loads (the bridge reaches native capability/tokens),

    so it sits at high. MAS mapping per the pack pairs the bridge gap with

    MASVS-PLATFORM-2.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:Sources.App.Frontend.ExternalMessageBus.WebViewExternalMessageHandler.handleExternalMessage:L37-L76@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: switch externalBusMessage { case .configGet ... case .tagRead ... }
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: trustManagerFactory.init(androidCaStore) ... trusts USER-installed CAs
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SI-17
    - CP-12
    - SI-13
    cwe:
    - CWE-636
    - CWE-345
    masvs:
    - MASVS-PLATFORM-2
  recommendation:
    posture: required
    summary: Define a fail-closed degraded mode on the client for unavailable/untrusted backend responses, and origin-allowlist the bridge, rather than acting on any rendered message.
    detail: 'Give the Companion WebView bridge an explicit fail-safe degradation mode:

      when the backend is unreachable, show last-known-good entity state with a

      "cannot reach server" freshness banner rather than a blank or

      action-driving state; and when a bridge message cannot be origin-verified

      (handleExternalMessage, cev-e5000001), refuse to dispatch it rather than

      acting (fail-closed), surfacing a degraded-functionality indicator. Pair

      the origin allowlist on the bridge with the server-side invariant — the

      backend, not the client, must re-verify any consequential action the

      bridge would drive — because a control evaluated only on the

      attacker-controllable client (over a TLS stack that trusts user CAs,

      cev-f6000002) is bypassable. Route the bridge origin-verification and the

      token-on-the-bridge facets to Authenticity/Confidentiality; this finding''s

      ask is the missing fail-closed client degradation behavior.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-243e5056 (hostile remote frontend delivers tampered bridge messages the app acts on)'
  related_concerns:
  - authenticity
  - integrity
  - confidentiality
  cross_references: []
- schema_version: 1
  id: resil-895658c9
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  disposition: blocked
  severity: medium
  confidence: low
  title: Mobile client reconnect/retry backoff and push-woken sync de-synchronization against single Core unspecified
  summary: The Companion apps reconnect to and retry against a single Core instance, but the backoff/jitter curve, per-dependency retry budget, and push/cron-woken sync de-synchronization are not in the artifacts, so a fleet retry storm on Core recovery cannot be ruled out.
  detail: 'The Companion apps depend on a single Core instance and a single push relay

    (tm-0ea69aaa iOS, tm-4fccdc51 Android: "The app depends on the single Core

    instance and the push relay; denial of service applies to app function when

    those are down"). The mobile_app sensor/webhook send path and the WS

    reconnect path retry against that one backend. The artifacts do not specify

    the client''s reconnect/retry behavior: whether retries use exponential

    backoff with full jitter or a fixed interval, whether there is a

    per-dependency retry budget, and whether push- or cron-woken syncs are

    spread over a window or fire at one instant.


    The Resilient concern is the mobile-fleet retry-storm (thundering herd)

    failure mode: against a single Core process, a fixed-interval reconnect or

    a push that wakes the whole installed fleet at once synchronizes clients

    into a self-sustained load spike that can prevent the single instance from

    recovering after a blip. Because the code-evidence index contains no

    reconnect/backoff entry for the iOS or Android network client, and the docs

    do not specify it, I do not infer the behavior is bad from silence. Per the

    block-on-ambiguity discipline this is recorded as blocked with the

    prerequisite evidence named.


    Severity medium reflects the *mobile-applications* rubric Resilient

    common-pattern "No backoff/jitter on retries against the backend ... a

    synchronized mobile-fleet retry storm" (which the rubric pegs high when

    confirmed) dropped one band for the blocked/low-confidence disposition: the

    scale-vector modifier would load if confirmed, but the install-base size

    for a self-hosted single-instance product is far smaller than a hosted-app

    fleet, so the herd ceiling is correspondingly lower.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...database.server.ServerSessionInfo.ServerSessionInfo:L1-L1@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: persisted access + refresh bearer tokens (in_degree 21)
  prerequisite_evidence:
  - iOS/Android Companion network-client reconnect and retry policy (backoff curve, jitter strategy, per-dependency retry budget)
  - Whether push/cron-woken syncs are de-synchronized over a window vs firing at one instant against the single Core
  control_mappings:
    nist_800_53r5:
    - SI-13
    - SC-5
    - CP-10
    cwe:
    - CWE-770
  recommendation:
    posture: consider
    summary: Specify and verify exponential backoff with full jitter plus de-synchronized push-woken sync on the Companion clients against the single Core.
    detail: 'Document and verify the Companion reconnect/retry policy: exponential

      backoff with full jitter and a per-dependency retry budget on the WS

      reconnect and the sensor/webhook send path, and spread push- or

      cron-woken syncs over a window rather than firing them at one instant, so

      that a single-instance Core recovering from a blip is not hit by a

      synchronized fleet reconnect. This resolves the blocked assessment and,

      paired with the backend admission control the Availability lens

      recommends (avail-a292763c / avail-4be2dd70), keeps a fleet that

      misbehaves from preventing the single instance''s recovery.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-4fccdc51 (app depends on Core + FCM; DoS to app function when down)'
  related_concerns:
  - availability
  cross_references:
  - avail-4be2dd70
- schema_version: 1
  id: resil-a4c9535c
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  disposition: gap
  severity: low
  confidence: medium
  title: No queue-and-replay or fallback notification path when the single Firebase push relay is unavailable
  summary: Security-relevant push notifications route through a single Firebase Cloud Functions relay with no documented retry, queue-and-replay, or local fallback path when the relay is unreachable, so an alarm alert is silently dropped during a relay outage.
  detail: 'Every push notification (including alarm-triggered and lock/presence

    alerts) is forwarded by a single Firebase Cloud Functions relay

    (cev-08000001, cev-08000002 — "Public relay route forwarding notifications

    to APNS/FCM"). The relay applies a per-token rate limit, but the threat

    model and inventory record no behavior for the case where the relay (or its

    single configured region, us-central1) is unavailable: the design has no

    documented retry with backoff, no queue-and-replay of the notification when

    the relay recovers, and no local/persistent-notification fallback so the

    event still surfaces in the app on next reachable connection.


    The Resilient concern is graceful degradation of the notification path: a

    queue-and-replay or a degraded local-notification fallback would convert a

    relay outage into delayed-but-delivered, whereas the current (undocumented)

    behavior is a silently dropped alert. The relay''s *availability SLA / single

    region* is the dependency-reliability facet and is owned by Availability

    (avail-a2cfd41c); the *single-relay topology / lack of a redundant relay* is

    a Distributed concern; this finding is strictly the missing

    behavior-when-down (retry/queue/fallback).


    Severity is low under the *api-security* rubric: this is a defense-in-depth

    / graceful-degradation gap on a notification path, not the primary control

    plane — LAN-local device control and in-app state still function without

    the relay, and an alarm event remains recorded in Core; only the push

    delivery is at risk. Confidence is medium because the relay''s outage

    behavior is simply not in the artifacts.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:__route__POST__/api/sendPushNotification:L40-L43@142579dc41ee534f0d60bc390c4661dba051a995
    excerpt: Public relay route forwarding notifications to APNS/FCM
  - artifact: mobile/mobile-apps-fcm-push-README.md
    locator: lines 42-47
    excerpt: forwards notifications without exposing device push tokens to the instance
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - CP-12
    - CP-13
    - SI-17
    cwe:
    - CWE-636
  recommendation:
    posture: consider
    summary: Define a queue-and-replay or local-notification fallback so a relay outage delays rather than drops security-relevant alerts.
    detail: 'Define the notification-delivery behavior when the Firebase relay

      (cev-08000002) is unreachable: queue the notification on the instance

      side with bounded backoff retry and replay it when the relay recovers,

      and/or surface the event as a local/persistent in-app notification so an

      alarm or lock alert is still seen on the app''s next reachable connection

      rather than silently dropped. Coordinate the relay-SLA / single-region

      half with the Availability lens (avail-a2cfd41c) and the redundant-relay

      topology with the Distributed lens; this finding''s ask is only the

      degraded-delivery behavior.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml tm-66c3bf93 (relay is the single push path; DoS degrades notification delivery)'
  related_concerns:
  - availability
  - distributed
  cross_references:
  - avail-a2cfd41c
- schema_version: 1
  id: resil-b1d0c558
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  disposition: blocked
  severity: medium
  confidence: low
  title: Supervisor watchdog auto-recovery and add-on restart policy on Core/add-on failure undocumented
  summary: Whether the Supervisor watchdog auto-restarts a hung-but-alive Core, with what backoff and restart cap, and the add-on restart policy on crash, are not in the artifacts, so the single-host instance's automatic-recovery behavior cannot be assessed.
  detail: 'The single-host instance''s only automatic-recovery mechanism is the

    Supervisor, which "manages your Home Assistant Core installation"

    (supervisor-README.md) and runs alongside a plugin-observer health/observer

    container (.apd-run.yaml). The Resilient question — does the system recover

    automatically from a component failure — turns on the watchdog and restart

    policy, and none of the supplied artifacts document it: whether the

    watchdog restarts Core on a failed deep health check or only on process

    death; the restart backoff and any restart-cap / crash-loop protection

    (unbounded restarts of a crash-looping Core or add-on is itself a failure

    mode); and the add-on restart policy on add-on crash. The supervisor and

    plugin-observer repos are dependency-role and were not deep-read, and the

    code-evidence index has no watchdog/restart-policy entry.


    Per the block-on-ambiguity discipline I do not infer that auto-recovery is

    present-and-good or absent from silence; this is recorded as blocked with

    prerequisite evidence named. This is the Resilient (auto-recovery behavior)

    complement to the Availability lens''s blocked health-check finding

    (avail-77752ee2), which covers the health-check depth that a watchdog would

    consume; the two should be resolved together.


    Severity medium reflects the Resilient predictable-failure / fail-safe band

