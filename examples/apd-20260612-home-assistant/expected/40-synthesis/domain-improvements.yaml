# === Judgment — verified absent from merged apd-domain skill (4) =============

- id: dimpr-b33ccb51
  improvement_type: missing_common_pattern
  target_pack: api-security
  target_file: common-patterns/authenticity.md
  apd_goal: authenticity
  source: judgment
  priority: high
  evidence:
  - kind: finding
    ref: auth-3f2314a4
    note: "mobile_app webhook authenticates by possession of a 32-hex webhook_id alone — no bearer, no per-request signature, no caller identity."
  rationale: >-
    The api-security authenticity patterns cover OAuth/JWT, mTLS, and signed
    payloads, but none names the bearer-LESS callback anti-pattern: a single static
    possession factor (a webhook_id) is the sole authenticator for a consequential
    control surface, with an optional-only per-request signature. A leaked secret is
    indistinguishable from the genuine device. This recurs in any system that mints
    long-lived device callback secrets and treats request signing as opt-in.
  suggested_action: >-
    Add an authenticity common-pattern documenting the bearer-less callback
    anti-pattern and the finding-of-record (make the per-request signature
    mandatory; bind the callback to a verifiable device/user identity).
  insertion_hint:
    markdown_section:
      level: 2
      text: "Pattern: bearer-less callback authenticated by a static possession factor"
  draft_snippet: |
    ## Pattern: bearer-less callback authenticated by a static possession factor

    **Symptom.** An inbound callback/webhook endpoint that drives consequential
    actions (service calls, state changes, actuation) authenticates on possession of
    a single long-lived static string (a `webhook_id`, callback URL, or shared secret)
    with no bearer token, no mandatory per-request signature, and no caller-identity
    assertion. Any per-request MAC/encryption is presented as an optional client flag.

    **Why it is an Authenticity finding.** The identity claim "I am this registered
    device" is unverifiable beyond replaying a static bearer-equivalent string; a
    leaked secret is cryptographically indistinguishable from the genuine caller.
    Maps to OWASP API2 (Broken Authentication), CWE-306/CWE-345, NIST IA-9/SC-23.

    **Severity.** High when the callback can reach a consequential control surface
    (PII access, financial action, physical/device actuation) under a synthesized
    rather than authenticated principal. Medium when the callback is read-only or
    fully signature-gated by default.

    **Finding of record.** The absent MANDATORY per-request signature (verified MAC
    over the body, nonce-replay-protected) and the absent binding of the callback to a
    verifiable device/user identity — not merely the existence of the static id.

- id: dimpr-97a729a9
  improvement_type: missing_common_pattern
  target_pack: mobile-applications
  target_file: common-patterns/authenticity.md
  apd_goal: authenticity
  source: judgment
  priority: medium
  evidence:
  - kind: finding
    ref: auth-1787eae1
    note: "Android Companion: default CA + user-installed CAs, no pinning; backend is a user-entered self-hosted URL with no fixed cert, so a static pin is impossible — TOFU pin is the control of record."
  rationale: >-
    The mobile-applications authenticity pattern for MASVS-NETWORK-2 assumes a
    fixed, vendor-controlled server whose certificate/SPKI can be statically pinned.
    It does not address the self-hosted / user-entered-instance case where there is
    no fixed server certificate to pin, so a static pin set is impossible and the
    correct finding-of-record is the ABSENT trust-on-first-use pin (or user-confirmable
    certificate identity) plus the un-scoped trust of user-installed CAs.
  suggested_action: >-
    Add a mobile authenticity common-pattern covering server-identity verification
    for user-entered/self-hosted backends, where TOFU pinning and CA-store scoping
    replace a static pin set as the control of record.
  insertion_hint:
    markdown_section:
      level: 2
      text: "Pattern: server-identity verification for self-hosted / user-entered backends (no static pin possible)"
  draft_snippet: |
    ## Pattern: server-identity verification for self-hosted / user-entered backends (no static pin possible)

    **Symptom.** The app connects to a user-entered, self-hosted backend URL with no
    fixed vendor certificate. Default platform TLS trusts the full device CA store
    (including user-installed and MDM/enterprise CAs) with no certificate or public-key
    pinning. A static pin set (MASVS-NETWORK-2) is genuinely impossible because the
    server certificate is chosen by the operator, not the vendor.

    **Why it is still an Authenticity finding.** Without pinning, server identity
    reduces to "some CA in the device store signed this leaf." A network MitM who can
    get a CA into the store (user-installed MitM CA, enterprise/MDM CA, compromised
    public CA) impersonates the backend and harvests the bearer token or rewrites
    responses the WebView/native bridge then trusts. Maps to MASVS-NETWORK-2,
    MASWE-0052, CWE-295, NIST SC-8(1)/IA-9.

    **Finding of record.** The absent trust-on-first-use (TOFU) pin — capture the
    leaf/SPKI on first successful connection and pin it, surfacing a later mismatch as
    a security event — plus scoping the trust manager to the system CA store
    (excluding user-added CAs) for the configured instance unless the user explicitly
    opts into a custom CA. A static pin set is NOT the expected control here.

    **Severity.** High on a high-value channel that carries the session bearer token;
    the device-trust assumption is low once a user-installed CA is in scope.

- id: dimpr-45813a89
  improvement_type: missing_common_pattern
  target_pack: api-security
  target_file: common-patterns/availability.md
  apd_goal: availability
  source: judgment
  priority: medium
  evidence:
  - kind: finding
    ref: dist-66e3e208
    note: "Single-host single-process Core: auth subsystem, recorder DB, supervisor, integrations all co-reside in one event loop / one failure domain, no replication."
  rationale: >-
    The api-security availability patterns assume a multi-tier service that can be
    sized, replicated, and load-shed at the boundary. They do not name the
    single-process appliance constraint where the entire platform — including the
    in-process authentication service and every integration — shares ONE event loop
    and ONE failure domain, so any one slow integration, an unthrottled handshake,
    or host loss takes down the whole system including auth. This availability shape
    is structural to appliance / self-hosted single-binary products.
  suggested_action: >-
    Add an availability common-pattern for the single-process / single-event-loop
    appliance, documenting the per-component bounding (timeouts, back-pressure,
    bounded queues) and boundary load-shedding that substitute for replication.
  insertion_hint:
    markdown_section:
      level: 2
      text: "Pattern: single-process / single-event-loop appliance (one failure domain for auth + everything)"
  draft_snippet: |
    ## Pattern: single-process / single-event-loop appliance (one failure domain for auth + everything)

    **Symptom.** The whole platform runs as one process on a single event loop /
    single host: the authentication subsystem, the datastore session, the control
    plane, and every in-process integration/plugin co-reside in one failure domain
    with no clustering, replication, or second node. There is no live replica — only
    a backup archive (a recovery artifact, not failover).

    **Why it is an Availability finding (route topology to Distributed, behavior to
    Resilient).** A single slow or blocking in-process integration, an unthrottled
    pre-auth handshake, or host loss starves or stops the one event loop and produces
    a TOTAL platform outage — including the in-process authentication service, so no
    user can authenticate during the incident. Maps to the single-AZ-auth-service
    framing escalated by the auth co-residency; NIST SC-5/SC-6, CP-2.

    **Finding of record.** Absent per-component bounding on the shared loop —
    execution timeouts and isolation around each integration, bounded write/queue
    back-pressure for the datastore, and a connection/subscription quota plus
    boundary load-shedding on pre-auth handshakes — as the realistic substitute for
    the replication an appliance form factor cannot provide.

    **Severity.** High where the in-process auth service shares the failure domain;
    do not rate critical absent a confidentiality or authentication-bypass impact.

