  title: mobile_app webhook rejects invalid plaintext JSON but documents no validation error for invalid encrypted JSON
  summary: The webhook contract returns 400 for invalid plaintext JSON but explicitly does not for invalid encrypted JSON, leaving malformed decrypted payloads without a defined reject-on-fail / dead-letter behavior.
  detail: 'The documented webhook data-quality contract (sending-data.md) states a 400 is

    returned "if your JSON is invalid. However, you will not receive this error if the

    encrypted JSON is invalid." This is an input-validation/data-quality asymmetry on

    the write path: the plaintext branch has a defined reject-on-fail (400), but the

    encrypted branch''s behavior on a malformed decrypted payload is undefined in the

    contract — there is no documented reject, quarantine, or dead-letter outcome, so a

    malformed-after-decrypt message may be silently dropped or partially processed.

    The typed field constraints documented for messages such as update_location

    (gps_accuracy "Must be greater than 0", etc.) further imply per-field validation

    whose enforcement on the encrypted branch is unspecified.


    This is the data-quality-contract facet (defined behavior for malformed input at

    an ingestion point). Severity is low under the *api-security* rubric clause

    "Documentation deficiency / OpenAPI specification drift from implemented behavior

    in non-security-critical surfaces" — the asymmetry is primarily a contract/

    observability gap rather than a direct exploit — but it is recorded because the

    encrypted branch is the one carrying location PII. Confidence is medium because

    the asymmetry is documented but the actual server-side handling of a malformed

    decrypted body is not enumerated in the code-evidence-index.

    '
  evidence:
  - artifact: api/native-app/sending-data.md
    locator: '#response, line 88'
    excerpt: You will receive a 400 status code if your JSON is invalid. However, you will not receive this error if the encrypted JSON is invalid.
  - artifact: api/native-app/sending-data.md
    locator: '#update-device-location, gps_accuracy row'
    excerpt: GPS accuracy in meters. Must be greater than 0.
  prerequisite_evidence:
  - Server-side handling of a malformed-after-decrypt webhook body (reject / quarantine / dead-letter behavior) — not enumerated in code-evidence-index.yaml
  control_mappings:
    nist_800_53r5:
    - SI-10
    cwe:
    - CWE-20
  recommendation:
    posture: consider
    summary: Define and document a reject-on-fail outcome for malformed decrypted webhook payloads symmetric with the plaintext 400.
    detail: 'Extend the webhook data-quality contract so a payload that decrypts to invalid

      JSON or fails per-field validation returns a defined error (or is dead-lettered

      with a logged, monitorable outcome) symmetric with the plaintext 400 path

      documented in sending-data.md, rather than being silently dropped. This gives

      the location-PII-carrying encrypted branch the same reject-on-fail data-quality

      guarantee as the plaintext branch.

      '
    references:
    - 'internal: api/native-app/sending-data.md #response'
  related_concerns: []
  cross_references: []
- schema_version: 1
  id: intg-8b158cfe
