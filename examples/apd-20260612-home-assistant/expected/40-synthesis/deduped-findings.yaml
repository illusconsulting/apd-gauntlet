    summary: Document the single-host SPOF as an explicit architectural constraint and define the failure domain in the hardening baseline.
    detail: 'State explicitly in the hardening guidance (org/SECURITY.md is currently a

      6-line pointer) that the supported topologies (overview lines 108-116) are

      all single-instance: there is no Core clustering, no state replication, and

      no automated failover, so the host is the platform''s single failure domain.

