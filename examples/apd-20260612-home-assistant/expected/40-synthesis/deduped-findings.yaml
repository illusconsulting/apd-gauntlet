  title: 2000+ integrations share Core's single process and event loop with no failure-domain isolation, preventing fault containment or horizontal scale
  summary: Every integration runs in-process at Core's full privilege on the one asyncio event loop with no isolation boundary, so the integration tier cannot be scaled out, partitioned, or fault-contained — one integration's failure is the whole platform's failure domain.
  detail: 'The integration tier is the largest moving part of Core, and it is entirely

    co-located inside the single Core process. The overview states "integrations

    are not sandboxed from each other and run with Core''s full privilege," and

    the threat model records that integrations "share Core''s single event loop

    with no per-integration resource quota" (tm-35a0b188) and that there is "no

    in-process integrity boundary protecting Core''s state machine from a single

    misbehaving integration" (tm-d98660ae). From the Distributed lens this is an

    in-process-state / no-failure-domain-boundary topology problem: because the

    2000+ integrations and Core''s own state machine occupy one process and one

    event loop, the integration tier has no failure domain of its own. It cannot

    be partitioned across processes or hosts, cannot be horizontally scaled

    independently of Core, and a fault in any one integration is not contained —

    it shares the single failure domain with the auth subsystem, the API

    surface, and the recorder write path (cev-a1000018).


    This is distinct from the Availability finding on the missing per-integration

    resource quota (avail-235dacf0, which owns the capacity-ceiling facet) and

    from the Integrity findings on the absent inter-integration trust boundary

    (tm-e185c6a7). The topology fact owned here is that the design provides no

    process/host boundary along which the integration tier could be isolated into

    its own failure domain — the standard distributed remedy (run untrusted or

    high-fan-out workers in a separate, independently-restartable process or

    container) is structurally absent.


    Severity is high under the *api-security* rubric distributed common-pattern

    "In-process state in the application tier preventing horizontal scale"

    (calibrated medium-to-high "depending on what''s in-process"); here what is

    in-process is the entire 2000+-integration tier plus Core''s authorization

    state, so the upper bound of that band applies. The blast radius of the

    missing isolation is the whole single failure domain. The behavior a healthy

    design would add around an integration (timeout, bulkhead, circuit-break) is

    routed to Resilient; the capacity ceiling to Availability; here the concern

    is strictly the absence of a failure-domain boundary for the integration

    tier.

    '
  evidence:
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#what-home-assistant-is, lines 20-22'
    excerpt: integrations are not sandboxed from each other and run with Core's full privilege
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.helpers.recorder.session_scope:L71-L72@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: Recorder DB session for entity-state history
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-36
    - SC-7(21)
    - SC-7(5)
    - SC-6
    cwe:
    - CWE-1189
  recommendation:
    posture: recommended
    summary: Provide a failure-domain boundary for the integration tier (out-of-process or per-integration worker isolation) so one integration is not the whole platform's failure domain.
    detail: 'Introduce a topology boundary that lets high-fan-out, untrusted, or

      blocking integrations run in a separate, independently-restartable failure

      domain (a worker process or sidecar container) rather than on Core''s single

      event loop alongside the auth subsystem and recorder write path

      (cev-a1000018). This is the topology complement to the Availability lens''s

      per-integration resource quota and the Resilient lens''s timeout/bulkhead

      work — isolate the tier into its own failure domain so a fault in one

      integration can be contained and restarted without taking Core down. Do not

      duplicate the quota or bulkhead recommendations; this one is specifically

      about creating the process/host boundary they would then be applied across.

      '
    references:
    - 'internal: 00-context/context-brief.md §8 (integrations run unsandboxed in one process)'
  related_concerns:
  - availability
  - resilient
  - integrity
  cross_references:
  - avail-235dacf0
