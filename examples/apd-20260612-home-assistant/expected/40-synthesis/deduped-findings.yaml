  title: iOS Companion stores access/refresh tokens in Keychain with default (non-hardened) accessibility
  summary: '`ServerManagerKeychain` persists the OAuth access/refresh tokens via KeychainAccess with no explicit kSecAttrAccessible set in source, defaulting to AccessibleWhenUnlocked (device-migratable) rather than the ThisDeviceOnly hardening expected for backend credentials.'
  detail: '`Sources.Shared.API.ServerManagerPersistence.ServerManagerKeychain`

    (cev-e5000002) stores the access/refresh tokens via the KeychainAccess

    `set(_:key:)` path with `ignoringAttributeSynchronizable: true`. The recon

    note records zero hits for `.accessibility(` across Sources, so no explicit

    `kSecAttrAccessible` is set — meaning the items default to

    `kSecAttrAccessibleWhenUnlocked`, NOT

    `…WhenUnlockedThisDeviceOnly` or `…WhenPasscodeSetThisDeviceOnly`.


    The practical consequence is that the token items are eligible to migrate

    via an unencrypted-or-weakly-protected device backup and are not bound to

    the originating device, widening the `physical_thief_with_stolen_device`

    extraction surface: the tokens are the persisted session/refresh bearer

    estate (mobile_stored_session_and_refresh_tokens) that replays into Core

    (cev-0a000005). The Keychain still provides at-rest protection while the

    device is locked — which is why this is a hardening risk rather than a

    plaintext-storage gap like the Android Room case (conf-androidr).


    High severity under the *mobile-applications* rubric clause "Sensitive

    data — access/refresh tokens … persisted in unprotected on-device storage

    … readable from a device backup or a stolen device" (MAS mapping:

    MASVS-STORAGE-1). Confidence is medium because the accessibility class is

    inferred from the absence of an explicit attribute in Sources rather than

    a positive `kSecAttrAccessibleWhenUnlocked` declaration; a code-grounded

    confirmation of the effective accessibility attribute would raise it to

    high confidence.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:Sources.Shared.API.ServerManagerPersistence.ServerManagerKeychain:L6-L35@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: 'func set(_ value: Data, key: String) ... ignoringAttributeSynchronizable: true'
  prerequisite_evidence:
  - Effective kSecAttrAccessible attribute on the token Keychain items (confirm WhenUnlocked vs WhenUnlockedThisDeviceOnly)
  control_mappings:
    nist_800_53r5:
    - SC-28
    - SC-28(1)
    - MP-5
    mitre_attack:
    - technique: T1634
      sub_technique: null
      tactic: TA0035
      rationale: Default WhenUnlocked Keychain items are accessible to credential-access tooling on a stolen/migrated device, the Access Stored Application Data / Keychain procedure on iOS.
    cwe:
    - CWE-312
    masvs:
    - MASVS-STORAGE-1
  recommendation:
    posture: recommended
    summary: Set kSecAttrAccessibleWhenUnlockedThisDeviceOnly on the token Keychain items.
    detail: 'In `ServerManagerKeychain` (cev-e5000002), set the Keychain

      accessibility on the access/refresh-token items to

      `kSecAttrAccessibleWhenUnlockedThisDeviceOnly` (or

      `…WhenPasscodeSetThisDeviceOnly` where a passcode requirement is

      acceptable) so the items are non-migratable across devices and excluded

      from device backups. This is the iOS analog of the Android Room

      recommendation (conf-androidr) and uses the same KeychainAccess API the

      class already calls.

      '
    references:
    - 'external: OWASP MASTG MASVS-STORAGE-1 (Keychain accessibility)'
  related_concerns:
  - ephemeral
  cross_references: []
