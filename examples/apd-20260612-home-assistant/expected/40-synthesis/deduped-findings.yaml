  title: 2000+ in-process integrations and the recorder write path share one asyncio event loop with no per-integration timeout, bulkhead, or circuit breaker
  summary: Every one of 2000+ integrations and the recorder write path run on Core's single shared asyncio loop with no per-call timeout, circuit breaker, bulkhead, or execution-time budget, so one slow or hostile integration or outbound call blocks the loop and cascades to a platform-wide stall that starves the consequential alarm/lock and recorder paths.
  detail: 'Two Resilient findings describe the same structural decision from the

    inbound and outbound sides of the shared loop. resil-5e5a02f0: outbound

    calls from 2000+ in-process integrations to external devices/clouds run on

    the shared loop with no per-call timeout or circuit breaker, so a slow or

    hostile endpoint blocks the loop. resil-cb12ebae: the same 2000+

    integrations plus the recorder write path share one asyncio loop with no

    bulkhead, per-integration execution-time budget, or watchdog, so one

    blocking integration starves the consequential alarm/lock and recorder

    paths. Both name the identical root cause — a single shared event loop

    with no isolation primitive — one emphasizing the missing outbound

    timeout/breaker and the other the missing bulkhead/budget. Merging keeps

    the isolation remediation as one design problem (loop isolation) rather

    than two partial patches. The webhook-backpressure (resil-872de693),

    mobile-reconnect (resil-895658c9), and push-queue-replay (resil-a4c9535c)

    records are distinct resilience gaps on other surfaces and are linked, as

    are the WebView fail-safe (resil-43c0c35b) and the two audit records that

    belong to the cross-group audit-absence finding.

    '
