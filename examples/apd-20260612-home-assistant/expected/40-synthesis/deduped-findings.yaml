  title: Control plane (Supervisor/os-agent) and data plane (Core) share one host and one failure domain
  summary: The Supervisor control plane that manages Core's lifecycle, and the os-agent host bridge, are co-resident host-root processes on the same host as the Core data plane, so a control-plane fault or host incident takes the data plane with it and there is no out-of-band management domain.
  detail: 'A resilient distributed design separates the control plane (which manages,

    schedules, restarts, and recovers workloads) from the data plane (which

    serves traffic) so that one can survive and act on the other''s failure. Home

    Assistant co-locates them: the Supervisor manages the Core container,

    backups, and add-on lifecycle (overview line 34) and binds the Docker socket

    (cev-b2000003), and os-agent exposes host operations over D-Bus

    (cev-c3000001/2) — all on the same host as the Core data plane. There is no

    separate management host or out-of-band control domain. The cross-repo edges

    confirm the tight coupling: Supervisor mints and holds a Core access token

    and calls Core as a privileged client (cev-0a000002), and Supervisor drives

    the host Docker daemon and os-agent over local sockets/D-Bus

    (cev-0a000003/cev-0a000004).


    The Distributed consequence is a shared failure domain across the

    control/data-plane boundary: a host incident, a host-root compromise, or the

    ScheduleWipeDevice path (cev-c3000002) takes down both the workload and the

    plane that would otherwise recover it; conversely the control plane has no

    surviving peer to fail over to. The management plane cannot act on the data

    plane''s failure from outside the failed domain because it is inside it. The

    privilege-escalation and host-root-blast-radius facets of this co-location

    are owned by the tier-1 Integrity/Authenticity findings (tm-83f43c8e,

    tm-cbe50d76); the topology fact owned here is the absence of any

    control-plane/data-plane failure-domain separation.


    Severity is medium under the *api-security* rubric distributed

    common-patterns (single-failure-domain family). It is medium rather than

    high because, for the supported single-host topologies (overview lines

    108-116), control/data-plane co-location is the intended appliance model and

    the dominant security harm (host-root blast radius) is carried by the

    tier-1 trustworthiness findings; the Distributed concern is the topology

    constraint that no out-of-band recovery domain exists.

    '
  evidence:
  - artifact: 00-SYSTEM-OVERVIEW.md
    locator: '#trust-boundaries, lines 88-89'
    excerpt: Supervisor controls the Docker socket ... the container-to-host-root boundary
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.docker.manager.DockerAPI.__init__:L271-L279@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: Supervisor binds the Docker socket (/run/docker.sock)
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SC-7
    - SC-7(21)
    - SC-36
    - CP-7
    cwe:
    - CWE-1189
  recommendation:
    posture: consider
    summary: Document the control-plane/data-plane co-location and name the out-of-band recovery the appliance topology lacks.
    detail: 'Note in the hardening baseline that the Supervisor control plane and the

      Core data plane share one host and one failure domain, so the management

      plane cannot recover Core from outside a failed/compromised host

      (cev-b2000003, cev-0a000002). For operators who need management-plane

      survivability, name the out-of-band recovery pattern they must supply (a

      separate host that can restore the Supervisor backup, or external

      monitoring that triggers a rebuild), rather than relying on the in-host

      Supervisor watchdog alone. Coordinate the host-root-blast-radius half with

      the tier-1 Integrity/Authenticity findings and the watchdog-behavior half

      with Resilient.

      '
    references:
    - 'internal: 00-context/threat-model-normalized.yaml (tm-83f43c8e, tm-cbe50d76 host-root scope)'
  related_concerns:
  - resilient
