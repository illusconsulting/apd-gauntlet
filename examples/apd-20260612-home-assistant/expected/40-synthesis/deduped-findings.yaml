  title: Single-host single-process Core is a platform-wide single point of failure with no replication or multi-node topology
  summary: HA Core, the auth subsystem, the Recorder DB, Supervisor, and os-agent all run in one process or one host with no clustering, no replication, and no second failure domain, so host loss takes the entire automation platform offline.
  detail: 'Home Assistant is, by design, a single Python asyncio Core process on a

    single host. The system overview states verbatim that "A single trusted

    Python Core process exposes a local-first REST + WebSocket API, runs 2,000+

    in-process integrations ... and persists automation state and history," and

    that "Core is a single, highly-privileged trust domain." The threat model

    records this as a single point of failure (tm-296e2800): "Core is a single

    asyncio process on a single host by design (no clustering claim) ...

    exhausting the event loop, the recorder DB, or the host crashes the whole

    automation platform including locks/alarms." All of the load-bearing

    components co-reside in this one failure domain: the auth subsystem is

    in-process with Core (tm-6fab88e3), the Recorder history DB shares the same

    host (tm-60f1d9cf), and the Supervisor + add-on/plugin containers + os-agent

    sit on the same host.


    This is the topology root cause behind several Availability findings. There

    is no second node, no multi-AZ placement, no multi-region posture, no

    primary/replica or quorum replication of state, and no horizontal scaling.

    The only "copy" of the system is the Supervisor backup archive (a recovery

    artifact, not a live replica), and a host loss or the os-agent

    ScheduleWipeDevice path (cev-c3000002) destroys the single live instance with

    no automatic failover. The deployment-topology section (overview lines

    108-116) enumerates four install methods (OS, Supervised, Container, Core)

    but all four are single-instance; none introduces a clustered or replicated

    mode.


    This finding is strictly the TOPOLOGY fact (one failure domain, no

    replication). The uptime/SLO consequence is routed to Availability

    (avail-754cfc01) and the failure-on-component-loss behavior (degrade,

    restart, recovery) to Resilient. Severity is high under the *api-security*

    rubric distributed common-pattern "Single-AZ deployment of the authentication

    service, session store, or payment service" calibrated to high: here the

    single host is the failure domain for the entire platform including the

    in-process authentication service, so a host incident produces total

    authentication and automation outage. It does not rise to critical in this

    lens because the harm is availability/topology, not a confidentiality or

    authentication-bypass impact; HA is also an owner-operated self-hosted

    product with no contractual multi-node commitment in the artifacts.

    '
  evidence:
