  title: No enumerated failure-mode catalog or declared graceful-degradation modes for the Core automation platform
  summary: The design enumerates no failure modes (integration unavailable, recorder DB full, push relay down, host loss) with their user-visible effect, and declares no degradation modes (read-only, last-known-good, safe-mode), so failure behavior is implicit and largely fail-by-stall.
  detail: 'Across the artifacts there is no failure-mode catalog: the design does not

    enumerate the failure modes the platform handles (single integration

    unavailable, dependency degraded-but-responding, recorder DB full/locked,

    push relay down, certificate expiry on a reverse proxy, host loss) nor

    state, per mode, the intended user-visible effect (hard error, retry-then-

    succeed, degraded response, queued-for-later). The threat model''s

    availability cells repeatedly record the *absence* of the controls that a

    catalog would drive — "no documented rate-limit / SLO / capacity model,"

    "no stated timeout/circuit-breaker" (tm-17b14550), "no per-integration

    resource quota" (tm-35a0b188) — which together imply the de-facto failure

    mode is "stall the shared event loop," but no mode is named or designed.


    Equally, no graceful-degradation modes are declared: there is no documented

    read-only or safe-mode for when the recorder DB or a dependency is

    unavailable, no last-known-good fallback policy, and no user-disclosed

    degraded-state signaling. The permission engine does fail closed (deny-all

    on empty/None policy, cev-a1000006) — recorded as a capability — but that is

    one fail-safe point, not a platform degradation strategy.


    The Resilient concern is that without an enumerated failure-mode catalog and

    declared degradation modes, every Resilient control (timeouts, breakers,

    bulkheads, backpressure) is added ad hoc rather than driven by a stated

    behavior contract, and the system''s behavior under partial failure is

    unpredictable. Severity is medium under the *api-security* rubric: this is a

    design-completeness / predictable-failure gap rather than a single

    exploitable control absence (those are filed separately above), and it

    overlaps the Availability SLO finding (avail-754cfc01) which the synthesizer

    may merge. Confidence is medium: the absence of a catalog is evident from

    the artifact set, but a hardening doc out-of-band (org/SECURITY.md is a

    6-line pointer) could carry some of it.

    '
  evidence:
  - artifact: org/SECURITY.md
    locator: full file (6 lines)
    excerpt: Security-policy pointer; no embedded hardening or failure-mode content
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.permissions.util.compile_policy:L23-L52@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'def apply_policy_deny_all(entity_id, key): return False'
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - SI-13
    - CP-12
    - SI-17
    - SC-24
    cwe:
    - CWE-636
  recommendation:
    posture: recommended
    summary: Author a failure-mode catalog with per-mode user-visible effect and declare the platform's graceful-degradation modes (read-only/safe-mode/last-known-good).
    detail: 'Produce a failure-mode catalog enumerating the failure modes the platform

      handles — integration unavailable, dependency degraded-but-responding,

      recorder DB full/locked, push relay down, host loss — and, for each, the

      intended user-visible effect (hard error, retry-then-succeed, degraded

      response, queued-for-later). Declare the platform''s graceful-degradation

      modes: a read-only / safe-mode when the recorder DB or a dependency is

      unavailable, a last-known-good entity-state fallback, and user-disclosed

      degraded-state signaling so operators of safety automations know when the

      platform is degraded. Capture this in the hardening baseline

      (org/SECURITY.md is currently a 6-line pointer with no such content). This

      contract is what the per-control findings above (timeouts, breakers,

      bulkheads, backpressure) should be designed against. Coordinate with the

      Availability SLO finding (avail-754cfc01).

      '
    references:
    - 'internal: 00-context/context-brief.md §6 Evidence Gaps (DR/RTO/RPO + availability targets)'
  related_concerns:
  - availability
  cross_references:
  - avail-754cfc01
