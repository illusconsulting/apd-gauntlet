  title: No SBOM or SLSA build provenance over Core/Supervisor/add-on/mobile builds, so a swapped dependency or artifact is unattested
  summary: Build artifacts ship with no generated/signed SBOM and no build-provenance attestation, so the composition and origin of a release cannot be verified.
  detail: 'The build inputs reviewed (supervisor-Dockerfile, the add-on manifest) show no

    generation of a CycloneDX/SPDX SBOM, no SLSA-style build-provenance attestation, and

    no in-toto link metadata accompanying the images or wheels. The Supervisor image

    installs requirements via `uv pip install` from a requirements file plus optional

    local wheels with no recorded, signed manifest of what went in, and there is no

    evidence of a continuous process to evaluate new vulnerabilities against a stored SBOM.

    Consequently, for any Core/Supervisor/add-on/mobile release there is no attested record

    of the components it contains or of the build that produced it — a swapped, backdoored,

    or typosquatted dependency (the supply_chain_attacker / malicious_in_process_sdk

    positions) leaves no provenance trail that would let a consumer detect it.


    This is medium severity under the *api-security* rubric clause "Unsafe consumption /

    supply-chain hardening weakness" framing: the absent SBOM/provenance is a supply-chain

    attestation gap that does not itself grant access but removes the authenticity record

    needed to detect a component swap. Marked medium confidence because the review covers

    the Dockerfiles and manifest in scope and the CI/release pipeline configuration that

    would generate provenance is not in the artifact set — if a CI provenance step exists

    out-of-band, this downgrades. Pairs with the image-signing finding (a signature is only

    meaningful when it attests a known SBOM).

    '
  evidence:
  - artifact: infra/supervisor-Dockerfile
    locator: lines 36-56 (build/install, no SBOM/provenance emission)
    excerpt: uv pip install --no-cache -e ./supervisor && python3 -m compileall ./supervisor/supervisor
  - artifact: infra/addon-mosquitto-config.yaml
    locator: config.yaml (manifest declares role/mounts, no provenance)
    excerpt: 'auth_api: true; map: [ssl, share]; startup: system'
  prerequisite_evidence:
  - CI/release pipeline configuration showing whether a CycloneDX/SPDX SBOM is generated and signed per release
  - Whether SLSA build-provenance / in-toto attestations are produced and verified for Core/Supervisor/add-on/mobile artifacts
  control_mappings:
