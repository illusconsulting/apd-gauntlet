  title: Companion apps and Core have no hardware device attestation (Play Integrity / App Attest), so the backend has no genuine-client proof
  summary: No Play Integrity / App Attest / key attestation anywhere; the backend cannot cryptographically verify a request came from a genuine, untampered app on a genuine device.
  detail: 'The run''s crown-jewel enumeration confirms attestation_tokens_and_jwts is ABSENT —

    no Play Integrity, App Attest, DeviceCheck, or SafetyNet exists in either Companion

    app or Core. Code recon corroborates: the Android client''s only client-side identity

    controls are the mTLS key in the AndroidKeyStore (KeyStoreRepositoryImpl) and the

    custom TLS factory (TLSHelper), and there is no root/jailbreak/Frida detection

    (rooted_device_attacker_with_frida position). Consequently the backend has no

    cryptographic proof that a request originates from a genuine, untampered Companion

    build running on an uncompromised device — a repackaged or emulated client, or a

    direct API caller replaying extracted tokens, is indistinguishable to Core.


    This is the *verifiable* counterpart to the missing runtime-detection signal (which

    Integrity owns as advisory). Per the *mobile-applications* authenticity pattern "No

    hardware attestation (MASVS-RESILIENCE-4)", severity is high here rather than critical

    because the consequential backend writes the client commands (device control via the

    mobile_app webhook / call_service) are additionally guarded by the bearer/permission

    model rather than accepted on the bare client assertion alone; it would be critical if

    a high-value write were accepted on nothing but a client-side root verdict. Recorded as

    the structural gap: the backend has no genuine-client proof at all, so every

    device-trust argument about the mobile clients is unresolvable.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.keychain.KeyStoreRepositoryImpl:L108-L112@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidKeyStore") // hardware-backed key store for mTLS client-cert private key
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidCAStore")... trustManagerFactory.init(androidCaStore)
  - artifact: mobile/android-CLAUDE.md
    locator: run-config crown_jewels EXCLUDED note (attestation_tokens_and_jwts absent)
    excerpt: no Play Integrity / App Attest / DeviceCheck / SafetyNet anywhere
  control_mappings:
    nist_800_53r5:
    - IA-9
    - SI-7
    - SI-7(6)
    - SC-23
    - RA-3
    mitre_attack: []
    masvs:
    - MASVS-RESILIENCE-4
    maswe:
    - MASWE-0099
  recommendation:
    posture: recommended
    summary: Request and server-verify a fresh hardware attestation verdict and bind it to high-value actions.
    detail: 'Add Play Integrity (Android) and DCAppAttest / App Attest (iOS) to the

      Companion apps, request a fresh nonce-bound verdict at session establishment

      and before consequential device-control actions, and verify the

      Google/Apple-signed verdict plus key-attestation chain SERVER-SIDE in the

      mobile_app integration before honoring webhook_call_service / state writes —

      binding the verdict to the issued session or per-action step-up rather than

      logging it. Because self-hosted instances vary, gate this as an opt-in

      hardening tier for users who expose Core to the internet. This is the

      verifiable floor that makes the absent root/Frida heuristics moot.

      '
    references:
    - 'external: OWASP MASVS-RESILIENCE-4 (hardware-backed attestation)'
    - 'external: Google Play Integrity API / Apple App Attest'
  related_concerns:
  - integrity
  - non_repudiation
  cross_references: []
