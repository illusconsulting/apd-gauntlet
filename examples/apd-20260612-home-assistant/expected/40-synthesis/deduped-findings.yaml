  title: Native<->WebView external-auth bridge dispatches on remote-frontend messages with only doc-only, unenforced callback-origin verification
  summary: The JS bridge that carries the access token native<->WebView relies on a documented 'verify the callback name' convention with no enforced origin/integrity check on the remotely-served frontend message source.
  detail: 'The external-auth bridge moves the access token between the native Companion app and

    the frontend loaded in the WebView. The frontend dispatches to native via

    window.externalAppV2 / webkit.messageHandlers (ExternalMessaging._sendExternal, code:

    L491-L505) and registers the native->WebView callback on window[CALLBACK_EXTERNAL_BUS]

    (fireMessage L381-L428); the iOS native handler switches on the incoming message TYPE

    with no origin/integrity check (WebViewExternalMessageHandler.handleExternalMessage

    L37-L76). The only stated protection against a forged message is a DOCUMENTED

    convention: "Apps should verify the callback name matches the expected value to ensure

    the callback has not been forged" (frontend-external-authentication.md). This is

    guidance, not an enforced control, and the WebView renders the REMOTE, user-configured

    server frontend — so a compromised backend or MitM-substituted response

    (compromised_backend_or_response position) is the very source the bridge trusts.


    The identity of the party sending a bridge message (is this really the genuine frontend,

    not hostile injected content?) is therefore not verifiable: there is no per-message

    authentication binding the message to a trusted origin, only a stable callback name an

    attacker who controls the rendered content already knows. This is high severity under

    the *mobile-applications* authenticity pattern for unverified bridge/caller identity

    (MASVS-PLATFORM-1/2): untrusted web content crosses into native capability, and the

    blast radius includes the access token the bridge carries. The input-validation and

    token-confidentiality faces route to Integrity and Confidentiality respectively.

    '
  evidence:
  - artifact: auth/frontend-external-authentication.md
    locator: '#get-access-token, line 19'
    excerpt: Apps should verify the callback name matches the expected value to ensure the callback has not been forged.
  - artifact: code-evidence-index.yaml
    locator: code:Sources.App.Frontend.ExternalMessageBus.WebViewExternalMessageHandler.handleExternalMessage:L37-L76@8f26f9e7d5bb9ca7d55d563ceb685ed77a76a740
    excerpt: switch externalBusMessage { case .configGet ... case .tagRead ... } // no origin/integrity check
  - artifact: code-evidence-index.yaml
    locator: code:src.external_app.external_messaging.ExternalMessaging.fireMessage:L381-L428@505966e84f3a90347c66261592908a02a4118189
    excerpt: window[CALLBACK_EXTERNAL_BUS] = (msg) => this.receiveMessage(msg)
  control_mappings:
    nist_800_53r5:
    - IA-9
    - SC-23
    - AC-4
    - SI-10
    mitre_attack: []
    masvs:
    - MASVS-PLATFORM-2
    maswe:
    - MASWE-0072
  recommendation:
    posture: recommended
    summary: Enforce origin/integrity verification on the bridge rather than relying on a documented callback-name convention.
    detail: 'Make the bridge authenticate its peer rather than trusting a stable callback

      name: on Android, use the WebViewFeature.WEB_MESSAGE_LISTENER (the V2 path

      already required) with an allowlisted origin so only the genuine

      same-origin frontend can post, and on iOS validate message.frameInfo /

      securityOrigin in the WKScriptMessageHandler against the configured instance

      origin before dispatching on the message type. Minimize the native

      capability the bridge exposes to untrusted content, and never release the

      access token to a message whose origin is not the verified instance frontend.

      '
    references:
    - 'external: OWASP MASVS-PLATFORM-2 (WebView / JS bridge)'
    - 'external: Android WebViewCompat WebMessageListener allowlisted origins'
  related_concerns:
  - integrity
  - confidentiality
  cross_references:
  - intg-3b33966f
  - conf-3060c50e
- schema_version: 1
  id: immut-5a5ef5bd
  agent: immutability
  apd_tier: auditability
  apd_goal: immutability
  disposition: gap
  severity: medium
  confidence: high
  title: Add-on and base images reference mutable floating tags with no digest pinning or immutable deployment record, so what runs in a container is not reproducible from an immutable provenance reference
  summary: The mosquitto add-on build_from pins to floating ghcr.io base-debian:trixie tags and the core Dockerfile takes an unpinned BUILD_FROM, so the image actually deployed can change under a fixed reference with no immutable digest, SBOM, or deploy-record linking running container to a frozen artifact.
  detail: 'Home Assistant''s container build configuration references base images by mutable

    floating tag rather than by immutable content digest. The official mosquitto

    add-on build manifest pins both architectures to `ghcr.io/home-assistant/

    <arch>-base-debian:trixie` — a rolling tag that the registry owner can re-point

    at any time. The core Dockerfile takes `BUILD_FROM` as an unpinned ARG (`FROM

    ${BUILD_FROM}`) and, while it pins the dockerfile *frontend* by digest

    (`# syntax=docker/dockerfile@sha256:...`), the *base image* it builds on is not

    digest-pinned. The Supervisor Dockerfile similarly builds `FROM

    ghcr.io/home-assistant/base-python:3.14-alpine3.22-2026.05.0` — a version tag,

    still a mutable reference, not a digest.


    From the Immutability lens the defect is twofold: (1) the deployed image is not

    reproducible from an immutable reference — a fixed `:trixie` tag can resolve to

    different content over time, so "the image we ran" cannot be frozen and re-proven;

    and (2) there is no immutable deployment/provenance record — no retained per-deploy

    SBOM, no signed image digest pinned at install, and no link from a running add-on

    container back to a frozen artifact digest. This defeats the

    code-and-artifact-deployment-record immutability class: there is no immutable

    record of what artifact produced the current runtime behavior.


    The supply-chain *trust* question (is the image signed/verified at install,

    Cosign) is an Authenticity concern and is routed there via related_concerns; this

    finding is specifically the immutability/reproducibility/deployment-record gap of

    pinning to mutable references and retaining no frozen provenance.


    Severity is medium under the *api-security* Immutability common-pattern "SBOM and

    artifact-provenance history not retained — only current SBOM stored," at the

    medium end because no contractual supply-chain-attestation obligation is evidenced

    for this self-hosted platform; it would escalate where such an attestation is

    required. The mosquitto add-on was flagged ephemeral on the `:trixie` floating

    tag in the run scope, corroborating the mutable-reference observation.

    '
  evidence:
  - artifact: infra/addon-mosquitto-build.yaml
    locator: lines 2-4 build_from base-debian tags
    excerpt: 'build_from: aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie; amd64: ...:trixie'
  - artifact: infra/supervisor-Dockerfile
    locator: line 1 ARG BUILD_FROM
    excerpt: ARG BUILD_FROM=ghcr.io/home-assistant/base-python:3.14-alpine3.22-2026.05.0
  prerequisite_evidence: []
  control_mappings:
    nist_800_53r5:
    - CM-2
    - CM-8
    - SR-4
    - SR-4(3)
    - SI-7
    - AU-11
    mitre_attack:
    - technique: T1525
      sub_technique: null
      tactic: TA0003
      rationale: A mutable floating base tag lets the upstream reference resolve to attacker-altered image content under a fixed build reference, the Implant Internal Image procedure, with no pinned digest to detect substitution.
    cwe:
    - CWE-829
  recommendation:
    posture: recommended
    summary: Pin base and add-on images by immutable content digest, retain a per-deploy SBOM and signed digest, and link the running container to that frozen provenance record.
    detail: 'Replace the floating `:trixie` base references in the add-on build manifests

      (infra/addon-mosquitto-build.yaml lines 3-4) and the unpinned BUILD_FROM in the

      core/supervisor Dockerfiles with `@sha256:<digest>` content-digest pins, mirroring

      the digest pin already applied to the dockerfile syntax frontend in the core

      Dockerfile (line 1). Retain a per-deploy SBOM and the signed image digest as an

      immutable deployment record so the artifact that produced a running container is

      reconstructible after the fact, and surface the deployed digest from the running

      instance so it can be reconciled against that record. Pair this with the

      Authenticity recommendation that add-on/base images be Cosign-signed AND verified

      at install — pinning makes the artifact immutable; signing makes it attributable.

      '
    references:
    - 'external: NIST SP 800-53r5 SR-4(3) Provenance, CM-8 System Component Inventory'
  related_concerns:
  - authenticity
  - integrity
  cross_references: []
- schema_version: 1
  id: nonrep-af1c55d3
  agent: non_repudiation
  apd_tier: auditability
  apd_goal: non_repudiation
  disposition: gap
  severity: high
  confidence: high
  title: logbook entries carry null context_user_id, so even the state-history surface lacks an attributable actor for consequential state changes
  summary: The only persisted trace of state changes (logbook) records context_user_id as null in the documented sample, so a consequential action cannot be tied to the user, token, or principal that caused it.
  detail: 'Even setting aside that `logbook` is a history surface and not a security

    audit (Finding nonrep-00000001), the trace it does provide lacks actor

    attribution. The brief''s `/api/logbook` sample shows `"context_user_id": null`

    — the field that would name the acting user is empty. AU-3 (Content of Audit

    Records) and AU-10 (Non-Repudiation) both require that each record bind the

    action to an actor; a null actor field defeats both.


    This is structurally worse than a "system account" attribution because there

    is no actor at all to even disambiguate. Two paths make the actor

    unrecoverable by construction: (1) the bearer-less webhook path —

    webhook_call_service runs every service call under a SYNTHESIZED

    `registration_context` (cev-a1000015), not a user identity, so a leaked

    webhook_id holder who actuates a lock is attributable to no human; and

    (2) the supervisor-socket and signed-query auth paths in the middleware

    (cev-a1000009) authenticate a request without necessarily resolving it to a

    named interactive user.


    Severity HIGH under the api-security rubric "Partial audit gap on

    consequential-action flows" — attribution loss specifically named in that

    clause ("logged ... without actor attribution; impairs incident

    reconstruction"). The actor field is only as strong as the authentication

    that would populate it; that strength question is Authenticity''s (the webhook

    possession-only model and synthesized context are already filed there).

    '
  evidence:
  - artifact: api/rest.md
    locator: /api/logbook sample response, lines 360-383
    excerpt: '"context_user_id": null'
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.webhook.webhook_call_service:L269-L292@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'async_call(... context=registration_context(...)) # synthesized context, no per-entity permission check'
  control_mappings:
    nist_800_53r5:
    - AU-3
    - AU-3(1)
    - AU-10
    - AU-10(1)
    - AU-12
    mitre_attack: []
    cwe:
    - CWE-778
  recommendation:
    posture: required
    summary: Populate a resolved actor identity on every audit record, and for the synthesized webhook context record the registering device/user as the on-behalf-of principal.
    detail: 'On the new audit stream (Finding nonrep-00000001), require a non-null actor

      on every record. For interactive REST/WS requests the actor is the resolved

      user from the validated access token (cev-a1000002). For the webhook path

      (cev-a1000015), the synthesized `registration_context` must carry — and the

      audit record must capture — the device''s `webhook_id`-to-config_entry binding

      and the registering user (the bearer principal recorded at

      cev-a1000014 registration time) as the on-behalf-of actor, so a

      lock/alarm actuation through a leaked webhook_id is attributable to the

      registered device rather than to no one. For supervisor-socket and

      signed-query auth (cev-a1000009), record the service principal explicitly

      rather than emitting a null actor.

      '
    references:
    - 'external: NIST SP 800-53r5 AU-3, AU-10'
  related_concerns:
  - authenticity
  cross_references: []
