  title: Recorder history DB persists home-occupancy/geolocation state with neither encryption nor tamper-evidence at rest
  summary: The Recorder history store holds raw presence, geolocation, and lock/alarm state with no encryption-at-rest and no append-only/WORM/content-hash protection, so any filesystem or DB read both discloses the home-occupancy fact base and can silently rewrite or delete it undetected.
  detail: 'Two lenses converge on the single Recorder store (session_scope, an

    ordinary mutable SQLite/MariaDB/Postgres database). The Confidentiality

    lens establishes the store has no encryption-at-rest layer over a

    high-privacy fact base (presence, geolocation/zones, lock and alarm

    history), so a host or DB read discloses where occupants are and were.

    The Immutability lens establishes the same store has no append-only tier,

    no WORM, and no content-hash, so the same actor with DB or host access

    can rewrite or delete that history with no detection. The two are the

    same architectural decision — Recorder is a plain mutable, plaintext DB —

    assessed for the two distinct properties it lacks (secrecy at rest, and

    preservation against alteration). Treating them as one record keeps the

    remediation coherent: an at-rest protection program for Recorder must

    address both encryption and tamper-evidence together, because partial

    work (encrypt-only, or hash-only) leaves the other exposure standing.

    '
