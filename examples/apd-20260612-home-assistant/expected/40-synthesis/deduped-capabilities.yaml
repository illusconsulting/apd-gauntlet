- schema_version: 1
  id: resil-cap-6a038f48
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  title: WebSocket connection state self-corrects by dropping the live socket on token
    revocation
  description: 'The WS auth handshake (AuthPhase.async_handle, cev-a1000010) registers
    an

    async_register_revoke_token_callback so that when the backing refresh token

    is revoked, the live WebSocket socket is dropped rather than left open in a

    now-invalid state. This is a Resilient state-recovery behavior on the

    connection lifecycle: a revocation event drives the connection to a known

    state (closed) automatically, without waiting for the next request or a

    manual sweep, so the system converges to a consistent connection state on a

    security-relevant change.

    '
  maturity: implemented
  scope: "Confirmed for the Core WebSocket connection lifecycle (cev-a1000010),\n\
    grounded in code evidence. Covers the drop-on-revocation transition only;\nit\
    \ does NOT address reconnect/backoff behavior on the client side\n(unspecified\
    \ \u2014 resil-01000005), nor any WS connection/subscription quota\n(an open Availability\
    \ finding, avail-4be2dd70). The recovery here is the\nserver forcing the socket\
    \ closed; the client's resilient reconnection is\nout of scope of this capability.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.websocket_api.auth.AuthPhase.async_handle:L85-L123@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: async_register_revoke_token_callback
  control_mappings:
    nist_800_53r5:
    - SI-13
    - SC-24
  caveats:
  - Covers the server-side drop-on-revocation transition only; client reconnect/backoff
    behavior is unspecified (resil-01000005).
  - Does not bound the number of WS connections/subscriptions, which remains an open
    Availability concern (avail-4be2dd70).
  related_concerns:
  - ephemeral
  - authenticity
