    revocation drops the live socket within the single Core process. NOT a\ndistributed\
    \ capability \u2014 it works precisely because there is exactly one\nprocess and\
    \ one failure domain; it does not extend to any multi-instance,\nreplicated, or\
    \ cross-host topology (none exists). The REST request path is\nre-validated per\
    \ request (cev-a1000002) rather than via a held callback.\nDoes not address availability\
    \ of the single instance (see findings) or\ncross-node consistency (not applicable\
    \ \u2014 no second node).\n"
