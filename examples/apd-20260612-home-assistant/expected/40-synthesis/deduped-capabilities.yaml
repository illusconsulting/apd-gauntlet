    \ the\nbound live socket is dropped rather than continuing to serve a\nnow-invalid\
    \ session. Because Core is a single process owning all its\nsockets, this gives\
    \ strongly-consistent revocation propagation across the\none failure domain: there\
    \ is no cross-instance staleness window in which one\nnode would keep serving\
    \ a connection another node revoked, precisely because\nthere is only one node.\
    \ Within the Distributed lens this is the one place the\nsingle-process topology\
    \ yields a consistency benefit \u2014 token revocation is a\nlocal, immediate,\
    \ in-process event with no eventual-consistency lag.\n"
