- schema_version: 1
  id: auth-cap-42c6a13f
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  title: Android Companion mTLS client-cert private key held in the hardware-backed
    AndroidKeyStore
  description: 'The Android Companion supports mutual-TLS client authentication to
    the user''s

    instance using a client certificate whose private key is stored in the

    hardware-backed AndroidKeyStore (KeyStoreRepositoryImpl getInstance

    "AndroidKeyStore"; TLSHelper wires the key manager into the OkHttp SSL factory).

    This is a genuine workload-identity control: the client proves its identity to
    a

    mTLS-configured server with a non-exportable hardware-bound key, so a stolen

    on-device token alone does not let an attacker present the client certificate

    from another device.

    '
  maturity: implemented
  scope: "Confirmed in code for the Android client: the mTLS client-cert private key\
    \ is\ncreated/held in the AndroidKeyStore and used by the OkHttp client SSL socket\n\
    factory. NOT addressed: this is a CLIENT-to-server identity control gated on the\n\
    user/server having configured mTLS (optional, not default); it does not provide\n\
    device attestation (see the no-attestation finding) and does not authenticate\
    \ the\nSERVER (see the no-pinning finding). iOS mTLS parity is not confirmed in\
    \ the\nevidence reviewed. The hardware non-exportability is the protection \u2014\
    \ a\nsoftware-fallback key would void it.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.keychain.KeyStoreRepositoryImpl:L108-L112@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidKeyStore") // hardware-backed key store
      for mTLS client-cert private key
  - artifact: code-evidence-index.yaml
    locator: code:common...data.TLSHelper.TLSHelper.setupOkHttpClientSSLSocketFactory:L24-L43@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: builder.sslSocketFactory(..., trustManagers[0] as X509TrustManager)
  control_mappings:
    nist_800_53r5:
    - IA-3
    - IA-3(1)
    - IA-5(2)
    - SC-17
    masvs:
    - MASVS-AUTH-2
  caveats:
  - mTLS is opt-in per server/user configuration, not a default control.
  - Provides client identity only; no server-identity pinning and no device attestation
    accompany it.
  - iOS mTLS client-cert custody parity not confirmed in the reviewed evidence.
  related_concerns:
  - confidentiality
  - ephemeral
- schema_version: 1
  id: auth-cap-8144e2be
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  title: Homeassistant auth provider uses bcrypt password hashing with constant-time,
    enumeration-resistant login
  description: "The homeassistant auth provider hashes passwords with bcrypt (rounds=12,\n\
    Data.hash_password) and validates them in constant time: validate_login runs a\
    \ dummy\nbcrypt.checkpw on a user miss \"to make timing the same as if user was\
    \ found\" and uses\ntiming-safe comparison, defending the credential-verification\
    \ path against user\nenumeration. This strengthens the authenticity of the primary\
    \ knowledge factor \u2014 the\nstored verifier is a salted adaptive hash and the\
    \ verification side-channel is closed.\n"
  maturity: implemented
  scope: "Confirmed in code for the homeassistant password provider: bcrypt rounds=12\
    \ +\nconstant-time validate_login with a dummy-hash miss path. NOT addressed:\
    \ this is the\nsingle knowledge factor only \u2014 MFA is opt-in and not enforced\
    \ (see the MFA finding),\nand bcrypt's 72-byte input truncation means passwords\
    \ longer than 72 bytes are\nsilently truncated before hashing. Does not speak\
    \ to the legacy_api_password /\ntrusted_networks providers, which carry their\
    \ own authenticity weaknesses.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.providers.homeassistant.Data.hash_password:L189-L198@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: hashed = bcrypt.hashpw(password.encode()[:72], bcrypt.gensalt(rounds=12))
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.providers.homeassistant.Data.validate_login:L160-L187@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'bcrypt.checkpw(b"foo", dummy) ... # check a hash to make timing the
      same as if user was found'
  control_mappings:
    nist_800_53r5:
    - IA-5
    - IA-5(1)
    - IA-2
  caveats:
  - Single knowledge factor only; MFA is opt-in and unenforced.
  - bcrypt truncates input to 72 bytes, silently dropping longer-password entropy.
  - Does not cover the legacy_api_password / trusted_networks providers.
  related_concerns:
  - confidentiality
- schema_version: 1
  id: auth-cap-e9f55df8
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  title: Supervisor SecurityMiddleware authenticates the add-on by SUPERVISOR_TOKEN
    and gates by declared role with default-deny
  description: 'The Supervisor SecurityMiddleware.token_validation resolves the inbound

    SUPERVISOR_TOKEN to the calling add-on identity, then matches the request path
    against

    a per-role URL allow-list (role_access[hassio_role], with ROLE_ADMIN matching
    .* and

    narrower regexes for default/homeassistant/backup/manager) and DEFAULT-DENIES
    on no

    match. This is a real identity-bound authorization gate: each add-on caller is

    identified by its issued token and constrained to the API surface its declared
    role

    permits, so a low-role add-on cannot reach the full privileged Supervisor API.

    '
  maturity: implemented
  scope: "Confirmed in code: token->app resolution + per-role regex URL ACL with default-deny.\n\
    Authenticity-relevant face: the caller identity (which add-on) is established\
    \ from the\nSUPERVISOR_TOKEN and bound to a role. NOT addressed here: an add-on\
    \ running with the\nadmin role or with protection-mode disabled matches ROLE_ADMIN's\
    \ .* and reaches the\nfull API including the Docker host-root plane \u2014 so\
    \ the gate's strength depends on the\nrole/protection configuration (an authorization-scope\
    \ concern routed to api-security /\nIntegrity), and the SUPERVISOR_TOKEN lifecycle\
    \ (rotation/expiry) is unspecified\n(Ephemeral).\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.api.middleware.security.SecurityMiddleware.token_validation:L302-L375@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: 'if patterns.role_access[app.hassio_role].match(request.path): request_from
      = app ... else: _LOGGER.warning("no role")'
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.api.middleware.security.SecurityMiddleware.ADDONS_ROLE_ACCESS:L111-L237@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: 'ROLE_ADMIN: re.compile(r".*") ... per-role path regexes'
  control_mappings:
    nist_800_53r5:
    - IA-9
    - AC-3
    - AC-6
    - SC-23
  caveats:
  - An admin-role or protection-disabled add-on matches .* and reaches the host-root
    Docker plane.
  - SUPERVISOR_TOKEN rotation/expiry/revocation lifecycle is unspecified (Ephemeral).
  - Identity binding is per-token; no per-request signature beyond the bearer.
  related_concerns:
  - ephemeral
  - integrity
- schema_version: 1
  id: auth-cap-eba3a527
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  title: Supervisor ingress strips client-supplied X-Remote-User-* headers before
    injecting its own
  description: 'The Supervisor ingress header path (_init_header) sets X-Remote-User-Id
    / -Name /

    -Display-Name from the authenticated session AND, in the same loop, filters/strips
    any

    inbound copies of those headers from the client request before forwarding to the

    add-on. This prevents a client reaching the add-on THROUGH ingress from spoofing
    the

    identity headers, so the asserted user identity an add-on receives over the ingress

    path reflects the Supervisor session rather than client-supplied input.

    '
  maturity: implemented
  scope: 'Confirmed in code: ingress overwrites the X-Remote-User-* headers from session
    data

    and strips inbound copies in the forward path. This is a PARTIAL authenticity
    control:

    it closes client-through-ingress header spoofing, but the conveyed identity remains
    an

    UNSIGNED header the add-on cannot independently verify, so an add-on reached outside

    ingress (host network / direct container call) or trusting the header on faith
    is still

    exposed (see the header-trust finding). Scope is the ingress hop only.

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:supervisor.api.ingress._init_header:L320-L349@7eaf69fcab6a9fd1607b6d7000cbe75b3c96b7b2
    excerpt: 'headers[HEADER_REMOTE_USER_ID] = session_data.user.id ... for name in
      request.headers: if name in (... REMOTE_USER_ID ...): continue'
  control_mappings:
    nist_800_53r5:
    - AC-4
    - SC-23
    - IA-9
  caveats:
  - Conveyed identity is an unsigned header the add-on cannot cryptographically verify.
  - Protects only the ingress hop; add-ons reachable outside ingress are not covered.
  - Pairs with the open header-trust finding (auth-0a00000b).
  related_concerns:
  - integrity
- schema_version: 1
  id: auth-cap-f01e6108
  agent: authenticity
  apd_tier: auditability
  apd_goal: authenticity
  title: Single revocation-aware access-token validation chokepoint for REST and WebSocket
  description: 'Access-token authenticity is verified at one chokepoint: async_validate_access_token

    decodes the HS256 JWT with the per-refresh-token jwt_key, restricts the algorithm
    to

    HS256 (no alg:none / key-confusion surface), applies a 10s leeway, checks the
    issuer,

    and rejects the token if its backing refresh token was revoked or the user is

    inactive. The REST auth middleware and the WebSocket auth_required->auth handshake

    both route through this validation, and the WS path additionally registers a

    revoke-token callback that drops the live socket when the token is revoked. This
    is a

    well-scoped token-authenticity verification with explicit algorithm pinning and

    revocation propagation.

    '
  maturity: implemented
  scope: "Confirmed in code for Core's interactive bearer path (REST middleware +\
    \ WS handshake):\nalgorithm is pinned to HS256, the signing key is the per-refresh-token\
    \ jwt_key, and\nrevocation/inactive-user are enforced at validation. NOT addressed:\
    \ the per-token\njwt_key never rotates and refresh/long-lived tokens are effectively\
    \ non-expiring\n(Ephemeral findings) \u2014 so authenticity verification is strong\
    \ at the moment of check\nbut the credential it verifies is long-lived; and this\
    \ chokepoint does NOT cover the\nbearer-LESS mobile_app webhook path (separate\
    \ finding). Algorithm-pinning prevents\nkey-confusion only because HS256 is the\
    \ sole accepted algorithm.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.AuthManager.async_validate_access_token:L654-L682@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: verify_and_decode(token, jwt_key, leeway=10, issuer=issuer, algorithms=["HS256"])
      ... not refresh_token.user.is_active
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.websocket_api.auth.AuthPhase.async_handle:L85-L123@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: refresh_token := self._hass.auth.async_validate_access_token(access_token)
      ... async_register_revoke_token_callback
  control_mappings:
    nist_800_53r5:
    - IA-2
    - SC-23
    - SC-23(3)
    - IA-2(8)
    mitre_attack_mitigations:
    - id: M1047
      rationale: Algorithm-pinned, revocation-aware token validation rejects forged
        or revoked tokens at a single audited chokepoint (counters T1550.001 application
        access token reuse).
  caveats:
  - 'The verified credential is long-lived: jwt_key never rotates and refresh/long-lived
    tokens do not expire (Ephemeral).'
  - Does not cover the bearer-less mobile_app webhook path.
  - HS256-only is what prevents key-confusion; no asymmetric verification option.
  related_concerns:
  - ephemeral
  - non_repudiation
- schema_version: 1
  id: avail-cap-f97d3d6b
  agent: availability
  apd_tier: trustworthiness
  apd_goal: availability
  title: Per-token rate limiting on the Firebase push-relay request handler
  description: 'The mobile-apps-fcm-push relay request handler (cev-08000001) enforces
    a

    per-push_token rate limit: it reads push_token from the request body,

    rejects a missing token with 403, and calls

    rateLimiter.checkRateLimit(token), returning 429 when the per-token quota

    is exceeded. This is an identity-dimensioned (per-token) resource-

    consumption control with explicit breach behavior on the one availability

    surface in scope that actually has a throttle.

    '
  maturity: implemented
  scope: "Confirmed for the push-relay request handler (functions/handlers.js,\ncev-08000001):\
    \ per-token (push_token) rate limit with a 429 breach\nresponse. NOT addressed:\
    \ this is the only rate limit observed anywhere in\nthe Home Assistant availability\
    \ surface \u2014 the Core REST boundary, the WS\nauth_required handshake, the\
    \ bearer-less mobile_app webhook entrypoint, and\nthe Supervisor API all lack\
    \ a documented rate limit (see availability\nfindings avail-0002webh, avail-0003rest,\
    \ and the threat-model D cells). The\nrelay limit bounds notification-spam abuse,\
    \ not relay-outage availability.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:functions.handlers.handleRequest:L51-L95@142579dc41ee534f0d60bc390c4661dba051a995
    excerpt: rateLimitInfo = await rateLimiter.checkRateLimit(token)
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-5(1)
    - SC-6
  caveats:
  - Per-token threshold, time window, and reset behavior are not stated in the artifacts;
    only the existence of the per-token check and the 429 response are confirmed.
  - No caller authentication on the relay (Authenticity concern); the rate limit is
    keyed on an unauthenticated push_token.
  - This control protects only the push-relay tier, not the Core or Supervisor availability
    surfaces.
  related_concerns:
  - resilient
  - authenticity
- schema_version: 1
  id: conf-cap-01c47d42
  agent: confidentiality
  apd_tier: trustworthiness
  apd_goal: confidentiality
  title: Android mTLS client-cert private key held in non-exportable hardware-backed
    AndroidKeyStore
  description: "`common...data.keychain.KeyStoreRepositoryImpl` (cev-f6000001) stores\
    \ the\nmTLS client-certificate private key in `KeyStore.getInstance(\"AndroidKeyStore\"\
    )`,\nthe hardware-backed Android key store. The protection of\nandroid_keystore_mtls_client_key\
    \ rests on the key being non-exportable: it\ncannot be read out of the TEE/StrongBox\
    \ into app memory, so even a rooted\ndevice or a process-memory dump does not\
    \ yield the raw private key \u2014 the\nattacker can at most use it in place while\
    \ the device is unlocked. This is\nthe correct custody model for an on-device\
    \ asymmetric secret.\n"
  maturity: implemented
  scope: "Confirmed for the Android Companion mTLS client-cert private key via the\n\
    AndroidKeyStore (code-grounded, cev-f6000001). NOT extended to the\nsession/refresh\
    \ bearer tokens or the location_history table, which live in\nthe UNENCRYPTED\
    \ Room database (see finding conf-androidr) \u2014 so this\ncapability covers\
    \ the mTLS key only, not the broader on-device secret\nestate. iOS-side key custody\
    \ (Keychain) is evaluated separately and has a\nhardening gap (finding conf-ioskeych).\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:common...data.keychain.KeyStoreRepositoryImpl:L108-L112@bf8215602c19f20f4abf9c1dbfcbc2a3e4cf1bea
    excerpt: KeyStore.getInstance("AndroidKeyStore") // hardware-backed key store
  control_mappings:
    nist_800_53r5:
    - SC-12
    - SC-12(3)
    - SC-28
    - IA-7
    mitre_attack_mitigations:
    - id: M1041
      rationale: Non-exportable hardware-backed key storage mitigates collection of
        the mTLS private key from device storage or process memory (T1409, T1552).
    masvs:
    - MASVS-STORAGE-1
    - MASVS-CRYPTO-2
    mitre_attack:
    - technique: T1409
      sub_technique: null
      tactic: TA0035
      rationale: A non-exportable AndroidKeyStore key denies the Stored Application
        Data extraction of the mTLS private key even on a device with file access.
    d3fend:
    - technique: D3-CBAN
      rationale: Hardware-backed non-exportable custody of the client-cert private
        key underpins certificate-based authentication of the device to the backend.
      counters_attack:
      - T1409
  caveats:
  - Covers the mTLS key only; bearer tokens and location PII are in the unencrypted
    Room DB (finding conf-androidr).
  - Non-exportability protects key-at-rest; it does not prevent in-place use on an
    unlocked rooted device.
  related_concerns:
  - authenticity
- schema_version: 1
  id: conf-cap-1044dbb3
  agent: confidentiality
  apd_tier: trustworthiness
  apd_goal: confidentiality
  title: User passwords stored as bcrypt hashes (rounds=12) with a constant-time miss
    path
  description: '`homeassistant.auth.providers.homeassistant.Data.hash_password`

    (cev-a1000004) hashes passwords with `bcrypt.hashpw(..., bcrypt.gensalt(rounds=12))`,

    and `validate_login` (cev-a1000005) performs a dummy `bcrypt.checkpw` on a

    user miss so login timing does not reveal account existence. Passwords are

    therefore never persisted in recoverable form, and the bcrypt work factor

    (rounds=12) raises the cost of offline cracking should the hash store be

    read. This is the correct one-way-storage posture for the credential

    factor.

    '
  maturity: implemented
  scope: "Confirmed for the homeassistant auth provider's password factor\n(code-grounded,\
    \ cev-a1000004/5). Important boundary: the bcrypt HASH is\nstrong, but it is persisted\
    \ to .storage as PLAINTEXT JSON (no\nencryption-at-rest layer, finding conf-st0rag31)\
    \ alongside the MFA/TOTP\nseeds and the per-token jwt_keys \u2014 so this capability\
    \ protects the\npassword factor specifically, NOT the surrounding secret estate.\
    \ The\n72-byte bcrypt truncation is noted but standard.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.providers.homeassistant.Data.hash_password:L189-L198@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: hashed = bcrypt.hashpw(password.encode()[:72], bcrypt.gensalt(rounds=12))
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.providers.homeassistant.Data.validate_login:L160-L187@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'bcrypt.checkpw(b"foo", dummy) # check a hash to make timing the same'
  control_mappings:
    nist_800_53r5:
    - IA-5(1)
    - SC-13
    - SC-28(1)
    mitre_attack_mitigations:
    - id: M1027
      rationale: bcrypt rounds=12 one-way hashing of passwords raises the cost of
        offline credential cracking (T1110) if the .storage auth file is read.
    mitre_attack:
    - technique: T1110
      sub_technique: T1110.002
      tactic: TA0006
      rationale: The bcrypt rounds=12 work factor materially slows offline Password
        Cracking of a recovered hash store.
    d3fend:
    - technique: D3-CH
      rationale: bcrypt rounds=12 one-way hashing with per-user salt is the Credential
        Hardening technique applied to the stored password factor.
      counters_attack:
      - T1110
  caveats:
  - The bcrypt hash is stored in plaintext .storage with no encryption-at-rest (finding
    conf-st0rag31).
  - MFA/TOTP seeds and jwt_keys in the same store are NOT one-way and are recoverable
    in plaintext.
  related_concerns:
  - authenticity
- schema_version: 1
  id: conf-cap-277b2364
  agent: confidentiality
  apd_tier: trustworthiness
  apd_goal: confidentiality
  title: Optional NaCl SecretBox encryption of mobile_app webhook payload bodies (in-transit
    confidentiality, opt-in)
  description: "At device registration, `RegistrationsView.post` (cev-a1000014) mints\
    \ a\nper-device `CONF_SECRET` of `secrets.token_hex(SecretBox.KEY_SIZE)` so the\n\
    mobile_app webhook path can encrypt request bodies with libsodium's NaCl\nSecretBox\
    \ (authenticated symmetric encryption). When enabled\n(`supports_encryption`),\
    \ webhook payloads \u2014 location, sensor PII \u2014 are\nconfidential in transit\
    \ independent of the transport TLS, which is\nvaluable on the bearer-less cloudhook\
    \ path that may traverse the Nabu Casa\nrelay.\n"
  maturity: implemented
  scope: 'Confirmed that the registration path mints a SecretBox key and the webhook

    supports encrypted bodies (code-grounded, cev-a1000014). The decisive

    caveat: encryption is OPT-IN (`supports_encryption`), so the default /

    non-encrypting client sends payloads in cleartext at the application layer,

    and the per-device secret is itself persisted to the on-device store

    (unencrypted Android Room, finding conf-androidr) and to plaintext

    .storage server-side (finding conf-st0rag31). This capability covers

    payload-body confidentiality ONLY when a client opts in; it does not

    protect the webhook_id (which is the bearer-less authenticator) and does

    not add per-entity authorization to the service-call path (cev-a1000015).

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.mobile_app.http_api.RegistrationsView.post:L67-L88@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: data[CONF_SECRET] = secrets.token_hex(SecretBox.KEY_SIZE)
  control_mappings:
    nist_800_53r5:
    - SC-8
    - SC-8(1)
    - SC-12
    - SC-13
    mitre_attack_mitigations:
    - id: M1041
      rationale: NaCl SecretBox authenticated encryption of webhook bodies mitigates
        interception of location/sensor PII in transit (T1040) when enabled.
    mitre_attack:
    - technique: T1040
      sub_technique: null
      tactic: TA0006
      rationale: SecretBox-encrypted bodies deny Network Sniffing of the webhook payload
        PII independent of the transport layer.
  caveats:
  - Encryption is opt-in (supports_encryption); default clients send cleartext application-layer
    payloads.
  - The per-device secret is persisted to the unencrypted on-device Room DB and plaintext
    server-side .storage.
  - Protects body confidentiality only; the webhook_id remains a bearer-less authenticator
    with no per-entity authz (cev-a1000015).
  related_concerns:
  - authenticity
  - integrity
- schema_version: 1
  id: conf-cap-88473a97
  agent: confidentiality
  apd_tier: trustworthiness
  apd_goal: confidentiality
  title: Per-entity READ permission enforced at the state-read API (access scoping
    at data-element granularity)
  description: "`homeassistant.components.api.APIEntityStateView.get` (cev-a1000011)\n\
    enforces `user.permissions.check_entity(entity_id, POLICY_READ)` and\nraises `Unauthorized`\
    \ on deny, and `filter_entity_ids_by_permission`\n(cev-a1000007) scopes the entity\
    \ set a non-admin user can read per the\ncompiled policy (`compile_policy`, cev-a1000006,\
    \ which fails closed to\ndeny-all on an empty/None policy). This is genuine field-/element-level\n\
    confidentiality scoping for entity-state reads, and it RESOLVES the intake\nbrief's\
    \ open question \u2014 the per-entity policy is enforced at runtime,\ncontradicting\
    \ the \"not enforced yet\" documentation.\n"
  maturity: implemented
  scope: 'Confirmed for entity-state READS on GET /api/states/{entity_id}

    (cev-a1000011) and the filtered list path (cev-a1000007), with deny-all

    default (cev-a1000006). NOT extended in two material ways: (1) the filter

    SHORT-CIRCUITS to allow-all for ANY admin (cev-a1000007) and the owner is

    unconditional all-access (cev-a1000008), so this scoping protects against

    non-admin over-reach only; (2) the WRITE path (POST /api/states) is

    admin-or-deny with NO per-entity write policy (cev-a1000012), and

    /api/config is unscoped (finding conf-apiconfig). The webhook service-call

    path applies no per-entity check at all (cev-a1000015).

    '
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.components.api.APIEntityStateView.get:L242-L255@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'if not user.permissions.check_entity(entity_id, POLICY_READ): raise
      Unauthorized(entity_id=entity_id)'
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.permissions.filter_entity_ids_by_permission:L32-L39@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'if user.is_admin or user.permissions.access_all_entities(key): return
      list(entity_ids)'
  control_mappings:
