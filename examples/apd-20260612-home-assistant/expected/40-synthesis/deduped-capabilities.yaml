    \ per-role\npath allow-lists (cev-b2000002), and ingress header-injection-with-strip\n\
    (cev-b2000005). NOT covered: ROLE_ADMIN matches everything (re.compile(\".*\"\
    ),\ncev-b2000002), so an admin-role add-on or one with protection mode disabled\n\
    reaches the full Supervisor API and the Docker socket -> host root \u2014 the\
    \ gate\nweakens to nothing for that configuration; runtime enforcement of protection-mode\n\
    and AppArmor was not separately confirmed in code beyond the role ACL.\n"
