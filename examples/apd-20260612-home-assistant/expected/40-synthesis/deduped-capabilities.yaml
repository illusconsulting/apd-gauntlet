  id: resil-cap-c76c9240
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  title: Push relay enforces a per-token rate limit bounding abuse on the single notification
    path
  description: 'The Firebase Cloud Functions push relay (handlers.handleRequest,

    cev-08000001) reads the push_token from the request body and applies a

    per-token rate limit, rejecting with a 429 when the limit is exceeded. On

    the single notification path this is a partial backpressure / admission

    control: it bounds the volume one token can drive through the relay, so a

    single misbehaving or abusive sender cannot arbitrarily saturate the shared

    relay and starve other users'' notification delivery.

    '
  maturity: implemented
  scope: "Confirmed at the relay's handleRequest entrypoint (cev-08000001), grounded\n\
    in code evidence \u2014 a per-token (not per-caller) rate limit returning 429.\n\
    It bounds per-token volume only; it is NOT relay-outage resilience (no\nretry/queue/fallback\
    \ when the relay itself is down \u2014 resil-01000006), does\nNOT authenticate\
    \ the caller (any valid-format token drives the relay \u2014 a\nNon-Repudiation/Authenticity\
    \ gap owned elsewhere), and does not provide a\nrelay availability SLA or regional\
    \ redundancy (avail-a2cfd41c).\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:functions.handlers.handleRequest:L51-L95@142579dc41ee534f0d60bc390c4661dba051a995
    excerpt: rateLimitInfo = await rateLimiter.checkRateLimit(token)
  control_mappings:
    nist_800_53r5:
    - SC-5
    - SC-5(1)
    - SC-6
  caveats:
  - "Bounds per-token volume only; it is not relay-outage resilience (no retry/queue/fallback\
    \ when the relay is down \u2014 resil-01000006)."
  - The relay does not authenticate the caller (cev-08000001), so the rate limit is
    the only abuse bound on an otherwise unauthenticated path.
  - Does not provide a relay availability SLA or regional redundancy (avail-a2cfd41c).
  related_concerns:
  - availability
  - non_repudiation
- schema_version: 1
  id: resil-cap-fa365a2d
  agent: resilient
  apd_tier: scalability
  apd_goal: resilient
  title: Permission engine fails closed (deny-all) on an empty, missing, or unparseable
    policy
  description: "compile_policy (cev-a1000006) compiles a per-entity allow/deny decision\n\
    function and, when the policy is empty or None, returns apply_policy_deny_all\n\
    (a function that returns False for every entity). The failure behavior on a\n\
    corrupt or missing policy is therefore fail-closed: the engine fails into a\n\
    known safe state (deny-all) rather than failing open to allow-all. This is\nthe\
    \ Resilient fail-safe / fail-in-known-state property of the authorization\ncontrol\
    \ \u2014 a corrupted policy source degrades to \"deny\" (a safe denial-of-\nservice\
    \ for legitimate users) rather than silent privilege escalation.\n"
  maturity: implemented
  scope: "Confirmed for the per-entity permission decision path in Core\n(compile_policy,\
    \ cev-a1000006), grounded in code evidence. This is one\nfail-safe point, NOT\
    \ a platform-wide degradation strategy: it does not\naddress the shared-event-loop\
    \ stall failure mode, outbound-integration\ntimeouts/breakers, or any declared\
    \ read-only/safe-mode for dependency\nunavailability \u2014 those are open Resilient\
    \ findings (resil-01000001/2/8).\nThe owner identity short-circuits the policy\
    \ entirely (cev-a1000008), so\nthe fail-closed property protects non-owner scoping\
    \ only.\n"
  evidence:
  - artifact: code-evidence-index.yaml
    locator: code:homeassistant.auth.permissions.util.compile_policy:L23-L52@28076bcad6158160647ac62c92f1ff5acd4851ca
    excerpt: 'def apply_policy_deny_all(entity_id, key): return False'
  control_mappings:
    nist_800_53r5:
    - SC-24
    - CP-12
    - SI-13
  caveats:
  - This is a single fail-safe point in the authorization path, not a platform-wide
    graceful-degradation strategy (see resil-01000008).
  - Owner identity short-circuits the policy (cev-a1000008), so the fail-closed property
    governs non-owner scoping only.
  - Fail-closed deny-all is a safe-by-default posture but is a denial-of-service for
    legitimate users on policy corruption (the availability trade-off).
  related_concerns:
  - authenticity
  - availability
