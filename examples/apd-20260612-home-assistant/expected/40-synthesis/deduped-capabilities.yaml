    that add-on''s declared hassio_role; on no match it default-denies (logs a warning

    and does not grant). The per-role path allow-lists (ADDONS_ROLE_ACCESS,

    cev-b2000002) constrain which Supervisor API routes each role may reach, gating

    access to the Docker-socket control plane (cev-b2000003) for any caller below
    the

    admin role. Ingress additionally strips inbound X-Remote-User-* headers and

    re-injects session-derived values (cev-b2000005), preventing a client from

    spoofing an identity header into an add-on via the ingress path. These are

    write-path authorization controls on the most privileged surface.

    '
  maturity: implemented
