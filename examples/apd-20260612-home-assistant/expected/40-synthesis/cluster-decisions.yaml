    decision: merge
    merged_title: "Core and Supervisor emit no attributable security-audit record over the consequential-action surface (device actuation, auth lifecycle, privileged Supervisor API)"
    merged_summary: "There is no security-purposed audit stream in Core or Supervisor: admin-gated state writes and service calls that actuate locks/alarms, the entire auth/token/credential lifecycle, and the host-root-equivalent Supervisor operations (add-on install, backup, container-exec) all complete with no attributable record naming who did what, leaving the highest-impact action paths fully deniable and credential-compromise reconstruction impossible."
    merged_detail: |
      Three Non-Repudiation findings cite distinct entrypoints (POST /api/states
      and service dispatch; the Core auth subsystem's token/credential events;
      the Supervisor privileged-API middleware) but share one root cause: the
      system has no security-audit stream over its consequential-action surface.
      The device-actuation path emits no record naming who actuated which lock
      or alarm (nonrep-12328d11). The auth subsystem produces no auditable event
      for login success/failure, token issuance/refresh/revocation, or
      password/MFA change (nonrep-5dd8b9f0). The Supervisor middleware logs only
      role-DENY misses as a diagnostic warning; the host-root-equivalent
      operations it ALLOWS (add-on lifecycle, backup, Docker exec) produce no
      record of the allowed action or its caller (nonrep-3b6ebb6c). Each is the
      same gap — no attributable audit over consequential actions — observed at
      a different surface. Merging them yields one coherent finding: the
      audit-stream absence, scoped across the three action surfaces, so the
      remediation is designed once rather than three times. The os-agent
      host-root audit gap (nonrep-177fa3cc) and the audit-read/SoD gap
      (nonrep-30404306) are downstream of the same absence and are linked.
    merged_recommendation:
      posture: required
      summary: "Introduce one security-audit stream covering device actuation, auth lifecycle, and privileged Supervisor operations, with actor attribution on every entry."
      detail: |
        The three lenses reinforce a single program. Define the consequential-
        action surface (device actuation via /api/states and service calls; the
        full auth/token/credential/MFA lifecycle; every ALLOWED Supervisor
        privileged operation — add-on install/remove, backup, container exec),
        then emit a security-purposed audit record on each, distinct from the
        user-facing logbook and the diagnostic logger, carrying actor (subject,
        on-behalf-of, source), action, target, and time. Critically, log
        ALLOWED privileged operations, not only DENIED ones — the current
        Supervisor middleware inverts this. Pair the stream with tamper-evidence
        and an audit-read/segregation-of-duties role (tracked in the linked
        os-agent and audit-read records) so the new evidence is itself durable
        and access-controlled. This is required: without it the highest-impact
        actions in the system are unattributable and disputes are unwinnable.
    lens_perspectives:
