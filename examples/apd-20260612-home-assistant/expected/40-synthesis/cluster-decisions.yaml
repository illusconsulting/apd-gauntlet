    decision: merge
    merged_title: "Core .storage is plaintext JSON with no content MAC, version history, or drift detection, so a file-write tampers keys/policy and config changes leave no immutable record"
    merged_summary: "All Home Assistant .storage (refresh-token jwt_keys, user/group policy, integration secrets, plus configuration.yaml) is mutable plaintext gated only by 0600 file permissions, with no content MAC, no required version history or signed-commit path, and no declared-vs-actual drift detection, so a single file-write both forges signing keys/escalates privilege undetected and leaves config changes with no immutable change record."
    merged_detail: |
      The Integrity and Immutability lenses converge on the same artifact —
      .storage written in place by Store._write_prepared_data as plaintext
      UTF-8 JSON, protected only by 0600 filesystem permissions — for two
      properties it lacks. The Integrity lens: there is no MAC or content hash
      over the records, so a file-write primitive forges refresh-token jwt_keys
      (minting valid access tokens) or rewrites the user/group permission
      policy (escalating a principal) with no detection at read time. The
      Immutability lens: the same plaintext store, plus configuration.yaml, has
      no required version history, no signed-commit/GitOps-only change path, and
      no drift detection between declared and running state, so the change that
      tampers it also leaves no immutable record that it occurred. These are one
      root cause — .storage has no cryptographic protection and no change
      provenance — viewed as a write-time forgery risk and as a preservation/
      change-record gap. The Confidentiality lens on the same .storage
      (conf-fdf0fb06, no encryption at rest, critical) is the third face of the
      convergence and is linked rather than merged because it lives in another
      candidate group; together the three are the Conf+Integrity+Immutability
      .storage triad.
    merged_recommendation:
      posture: required
      summary: "Add a content MAC plus a versioned, drift-detected change path over .storage so tampering both fails verification and leaves an immutable record."
      detail: |
        The two lenses reinforce: a single protection program closes both. (1)
        Integrity — add a keyed MAC or signed-content envelope over each
        .storage record (key held outside the .storage tree), verified on read,
        so a directed file-write that forges a jwt_key or flips a policy fails
        verification rather than silently taking effect. (2) Immutability —
        route config-affecting .storage and configuration.yaml changes through a
        versioned, signed-commit/GitOps path as the only sanctioned mutation
        route, and run declared-vs-actual drift detection so an out-of-band edit
        is both rejected and recorded. Pair this with the Confidentiality
        at-rest encryption tracked in the linked .storage record — the MAC
        protects against tamper, the encryption against disclosure, and the
        version history against silent change; all three are required because
        each leaves a distinct exposure standing if omitted.
    lens_perspectives:
      integrity:
        summary: "All .storage is plaintext JSON gated only by 0600 file perms; there is no integrity protection on refresh-token jwt_keys, user/group policy, or integration secrets, so a file-write primitive forges signing keys or escalates a user with no detection."
        detail: "intg-4768c0f0: Store._write_prepared_data writes .storage as plaintext UTF-8 JSON with 0600 perms and no MAC/content hash; a file-write primitive forges refresh-token jwt_keys or escalates a user via the permission policy with no read-time detection. Mapped SI-7/SI-7(1)/CM-5/SC-28; ATT&CK T1606."
      immutability:
