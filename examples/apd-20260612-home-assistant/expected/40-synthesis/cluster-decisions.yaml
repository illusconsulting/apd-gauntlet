        to: nonrep-cap-e865e0d3

  # === cluster-cand-000b — capabilities (overlap + related_concerns + title) ==
  # Push-relay rate-limit attested by both availability and resilient lenses,
  # and the fail-closed policy compilation attested by integrity and resilient
  # lenses. These are the same control seen twice each. Capabilities are not
  # merged; link the cross-lens duplicate pairs so both the availability and
  # resilient (and integrity/resilient) attestations remain on record.
  - group_id: cluster-cand-000b
    decision: separate
    links:
      - from: avail-cap-f97d3d6b
        to: resil-cap-c76c9240
      - from: intg-cap-e18bb24c
        to: resil-cap-fa365a2d

  # === cluster-cand-000c — capabilities (evidence_locator_overlap) =======
  # Two capabilities on the SAME WS revoke-callback mechanism: dist-cap-827afb47
  # (distributed: strongly-consistent in-process revocation propagation) and
  # resil-cap-6a038f48 (resilient: socket self-corrects to closed on
  # revocation). Same control, two lenses. Per capability discipline, keep both
  # positive attestations rather than collapsing; link them.
  - group_id: cluster-cand-000c
    decision: separate
    links:
      - from: dist-cap-827afb47
        to: resil-cap-6a038f48

# ---------------------------------------------------------------------------
# Contradictions: finding-vs-capability conflicts to classify.
# The per-entity READ authorization capabilities (conf-cap-88473a97 /
# intg-cap-ecebb879) explicitly state the code-recon pass RESOLVES the intake
# brief's "not enforced yet" doc note to ENFORCED for reads. This is a
# capability that supersedes a stale documentation premise — but the matching
# write-path findings (intg-d6c5e666 admin-or-deny state WRITE; intg-5df46115
# webhook call_service no per-entity authz) are COMPATIBLE, not contradicted:
# the capability covers READ scoping only and the findings explicitly cover the
# WRITE path, which the capability does NOT claim. The intg-cap-e18bb24c /
# resil-cap-fa365a2d fail-closed capability self-documents the same boundary:
# it protects against accidental corruption, NOT a directed tamper-to-True,
# which is exactly the standing intg-4768c0f0 finding.
# ---------------------------------------------------------------------------
contradictions:
  - finding_id: intg-d6c5e666
    capability_id: conf-cap-88473a97
    classification: compatible
    finding_assertion: "POST /api/states write enforces only is_admin with no per-entity write policy, so any admin token mutates arbitrary entity state."
    capability_assertion: "APIEntityStateView.get enforces per-entity check_entity(POLICY_READ) and filter_entity_ids_by_permission scopes the readable set per the compiled policy, resolving the brief's open question to ENFORCED for reads."
    evidence_comparison: "The capability cites the GET path (L242-L255, check_entity POLICY_READ) and is explicit that it scopes READS; the finding cites the POST path (L257-L275, is_admin-or-deny) and is explicit that it concerns WRITES. The same permission engine is per-entity on read but coarse admin-or-deny on write — an asymmetry both records independently observe — so they describe adjacent, non-overlapping surfaces rather than the same claim."
    recommended_resolution: "Keep both: the capability stands as a confirmed READ-path control and the finding stands as an open WRITE-path gap. Neither downgrades the other; the asymmetry itself is the actionable signal (extend per-entity policy to the write path)."
  - finding_id: intg-5df46115
    capability_id: intg-cap-ecebb879
    classification: compatible
    finding_assertion: "mobile_app webhook_call_service actuates arbitrary services (locks/alarms) with no per-entity write-path authorization, mutating state outside the permission engine."
    capability_assertion: "Per-entity READ permission is enforced at the state view with deny-all-by-default policy compilation; the code-recon pass resolves the brief's load-bearing authz gap to ENFORCED for reads."
    evidence_comparison: "The capability's scope is explicitly the READ path (APIEntityStateView.get, check_entity POLICY_READ, compile_policy fail-closed) and even names the doc note it resolves; the finding's scope is the webhook write path (webhook_call_service, registration_context, no per-entity check) which routes AROUND the permission engine entirely. The capability never claims write-path or webhook-path coverage, so its ENFORCED-for-reads attestation does not touch the finding's claim."
    recommended_resolution: "Keep both. The capability resolves the READ-side documentation staleness; the finding's WRITE-side and webhook-bypass gaps are untouched by it and remain open. No maturity change."
  - finding_id: intg-4768c0f0
    capability_id: intg-cap-e18bb24c
    classification: compatible
    finding_assertion: "Core .storage records have no MAC or content hash, so a directed file-write silently forges refresh-token jwt_keys or escalates a user via the permission policy."
    capability_assertion: "Permission policy compilation fails closed to deny-all on an empty or corrupt policy, so a missing/truncated/unparseable policy denies rather than defaulting open."
    evidence_comparison: "The capability (compile_policy, apply_policy_deny_all) protects against ACCIDENTAL corruption and truncation — a malformed policy degrades to deny — and its own prose explicitly carves out that it does NOT protect against a DIRECTED tamper-to-True/allow-all. The finding is precisely that directed tamper: a file-write that sets policy to True or forges a jwt_key, which fail-closed compilation does not detect or prevent. The two address disjoint threat models (random corruption vs. adversarial write) on the same policy artifact."
    recommended_resolution: "Keep both. The fail-closed capability is a genuine resilience/safe-default property; it neither covers nor weakens the directed-tamper finding. The MAC/content-hash remediation in the finding is the control that would close the directed-tamper gap the capability self-admits it does not."

