  # bulkhead) are distinct resilience gaps; the event-loop-isolation pair
  # (resil-5e5a02f0 + resil-cb12ebae) is one root cause — the shared single
  # asyncio loop with no per-integration isolation. Merge that pair; link the
  # audit records out and the webhook/push records to their siblings.
  - group_id: cluster-cand-0006
    decision: merge
    merged_title: "2000+ in-process integrations and the recorder write path share one asyncio event loop with no per-integration timeout, bulkhead, or circuit breaker"
    merged_summary: "Every one of 2000+ integrations and the recorder write path run on Core's single shared asyncio loop with no per-call timeout, circuit breaker, bulkhead, or execution-time budget, so one slow or hostile integration or outbound call blocks the loop and cascades to a platform-wide stall that starves the consequential alarm/lock and recorder paths."
    merged_detail: |
      Two Resilient findings describe the same structural decision from the
      inbound and outbound sides of the shared loop. resil-5e5a02f0: outbound
      calls from 2000+ in-process integrations to external devices/clouds run on
      the shared loop with no per-call timeout or circuit breaker, so a slow or
      hostile endpoint blocks the loop. resil-cb12ebae: the same 2000+
      integrations plus the recorder write path share one asyncio loop with no
      bulkhead, per-integration execution-time budget, or watchdog, so one
      blocking integration starves the consequential alarm/lock and recorder
      paths. Both name the identical root cause — a single shared event loop
      with no isolation primitive — one emphasizing the missing outbound
      timeout/breaker and the other the missing bulkhead/budget. Merging keeps
      the isolation remediation as one design problem (loop isolation) rather
      than two partial patches. The webhook-backpressure (resil-872de693),
      mobile-reconnect (resil-895658c9), and push-queue-replay (resil-a4c9535c)
      records are distinct resilience gaps on other surfaces and are linked, as
      are the WebView fail-safe (resil-43c0c35b) and the two audit records that
      belong to the cross-group audit-absence finding.
    merged_recommendation:
      posture: required
      summary: "Isolate integrations and the recorder path from the shared loop with per-call timeouts, circuit breakers, and bulkheads."
      detail: |
        The two lenses reinforce one isolation design. Add a per-call timeout
        and circuit breaker on every outbound integration call so a slow or
        hostile external endpoint cannot pin the loop (resil-5e5a02f0), AND add
        a bulkhead / per-integration execution-time budget plus a watchdog so a
        single misbehaving integration cannot starve the consequential
        alarm/lock and recorder paths (resil-cb12ebae). Run the recorder write
        path and the consequential-actuation path in protected lanes (separate
        executor or priority budget) so they survive a noisy integration. This
        is required: the alarm/lock control path is the highest-consequence
        surface and it currently shares an unbounded loop with 2000+ third-party
        integrations.
    lens_perspectives:
      resilient:
        summary: "2000+ integrations and the recorder write path share one asyncio loop with no bulkhead, per-integration execution-time budget, or watchdog, so one blocking integration starves the consequential alarm/lock and recorder paths."
        detail: "Two merged Resilient findings on the shared loop. resil-5e5a02f0 (outbound side): no per-call timeout or circuit breaker on integration calls to external devices/clouds, so a slow/hostile endpoint blocks the loop and cascades platform-wide; mapped SI-13/SC-5/CP-13. resil-cb12ebae (isolation side): no bulkhead, per-integration execution-time budget, or watchdog isolating one integration from the shared loop, so one blocking integration starves the alarm/lock and recorder paths; mapped SC-6/SI-13/SC-5."
