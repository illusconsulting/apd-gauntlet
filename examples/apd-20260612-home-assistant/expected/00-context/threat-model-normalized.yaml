  threat: 'A Long-Lived Access Token is a user-minted, long-horizon bearer issued from /profile; it authenticates as its owning user with that user''s full permission set. Spoofing applies: anyone who replays a leaked LLAT is indistinguishable from the user, and an owner-issued LLAT inherits owner all-access (cev-a1000008). LLATs are validated by the same async_validate_access_token chokepoint (cev-a1000002) and revoked only by deleting the backing refresh token.'
  mitigation: Validation is centralized (cev-a1000002, rejects if refresh token revoked or user inactive); revocation is by refresh-token delete. No automatic expiry — the token remains valid until explicitly deleted.
