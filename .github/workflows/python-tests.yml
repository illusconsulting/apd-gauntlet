name: python-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check tools/ tests/
      - run: mypy tools/
      - run: pytest --cov --cov-report=term-missing
      - name: Check precompiled report-template bundle freshness
        run: python tools/check_report_template_freshness.py
      - name: Check KB cache provenance freshness
        run: python tools/check_kb_cache_freshness.py
      - name: Check NOTICE attributions present
        run: python tools/check_notice_present.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_wheel_install_smoke.py -m wheel -v
