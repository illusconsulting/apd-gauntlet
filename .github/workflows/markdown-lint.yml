name: markdown-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd  # v23.2.0
        with:
          globs: |
            docs/**/*.md
            !docs/superpowers/plans/**
            .claude/**/*.md
            tools/apd_gauntlet/data/domains/**/*.md
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            CODE_OF_CONDUCT.md
  plugin-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: apd-gauntlet lint-agents --agent-dir .claude/agents/
      - run: apd-gauntlet lint-skills --skill-dir .claude/skills/
      - name: Validate plugin + marketplace manifests
        run: pytest tests/test_plugin_manifest.py -v
