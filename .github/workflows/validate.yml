name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate bundled example
        run: apd-gauntlet validate examples/apd-20260601-claim-event-bus/expected/
      - name: Validate second bundled example
        run: apd-gauntlet validate examples/apd-20260602-acme-mobile-banking/expected/
      - name: Validate Home Assistant example
        run: apd-gauntlet validate examples/apd-20260612-home-assistant/expected/
      - name: Validate domain pack
        run: apd-gauntlet validate-domain pbm
      - name: Meta-validate all schemas
        run: pytest tests/test_meta_schemas.py -v
  plugin-manifest:
    # Defense-in-depth: catches malformed manifest JSON / missing required
    # fields. Does NOT catch the skills file-vs-directory error (verified on
    # CLI 2.0.76: it exits 0 on that) — the load-bearing guard for the
    # path-form class is
    # tests/test_plugin_manifest.py::test_manifest_satisfies_loader_contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: "20" }
      # Pinned to the CLI version the exits-0-on-path-form behavior was
      # verified on (2026-07-14, re-verified 2026-08-02). Bump deliberately.
      - run: npm install -g @anthropic-ai/claude-code@2.0.76
      - run: claude --version
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: claude plugin validate .claude-plugin/marketplace.json
