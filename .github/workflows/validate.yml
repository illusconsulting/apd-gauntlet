name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate bundled example
        run: apd-gauntlet validate examples/apd-20260601-claim-event-bus/expected/
      - name: Validate second bundled example
        run: apd-gauntlet validate examples/apd-20260602-acme-mobile-banking/expected/
      - name: Validate Home Assistant example
        run: apd-gauntlet validate examples/apd-20260612-home-assistant/expected/
      - name: Validate domain pack
        run: apd-gauntlet validate-domain pbm
      - name: Meta-validate all schemas
        run: pytest tests/test_meta_schemas.py -v
