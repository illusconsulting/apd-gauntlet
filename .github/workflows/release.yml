name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for PyPI trusted publishing and sigstore signing
      attestations: write   # for SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" build
      - run: pytest --cov --cov-report=term-missing
      - run: apd-gauntlet validate examples/apd-20260601-claim-event-bus/expected/
      - run: python -m build
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/whlenv
          /tmp/whlenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/whlenv/bin/apd-gauntlet --version
          /tmp/whlenv/bin/apd-gauntlet validate-domain pbm
      - name: Validate plugin + marketplace manifests
        run: pytest tests/test_plugin_manifest.py -v
      - name: Generate SLSA build-provenance attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
