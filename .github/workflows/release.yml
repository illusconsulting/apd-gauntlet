name: release

# Two release lines publish from this one workflow (see RELEASING.md):
#   stable  — main (and release/X.Y after a major GA)  → PyPI default, GitHub "Latest"
#   next    — next (a/b/rc/dev pre-releases)            → PyPI pre-release, GitHub pre-release
# tools/check_release_tag.py refuses any tag that does not match the package
# version or does not sit on the branch allowed for its kind of version.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for PyPI trusted publishing and sigstore signing
      attestations: write   # for SLSA build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0    # the release gate needs every branch and tag
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" build
      - name: Release gate (tag ↔ version ↔ branch line)
        id: gate
        run: python tools/check_release_tag.py --tag "$GITHUB_REF_NAME"
      - run: pytest --cov --cov-report=term-missing
      - run: apd-gauntlet validate examples/apd-20260601-claim-event-bus/expected/
      - run: python -m build
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/whlenv
          /tmp/whlenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/whlenv/bin/apd-gauntlet --version
          /tmp/whlenv/bin/apd-gauntlet validate-domain pbm
      - name: Validate plugin + marketplace manifests
        run: pytest tests/test_plugin_manifest.py -v
      - name: Generate SLSA build-provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.gate.outputs.prerelease }}
          make_latest: ${{ steps.gate.outputs.make_latest }}
          files: |
            dist/*.whl
            dist/*.tar.gz
