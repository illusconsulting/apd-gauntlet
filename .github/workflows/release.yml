name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for PyPI trusted publishing and sigstore signing
      attestations: write   # for SLSA build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" build
      - run: pytest --cov --cov-report=term-missing
      - run: apd-gauntlet validate examples/apd-20260601-claim-event-bus/expected/
      - run: python -m build
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/whlenv
          /tmp/whlenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/whlenv/bin/apd-gauntlet --version
          /tmp/whlenv/bin/apd-gauntlet validate-domain pbm
      - name: Validate plugin + marketplace manifests
        run: pytest tests/test_plugin_manifest.py -v
      - name: Generate SLSA build-provenance attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          attestations: true
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
