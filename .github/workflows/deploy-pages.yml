name: Deploy Home Assistant report to GitHub Pages

# Publishes the self-contained Home Assistant advisory report bundle
# (examples/apd-20260612-home-assistant/expected/40-synthesis/report-html) as the
# GitHub Pages site. The bundle uses only relative asset paths, so it serves
# correctly from the project sub-path (https://<owner>.github.io/apd-gauntlet/).
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". This workflow then deploys on every push that touches the
# report, and can be run manually via "Run workflow".

on:
  push:
    branches: [main]
    paths:
      - "examples/apd-20260612-home-assistant/expected/40-synthesis/report-html/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: examples/apd-20260612-home-assistant/expected/40-synthesis/report-html
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
