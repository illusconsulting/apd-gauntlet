name: codeql

on:
  pull_request:
    branches: [main, next, "release/**"]
  push:
    branches: [main, next, "release/**"]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          # Code Scanning needs to be enabled in repository settings before
          # SARIF upload succeeds. Until then, run the analysis but skip the
          # upload step so PRs don't fail on the repo-config gap.
          upload: never
