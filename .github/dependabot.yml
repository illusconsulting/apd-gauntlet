version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 2.0 line: next carries dependencies main does not (the [decide], [runner],
  # [tui], [web] extras). Shared bumps reach next by the main→next merge-forward
  # described in RELEASING.md; this entry covers the 2.0-only ones. Remove it
  # when next merges into main at 2.0.0 GA.
  - package-ecosystem: pip
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "2.0-line"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /report-template/.build
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Any bump here changes what esbuild inlines into the shipped report
    # bundle: the bundle-rebuild-diff CI job stays red until the same PR
    # also runs `python tools/build_report_template.py` and commits the
    # refreshed bundle (that is the gate working as designed).
