# precision, recall, n, labels_sha256, provider, model, weights_revision and
# calibrated: true. Proposal entries ship as calibrated: false (amendment A1) and never
# decide on their own. A changed entry is a changed tunable, so run
# 'apd-gauntlet eval freeze' before any held-out run (ADR-0028).
