name: pbm
display_name: "Pharmacy Benefit Management"
version: 1.0.0
framework_compat: ">=1.0.0,<2.0.0"
description: "PBM-specialized severity rubric and pattern library for pharmacy-benefit-management platforms — real-time claims adjudication engines, mail-order and specialty pharmacy fulfillment, member-facing portals and mobile apps, pharmacy-network submission ingress (NCPDP D.0 over switches such as RelayHealth or Change Healthcare), CMS Part D Prescription Drug Event (PDE) reporting pipelines, and eligibility/coordination-of-benefits integrations with health plans, Medicare, and Medicaid agencies. The defining domain risk is the convergence of mass PHI disclosure under HIPAA breach-notification thresholds with CMS Part D PDE-submission-integrity fraud, which together carry both 45 CFR §164.408 federal breach-notification consequence (HHS Secretary plus media plus individual notice for 500+ affected individuals) and 42 CFR §423.322 PDE-data-integrity consequence (CMS reopening of payment determinations, plan-payment recovery, and potential False Claims Act exposure). The threat model orientation is PHI confidentiality plus clinical-decision integrity (drug-utilization-review and prior-authorization outcomes that directly affect member health) plus audit defensibility for regulator inquiry — a posture distinct from generic healthcare-application or insurance-application concerns, which typically lack the real-time adjudication-engine surface and the regulator-anchored PDE submission obligation. Anchored to HIPAA Privacy and Security Rules, HITECH breach notification, CMS Part D reporting requirements, URAC PBM accreditation standards, and HITRUST CSF / SOC 2 Type II Trust Services Criteria."
includes:
  - severity-rubric.md
  - consequential-actions.md
  - immutability-classes.md
  - data-taxonomy.md
  - common-patterns/confidentiality.md
  - common-patterns/integrity.md
  - common-patterns/availability.md
  - common-patterns/distributed.md
  - common-patterns/resilient.md
  - common-patterns/ephemeral.md
  - common-patterns/authenticity.md
  - common-patterns/non-repudiation.md
  - common-patterns/immutability.md
regulatory_anchors:
  - "HIPAA Privacy Rule (45 CFR 164 Subpart E)"
  - "HIPAA Security Rule (45 CFR 164 Subpart C)"
  - "HITECH Act breach notification (74 FR 42740 / 45 CFR 164 Subpart D)"
  - "NIST SP 800-66 Rev 2 (HIPAA Security Rule implementation guidance)"
  - "NIST SP 800-53r5 (selected control families: AC, AU, IA, SC, SI)"
  - "NCPDP Telecommunication Standard D.0"
  - "MITRE ATT&CK Enterprise"
  - "CMS Part D PDE Submission (42 CFR 423.322)"
  - "URAC PBM Accreditation Standards"
  - "SOC 2 Type II (Trust Services Criteria 2017)"
crown_jewels:
  - pattern: phi_store
    description: "Member PHI store carrying demographics, claims history, prescriber/diagnosis associations subject to HIPAA breach-notification thresholds."
  - pattern: pde_submission_pipeline
    description: "CMS Part D Prescription Drug Event submission pipeline — submission integrity is regulator-anchored under CMS rules and material to plan revenue."
  - pattern: claim_adjudication_engine
    description: "Real-time claim adjudication engine — pricing accuracy and decision integrity drive member out-of-pocket and pharmacy reimbursement."
  - pattern: audit_log_store
    description: "Security and consequential-action event log spanning PHI access, claim-adjudication decisions, prior-authorization decisions, configuration changes, break-glass invocations, and CMS PDE submission events. HIPAA Security Rule §164.312(b) (Audit Controls) treats this store as the breach-detection and breach-notification fact base — regulators treat absence or alteration as presumption of breach. Compromise enables both attack-concealment (T1070 Indicator Removal) and post-incident liability — without defensible audit, the PBM cannot satisfy HIPAA breach-notification rules even when an attack is otherwise detected. NIST SP 800-66 Rev 2 provides §164.312(b) implementation guidance for the audit-controls obligation."
  - pattern: backup_artifact_store
    description: "Database snapshots (adjudication, member, claim history), object-store backups (PDE batch archives, audit-log archives), configuration backups, and key-material escrow copies. Frequently the weakest crown jewel because encryption-at-rest, access controls, and immutability protections are typically weaker than the primary stores they protect against. A successful exfiltration of a backup commonly bypasses the controls applied to live PHI surfaces and produces the same regulatory consequences under 45 CFR §164.408."
  - pattern: prescriber_directory
    description: "Provider attribution surface — NPI, DEA registration number, state pharmacy/medical license, prescriber specialty, prescriber demographics, controlled-substance authority. Compromise enables both prescription-fraud campaigns (forge prescriptions in a real prescriber's name) and clinical-decision misattribution (DUR alerts routed to wrong prescriber). DEA records are subject to 21 CFR §1304.04 retention; state-license records are commonly subject to state pharmacy-board reporting requirements separate from HIPAA."
  - pattern: rebate_formulary_pricing_data
    description: "Manufacturer rebate calculations, Maximum Allowable Cost (MAC) lists, formulary tier assignments, pharmacy-network reimbursement schedules, and accumulator history. Compromise yields commercial-confidentiality exposure (master-service-agreement breach, manufacturer-rebate-contract breach) and competitive-intelligence harm; tampering yields plan-payment fraud and pharmacy-reimbursement disputes that commonly trigger litigation. Retention requirements typically derive from contract terms rather than statute, but the contract floors are routinely 7–10 years to cover audit and statute-of-limitations windows."
  - pattern: member_authentication_credentials
    description: "Member portal authentication store — password hashes, MFA enrollments, recovery email and phone, security questions, account-lockout state. Compromise yields member-account takeover at scale, which converts directly to PHI exposure under HIPAA (every claim record and PA history for the affected member becomes readable). Authentication factor strength and recovery-flow integrity gate both the §164.524 (Right of Access) surface and the §164.502 (Minimum Necessary) surface."
  - pattern: vendor_integration_secrets
    description: "Service-account credentials, API tokens, and signing keys used for outbound integrations — rebate aggregators, COB carriers, eligibility partners, mail-order fulfillment pharmacies, accumulator vendors, and analytics partners. Long-lived service-account credentials are the dominant root cause of vendor-channel PHI exposure incidents; compromise of one integration credential commonly yields lateral PHI access across the entire vendor surface. Each credential's blast radius equals the data scope granted in the underlying Business Associate Agreement."
attacker_positions:
  - position: external_internet
    description: "Untrusted external internet client; the default external attacker position for any internet-facing surface."
  - position: compromised_pharmacy_credential
    description: "An attacker holding a valid pharmacy-submitter credential through phishing, credential stuffing, or insider abuse at a pharmacy partner."
  - position: compromised_vendor_integration
    description: "An attacker who has compromised a third-party vendor's integration credentials (e.g., a benefits-management vendor or analytics partner)."
  - position: insider_with_member_service_role
    description: "An insider holding a legitimate member-services role but acting outside their minimum-necessary scope (e.g., bulk PHI export, unauthorized member lookups)."
  - position: compromised_dev_workstation
    description: "An attacker who has compromised a developer or operator workstation with production deployment or break-glass access."
  - position: unauthenticated_internet_against_member_portal
    description: "Untrusted external attacker targeting the member-portal authentication surface specifically (distinct from the generic external_internet position, which models any internet-facing surface). Models credential-stuffing campaigns, OWASP API1 (BOLA) on member-id-keyed endpoints, OWASP API5 (BFLA) on tier-distinct endpoints (member vs admin), enumeration of member identifiers via login or password-reset response oracles (T1110.003 Password Spraying, T1110.004 Credential Stuffing), and SAML/OIDC misconfiguration on federated member access. The defining threat: a successful authentication compromise here converts directly to PHI exposure under HIPAA §164.508 (Authorization) without further escalation."
  - position: authenticated_member_seeking_cross_member_phi
    description: "A member with valid credentials attempting horizontal escalation to another member's PHI — typically via IDOR on member-id parameters, predictable claim-reference URLs, parameter tampering on dependent-coverage endpoints, or session re-use across logical member contexts (T1078.004 Cloud Accounts applied to member portal). The most common PBM-specific manifestation is dependent-coverage scope: a primary subscriber attempting to access an adult dependent's PHI. Adult dependents are not within the §164.502(g) personal-representative scope, so the access falls under the §164.502(a) general use-and-disclosure rule and requires §164.508 authorization from the adult dependent before disclosure."
  - position: compromised_cms_submission_credential
    description: "Attacker holding the credential or signing key used to authenticate the PBM's outbound CMS Part D PDE submission channel. Distinct from compromised_pharmacy_credential (which models inbound NCPDP claim submission) and compromised_vendor_integration (which models third-party vendor egress). Maps to T1078 (Valid Accounts) for credential-holding abuse of the held CMS submission credential, T1565.002 (Transmitted Data Manipulation) when the held signing key is used to inject falsified PDE records into the outbound submission channel, and T1565.001 (Stored Data Manipulation) for altering PDE retroactive corrections in the submission staging store. Compromise yields the ability to submit falsified PDE records, suppress legitimate PDE records, or alter PDE retroactive corrections — each producing 42 CFR §423.322 PDE-data-integrity consequence (CMS payment-determination reopening, plan-payment recovery, potential False Claims Act exposure under 31 U.S.C. §3729 if the submission was knowingly false)."
  - position: compromised_admin_workstation
    description: "Attacker who has compromised an operator or administrator workstation with privileged access to formulary configuration, PA-criteria configuration, MAC pricing, contract-pricing tables, or audit-log retention settings. Distinct from compromised_dev_workstation (which models pre-production tooling). Models the post-phishing escalation path where a compromised admin can silently disable audit shipping (T1070), backdate audit entries (T1036 Masquerading at the audit layer), or alter the formulary configuration to produce clinical-decision harm at scale. The defining feature: actions taken from this position attribute to a legitimate operator credential, so defensibility depends entirely on the audit-of-audit surface."
  - position: internal_lateral_attacker_in_adjudication_tier
    description: "Attacker who has already established a foothold in the internal network — typically through the dev_workstation position, an exposed admin-console session, or a vendor-integration compromise — and is now attempting lateral movement to reach the PHI store, the adjudication engine, or the PDE submission pipeline. Models the post-breach window where the attacker has time and access to enumerate internal services, abuse in-cluster trust assumptions (T1078 Valid Accounts on service-account credentials, T1213 Data from Information Repositories on internal PHI replicas), and escape from a low-value tier to a high-value tier. The defining test for this position: would mTLS, network segmentation, and credential-scoping prevent the attacker from reaching the crown jewel from their established foothold?"
default_trust_boundaries:
  - boundary: pharmacy_submission_ingress
    description: "Boundary between external pharmacy submitters and the claim-ingress API; first authentication/authorization checkpoint for claim submission."
  - boundary: member_portal_ingress
    description: "Boundary between internet members and the member-facing portal; second external ingress with PHI-read scope after authentication."
  - boundary: internal_to_pde_submission
    description: "Boundary between internal services and the CMS Part D submission pipeline; outbound regulatory channel with submission-integrity guarantees."
  - boundary: adjudication_engine_to_phi_data_tier
    description: "Service-to-datastore crossing between the claim-adjudication engine and the underlying PHI store (PostgreSQL, MongoDB, or vendor-specific adjudication-engine database). Frequently the weakest link under 'in-cluster trust' assumptions; enforcement requires in-cluster mTLS, query parameterization to prevent NoSQL/SQL injection on member-id or claim-reference parameters, and least-privilege datastore credentials scoped to the specific adjudication operation. A successful boundary failure here reaches the largest PHI scope in the PBM."
  - boundary: pbm_to_third_party_vendor
    description: "Outbound egress from PBM services to third-party vendors with whom the PBM has a Business Associate Agreement under HIPAA §164.504(e) — rebate aggregators, accumulator vendors, COB carriers, analytics partners, mail-order fulfillment pharmacies, specialty-pharmacy fulfillment, and switch operators (RelayHealth, Change Healthcare). The boundary is multi-channel (HTTPS APIs, SFTP file drops, IBM MQ enterprise messaging) and each channel needs its own authentication, encryption-in-transit, and data-scope-enforcement. Vendor-credential compromise (see compromised_vendor_integration attacker position) is the dominant breach vector here."
  - boundary: phi_subject_zone
    description: "HIPAA-anchored PHI segmentation boundary, analogous to api-security's personal_data_subject_zone for GDPR. Crossings into or out of this zone trigger HIPAA Privacy Rule disclosure analysis (45 CFR §164.502 Uses and Disclosures, §164.514(b)(1) Expert Determination and §164.514(b)(2)(i) Safe Harbor identifier enumeration). Includes the de-identification gate for analytics surfaces, the minimum-necessary gate for internal cross-team data sharing (§164.502(b)), and the lawful-basis gate for any disclosure outside the Treatment / Payment / Operations exception (§164.506)."
  - boundary: admin_console_to_pbm_backend
    description: "Privileged-administration crossing between the operator admin console (formulary editor, PA criteria editor, MAC list editor, contract-pricing editor, audit-retention configuration) and the corresponding backend services and configuration stores. The blast radius of any boundary failure here is the entire PBM — admin actions silently affect every subsequent claim adjudicated against the modified configuration. Enforcement requires step-up authentication (per the severity rubric's authentication-bypass clause), four-eyes / dual-approval workflows on configuration-changing actions, and an audit chain attributing the action to the human operator (not the operator's session token or sidecar identity)."
